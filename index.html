0\"><span class=\"c5 c1\">(Memalingkan wajahnya ke arah jendela, mendengus kencang meskipun suaranya masih terdengar lirih)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Itu urusanku. Urusan Florentina adalah tanggung jawabku, aku tidak punya waktu untuk bersantai memikirkan hal-hal sepele seperti makan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela nafas frustasi, berkacak pinggang menatap tunangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Makan itu bukan hal sepele, Han Na Eun! Dengar ya, kalau kau terus-terusan mengabaikan kesehatanmu demi sebuah pekerjaan, proses tiga bulan kita ini tidak akan ada gunanya. Bagaimana kau bisa mengenalku jika kau bahkan tidak mengenali batas kemampuan tubuhmu sendiri?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tatapannya kembali menajam menantang Junwoo, meskipun napasnya masih terengah-engah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau tidak berhak menceramahiku soal ini! Kau tidak tahu apa-apa soal itu\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika merundukkan tubuhnya, menatap lurus ke dalam manik mata Na Eun dengan jarak yang sangat dekat, membuat Na Eun menahan napas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tahu, aku sangat tahu seberapa keras dirimu. Tapi mulai sekarang, selama ada aku disampingmu... aku tidak akan membiarkanmu melupakan makan karena tekanan kerja sampai menghancurkan dirimu sendiri. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sekarang, diam dan habiskan bubur rumah sakit ini sebelum aku sendiri yang turun tangan untuk menyuapimu secara paksa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun tertegun. Di dalam kondisi tubuhnya yang sedang lemas tak bertenaga, gertakan penuh perhatian dari Junwoo malam itu anehnya tidak membuat hatinya kesal, melainkan memicu sebuah getaran asing yang perlahan meruntuhkan lapisan demi lapisan benteng pertahanannya yang tersisa.</span></p><h3 class=\"c9\" id=\"h.2s688347saxp\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c9\" id=\"h.xdunfs46x2nw\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.veyzkvpe2q4j\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sembari menangkup dagunya, matanya berkaca-kaca dramatis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh eonni... Junwoo Oppa romantis sekali saat sedang marah! Jadi, di momen UGD itulah kau akhirnya benar-benar tak berdaya di hadapannya, Eonni?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, menyandarkan kepalanya dengan rileks)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Begitulah, Daehyun-ah. Malam itu aku terlalu lemas untuk mendebatnya lagi dengan teori-teori rasional. Dan untuk pertama kalinya, aku membiarkan diriku dilindungi oleh seorang pria.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.sjnbifkdfap3\"><span class=\"c7 c1 c6\">Debat Dini Hari di Depan Gerbang</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana dini hari sekitar pukul 02.00 malam. Mobil hitam Junwoo berhenti perlahan di depan gerbang megah kediaman keluarga Han. Jalanan sangat sunyi. Na Eun duduk di kursi penumpang dengan wajah yang masih sangat pucat, tubuhnya lemas tak bertenaga setelah cairan infus terakhirnya dilepas secara paksa atas permintaannya sendiri.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuka sabuk pengaman dengan tangan yang sedikit bergetar, suaranya pelan dan serak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah... sampai di sini saja. Kau tidak perlu turun, apalagi mengantarku masuk ke dalam.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mematikan mesin mobil, menoleh dengan tatapan tidak percaya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau bahkan kesulitan untuk membuka sabuk pengamanmu sendiri, Han Na Eun. Jangan konyol, aku akan mengantarmu sampai ke dalam kamar.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menahan lengan Junwoo, matanya menatap cemas ke arah jendela rumah yang gelap)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jangan, Park Junwoo! Ini sudah jam dua malam. Kalau orang tuaku terbangun dan melihatmu memapahku masuk, mereka akan panik dan menanyakan banyak hal yang tidak perlu. Aku tidak mau membuat keributan di jam segini. Aku bisa jalan sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas berat, menyingkirkan tangan lemas Na Eun dari lengannya secara lembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Keributan apa? Ayah dan ibumu justru akan lebih panik kalau melihat putrinya ambruk di depan pintu karena pingsan. Diam dan turuti kata-kataku sekali saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tanpa memperdulikan protes lemah dari Na Eun, Junwoo turun dari mobil, memutari kap, dan membuka pintu penumpang. Dengan gerakan taktis, ia memapah tubuh Na Eun yang sangat lemas. Na Eun yang sudah benar-benar kehabisan energi untuk berdebat akhirnya hanya bisa pasrah, menyandarkan sebagian berat tubuhnya pada bahu kokoh Junwoo saat pria itu menuntunnya melewati pintu samping, menaiki tangga, hingga mengantarkannya masuk ke dalam kamarnya sendiri.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membantu Na Eun duduk di tepi tempat tidur, lalu menyelimuti kakinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidur. Jangan menyentuh ponsel atau berkas apa pun sampai pagi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membenamkan wajahnya di bantal, berbisik lirih tanpa menatap Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Pulanglah... dan terima kasih.\"</span></p><h3 class=\"c9\" id=\"h.189jq8yutk09\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.kqvip5qs74o1\"><span class=\"c7 c1 c6\">Invasi Pagi dan Perasaan yang Memberontak</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Keesokan paginya di kamar tidur Han Na Eun. Sinar matahari pagi menerobos masuk melalui celah gorden. Nyonya Han melangkah masuk ke dalam kamar, menggoyang-goyangkan pelan pundak putrinya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Na Eun-ah, ayo bangun. Ini sudah jam tujuh pagi. Junwoo sudah duduk di ruang tamu menunggumu sejak tadi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak membuka matanya lebar-lebar, rasa pening di kepalanya langsung sirna digantikan rasa syok)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa?! Pria itu... dia datang lagi pagi ini?!\" (bergumam dalam hati)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sembari melangkah ke kamar mandi dengan terburu-buru, hati Na Eun bergemuruh hebat. Perasaannya mendadak memberontak. Bukan karena ia merasa risih, melainkan karena ego dan jiwanya sebagai wanita independen merasa terusik. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sepanjang hidupnya, ia terbiasa mengurus segala hal sendirian dan tidak pernah membiarkan orang lain mengintervensi ruang pribadinya. Kehadiran Park Junwoo yang mendadak selalu ada dan memperhatikan hal-hal kecil di hidupnya terasa sangat asing, menakutkan, sekaligus membingungkan bagi hatinya.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Sementara itu, di ruang tamu keluarga Han, Junwoo sedang mengobrol santai dengan Tuan dan Nyonya Han sembari menikmati kopi pagi. Hebatnya, Junwoo sama sekali tidak membocorkan kejadian Na Eun pingsan semalam demi menjaga gengsi tunangannya di depan orang tua.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya Ayah. Kemarin saya ada beberapa agenda di firma hukum, cukup padat karena memang saya ingin membantu bisnis ayah dan ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk-angguk puas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Luar biasa, Junwoo-ya. Kau benar-benar bisa diandalkan dimanapun\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tepat saat itu, Na Eun turun dari tangga dengan pakaian kerja formal yang rapi, meskipun riasan wajahnya dibuat sedikit lebih tebal untuk menutupi sisa-sisa wajah pucatnya. Tatapannya menatap Junwoo dengan tajam.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari duduknya, tersenyum sopan pada calon mertuanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Na Eun sudah siap. Kalau begitu, Ayah, Ibu, kami pamit berangkat ke kantor dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, hati-hati di jalan ya, kalian berdua.\"</span></p><h3 class=\"c9\" id=\"h.smmi2a98askg\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.s71bfu6xsovy\"><span class=\"c7 c1 c6\">Benturan Dua Ego di Dalam Mobil</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di dalam mobil Junwoo yang sedang membelah jalanan kota Seoul yang padat pagi itu. Keheningan yang mencekam menyelimuti kabin mobil sebelum akhirnya Na Eun membuka suara dengan nada menggerutu kesal.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini benar-benar berlebihan, Park Junwoo. Kenapa kau harus datang lagi di pagi hari ke rumahku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Fokus menatap jalanan, membalas dengan nada tenang namun tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sebagai tunanganmu, aku punya tanggung jawab untuk memastikan kau tiba di kantor dengan selamat hari ini. Jangan lupa, mobilmu masih tertinggal di parkiran kantor sejak semalam.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengus ketus, melipat kedua tangannya di dada)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku bisa naik taksi atau meminta sopir untuk mengantarku! Aku tidak suka diperlakukan seperti wanita lemah yang tidak bisa mengurus dirinya sendiri. Aku terbiasa mandiri, dan tindakanmu ini membuatku terlihat menyedihkan di hadapanmu!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mulai terpancing, melirik Na Eun sekilas dengan raut wajah mengeras)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Menyedihkan? Jadi, menerima bantuan dari tunangan sendiri setelah kau pingsan sendirian di kantor itu kau sebut menyedihkan? Han Na Eun, kenapa kau harus selalu berpura-pura kuat di depanku?!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya meninggi, egonya tersulut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Karena aku memang kuat! Aku tidak butuh dikasihani oleh siapapun, termasuk dirimu! proses tiga bulan ini dibuat agar kita saling mengenal, bukan agar kau bisa mengontrol hidup dan caraku bekerja!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencengkeram setir mobil lebih erat, napasnya memburu menahan kekesalan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tidak mengontrolmu! Aku hanya peduli pada kesehatanmu, Na Eun-ah! Tapi kau... kau terlalu gila kerja dan menutup mata dari orang-orang di sekitarmu! Kau egois!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya, aku memang egois! Dan jika kau tidak tahan dengan caraku mendominasi hidupku sendiri, kita bisa batalkan pertunangan ini sekarang juga!\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana seketika membeku. Kata 'batalkan' membuat tensi di dalam mobil berada di titik tertinggi. Keduanya sama-sama terdiam dengan dada yang kembang kempis menahan amarah yang meledak.)</span></p><h3 class=\"c9\" id=\"h.wozhm98iigwd\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.njssqrpgwo4a\"><span class=\"c7 c1 c6\">Pintu yang Dibanting dan Ban yang Mencengkram</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Mobil hitam Junwoo akhirnya mengerem mendadak dengan kasar tepat di depan lobi kantor Florentina. Belum sempat mobil berhenti dengan sempurna, Na Eun langsung membuka pintu mobil dengan gerakan kasar.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Junwoo dengan tatapan mata yang berkilat marah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih atas tumpangannya, Tuan Park yang terhormat. Hubungi aku lagi saat kau sudah belajar cara menghargai privasi orang lain!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">BRAAAMMM!!!</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun keluar dari mobil dan membanting pintu penumpang dengan sangat keras hingga menimbulkan bunyi dentuman yang menggema di area lobi. Ia melangkah masuk ke dalam gedung dengan tegap, mengabaikan rasa lemas yang sebenarnya masih tersisa di kakinya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencengkeram setir dengan wajah memerah akibat kemarahan mendengarkan keras kepalanya Na Eun)</span></p><p class=\"c0\"><span class=\"c1\">\"Dasar... wanita itu benar-benar keras kepala!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa membuang waktu, Junwoo langsung menginjak pedal gasnya dalam-dalam. Mobil hitam itu melesat pergi meninggalkan area lobi Florentina dengan kecepatan tinggi, menimbulkan suara decitan ban yang memekakkan telinga sebagai pelampiasan rasa kesalnya.)</span></p><h3 class=\"c9\" id=\"h.w3ztohj4zhxh\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.sq6pzey284mg\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke salon spa VVIP. Daehyun sampai menganga lebar dengan mata tidak berkedip.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Menegangkan sekali, eonni! Jadi di minggu ketiga pertunangan, kalian sudah bertengkar hebat sampai banting pintu mobil dan ngebut di jalanan?!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa getir, sambil bersantai dikolam spa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hari itu kami sama-sama kalah oleh ego masing-masing, Daehyun-ah. Aku yang terlalu takut terlihat lemah, dan Junwoo yang terlalu frustasi menghadapi kelakuanku. Masa-masa tiga bulan itu... benar-benar ujian terberat untuk kami saling mengenal\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.3zwvnrpojewg\"><span class=\"c7 c1 c6\">Perang Dingin dan Pergulatan Dua Pikiran</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sejak pertengkaran hebat dan insiden pintu mobil yang dibanting di depan lobi Florentina hari itu, waktu seolah berjalan begitu lambat. Selama beberapa hari berturut-turut, baik Park Junwoo maupun Han Na Eun sama sekali tidak menghubungi satu sama lain. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tidak ada pesan, tidak ada kiriman makanan, dan tidak ada telepon mendadak. Keduanya benar-benar tenggelam dalam ego dan harga diri masing-masing yang menjulang tinggi. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, di balik keheningan yang mereka ciptakan, ada badai yang berkecamuk di dalam kepala mereka berdua.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah-pindah secara bergantian menunjukkan aktivitas Junwoo di kantornya dan Na Eun di meja kerjanya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dialog Batin Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil menatap layar ponselnya yang gelap di atas meja kerja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa dia sama sekali tidak menghubungiku? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Apakah dia benar-benar menganggap saranku hanya bentuk kontrol sepihak? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Menanyakan kabar atau meminta maaf pun tidak ada. Ahhh... tapi kenapa juga aku malah terus-menerus memikirkan dan mencarinya? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Biarkan saja. Lagipula dia yang membanting pintu mobilku duluan. Ternyata... dia memang benar-benar tidak peduli padaku selain pada pekerjaannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dialog Batin Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil membolak-balik dokumen tanpa fokus, sesekali melirik ponsel di dekat laptop)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar-benar keterlaluan. Pria itu benar-benar tidak mengirim satu pesan pun sejak hari itu. Jadi ini yang dia sebut peduli dan bertanggung jawab? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Begitu aku menentangnya sedikit, dia langsung pergi dan menghilang begitu saja. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Berarti dugaanku benar, dia hanya ingin mengontrolku. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi... ahhh, kenapa perasaanku jadi tidak tenang begini? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kenapa di jam-jam seperti ini aku malah menunggu pesan usilnya? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sadarlah, Han Na Eun! Dia tidak menghubungimu karena dia memang sudah tidak peduli lagi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.f5u714xv808t\"><span class=\"c7 c1 c6\">Hangatnya Meja Makan Keluarga Park</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di ruang makan kediaman mewah keluarga Park. Hidangan makan malam sudah tersaji hangat, namun atmosfer di meja makan terasa sangat sunyi. Junwoo duduk bergeming, mengaduk-aduk nasi di mangkuknya dengan pandangan kosong. Wajahnya yang biasanya hangat dan penuh senyum, malam itu tampak mendung dan tidak bergairah.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meletakkan sumpitnya, menatap putranya dengan penuh kekhawatiran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa, Nak? Selama makan malam ini kau terlihat sangat murung. Bahkan sejak tadi sore saat kau membantuku mengurus keperluan di rumah sakit dan yayasan, kau lebih banyak diam dan melamun.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersentak pelan, mencoba memaksakan senyum tipis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... tidak apa-apa, Ibu. Aku hanya sedikit lelah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggelengkan kepala sambil menatap tajam putranya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak biasanya putraku murung berhari-hari seperti ini hanya karena lelah bekerja. Kami sebagai orang tuamu bisa merasakannya, Nak. Bahkan rekan-rekan di firma hukum Ayah juga bercerita, beberapa hari belakangan ini kau tidak banyak menyapa orang dan lebih sering mengurung diri di ruangan. Apakah... ada masalah dengan Na Eun?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar nama Han Na Eun disebut oleh Ayahnya, pertahanan Junwoo runtuh. Bahunya merosot pelan dan ia tidak bisa lagi menyembunyikan kegalauan mendalam yang menyiksanya sehabis bertengkar dengan gadis itu.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas pasrah, menunduk)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... iya, Ayah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langsung memajukan posisi duduknya, cemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Astaga, ada apa dengan putraku? Ada masalah apa sebenarnya di antara kalian berdua, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hanya... masalah salah paham, Ibu. Dia itu... benar-benar wanita yang sangat keras kepala. Kadang-kadang egonya begitu tinggi sampai-sampai membuatku kewalahan dan kehabisan cara untuk menghadapinya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum bijak, bersandar pada kursi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Itu hal yang sangat wajar, Nak. Kalian berdua ini masih berada di dalam masa penjajakan dan pengenalan awal. Tidak ada satu pun hubungan di dunia ini yang langsung berjalan sempurna. Kalian dibesarkan di lingkungan yang berbeda, memiliki isi kepala yang berbeda, tentu akan ada banyak ketidakcocokan di awal pertemuan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk setuju, menggenggam lembut tangan Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nak. Benar apa kata Ayahmu. Justru masa-masa ketidakcocokan dan pertengkaran seperti sekarang ini harus kau jadikan peluang emas untuk tahu kenapa dia bersikap seperti itu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Ingat prinsip Ibu, Junwoo-ya; di balik setiap sikap keras seseorang, selalu ada alasan mendalam yang melatarbelakanginya. Dan kau, sebagai pria yang berkomitmen menjadi calon suaminya, harus ego-nya diredam dan lebih mendalami kenapa Na Eun bertingkah sekaku itu. Mungkin dia hanya belum terbiasa dilindungi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar, Nak. Pernikahan itu bukan soal siapa yang menang atau siapa yang memegang kendali. Kalian harus saling menyelami, terutama kau sebagai laki-laki, Junwoo-ya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kalau di awal saja kalian sudah sama-sama mempertahankan ego dan tidak ada yang mau mengalah, sampai kapan pun jalan kalian tidak akan pernah bertemu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Junwoo hanya terdiam terpaku mendengar rentetan nasihat bijak dari kedua orang tuanya. Kata-kata ibunya tentang </span><span class=\"c1 c8\">'selalu ada alasan di balik setiap sikap'</span><span class=\"c4 c1\"> seketika menembus dadanya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Perlahan tapi pasti, rasa kesal yang sempat ia pertahankan berhari-hari mulai melunak, digantikan oleh rasa bersalah karena telah membiarkan ego menguasai dirinya.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.7u2et3n0tc08\"><span class=\"c7 c1 c6\">Sesuatu yang Hilang di Kamar Na Eun</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di saat yang sama di kamar tidur Han Na Eun. Kamar itu tampak sunyi dengan pencahayaan temaram. Na Eun duduk merenung di tepi tempat tidurnya yang luas, menatap kosong ke arah jendela luar yang menampilkan gemerlap lampu kota Seoul. Kejadian pertengkaran hebat di dalam mobil tempo hari kembali berputar seperti film di benaknya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Entah mengapa, malam ini di dalam lubuk hatinya yang paling dalam, Na Eun merasakan ada sesuatu yang kosong. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Ada ruang yang mendadak terasa hilang dari rutinitasnya. Proses masa penjajakan mereka baru berjalan 4 minggu dari total tiga bulan yang disepakati, namun ada rasa aneh yang teramat sangat menyiksa di dalam dada Na Eun saat menyadari pria itu benar-benar memutus kontak dan tidak menghubunginya sama sekali selama beberapa hari ini.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dialog Batin Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memeluk kedua lututnya, menyandarkan dagunya dengan pandangan sayu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa rasanya sepi sekali? Kamar ini... biasanya terasa tenang saat aku sendirian, tapi malam ini kenapa rasanya begitu asing?</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Empat minggu lalu aku bahkan tidak mengenal siapa Park Junwoo, tapi sekarang... kenapa saat dia menghilang dan berhenti mengusikku, hatiku malah terasa sekosong ini? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Apakah aku merindukan suaranya yang menyebalkan itu? Tidak, Han Na Eun. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kau adalah wanita independen. Kau tidak boleh bergantung pada kehadiran seorang pria. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi... kalau dia benar-benar mundur dan pertunangan ini batal, apakah ini yang benar-benar kuinginkan? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kenapa memikirkan dia tidak akan datang lagi ke rumah ini membuat dadaku sesak?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun memejamkan matanya rapat-rapat, meremas ujung selimutnya. Tembok pertahanan yang ia bangun dengan keangkuhan sifat mandirinya, kini perlahan mulai retak dari dalam oleh rasa rindu yang tidak mampu ia bendung lagi.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><h3 class=\"c14\" id=\"h.qsm5qi1wgu0m\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Daehyun tampak menghela napas panjang dengan ekspresi yang sangat dramatis, ikut merasakan kegalauan masa lalu kakak iparnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, Eonni... jadi itu fase di mana kalian berdua mengalami perang dingin? Benar-benar menegangkan! Di satu sisi ego kalian sama-sama setinggi langit, tapi di sisi lain hati kalian sudah mulai saling terikat, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum manis, ada binar kebahagiaan di matanya saat mengenang momen itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Masa-masa itu sangat melelahkan, Daehyun-ah. Tapi dari sana aku belajar, bahwa bersikap independen bukan berarti kita harus menolak kehadiran orang lain yang tulus ingin menjaga kita. Malam itu... menjadi malam terakhir di mana ego kami saling menjauh, karena setelah itu, takdir punya cara lain untuk menyatukan kami kembali.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.9pzx0ygjueoe\"><span class=\"c7 c1 c6\">Kilau Peluncuran dan Otak yang Tidak Sinkron</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana dari pagi hingga sore hari di aula utama kantor Florentina. Acara peluncuran produk baru sedang berlangsung dengan sangat megah. Lampu-lampu sorot menerangi jajaran produk estetis, jurnalis berlarian, dan para tamu undangan memenuhi ruangan. Di balik panggung, Na Eun tampak luar biasa sibuk, memegang handy-talkie dengan napas yang memburu.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbicara cepat pada kru panggung)</span></p><p class=\"c0\"><span class=\"c1\">\"Tim Kreatif, kenapa pencahayaan di </span><span class=\"c1 c8\">display</span><span class=\"c1\"> utama agak redup? Naikkan temperaturnya dua tingkat! Tim LO, pastikan semua </span><span class=\"c1 c8\">VIP influencer</span><span class=\"c1\"> sudah mendapatkan </span><span class=\"c1 c8\">goodie bag</span><span class=\"c4 c1\"> eksklusif mereka sebelum sesi wawancara dimulai!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Asisten:</span></p><p class=\"c0\"><span class=\"c1\">\"Nona Han, media dari harian ekonomi sudah menunggu di ruang pers untuk sesi </span><span class=\"c1 c8\">doorstop</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk cepat, merapikan setelan jasnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, saya ke sana sekarang. Pastikan draf rilis pers sudah berada di meja mereka.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Waktu merambat hingga pukul lima sore. Acara mulai lengang, para tamu satu per satu meninggalkan lokasi. Na Eun berdiri di sudut aula yang mulai sepi. Matanya menyapu jajaran papan bunga ucapan selamat yang berdiri berjejer di sepanjang koridor. Ia membaca satu per satu kartu nama pengirimnya kolega bisnis, vendor, hingga kerabat jauh namun nama yang dicarinya sama sekali tidak ada. Jangankan karangan bunga, pesan teks singkat ucapan selamat pun tidak masuk ke ponselnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dialog Batin Na Eun:</span></p><p class=\"c0\"><span class=\"c1 c8\">\"Bahkan di hari sepenting ini bagi Florentina... kau benar-benar tidak peduli, Park Junwoo? Tidak ada bunga, tidak ada ucapan... Kau benar-benar sekejam itu memutus hubungan kita?\"</span><span class=\"c1\"> </span><span class=\"c5 c1\">(Na Eun menggelengkan kepalanya kuat-kuat, meremas jemarinya kesal)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">\"Ah, apa-apaan kau ini, Han Na Eun! Kenapa kau jadi berharap pada pria itu? Sadarlah, fokus pada pekerjaanmu!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Sementara itu, di waktu yang sama di kantor firma hukum milik ayahnya. Junwoo duduk di balik meja kerja, menatap layar ponselnya yang menyala menampilkan ruang obrolannya dengan Na Eun. Jemarinya menggantung di atas papan ketik, ragu untuk menekan tombol kirim.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dialog Batin Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Otak dan hatiku rasanya baru pertama kali ini tidak sinkron. Otakku bilang, jangan hubungi dia dulu sebelum egonya turun dan dia meminta maaf karena membanting pintu mobil. Tapi hatiku... hatiku terus berteriak cemas memikirkan bagaimana jalannya peluncuran produk Florentina hari ini. Apakah dia makan dengan benar? Apakah dia pingsan lagi?\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menghela napas panjang, lalu bersandar pada kursinya. Bayangan nasihat ibunya malam itu kembali berdengung jernih di kepalanya: 'Setiap sikap selalu ada alasan... kau harus lebih mendalami kenapa Na Eun bertingkah seperti itu.' Junwoo melirik jam dinding yang menunjukkan pukul 18.00, jam pulang kantor.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meraih kunci mobilnya, tatapannya mendadak mantap)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Masa bodoh dengan ego. Aku harus ke Florentina sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.n9ehby1hn0r1\"><span class=\"c7 c1 c6\">Ruang Rapat yang Dingin dan Air Mata Gengsi</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari sekitar pukul 19.00 di kantor pusat Florentina. Suasana kantor sudah sepi, namun lampu di ruang rapat utama masih menyala benderang. Junwoo melangkah masuk ke koridor dengan perlahan. Niat awalnya adalah datang untuk berbaikan dengan tenang. Namun, langkahnya terhenti tepat di depan pintu ruang rapat yang sedikit terbuka. Di dalam ruangan, atmosfer terasa sangat mencekam. Na Eun berdiri di ujung meja dengan wajah memerah menahan amarah, menatap tajam tim pemasarannya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memukul meja rapat dengan berkas laporan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kita tidak bisa mencapai target penjualan hari pertama?! Angka ini bahkan tidak menyentuh setengah dari proyeksi minimal kita!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf 1:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk takut, menyodorkan tablet)</span></p><p class=\"c0\"><span class=\"c1\">\"Maaf, Nona Han... kami sudah memaksimalkan semua </span><span class=\"c1 c8\">campaign</span><span class=\"c1\"> dan </span><span class=\"c1 c8\">iklan</span><span class=\"c4 c1\"> sejak minggu lalu. Ini adalah data jangkauan pasar yang—\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memotong ketus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi data di atas kertas dan hasil aslinya di lapangan sama sekali tidak sama! Kalian ini sebenarnya bisa bekerja dengan becus atau tidak?!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Kepala Pemasaran:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha menenangkan)</span></p><p class=\"c0\"><span class=\"c1\">\"Maafkan kami, Nona Han. Hasil hari pertama ini memang belum memenuhi ekspektasi kita bersama, tetapi kita masih memiliki waktu untuk memperbaikinya melalui konversi di </span><span class=\"c1 c8\">channel</span><span class=\"c4 c1\"> penjualan lainnya minggu depan...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya bergetar karena stres yang memuncak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Perbaiki?! Apa kalian tahu seberapa besar kerugian yang harus ditanggung Florentina saat biaya peluncuran yang besar dan antusiasme pasar ternyata tidak sejalan?! Jika produk ini gagal di awal, tamat sudah!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Dari balik celah pintu, Junwoo mengamati seluruh kejadian itu dengan sangat jelas. Dadanya berdenyut perih. Apa yang dikatakan oleh ibunya semalam terbukti sepenuhnya benar, Na Eun benar-benar sedang mengalami stres berat karena tekanan target. Gadis itu menekan dirinya sendiri begitu keras hingga tanpa sadar melukai tubuhnya dan orang-orang di sekitarnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memijat pelipisnya, berteriak frustrasi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Keluar semua!!! Tinggalkan saya sendiri!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Para staf langsung mengemas barang mereka dengan terburu-buru dan keluar dari ruangan dengan wajah pucat. Mereka melewati Junwoo yang berdiri di kegelapan koridor tanpa menyadarinya. Setelah ruangan benar-benar sepi, Na Eun menjatuhkan dirinya ke kursi kerja. Pertahanan independennya runtuh seketika. Ia menundukkan kepalanya di atas meja, menyembunyikan wajahnya di antara kedua lipatan tangannya, dan mulai menangis sesenggukan. Suara tangisnya terdengar begitu keras dan menyayat hati, sampai ke telinga Junwoo yang berdiri di balik pintu.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terisak hebat, merutuki dirinya sendiri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana aku harus menutupi kerugian ini... Kalau Ayah sampai tahu hasil hari ini, dia pasti akan langsung meminta Florentina tahun depan akan diakuisisi oleh investor luar... dan itu artinya aku memang tidak becus memimpin perusahaan ini... Aku gagal...\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun bergerak dengan napas tersendat, berniat membuka laptopnya kembali untuk memeriksa ulang data pasar. Namun, baru saja jemarinya akan menyentuh laptop, sebuah tangan yang hangat dan besar tiba-tiba menggenggam pergelangan tangannya dengan kokoh, menghentikan gerakannya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun dengan tatapan mata yang dalam dan penuh kehangatan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo ikut aku, Han Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak mendongak, matanya yang sembap dan basah membelalak tidak percaya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... Park Junwoo? Kenapa... kenapa kau bisa ada di sini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa menjawab pertanyaan itu, ia langsung menarik lembut tangan Na Eun, menuntunnya keluar dari ruangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau pasti belum makan sejak tadi. Ayo makan sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha memberontak sepanjang koridor, mengomel dengan suara parau)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lepaskan aku! Kenapa aku harus makan di saat seperti ini?! Aku tidak membutuhkannya! Urusanku belum selesai, Park Junwoo!\"</span></p><h3 class=\"c9\" id=\"h.wy0bfcsv84kr\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.uvzdib27vsl4\"><span class=\"c7 c1 c6\">Sudut Kedai dan Rumus Solusi Malam Ini</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke sebuah kedai makan kecil yang sederhana di dekat area kantor Florentina. Suasananya hangat dan sepi. Di atas meja kayu, dua porsi makanan hangat yang masih mengepul telah terhidang. Na Eun masih terus menangis tertahan, menutupi wajahnya yang memerah dengan kedua tangan karena malu dan frustrasi, sementara Junwoo duduk tenang di hadapannya sembari menyantap makanannya dengan santai.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meletakkan sendoknya sejenak, menatap Na Eun lekat-lekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa solusinya harus kau temukan malam ini juga? Apakah target angka di kertas itu jauh lebih penting daripada perut kosongmu yang belum terisi sejak tadi, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menurunkan tangannya, menatap Junwoo dengan air mata yang kembali meleleh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... kau tidak tahu apa-apa, Junwoo! Kau tidak tahu seberapa besar taruhannya jika Florentina gagal hari ini!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Nadanya mendadak berubah tegas, memotong kalimat Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tahu semuanya, Han Na Eun! Aku tahu ketakutanmu, aku tahu tekanan dari ayahmu, dan aku tahu seberapa keras kau menahan semuanya sendirian! Tapi sekarang, diam, ambil sumpitmu, makan dan habiskan makanan ini!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar bentakan penuh perhatian yang sarat akan ketegasan itu, Na Eun seketika terdiam. Di dalam kondisi mental dan fisiknya yang sudah berada di titik nadir, ia benar-benar sudah tidak memiliki tenaga lagi untuk mendebat atau mempertahankan gengsi independennya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dengan tangan yang masih sedikit bergetar, ia akhirnya menuruti perintah Junwoo; membuka sumpitnya dan mulai menyuap makanan ke dalam mulutnya perlahan di sela sisa-sisa isak tangisnya.</span></p><h3 class=\"c9\" id=\"h.1c4sw36y88aq\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.6ytrg61f98o9\"><span class=\"c7 c1 c6\">Pelukan Pertama di Bawah Lampu Taman</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah selesai makan, keduanya berjalan kaki perlahan menuju sebuah taman kecil di dekat kedai tersebut. Udara malam kota Seoul berembus pelan, menciptakan kecanggungan yang kentara di antara mereka setelah perang dingin berhari-hari. Na Eun berjalan dengan kepala tertunduk, memandangi ujung sepatunya sebelum akhirnya memberanikan diri membuka suara, mencairkan suasana untuk pertama kalinya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya pelan, hampir berbisik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Soal yang tadi... dan beberapa hari ini... terima kasih. Dan maaf karena aku sudah keterlaluan waktu di mobil.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghentikan langkahnya di bawah pendar lampu taman yang temaram, membalikkan tubuhnya menghadap Na Eun)</span></p><p class=\"c0\"><span class=\"c1\">\"Aku tahu semuanya, Na Eun-ah. Aku tahu kau sedang sangat tertekan. Kau takut perusahaan ini diakuisisi oleh investor luar karena tekanan besar dari ayahmu yang menuntut kesempurnaan. Tapi ada satu hal yang harus kau sadari...\" </span><span class=\"c1 c8\">(Junwoo melangkah mendekat, memangkas jarak di antara mereka)</span><span class=\"c4 c1\"> \"...saat ini kau sedang terluka karena memaksakan diri menjadi terlalu kuat.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Untuk pertama kalinya di dalam proses hubungan mereka, Park Junwoo mengulurkan kedua tangannya dan menarik tubuh Han Na Eun ke dalam dekapannya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sebuah kontak fisik yang tulus, erat, dan hangat. Na Eun tersentak sejenak, matanya membelalak kaget. Logikanya sempat menolak, namun kenyamanan dan rasa aman yang mengalir dari dada hangat Junwoo malam itu membuat seluruh badai di hatinya mendadak reda. Ia menerima pelukan itu dengan sadar, menyandarkan keningnya di bahu Junwoo, meskipun mulutnya masih mencoba memprotes lemah.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbisik lirih di dalam dekapan Junwoo, jemarinya meremas pelan kemeja pria itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lepaskan, Junwoo... Park Junwoo, lepaskan aku. Ini di tempat umum...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Justru mempererat pelukannya, membenamkan wajahnya di rambut Na Eun sembari tersenyum penuh kemenangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak mau. Untuk malam ini saja, aku tidak mau menuruti kata-katamu. Diamlah seperti ini sampai kau merasa lebih baik, Han Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di bawah pendar lampu taman malam itu, benteng pertahanan kedua Han Na Eun yang dibangun dengan keangkuhan sifat mandirinya telah benar-benar runtuh seutuhnya. Bukan karena ia kalah, melainkan karena ia akhirnya menemukan tempat di mana ia boleh menjadi lemah tanpa perlu takut dihakimi.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><h3 class=\"c14\" id=\"h.yrbqrs1hz5w5\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Daehyun sampai memegang dadanya dengan ekspresi luar biasa baper, matanya berbinar-binar gembira.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh Eonni, ini benar-benar puncaknya! Junwoo Oppa benar-benar tahu kapan harus bersikap tegas dan kapan harus memelukmu seerat itu! Jadi, pelukan di taman itu yang membuatmu akhirnya menyerah kalah pada pesonanya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas dengan rona merah alami yang menghiasi kedua pipinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, begitulah, Daehyun-ah. Malam itu ego kami benar-benar melebur di bawah lampu taman. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun yang sejak tadi mendengarkan cerita Na Eun dengan saksama, tiba-tiba mengubah ekspresi wajahnya menjadi agak ragu dan tidak enak hati. Ia teringat akan sesuatu hal yang krusial terkait masa depan bisnis kakak iparnya tersebut.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sedikit memajukan tubuhnya, menatap Na Eun dengan hati-hati)</span></p><p class=\"c0\"><span class=\"c1\">\"Ah... Eonni, maaf... Aku jadi penasaran satu hal. Apakah karena kejadian kerugian saat hari peluncuran di Florentina itu, akhirnya kau memutuskan untuk tidak melanjutkan nama </span><span class=\"c1 c8\">brand</span><span class=\"c4 c1\"> tersebut di tahun 2013 ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas pelan, tersenyum maklum sambil mengangguk)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya... benar sekali, Daehyun-ah. Akhirnya Ayah mengetahui seluruh detail masalah itu saat laporan kuartal ketiga (Q3) keluar. Ayah merasa bahwa aku memang masih harus banyak belajar lebih dalam lagi pada manajemen yang sudah jauh lebih berpengalaman. Dan manajemen berpengalaman yang dimaksud Ayah saat itu... tidak lain adalah di bisnis milik keluargamu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya membelalak kecil, tangannya menutup mulut karena terenyuh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya ampun, Eonni... Ternyata hal yang membawa takdir kita akhirnya bisa menyatu menjadi satu keluarga besar seperti sekarang ini, berawal dari sebuah cerita yang cukup pahit bagimu di masa lalu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menggelengkan kepala dengan pandangan yang kini jauh lebih bijak)</span></p><p class=\"c0\"><span class=\"c1\">\"Di awal merintis bisnis dulu, aku memang masih terlalu idealis, Daehyun-ah. Inilah kenapa sekarang akupun sadar sepenuhnya; jika saat itu aku tidak dituntun untuk belajar di Na Group, maka </span><span class=\"c1 c8\">brand</span><span class=\"c4 c1\"> Na Cosmetic yang kupegang sekarang tidak akan pernah bisa berkembang. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Justru karena keluargamu datang membantu proses akuisisi di tahun 2013, dan kedua orang tuamu dengan sangat sabar mengajariku cara berbisnis agar mentalku bisa jauh lebih matang, aku bisa menjadi sosok yang seperti ini sekarang. Ini adalah sebuah takdir yang sangat aku syukuri, sekaligus takdir indah yang akhirnya membawamu masuk ke dalam Keluarga Han.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya mendadak berkaca-kaca haru, tersenyum sangat tulus menatap Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni... aku benar-benar tidak percaya kalau jalinan takdir kita ternyata seindah ini. Hmmm... tapi rasanya kita harus segera menyudahi obrolan di sini dan membersihkan diri sekarang, Eonni. Kulit kita bisa keriput karena kita sudah terlalu lama berendam di dalam kolam spa ini, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tertawa lepas, lalu mulai bersiap bangkit dari posisi rileksnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Iya, kau benar. Ayo kita bilas badan dulu. Setelah ini giliran kita menikmati sesi pijat refleksi agar tubuh kita benar-benar segar kembali.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Kelahiran Cinta yang Nyata", "html": "<p class=\"c10 title\" id=\"h.tkzlsed1ocw0\"><span class=\"c23 c13\">Kelahiran Cinta yang Nyata</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.a0y4px78gepi\"><span class=\"c7 c1 c6\">BAB: KELAHIRAN CINTA YANG NYATA</span></h3><p class=\"c0\"><span class=\"c3 c1\">Bagian 1: Invasi Akhir Pekan Jilid Dua (Juli 2012)</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana pagi hari sekitar pukul 08.00 di depan gerbang megah kediaman keluarga Han. Matahari musim panas bulan Juli mulai memancarkan sinarnya yang hangat. Na Eun melangkah keluar dari pintu rumah dengan pakaian kasual, dahi berkerut saat melihat mobil Junwoo sudah terparkir rapi di depan gerbang. Junwoo berdiri bersandar di kap mobil sembari tersenyum santai.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melipat kedua tangan di dada, menatap Junwoo dengan dahi berkerut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hari ini kita mau ke mana lagi, Park Junwoo? Ini sudah pukul delapan pagi, tidak mungkin kan kau mengajakku melakukan jogging subuh seperti waktu itu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, melangkah membukakan pintu penumpang untuk Na Eun)</span></p><p class=\"c0\"><span class=\"c1\">\"Tentu saja tidak, Na Eun-ah. Hari ini agendanya berbeda. Aku akan mengajakmu melakukan </span><span class=\"c1 c8\">hiking</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak membelalakkan matanya, terkejut)</span></p><p class=\"c0\"><span class=\"c1\">\"Apa? </span><span class=\"c1 c8\">Hiking</span><span class=\"c4 c1\">? Kau bahkan tidak membahas atau mengatakan apapun padaku kemarin! Kenapa tiba-tiba sekali mengajak naik gunung tanpa ada persiapan sama sekali?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengibaskan tangannya santai, tersenyum menenangkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudahlah, santai saja. Anggap saja kita sedang berjalan-jalan santai hari ini. Jangan terlalu memikirkan bagaimana caranya sampai ke puncak, cukup nikmati saja setiap proses perjalanannya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Masih sangsi, menatap Junwoo curiga)</span></p><p class=\"c0\"><span class=\"c1\">\"Memangnya kita mau </span><span class=\"c1 c8\">hiking</span><span class=\"c4 c1\"> ke mana?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunjuk ke arah utara dengan ibu jarinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Taman Nasional Bukhansan. Satu-satunya taman nasional di Seoul yang terletak di pinggiran utara kota. Tempat itu terkenal dengan puncak granitnya yang megah dan bahkan memegang Rekor Dunia Guinness untuk kepadatan pengunjung tertinggi per unit luas. Aksesnya sangat mudah, jadi kita bisa menikmati panorama seluruh kota Seoul dari atas sana dengan jelas. Ayo masuk, Han Na Eun.\"</span></p><h3 class=\"c11\" id=\"h.89p8smjytjas\"><span class=\"c7 c1 c6\">Bagian 2: Isi Jok Belakang dan Janji yang Ditagih</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di dalam mobil Junwoo. Na Eun baru saja mendudukkan dirinya di kursi penumpang. Saat ia menoleh ke kabin belakang, matanya menangkap pemandangan jok belakang yang dipenuhi oleh berbagai perlengkapan outdoor profesional—mulai dari tas gunung (carrier), jaket tebal windbreaker, hingga set tenda kemah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh cepat ke arah Junwoo dengan tatapan horor)</span></p><p class=\"c0\"><span class=\"c1\">\"Junwoo-ya... jangan bilang kau berniat mengajakku </span><span class=\"c1 c8\">camping</span><span class=\"c4 c1\"> dan menginap di gunung juga malam ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memutar kemudi, melirik Na Eun dengan senyum jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa tidak? Kau harus sesekali menikmati kehidupan di alam luar, Han Na Eun. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Hidupmu selama ini rasanya hanya habis digunakan untuk menatap layar laptop dan tumpukan laporan bisnis saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Egonya langsung mencuat, membela diri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tidak mau! Ada laporan Florentina yang harus aku selesaikan dan periksa malam ini juga!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengedikkan bahu, nadanya terdengar santai namun mutlak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau begitu, aku juga tidak peduli. Lusa kemarin malam saat kita di taman, kau sudah berjanji sendiri untuk mulai mendengarkan perkataanku selama masa proses ini, kan? Ya sudah, aku akan menagih janji itu hari ini. Kau harus ikut aturanku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Refleks berteriak gemas karena merasa skakmat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Park Junwoo!!!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas melihat ekspresi kesal tunangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa? Apa kau mau mengingkari janji dan tidak mau mendengarkanku lagi? Lagipula... aku sengaja memilih agenda ini karena aku tahu apa kesukaanmu saat dulu kau masih kuliah di luar negeri.\"</span></p><h3 class=\"c11\" id=\"h.75hd2p3ymnma\"><span class=\"c7 c1 c6\">Bagian 3: Bocoran dari Informan Rahasia</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Mobil melaju membelah jalanan kota Seoul menuju arah utara. Na Eun seketika terdiam. Kalimat terakhir Junwoo membuat otaknya berpikir keras dan mendadak bingung.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh patah-patah, menatap Junwoo dengan dahi berkerut dalam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa maksudmu kau tahu? Memangnya... apa yang kau ketahui tentang masa kuliahku di luar negeri?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum penuh arti, melirik Na Eun sekilas)</span></p><p class=\"c0\"><span class=\"c1\">\"Aku tahu kalau kau itu sebenarnya sangat suka melakukan </span><span class=\"c1 c8\">traveling</span><span class=\"c1\"> dan </span><span class=\"c1 c8\">hiking</span><span class=\"c4 c1\"> ke alam bebas untuk melepaskan penatmu dari tugas-tugas kuliah yang menumpuk. Benar, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Semburat merah tipis muncul di pipinya karena rahasia pribadinya terbongkar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Siapa... siapa yang memberitahumu hal itu? Tidak mungkin kau tahu sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh geli, menggelengkan kepalanya)</span></p><p class=\"c0\"><span class=\"c1\">\"Adikmu sendiri yang menceritakannya padaku, Na Eun-ah. Han Seo Pyo. Dia mengeluh padaku kalau dialah orang yang selalu kau seret dan kau paksa ikut kemanapun keinginanmu untuk </span><span class=\"c1 c8\">traveling</span><span class=\"c1\"> dan </span><span class=\"c1 c8\">hiking</span><span class=\"c4 c1\"> muncul saat kalian di luar negeri dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika memalingkan wajahnya ke arah jendela luar, menggertakkan giginya menahan kesal sembari mengumpat dalam hati)</span></p><p class=\"c0\"><span class=\"c5 c1\">'Dasar Han Seo Pyo... awas kau ya, berani-beraninya menjual informasi kakakmu sendiri pada pria ini!'</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat perubahan ekspresi Na Eun, senyumnya semakin lebar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi jangan beralasan lagi, Han Na Eun. Hari ini, lepaskan status pimpinan Florentina-mu sejenak, dan mari kita nikmati Gunung Bukhansan bersama-sama.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.46y13dxhm2t9\"><span class=\"c7 c1 c6\">Bagian 4: Godaan di Jalur Dulle-gil</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berganti di area gerbang awal pendakian Taman Nasional Bukhansan. Udara terasa bersih dan menyegarkan. Beberapa pendaki lain tampak sedang bersiap-siap. Na Eun mengencangkan tali sepatunya, lalu menoleh ke arah Junwoo yang sedang merapikan tas carrier di punggungnya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-15.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi kita mau lewat jalur mana? Yang jelas, aku tidak mau melewati jalur yang susah-susah ya, Park Junwoo. Tenagaku tidak sepertimu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum santai, menunjuk papan peta digital di dekat gerbang)</span></p><p class=\"c0\"><span class=\"c1\">\"Tenang saja, kita lewat jalur </span><span class=\"c1 c8\">Bukhansan Dulle-gil Trail</span><span class=\"c1\"> saja. Jalurnya relatif landai dan ramah untuk berjalan santai. Nanti setelah sore, kita bisa langsung menuju ke tempat berkemah di </span><span class=\"c1 c8\">Bukhansan Dulle Camp</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, menatap tas besar di punggung Junwoo dengan heran)</span></p><p class=\"c0\"><span class=\"c1\">\"Tunggu... kalau kau mengajakku </span><span class=\"c1 c8\">camping</span><span class=\"c1\"> di </span><span class=\"c1 c8\">Bukhansan Dulle Camp</span><span class=\"c4 c1\">, buat apa kau repot-repot membawa tenda besar dan perlengkapan sendiri dari rumah? Bukankah pihak pengelola di sana sudah menyiapkan semua fasilitas persewaan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika tertawa lepas, menggeleng-gelengkan kepalanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Naeun-ah, Naeun-ah... kau ini memang unik sekali. Tenda yang kubawa di punggungku ini khusus untukmu, karena tenda pribadi ini jauh lebih nyaman dan bersih daripada yang ada di persewaan umum. Dan untukku sendiri, aku bisa pakai tenda dari persewaan camp nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo mendadak memajukan wajahnya sedikit, menatap Na Eun dengan binar mata usil yang khas)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa? Apa jangan-jangan... kau mau kita tidur di dalam satu tenda yang sama, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya seketika memerah padam, matanya membelalak kaget karena salah tingkah tingkat dewa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa-apaan kau ini?! Enak saja!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Untuk menutupi rasa malunya yang meledak, Na Eun langsung membalikkan badan dan berjalan cepat mendahului Junwoo menyusuri jalur pendakian)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berteriak sembari menyusul langkah cepat tunangannya dengan tawa yang menggema)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun, tunggu aku! Hahaha! Jangan jalan cepat-cepat, nanti kau cepat lelah!\"</span></p><h3 class=\"c11\" id=\"h.c1ok56qtbv8s\"><span class=\"c7 c1 c6\">Teduhnya Hutan Pinus dan Bekal dari Rumah</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah menempuh setengah perjalanan, keduanya memutuskan untuk menepi dan beristirahat di sebuah area pondok kayu yang teduh di pinggir jalur trekking. Na Eun duduk bersandar sembari mengatur nafasnya, sementara Junwoo mengedarkan pandangannya ke sekeliling mereka.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-16.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merentangkan kedua tangannya, menghirup udara dalam-dalam)</span></p><p class=\"c0\"><span class=\"c1\">\"Lihatlah ke sekelilingmu, Naeun-ah. Jalur ini membelah hutan pinus asli Korea (</span><span class=\"c1 c8\">Korean pine</span><span class=\"c4 c1\">) dan pohon ek yang sangat teduh. Suasana hutannya begitu sunyi dan menenangkan, bukan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuka botol air putihnya, meminumnya perlahan sebelum mengangguk setuju)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Memang... suasananya sangat tenang di sini.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat Na Eun yang tampak lelah, Junwoo menurunkan tasnya. Ia merogoh ke dalam dan mengeluarkan sebuah kotak bekal rajutan hangat, lalu membukanya di atas meja kayu.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau pasti belum sempat sarapan tadi sebelum berangkat, ya kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memalingkan wajah, bergumam pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku... aku tadi memang belum lapar, Junwoo-ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum maklum, menggeser kotak bekal itu ke hadapan Na Eun)</span></p><p class=\"c0\"><span class=\"c1\">\"Ya sudah, makan ini. Aku bawa banyak variasi menu hari ini. Ada </span><span class=\"c1 c8\">Kimbab</span><span class=\"c4 c1\">, nasi gulung rumput laut yang isinya sayuran, daging sosis, dan telur sangat cocok dimakan langsung tanpa sendok di alam bebas begini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Lalu ada </span><span class=\"c1 c8\">Samgak Kimbap</span><span class=\"c4 c1\">, kimbap bentuk segitiga yang praktis dengan isian tuna mayo dan bulgogi. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Dan terakhir, ini ada </span><span class=\"c1 c8\">Jumeok Bap</span><span class=\"c4 c1\">, nasi kepal mini ala Korea yang dicampur minyak wijen, sedikit garam, dan taburan nori yang gurih.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berkedip heran, menatap jajaran makanan yang tertata rapi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... membawa semua makanan ini dari rumah?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Tentu saja. Ayo dimakan.\" </span><span class=\"c1 c8\">(Junwoo mengambil sepasang sumpit, lalu menyumpitkan sepotong Kimbab hangat dan mengarahkannya ke depan mulut Na Eun)</span><span class=\"c4 c1\"> \"Buka mulutmu, Han Na Eun.\"</span></p><h3 class=\"c11\" id=\"h.uy2d7bm7cuub\"><span class=\"c7 c1 c6\">Bagian 6: Rasa yang Berbeda dari Balik Dapur</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Na Eun sempat ragu sejenak sebelum akhirnya menerima suapan itu. Ia mengunyahnya pelan-pelan. Seketika, matanya berbinar terkejut. Rasa makanan itu benar-benar enak, gurih, dan memiliki kehangatan khas masakan rumah sebuah cita rasa yang sangat jarang ia rasakan karena sehari-hari ia terbiasa menyantap masakan koki pribadi atau asisten rumah tangga di rumahnya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menopang dagunya dengan tangan, memperhatikan ekspresi Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana rasanya? Apa kau suka?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk pelan, menelan makanannya dengan canggung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Siapa yang memasak semua ini? Rasanya benar-benar beda... rasanya sangat enak.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdehem pelan, menggaruk tengkuknya yang tidak gatal sembari tersenyum bangga)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku yang memasaknya sendiri. Tadi pagi-pagi buta sekali aku sudah bangun untuk menyiapkan ini semua, karena ini adalah jenis makanan khas Korea yang paling cocok dan praktis untuk dijadikan perbekalan naik gunung.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun seketika tertegun di tempat duduknya. Pikirannya mendadak melayang mengingat deretan pria-pria kaya yang pernah dijodohkan dengannya sebelum ini. Mereka semua selalu berlomba-lomba membelikan makanan di restoran bintang lima yang mewah, membawa dirinya ke tempat-tempat menarik yang mahal demi pamer status. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, lagi-lagi... Park Junwoo sama sekali tidak seperti itu. Pria di hadapannya ini justru memilih memberikan ketulusan lewat hal-hal kecil yang bermakna.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk, bertanya dengan nada malu-malu yang jarang ia tunjukkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... ternyata suka memasak?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sedikit, hehehe. Tapi karena aku sangat menyukai cita rasa masakan Korea rumahan, jadi kupikir apa salahnya jika aku belajar untuk memasaknya sendiri?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencicipi sepotong Samgak Kimbap lagi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi rasanya ini benar-benar bukan seperti masakan seorang pemula. Kau pasti sudah sangat sering melakukannya, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum mengenang masa lalu)</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, sering sekali dulu. Terutama saat aku masih bertugas di Jenewa dan masa-masa kuliah di Inggris. Setiap kali aku merasa rindu dengan rumah (</span><span class=\"c1 c8\">homesick</span><span class=\"c4 c1\">), aku memang suka memasak makanan-makanan ini untuk dijadikan bekalku sendiri, hehehe.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun kembali terdiam, menatap Junwoo dengan pandangan yang perlahan mulai melunak. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di dalam hatinya, ada rasa kagum yang menyeruak. Ia tidak menyangka bahwa seorang pria yang memiliki potensi luar biasa besar, berpendidikan tinggi, dan terkenal pernah sibuk sebagai diplomat muda, ternyata memiliki sisi sederhana yang sangat menyukai dunia memasak. Tembok pembatas di hati Na Eun, siang itu, kembali terkikis oleh kehangatan sepotong kimbap rumahan.</span></p><h3 class=\"c11\" id=\"h.ozzko1brfpbp\"><span class=\"c7 c1 c6\">Bagian 5: Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke salon spa VVIP. Daehyun langsung menangkup kedua pipinya dengan mata berbinar-binar penuh rasa iri yang menggemaskan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo Oppa benar-benar definisi pria idamanmu, Eonni! Dia bangun subuh-subuh hanya untuk membuatkanmu tiga jenis kimbap rumahan? Ah, andai saja suamiku bisa memasak sekreatif itu! Jadi, di Gunung Bukhansan itulah rasa penasaranmu berubah menjadi benih cinta yang nyata, Eonni?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, membenarkan posisi handuknya dengan senyum penuh kebahagiaan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, bisa dibilang begitu, Daehyun-ah. Hari itu aku baru sadar, bahwa cinta yang nyata tidak melulu soal kemewahan, melainkan tentang siapa yang mau meluangkan waktu dan hal-hal yang tampaknya sepele ternyata berharga.\"</span></p><h3 class=\"c11\" id=\"h.61xxqlqtrvo7\"><span class=\"c7 c1 c6\">Bagian 7: Filosofi Puncak dan Esensi Proses</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana siang beranjak sore di sepanjang jalur Bukhansan Dulle-gil Trail. Langkah kaki mereka terdengar beriringan di atas tanah berkerikil. Junwoo dan Na Eun berjalan dengan ritme yang lebih santai, sesekali menikmati hembusan angin yang menggoyang dedaunan pinus di kanan-kiri mereka sambil berbincang ringan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Na Eun yang berjalan di sampingnya)</span></p><p class=\"c0\"><span class=\"c1\">\"Naeun-ah, kalau dulu saat kuliah di luar negeri kau sangat suka melakukan </span><span class=\"c1 c8\">hiking</span><span class=\"c1\"> dan </span><span class=\"c1 c8\">traveling</span><span class=\"c4 c1\">, kenapa kegiatan menyenangkan seperti itu sama sekali tidak pernah kau lakukan lagi sekarang?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap lurus ke depan, nadanya kembali datar dan tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Prioritasku sekarang sudah berbeda, Park Junwoo. Tanggung jawabku besar di Florentina. Untuk apa aku membuang-buang waktu dengan bersenang-senang atau bersantai di masa sekarang?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, mengangguk-angguk kecil)</span></p><p class=
