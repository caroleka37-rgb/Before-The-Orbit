/span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk singkat, namun wajahnya agak ditekuk, menyiratkan sisa emosi dari pembicaraan ayahnya tadi pagi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Boleh...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memelankan laju mobil di lampu merah, menatap Na Eun lekat-lekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau kenapa, Naeun-ah? Sejak kita keluar dari rumahmu tadi, kau terlihat seperti tidak bersemangat dan banyak pikiran.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertegun sejenak, lalu memaksakan sebuah senyuman tipis agar Junwoo tidak curiga)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak apa-apa, Junwoo-ya... Tidak ada yang perlu dikhawatirkan. Ayo berangkat.\"</span></p><h3 class=\"c11\" id=\"h.tkaf30dukgys\"><span class=\"c7 c1 c6\">Kejutan di Lotte Young Plaza Myeongdong</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berganti di dalam gedung Lotte Young Plaza, Myeongdong. Tempat itu tampak ramai dan dinamis, dipenuhi oleh anak-anak muda. Saat mereka sedang berjalan menyusuri koridor toko, langkah kaki Junwoo mendadak terhenti di depan sebuah pop-up store yang dipenuhi dekorasi visual mencolok. Junwoo langsung tersenyum lebar karena teringat akan satu detail tentang masa lalu Na Eun yang pernah ia ketahui.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa aba-aba langsung meraih dan menggandeng erat tangan Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo, ikut aku ke sini sebentar!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terperanjat, langkah kakinya terseret pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh? Eh, Park Junwoo! Kenapa tiba-tiba menarikku? Kita mau ke mana?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah masuk ke dalam pop-up store dengan percaya diri, lalu berbalik sambil merentangkan tangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tadaaa! Ini... bukankah ini adalah duniamu di masa lalu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun seketika tertegun dan menghentikan langkahnya total. Matanya membelalak menatap sekeliling ruangan yang dipenuhi oleh merchandise, album, dan photocard K-Pop. Ini adalah pertama kalinya ia menginjakkan kaki di sebuah pop-up store K-Pop secara langsung. Meskipun ia memang sudah menyukai musik K-Pop sejak zaman SMA, di usianya yang kini menginjak 29 tahun, ia sama sekali tidak pernah berani datang ke tempat seperti ini karena merasa tidak percaya diri dan takut dianggap kekanak-kanakan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbisik panik, menarik ujung kemeja Junwoo sembari melihat sekeliling)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau malah mengajakku ke tempat seperti ini, Junwoo-ya? Aku kan sudah bukan remaja lagi!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, geli melihat kepanikan tunangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Naeun-ah, kau ini benar-benar unik ya. Memangnya sejak kapan menyukai K-Pop itu ada batasan umurnya? Lihatlah, ini adalah bagian dari hidupmu yang sebelumnya yang sempat kau sembunyikan karena terlalu sibuk bekerja. Coba kau lihat-lihat dulu ke sana dan berkeliling. Jika dirasa ada barang yang cocok atau kau sukai, kau boleh beli apa saja. Aku yang bayar.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggelengkan kepalanya cepat, egonya kembali berbisik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, tidak mau, Junwoo... Aku malu, ayo kita keluar saja dari sini...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh kedua tangannya di bahu Na Eun, memutar tubuh wanita itu menghadap deretan display)</span></p><p class=\"c0\"><span class=\"c1\">\"Sudah, jangan berkilah dan jangan pasang gengsimu itu hari ini. Ayo, kelilingi </span><span class=\"c1 c8\">pop-up store</span><span class=\"c4 c1\"> ini sampai kau puas.\"</span></p><h3 class=\"c11\" id=\"h.t34agda1ddn8\"><span class=\"c7 c1 c6\">Melelehnya sang Gunung Es</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Junwoo dengan lembut namun tegas mendorong Na Eun untuk mulai berjalan menyusuri lorong toko. Awalnya Na Eun melangkah dengan ragu dan kaku. Namun, begitu matanya melihat deretan album lawas dan pernak-pernik estetik dari grup favoritnya, benteng pertahanannya runtuh.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo berdiri agak jauh di dekat pintu masuk, menyandarkan punggungnya ke dinding sembari melipat tangan. Dari kejauhan, ia memperhatikan bagaimana raut wajah Na Eun yang sejak pagi tadi terlihat bete, muram, dan ditekuk, kini berubah 180 derajat menjadi jauh lebih bahagia. Mata Na Eun berbinar-binar cerah saat memegang sebuah merchandise, dan senyum tulus yang lepas terukir di bibirnya sebuah pemandangan langka yang membuat jantung Junwoo berdegup dua kali lebih cepat.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bergumam pelan dengan senyuman tulus yang sangat hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah... begitu, Han Na Eun. Tersenyumlah seperti itu. Sifat kakumu, tuntutan keluargamu, atau apa pun yang membebani pikiranmu pagi ini... lupakan saja semuanya saat kau sedang bersamaku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c11\" id=\"h.tqvv39ey2aii\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026) – Antara Tuntutan Ayah dan Kebahagiaan Myeongdong</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpantulan ke masa sekarang di dalam ruangan spa VVIP. Suara instrumen musik tradisional yang menenangkan mengalun lirih. Na Eun dan Daehyun kini sedang berbaring telungkup di atas kasur spa empuk, menikmati pijatan lembut dan layanan lulur aromaterapi dari para terapis. Suasana begitu rileks, namun obrolan mereka justru semakin seru.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil memejamkan mata, menikmati sensasi lulur di punggungnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah... Eonni, aku benar-benar baru tahu kalau dulu Ayah se-frontal itu mendikte masa depan Junwoo Oppa. Memaksimalkan pernikahan di tahun 2012 dan langsung menyiapkan jalur politik? Astaga... pantas saja saat itu tanganmu sampai mengepal menahan amarah di balik pintu kaca.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengembuskan napas panjang, menolehkan kepalanya sedikit ke arah Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm, begitulah. Saat itu hatiku rasanya campur aduk, Daehyun-ah. Aku benci melihat Ayah yang selalu memperlakukan masa depan anak-anaknya bahkan calon menantunya seperti bidak catur yang diatur sesuka hati.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuka satu matanya, menatap Na Eun penuh empati)</span></p><p class=\"c0\"><span class=\"c1\">\"Aku mengerti perasaanmu, Eonni. Tapi... plot twist dari Junwoo Oppa di siang harinya benar-benar tak terduga! Bagaimana bisa dia terpikir untuk membawamu ke </span><span class=\"c1 c8\">pop-up store</span><span class=\"c4 c1\"> K-Pop di Lotte Young Plaza Myeongdong?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika tertawa kecil, rasa hangat langsung menjalar di dadanya mengingat momen itu)</span></p><p class=\"c0\"><span class=\"c1\">\"Hahaha, jangankan kau, aku sendiri pun syok setengah mati hari itu. Gengsi umur dua puluh sembilan tahunku rasanya runtuh seketika saat melihat lautan </span><span class=\"c1 c8\">merchandise</span><span class=\"c1\"> dan </span><span class=\"c1 c8\">photocard</span><span class=\"c4 c1\">. Aku merasa seperti kembali jadi anak SMA yang bebas tanpa beban keluarga.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut terkekeh geli sampai bahunya berguncang pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Junwoo Oppa benar-benar genius kalau urusan membaca suasana hatimu! Dia tahu cara terbaik untuk menjinakkan stresmu bukan dengan kemewahan, tapi dengan mengembalikan bagian dari dirimu yang sempat hilang karena tuntutan pekerjaan dan keluarga. Tapi tunggu, Eonni... apa di pop-up store itu kau akhirnya kalap belanja?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya memerah tipis karena malu)</span></p><p class=\"c0\"><span class=\"c1\">\"Ih, jangan ditanya lagi! Awalnya saja aku menolak dan sok jual mahal, tapi ujung-ujungnya aku malah berkeliling sambil memeluk tiga album dan beberapa </span><span class=\"c1 c8\">merchandise</span><span class=\"c4 c1\"> limited edition. Dan yang membuatku semakin salah tingkah, Junwoo benar-benar berdiri di sudut ruangan sambil tersenyum bangga melihatku, lalu mengeluarkan dompetnya di kasir tanpa ragu sedikitpun.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas panjang, tersenyum kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... manis sekali. Junwoo Oppa tidak hanya membeli barang-barang K-Pop itu untukmu, Eonni. Tapi di hari itu, dengan status kencan baru kalian, dia sebenarnya sedang membeli kembali senyuman tulus seorang Han Na Eun yang sempat terenggut oleh tekanan dunia luar. Dia benar-benar definisi pria pelindung yang nyata.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c11\" id=\"h.kafdsdbzc3xb\"><span class=\"c7 c1 c6\">Kejujuran di Meja Makan dan Pelindung yang Sesungguhnya</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke salah satu restoran yang nyaman di dalam mal Lotte Young Plaza. Beberapa kantong belanjaan berisi merchandise K-Pop milik Na Eun diletakkan dengan rapi di kursi samping. Di atas meja, hidangan makan siang mereka sudah tersaji hangat. Junwoo menyumpit makanannya, lalu menatap Na Eun dengan senyuman santai.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau dipikir-pikir... ini baru pertama kalinya ya aku mengajakmu makan di restoran dalam mal seperti ini? Biasanya aku selalu mengajakmu makan di kedai kaki lima atau kedai biasa, hahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengaduk minumannya, tersenyum tulus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak apa-apa, makanan di kedai kaki lima yang kau rekomendasikan sebelumnya juga semuanya enak kok.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk setuju)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, sesekali kita memang harus makan di mana pun agar kau bisa mencoba banyak hal baru dalam hidupmu. Jadi kau tidak bosan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meletakkan sumpitnya perlahan, menatap Junwoo dengan tatapan serius)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... oh ya, Junwoo-ya. Sebenarnya... kenapa pagi tadi kau datang ke rumahku jauh lebih awal dari jam janji kita?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar pertanyaan itu, gerakan tangan Junwoo yang hendak menyuap makanan seketika terhenti. Ia meletakkan sumpitnya kembali ke piring. Melihat sorot mata Na Eun, Junwoo langsung menyadari bahwa raut wajah bad mood tunangannya saat keluar rumah tadi pagi pasti ada kaitannya dengan hal ini.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menarik napas pelan, menjawab jujur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, aku memang sengaja datang pagi-pagi sekali karena Ayahmu meneleponku pagi-pagi buta.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap lurus ke bola mata Junwoo, suaranya memberat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tahu semuanya, Park Junwoo. Begitu menyadari kedatanganmu di rumahku yang terlampau awal, aku turun dan memperhatikan kalian berdua dari balik pintu kaca.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaikkan alisnya sedikit, membaca situasi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau begitu... kau mendengar seluruh isi percakapan Ayahmu denganku di halaman samping tadi?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk tegas, emosi yang ditahannya sejak pagi mulai mencuat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja aku mendengar semuanya. Dan jujur, inilah hal yang paling aku khawatirkan sejak awal. Setelah kita berdua melewati banyak hal melelahkan untuk bisa saling memahami, Ayah tiba-tiba mencoba mengambil kendali lagi atas hubungan kita. Dan aku... aku sangat tidak suka itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengulurkan tangannya di atas meja, mencoba menenangkan)</span></p><p class=\"c0\"><span class=\"c1\">\"Tenang, Naeun-ah. Kau tidak perlu berpikiran berlebihan (</span><span class=\"c1 c8\">overthink</span><span class=\"c4 c1\">) sampai sejauh itu. Sewajarnya orang tua, beliau pasti hanya ingin memberikan pilihan yang terbaik untuk masa depan anaknya, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya bergetar menahan kekesalan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya, kau harus tahu satu hal. Ayahku itu orang yang sangat keras! Dia selalu mengatur jalan hidup anak-anaknya sesuka hatinya sendiri, dia mendikte segalanya dan menjadikan kami seakan-akan tidak punya pilihan lain untuk menolak!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun lekat-lekat, menebak)</span></p><p class=\"c0\"><span class=\"c1\">\"Jadi... kau semarah ini karena mendengar ucapan Ayah yang meminta </span><span class=\"c1 c8\">deadline</span><span class=\"c4 c1\"> pernikahan kita harus dilaksanakan tahun ini (2012), ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terdiam sejenak, matanya mulai berkaca-kaca, lalu menggelengkan kepala)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bukan... bukan karena masalah itu, Junwoo-ya. Justru... aku tidak terima karena Ayah sudah berani mengatur jalan karier dan hidupmu secara terang-terangan tadi! Dia ingin menyetirmu masuk ke dunia politik demi kepentingan keluarga.\"</span></p><h3 class=\"c11\" id=\"h.qg3slfiymw99\"><span class=\"c7 c1 c6\">Air Mata dan Celotehan Penyelamat</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Junwoo seketika tertegun di kursinya. Ia terdiam seribu bahasa, menatap wajah Na Eun yang kini dipenuhi kecemasan yang mendalam. Di dalam hatinya, ada rasa hangat yang menyeruak hebat saat menyadari bahwa kemarahan dan ketakutan Na Eun sejak pagi tadi bukanlah ego pribadi, melainkan karena wanita itu teramat mengkhawatirkan dirinya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sangat lembut, menggenggam erat tangan Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudahlah, kau jangan mengambil pusing masalah itu lagi. Tadi itu kami hanya mengobrol biasa sesama pria, kok. Masalah masa depan kita kelak, biar nanti kita berdua yang urus dan putuskan bersama. Dan kau... kau tidak perlu takut kalau Ayah akan mengintervensi atau menyetir rumah tangga kita nanti. Aku tidak selemah itu, Han Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar ketegasan dan janji pelindung dari mulut Junwoo, pertahanan Na Eun runtuh. Setitik air mata akhirnya lolos membasahi pipinya. Ia menangis pelan, meluapkan rasa sesak yang menghimpit dada mandirinya selama ini.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat tunangannya mulai menangis, Junwoo langsung memutar otak. Ia tidak ingin suasana kencan resmi mereka berakhir dengan air mata. Dengan cepat, ia mengubah ekspresi wajahnya menjadi sok heboh dan mulai menceritakan celotehan konyol tentang idola K-Pop dan barang-barang belanjaan unik yang dibeli Na Eun di pop-up store tadi dengan gaya yang dibuat-buat.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sembari menunjuk kantong belanjaan dengan heboh)</span></p><p class=\"c0\"><span class=\"c1\">\"Lagipula, Naeun-ah! Coba kau bayangkan nanti kalau aku jadi politisi, lalu di dirumah kita nanti penuh dengan pajangan </span><span class=\"c1 c8\">photocard</span><span class=\"c4 c1\"> dan album K-Pop yang kaubeli tadi? Hahaha! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kolega politik lain pasti akan syok melihat selera istri menteri mereka ternyata seorang fangirl garis keras, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika tertegun mendengar gurauan konyol Junwoo, lalu refleks mendengus tawa di tengah tangisnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ih... apa-apaan sih, Park Junwoo! Hahaha, tidak lucu!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memberikan selembar tisu sambil tersenyum puas karena misinya berhasil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, begitu dong. Tersenyum. Ayo usap air matamu, tidak boleh cengeng di depan kimbab, hahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menerima tisu itu, mengusap sisa air matanya sambil tersenyum lebar. Rasa gundah dan sesak yang membayangi pikirannya sejak pukul tujuh pagi tadi, kini menguap tak berbekas, digantikan oleh rasa aman yang dihadirkan oleh pria di hadapannya.)</span></p><h3 class=\"c11\" id=\"h.2o7gft7zdfx2\"><span class=\"c7 c1 c6\">Rencana Mendadak di Depan Department Store</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana sore hari di koridor Lotte Young Plaza. Na Eun berjalan berdampingan dengan Junwoo sembari membawa kantong belanjaan K-Pop miliknya. Langkah kaki mereka tiba-tiba melambat dan berhenti tepat di depan area pintu masuk department store yang menjual berbagai bahan makanan premium dan perlengkapan rumah tangga.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh ke arah Junwoo dengan dahi berkerut bingung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kita malah berhenti di depan sini, Junwoo-ya? Ada barang yang tertinggal?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lebar, memasukkan satu tangannya ke saku celana)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Malam ini aku akan mengajakmu pergi ke rumahku. Bukankah selama ini kau belum bertemu lagi dengan kedua orang tuaku secara santai setelah acara pertunangan resmi kita waktu itu, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertegun sejenak, lalu mengangguk pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... iya juga, sih. Jadi... alasan kita berhenti di sini karena kita mau membeli sesuatu untuk dibawa ke sana?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk penuh semangat, menunjuk ke dalam toko)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar sekali. Kita akan berbelanja beberapa bahan makanan sedikit, karena rencananya nanti malam kita semua akan mengadakan acara BBQ-an santai di halaman belakang rumahku.\"</span></p><h3 class=\"c11\" id=\"h.c2astabk8wm0\"><span class=\"c7 c1 c6\">Eksplorasi Menu dan Hangatnya Tradisi Rumah</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Mereka berdua melangkah masuk ke dalam area department store. Suasana di dalam tampak bersih, rapi, dan dipenuhi aroma segar dari bagian buah-buahan serta daging. Junwoo dengan cekatan mengambil sebuah troli belanjaan kecil dan mulai menuntun Na Eun menyusuri lorong sayuran segar.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperhatikan cara Junwoo memilih sayuran, merasa asing dengan pemandangan itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... ternyata sudah biasa berbelanja kebutuhan dapur seperti ini ya, Junwoo-ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan sambil memasukkan seikat daun selada segar ke dalam troli)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak sering-sering amat, sih. Biasanya aku hanya bertugas mengantar dan menemani Ibuku saja kalau beliau sedang ingin belanja banyak.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, bertanya dengan polos)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tunggu... memangnya di rumahmu tidak memakai asisten rumah tangga?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum maklum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja ada, Naeun-ah. Tapi tugas asisten di rumah kami memang tidak termasuk untuk urusan berbelanja bahan makanan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langkahnya terhenti, menatap Junwoo dengan tatapan heran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa bisa begitu? Bukankah akan jauh lebih praktis dan menghemat waktu jika asisten yang mengurus semuanya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghentikan trolinya, berbalik menghadap Na Eun dengan tatapan hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya... karena Ibuku sangat suka berbelanja bahan makanan sendiri. Menurut beliau, selain bisa dijadikan waktu untuk eksplorasi dan menyegarkan pikiran di luar rumah, dengan datang langsung ke pasar atau toko seperti ini, beliau bisa menentukan sendiri menu makanan apa yang paling sesuai dan paling sehat untuk disajikan kepada keluarga hari itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun seketika terdiam seribu bahasa di tengah lorong toko. Kata-kata Junwoo barusan mendadak membuat dadanya berdenyut asing. Pikirannya langsung melayang membandingkan kebiasaan keluarga Junwoo dengan lingkungan keluarganya sendiri. Di rumah keluarga Han, urusan dapur, menu makanan, hingga belanja harian adalah tugas mutlak para koki pribadi dan pelayan. Ibunya hampir tidak pernah menyentuh urusan sekecil itu karena sibuk dengan urusan sosialita dan bisnis. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar bagaimana Ibu Junwoo mendedikasikan waktu belanjanya demi kebahagiaan keluarga, membuat Na Eun menyadari betapa hangat dan perbedaannya pondasi rumah tangga yang akan ia masuki ini sebuah kehangatan sederhana yang tidak bisa dibeli dengan uang sekaya apapun keluarganya.</span></p><h3 class=\"c11\" id=\"h.kbag0tuek7su\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas panjang, matanya berbinar kagum sambil memandangi langit-langit langit ruangan spa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah... Eonni, pantas saja Ibu Mertuamu, Nyonya Park, selalu tahu resep masakan yang paling enak setiap kali kau berkunjung ke rumah mereka. Ternyata filosofi belanjanya sedalam itu ya!?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lembut, membenarkan posisi bantal spanya dengan perasaan emosional yang hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Daehyun-ah. Hari itu hatiku benar-benar tersentuh. Aku yang selama ini dibesarkan di lingkungan di mana semua hal serba dilayani oleh asisten, tiba-tiba diperlihatkan sebuah kenyataan bahwa kebahagiaan sebuah rumah tangga justru dibangun dari hal-hal kecil yang diurus sendiri dengan penuh cinta. Sore itu, di depan troli belanjaan itu... aku makin yakin kalau aku tidak salah memilih pria untuk masa depanku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.o5unhxmx3uyf\"><span class=\"c7 c1 c6\">Perjalanan yang Cemas dan Perang Pikiran</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di dalam mobil Junwoo. Mobil bergerak pelan membelah jalanan perumahan yang tenang. Di kursi penumpang, Na Eun tampak gelisah. Jemarinya bertautan erat di atas pangkuan. Pikirannya benar-benar kalut. Ini adalah pertama kalinya ia akan bertemu lagi dengan keluarga Junwoo setelah pertunangan resmi mereka. Ia merasa takut jika nanti mereka akan menanyakan tentang pencapaian bisnis, pendidikan, atau bahkan target perusahaannya kelak terlebih ia tahu baru-baru ini Florentina sempat mengalami kerugian karena hasil peluncuran produk yang tidak sesuai harapan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Na Eun yang terus menatap ke bawah, memecah keheningan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa terlihat gelisah begitu, Naeun-ah? Kau... masih kepikiran soal pembicaraan dengan Ayahmu tadi pagi?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersentak, lamunannya seketika membuyar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh... mmm, tidak. Aku hanya sedang ingin diam saja.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas pelan, tersenyum kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini selalu saja tidak berterus terang padaku. Kita ini sebentar lagi akan menikah, tadi di restoran kita juga baru saja membahas urusan pernikahan bersama. Tapi sampai sekarang masih saja ada hal yang kau tutupi dariku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terdiam sejenak, menggigit bibir bawahnya sebelum akhirnya menyerah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bukan bermaksud menutupi, Junwoo-ya. Aku... aku hanya merasa gugup.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Gugup? Hanya karena kita mau pergi ke rumahku?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmmm...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh hangat, menepuk pelan puncak kepala Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tenang saja, Naeun-ah. Kau tidak perlu merasa segugup itu. Ayah dan Ibuku tipikal orang yang sangat santai.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh, membela diri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Meskipun begitu, aku kan juga harus tetap punya persiapan kalau mau bertemu dengan mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah, tidak perlu bersiap apa-apa. Cukup jadi dirimu sendiri saja.\"</span></p><h3 class=\"c11\" id=\"h.o0dlnrdh19s\"><span class=\"c7 c1 c6\">Sambutan Hangat Nyonya Park dan Celemek Tuan Park</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Beberapa menit kemudian, mobil akhirnya terparkir di halaman sebuah rumah yang tampak asri dan hangat. Junwoo dan Na Eun turun sembari menurunkan kantong-kantong belanjaan dari bagasi. Tepat saat mereka berjalan menuju teras, pintu depan tiba-tiba terbuka lebar dan sesosok wanita paruh baya dengan senyum keibuan yang sangat tulus melangkah keluar. Beliau adalah Nyonya Park.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar senang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh! Kalian akhirnya sudah datang rupanya. Ayo sini masuk, Naeun-ah. Biar Ibu bantu bawakan kantong belanjaannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat, menyahut dengan nada malu-malu dan kaku)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh, tidak usah repot-repot, Nyonya... biar saya saja yang membawa ini semua.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan mendekat, langsung menggandeng lembut lengan Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau masih memanggilku dengan sebutan Nyonya? Panggil Ibu saja ya, Naeun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun yang mendengar ucapan spontan itu langsung tertegun di tempatnya. Panggilan \"Ibu\" yang diucapkan dengan begitu tulus tanpa sekat formalitas membuat dadanya mendadak berdesir hangat.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Belum sempat Na Eun merespons, dari arah dalam rumah muncul Tuan Park. Pria paruh baya itu melangkah ke ruang tamu dengan penampilan yang sangat mengejutkan bagi Na Eun: beliau masih mengenakan celemek dapur bermotif sederhana di tubuhnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lebar, mengusap tangannya ke kain)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalian datang lebih awal rupanya... Halo, Naeun-ah. Selamat datang di rumah kami.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Kembali tertegun, buru-buru membalas salam dengan canggung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Halo, Ayah... Selamat malam.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya sudah, kau di sini mengobrol bersama Ibu dulu di sofa ya. Junwoo, ayo bawa belanjaannya ke belakang dan bantu persiapkan panggangan dengan Ayah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menenteng kantong belanjaan, mengedipkan sebelah mata ke arah Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah... siap.\"</span></p><h3 class=\"c11\" id=\"h.vpx7w7g3snrw\"><span class=\"c7 c1 c6\">Pengakuan Tiga Bulan dan Meja Makan yang Mengubah Segalanya</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Di ruang tamu, Nyonya Park langsung duduk bersebelahan dengan Na Eun di atas sofa hangat, menggenggam jemari calon menantunya itu.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu benar-benar senang sekali akhirnya kau mau datang berkunjung ke sini, Naeun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum kecil, menunduk malu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hehehe... iya, Ibu. Maafkan aku karena baru bisa sempat berkunjung kemari sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak apa-apa, Naeun-ah. Junwoo sebenarnya sudah menceritakan semuanya kepada Ibu... dan jujur, Ibu merasa sangat bahagia sekali mendengarnya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, sedikit penasaran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo... bercerita tentang apa kepada Ibu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum manis, menatap Na Eun lekat-lekat)</span></p><p class=\"c0\"><span class=\"c1\">\"Dia bercerita bahwa di batas akhir (</span><span class=\"c1 c8\">deadline</span><span class=\"c4 c1\">) pengenalan tiga bulan ini... kalian berdua ternyata sudah sama-sama saling jatuh cinta.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya seketika merona merah, tersenyum malu-malu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hehehe... iya, Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tak lama kemudian, suara langkah kaki Tuan Park terdengar dari arah dalam.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo, Naeun, kita masuk ke ruang makan sekarang ya. Yeobo, ajak calon menantumu kemari.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bangkit berdiri, menuntun Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo, Naeun-ah...\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Begitu melangkah masuk ke dalam ruang makan, Na Eun kembali dibuat tertegun. Di atas meja makan kayu yang panjang, telah tersaji rapi lautan masakan rumahan khas Korea yang mengepul hangat sebuah pemandangan masakan penuh cinta yang sangat jarang, bahkan hampir tidak pernah ia temui di meja makan rumah keluarganya sendiri.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah sembari melepas celemeknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayah tadi hanya bisa membantu menghidangkan ini saja, sisanya ini semua adalah menu-menu yang dimasak sendiri oleh Ibumu, hehehe.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya bergetar menatap hidangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Ayah... ini menunya sangat beragam sekali. Kedatangan saya kesini justru jadi merepotkan kalian berdua.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengambilkan mangkuk nasi untuk Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sama sekali tidak merepotkan, Nak. Justru kami berdua sangat senang dan bersemangat bisa memasakkannya khusus untukmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar kalimat \"memasakkannya khusus untukmu\", dinding hati Na Eun seketika terenyuh hebat. Sesuatu di dalam dadanya bergejolak. Ia benar-benar tidak menyangka bahwa calon mertuanya yang ia tahu merupakan orang-orang penting dan sibuk di firma hukum, yayasan serta rumah sakit besar mau meluangkan waktu berjam-jam di dapur demi menyambut dirinya dengan kehangatan masakan rumahan yang mereka buat sendiri dengan tangan mereka. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pola ini sangat kontras dengan Ayah dan Ibunya yang selalu menyerahkan urusan penyambutan kepada koki. Setitik air mata hampir saja lolos membasahi pipi Na Eun, namun ia sekuat tenaga menahannya karena merasa malu.</span></p><h3 class=\"c11\" id=\"h.dm7hap7mzh5m\"><span class=\"c7 c1 c6\">Penerimaan Tanpa Syarat</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Makan malam berlangsung dengan suasana yang sangat hangat dan penuh tawa ringan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperhatikan Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana, Naeun-ah? Apa makanan rumah kami ini rasanya enak?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk cepat, mengunyahnya dengan khidmat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah. Ini benar-benar sangat enak.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyodorkan sebuah piring kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ini, coba kau cicipi kimchi yang ini. Ibu sendiri yang mendiamkan dan memfermentasikannya selama beberapa minggu di dalam gentong khusus demi mendapatkan hasil rasa yang lebih merasuk dan enak.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak, Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, menopang dagunya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah... maaf ya kami hanya bisa menghidangkan masakan biasa seperti ini saja di rumah. Oh ya, kalau boleh Ibu tahu, sebenarnya makanan favoritmu itu apa?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap kedua calon mertuanya dengan mata yang mulai berkaca-kaca karena menahan haru)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... saya... saya paling suka masakan Korea rumahan seperti ini, Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo yang duduk tepat di samping Na Eun, diam-diam melirik tunangannya. Ia bisa membaca pancaran emosional di mata Na Eun dan hanya bisa tersenyum sangat lembut tanpa berniat menggodanya kali ini.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Syukurlah kalau begitu. Semoga semua masakan malam ini cocok dengan seleramu ya, Nak.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di tengah kunyahan makan malamnya, Han Na Eun benar-benar merasa sangat terharu hingga rasanya ia ingin menangis bahagia di tempat duduknya saat itu juga. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sejak berada di dalam mobil tadi, otaknya sudah mengekspektasikan skenario terburuk; ia mengira akan dihujani pertanyaan interogasi tentang pencapaian bisnis, latar belakang pendidikannya, atau materi. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun ternyata, calon mertuanya sama sekali tidak menanyakan hal-hal permukaan itu. Mereka tidak peduli dengan kerugian bisnis atau status sosialnya. Di meja makan ini, mereka hanya ingin melihat, menerima, dan menyayangi seorang Han Na Eun yang sesungguhnya.</span></p><h3 class=\"c11\" id=\"h.ki03b1my2p1l\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Layanan lulur mereka hampir selesai.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghapus setitik air mata di sudut matanya sendiri karena ikut terharu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh... !!! Eonni, ceritamu ini benar-benar membuatku ingin menangis. Menyiapkan kimchi berminggu-minggu dan memakai celemek... Ayah dan Ibu Mertuamu benar-benar luar biasa. Jadi, di meja makan itulah kau akhirnya merasa 'pulang' ke rumah yang sebenarnya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk dengan senyuman penuh kebahagiaan yang sangat tulus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Daehyun-ah. Malam itu adalah titik balik terbesar bagi emosiku. Aku yang seumur hidup selalu dituntut untuk menjadi sempurna dan dinilai berdasarkan angka serta pencapaian oleh Ayahku... tiba-tiba diadopsi ke dalam sebuah keluarga yang mencintaiku hanya karena aku adalah diriku sendiri. Di malam itulah, ketakutanku menguap, dan aku tahu... bersama Junwoo dan keluarganya, aku aman.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.5kqcqej5inco\"><span class=\"c7 c1 c6\">Dinding Foto dan Kontras Dua Dunia</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di ruang keluarga kediaman Park. Sayup-sayup terdengar suara tawa Tuan dan Nyonya Park dari halaman belakang, berbaur dengan bunyi gemercik arang panggangan BBQ yang mulai disiapkan. Na Eun, yang sebelumnya berpamitan untuk ke toilet, tampak berjalan pelan menyusuri koridor ruang tengah. Langkahnya terhenti di depan sebuah dinding besar yang dipenuhi deretan bingkai foto. Ia memandangi foto-foto itu satu per satu dengan tatapan lekat, hingga sebuah suara familier memecah keheningan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan mendekat dari arah dapur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku mencarimu ke mana-mana... Kupikir kau tersesat dan bingung jalan lewat mana untuk ke toilet.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh sebentar, lalu kembali menatap dinding)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya... ini foto-foto keluargamu, ya? Aku... ingin melihat-lihatnya sebentar dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri di samping Na Eun, ikut menatap foto-foto itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Silakan, Naeun-ah. Lihat saja sepuasmu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Jarinya menunjuk pelan ke arah salah satu bingkai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayahmu adalah seorang Jaksa Agung yang sekarang memiliki firma hukum besar. Ibumu adalah seorang dokter spesialis anak yang memiliki rumah sakit dan yayasannya sendiri. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi... di dinding ruang tengah ini, yang terpajang sama sekali bukan foto formal penghargaan atau jabatan mereka. Hanya ada foto-foto kalian bertiga saat sedang liburan santai, atau saat kalian sedang melakukan kegiatan sosial bersama.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, memasukkan tangan ke saku celana)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Setiap keluarga kan memiliki preferensinya masing-masing, Naeun-ah. Ayah dan Ibuku memang lebih suka mengabadikan dan membagikan momen-momen santai kami sebagai manusia biasa. Jadinya, di ruang keluarga ini hanya foto-foto seperti ini yang terpajang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertegun, bahunya sedikit merosot)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya... ini benar-benar sangat kontras dengan rumah keluargaku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun lembut, lalu meraih pergelangan tangannya pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jangan berpikir begitu. Kan sudah pernah kubilang, setiap keluarga itu memiliki kebiasaan dan preferensi yang berbeda, jadi jangan dibanding-bandingkan terus, hm? Ayo, ikut aku...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menuntun langkah Na Eun menuju ke sebuah pintu di ujung koridor lantai satu, lalu membukanya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><h3 class=\"c14\" id=\"h.2n23nrpymou7\"><span class=\"c7 c1 c6\">Kamar Junwoo dan Sisi Privasi yang Terbuka</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Junwoo membawa Na Eun masuk ke dalam kamar pribadinya. Ruangan itu terasa hangat dengan pencahayaan lampu meja yang kuning temaram.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langkahnya tertahan di ambang pintu, matanya membelalak panik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmmm... kau ini benar-benar ya. Ini kan baru pertama kalinya aku berkunjung ke rumahmu, kenapa langsung diajak masuk ke kamar pribadimu begini? Kita kan belum resmi menikah!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh usil, memiringkan kepalanya untuk menggoda Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa? Apa kau mendadak jadi deg-degan, ya? Tidak, tidak... jangan berpikir yang aneh-aneh dulu, Tunanganku. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Aku mengajakmu kemari karena aku hanya ingin menunjukkan sisi privasiku yang paling jujur kepadamu. Saat aku memapahmu masuk setelah kau pulang dari rumah sakit waktu itu, aku sempat melihat sekilas bagaimana suasana kamarmu. Dan ya... sekarang adil, kan? Kau bisa melihat isi kamarku juga.\"</span></p><p class=\"c0\"><span class=\"c4 c1\"> </span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah masuk perlahan, mengedarkan pandangannya ke sekeliling ruangan)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di dalam kamar itu, Na Eun menyaksikan sendiri sisi lain dari seorang Park Junwoo yang berprestasi. Ada deretan piagam penghargaan, piala-piala kompetisi, tumpukan buku yang tertata, serta sebuah meja belajar yang sangat rapi. Namun, yang paling menarik perhatiannya adalah banyaknya foto yang tertempel di papan gabus; foto-foto Junwoo yang sedang tertawa lepas bersama teman-temannya di lingkungan komunitas sepeda gunung dan organisasi sosial.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bergumam lirih)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Suasananya... terasa jauh lebih berwarna di sini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyandarkan pinggulnya ke tepian meja belajar, melipat tangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa? Kau terkejut melihat pemandangan isi kamarku?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng pelan, menatap lurus ke mata Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak. Hanya saja... aku tahu kau sebenarnya sedang mencoba mengajariku sesuatu sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sesuatu? Memangnya apa yang sedang kuajarkan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... ingin agar kedepannya aku bisa lebih terbiasa untuk terbuka padamu tentang apa pun, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sangat tulus, tatapan matanya melembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja. Itulah hal yang paling kuinginkan darimu sejak awal kita memulai proses ini, Naeun-ah. Jadikan aku sebagai sahabat tempatmu berbagi keluh kesah juga, bukan hanya sekedar menganggapku sebagai calon suamimu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar kalimat tulus yang meluncur dari bibir Junwoo, Han Na Eun yang sejak pagi menahan seluruh beban emosinya mulai dari tekanan ayahnya, overthinking, hingga rasa minder terhadap keluarga Park akhirnya tidak kuasa lagi membendung air matanya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pertahanan gunung esnya mencair seutuhnya. Setitik air mata lolos membasahi pipinya. Dengan panik, ia buru-buru berbalik dan mengelap air matanya dengan gerakan pelan agar tidak terlihat cengeng.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, berjalan mendekat dan menyodorkan tisu dengan nada menggoda demi memecah tangis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aduhh... lihat ini, pimpinan Florentina yang terkenal dingin ternyata bisa menangis terharu hanya karena melihat isi kamarku, ya? Hahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengus kesal di sela tangisnya, memukul pelan dada Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ih, diamlah! Kau ini benar-benar merusak suasana saja!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.2iauemhki7na\"><span class=\"c7 c1 c6\">Gitar, Turnamen, dan Cara Menikmati Hidup</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana masih di dalam kamar pribadi Junwoo. Na Eun yang baru saja menyeka sisa air matanya mulai mengalihkan pandangan ke sudut ruangan demi menutupi rasa salah tingkahnya. Matanya tiba-tiba menangkap sebuah instrumen musik yang bersandarkan rapi di dekat lemari buku.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunjuk ke arah sudut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sebentar... kau ternyata juga punya gitar petik? Kau juga suka bermusik, Junwoo-ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik gitarnya, lalu terkekeh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak juga, Naeun-ah. Aku hanya sesekali saja bermain gitar kalau kepalaku sedang penat. Dan dulu, gitar itu paling sering kubawa hanya saat ada kegiatan komunitas atau organisasi saja.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah mendekati papan gabus, jemarinya menyentuh sebuah foto berbingkai kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau yang ini... ini foto-foto saat kau ikut turnamen sepeda gunung, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan mendekat, lalu menyenggol bahu Na Eun dengan nada menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, iya. Kamarku ya memang penuh barang acak seperti ini, Naeun-ah. Lagipula, aku ikut turnamen sepeda gunung begitu juga sebenarnya jarang menang, kok. Haha hanya untuk seru-seruan saja.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Kembali mengamati deretan foto komunitas Junwoo semasa kuliah di SNU dan di luar negeri, matanya memancarkan rasa kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau selama ini ternyata memiliki cerita hidup yang sangat berwarna ya, Junwoo-ya. Bahkan... awalnya kukira kau itu tipe pria yang hanya suka belajar, bermain sepeda gunung, dan bersosialisasi saja. Ternyata kau juga suka bermain gitar. Buktinya di foto-foto komunitas ini, kau kelihatan senang sekali bernyanyi bersama mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum santai, melipat kedua tangannya di dada)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lho, kau sendiri saja juga suka musik K-Pop, lalu kenapa aku tidak boleh suka musik?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Buru-buru membela diri, wajahnya merona tipis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku kan berbeda... Aku hanya menyukai tarian dan lagunya saja, tapi aku ini memang sama sekali tidak bisa bermain musik atau memegang instrumen.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun dengan tatapan matanya yang khas, penuh kebijaksanaan sederhana)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bermusik atau ikut komunitas itu memang hanya sekadar selingan, Naeun-ah. Justru kalau kami sedang berkumpul bersama dulu, selain mengobrol kosong, bermain musik itu bisa membuat suasana jadi jauh lebih seru. Di tengah tekanan belajar dan tugas kuliah yang menggila, sesekali kita memang harus menikmati hidup dengan cara seperti itu agar tidak stres.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.2wp8cwyzn9xm\"><span class=\"c7 c1 c6\">Interupsi Hangat sang Ibu</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c30 c1 c6 c8\">Krekkk…</span></p><p class=\"c0 c2\"><span class=\"c1 c6 c8 c30\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suara pintu kamar yang terbuka perlahan seketika memecah obrolan mendalam di antara mereka berdua. Kepala Nyonya Park muncul dari balik pintu dengan senyuman keibuan yang sangat ramah.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aaaah... ternyata kalian berdua ada di sini? Ibu tadi mencari kalian ke mana-mana di ruang tengah, ternyata kalian malah asyik mengobrol di kamar ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak terkejut, langsung memundurkan langkahnya dengan wajah gugup)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh... mmm, maafkan kami, Ibu. Kami tadi... kami hanya sedang mengobrol sebentar di sini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, melambaikan tangannya dengan santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, tidak apa-apa, Naeun-ah. Santai saja, tidak perlu gugup begitu. Ayo, kita semua ke halaman belakang sekarang. Semuanya sudah siap, Ayahmu sudah mulai memanggang dagingnya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyahut sembari merangkul pundak Na Eun pelan untuk menenangkan kegugupannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Bu. Kami berdua akan segera menyusul ke belakang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.c9t0ywzg9dzy\"><span class=\"c7 c1 c6\">Asap BBQ dan Penerimaan di Halaman Belakang</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di halaman belakang kediaman Park yang asri. Cahaya lampu taman yang kekuningan berpadu hangat dengan pendar merah dari arang panggangan BBQ. Aroma daging sapi yang dipanggang meresap di udara, menciptakan atmosfer yang sangat santai dan intim. Tuan Park sibuk membalik daging, sementara Nyonya Park dengan telaten menata piring-piring kecil di atas meja lipat kayu. Na Eun dan Junwoo duduk berdampingan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyodorkan sepiring daging yang baru matang ke depan Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, ini Naeun-ah... Ini dagingnya sudah matang, makan yang banyak ya, Nak.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menerima piring itu dengan sopan, membungkuk kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak, Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sembari mengipas arang, menoleh dengan senyum lebar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jangan sungkan-sungkan di sini ya, Naeun-ah. Anggap saja rumah sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Duduk di hadapan mereka, menopang dagunya dengan hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya, Naeun-ah, Ibu penasaran... Sejak kecil kau itu sebenarnya paling menyukai apa, hm? Kalau Junwoo, sejak kecil dia itu suka sekali dengan sepeda gunung. Ibu bahkan sempat kesal dan jantungan karena dia pernah kecelakaan parah gara-gara hobi ekstremnya itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, melirik Junwoo sejenak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ibu. Junwoo sudah sempat menceritakan kejadian itu padaku... Kalau aku sendiri, sejak kecil sebenarnya sangat suka menari dan mengoleksi buku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun mengatakan hal itu dengan nada yang sedikit gugup karena tidak terbiasa membicarakan hobi pribadinya).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar tertarik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, iya? Naeun-ah, hobimu menarik sekali! Lalu, jenis buku apa yang paling kau sukai? Fiksi atau nonfiksi?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku lebih menyukai buku-buku nonfiksi, Ibu. Tapi sesekali dulu, jika sedang berada di perpustakaan sekolah, aku juga suka membaca buku fiksi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh capitan daging, ikut menimpali dengan bijak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagus sekali. Membaca fiksi dan nonfiksi itu sama-sama melatih otak kita, tetapi dengan cara yang berbeda. Fiksi melatih kreativitas, empati, dan kecerdasan sosial melalui imajinasi. Sedangkan nonfiksi mempertajam pemikiran analitis, logika, dan memori kita melalui pemahaman fakta serta informasi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertegun mengagumi cara pandang Tuan Park, lalu mengangguk setuju)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah. Benar sekali.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memotong pembicaraan sembari meletakkan beberapa potong daging segar lagi ke piring Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, ini beberapa sudah matang lagi. Ayo, sambil mengobrol kita nikmati dagingnya. Jangan sampai lupa makan seladanya juga, Naeun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iyaaa! Benar sekali kata anakku. Ayo dimakan, Nak.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun, yang baru menghabiskan waktu beberapa jam saja di rumah ini, merasakan hatinya bergetar hebat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jantungnya terasa sangat hangat. Ia berulang kali terenyuh oleh bagaimana cara keluarga ini memperlakukannya. Tidak ada tekanan, tidak ada bahasan bisnis yang kaku.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.vf8xrx2zhhq\"><span class=\"c7 c1 c6\">Antara Tuntutan Belajar dan Ruang untuk Hobi</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sembari mengunyah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya, Naeun-ah. Kalau kau suka menari, apakah saat sekolah dulu kau juga aktif mengikuti kegiatan ekstrakurikuler tari?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika merasa canggung dan kaku dengan pertanyaan itu, jemarinya meremas sumpit)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hemmm... pernah, Ayah. Tapi... saat itu porsinya tidak terlalu banyak.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi lembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa begitu, Naeun-ah? Padahal menari itu sangat bagus.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk tipis, tersenyum pahit mengingat tuntutan akademis dari ayahnya dulu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya... Karena saat itu saya harus lebih fokus belajar untuk mengejar nilai ujian, Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar jawaban jujur itu, Tuan dan Nyonya Park saling melempar pandang, lalu tersenyum sangat lembut penuh permakluman.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah... Sesekali kau harus tetap melakukan hobimu itu kembali. Walaupun sekarang umurmu bertambah, dan prioritas pekerjaanmu juga bertambah, apa salahnya jika semua itu diimbangi dengan hobi yang kau cintai? Ya kan, Junwoo-ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum manis, menatap lekat ke arah Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, benar sekali, Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.ngrnicge6uh7\"><span class=\"c7 c1 c6\">Percikan STEM dan Air Mata yang Tertahan</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau tempat liburan pertama yang paling berkesan bagimu saat kecil, di mana Naeun-ah? Ayah sangat ingat, Junwoo itu paling suka diajak ke kebun binatang saat kecil karena dia teramat menyukai hewan sejak balita.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tuan Park menunjuk ke arah sudut halaman)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, lihat itu. Sampai sekarang pun dia masih merawat beberapa kucing dan kelinci di samping rumah ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak memprotes usil, wajahnya memerah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahh, Ayah! Kenapa malah membongkar hobi masa kecilku di depan Naeun, sih?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi kan kenyataannya kau memang masih menyukai mereka sampai sekarang, Junwoo-ya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum, namun di dalam lubuk hatinya, sebuah guncangan emosional kembali melanda. Ia tidak pernah ditanyai tentang memori masa kecil yang emosional seperti ini oleh keluarganya sendiri, bahkan ia harus mengingat-ingat detailnya sejenak)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Ehmmm... Kalau aku, dulu pernah datang bersama Ayah dan Ibu ke </span><span class=\"c1 c8\">Gwacheon National Science Museum</span><span class=\"c1\"> di daerah Gyeonggi-do. Saat kunjungan itulah... untuk pertama kalinya aku sadar kalau aku menyukai dunia STEM (</span><span class=\"c1 c8\">Science, Technology, Engineering, and Mathematics</span><span class=\"c4 c1\">).\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah! Ternyata kau sangat menyukai bidang STEM ya? Dari semua hal di bidang itu, apa yang menurutmu paling menarik, Naeun-ah?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika raut wajahnya mencair, matanya berbinar cerah karena topik STEM adalah zona nyamannya)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1\">\"Hal yang paling menarik dari STEM adalah penerapan praktisnya dalam memecahkan masalah nyata di dunia (</span><span class=\"c1 c8\">real-world problem solving</span><span class=\"c1\">). STEM itu bukan sekadar tentang menghafal rumus-rumus mati di atas kertas, melainkan bagaimana kita menggunakan ilmu tersebut secara langsung untuk membuat sesuatu yang bermanfaat bagi orang banyak. Seperti contohnya... mungkin di masa depan nanti, akan ada banyak sekali sektor pekerjaan manusia yang akan sangat terbantu oleh kehadiran AI (</span><span class=\"c1 c8\">Artificial Intelligence</span><span class=\"c4 c1\">), Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk-angguk kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Menarik sekali analisismu, Naeun-ah. Bidang STEM memang memiliki peluang dan masa depan yang sangat bagus.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, benar. Kalau kita perhatikan sekarang, perkembangan teknologi memang selalu menarik untuk diikuti.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, benar, Bu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Junwoo yang duduk di sampingnya tidak ikut menyela. Ia hanya diam, memandangi ekspresi wajah Na Eun yang sangat tidak biasa malam ini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Junwoo merasa sangat bahagia melihat tunangannya itu bisa berbicara dengan begitu lepas dan bersemangat saat orang tuanya menanyakan tentang STEM dan menari sesuatu yang mungkin tidak pernah berani Na Eun bahas di dunia luar sana karena tuntutan citra karier bisnis.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Berkali-kali, hati Han Na Eun dirayapi rasa hangat yang teramat dalam hingga dadanya terasa sesak. Rasanya ia ingin menangis di detik itu juga saat ada orang tua yang dengan tulus mendengarkan kesukaannya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Ia akhirnya bisa merasakan bahwa ternyata, di dunia ini, ada sebuah keluarga yang begitu hangat, yang bersedia duduk bersama hanya untuk mengobrolkan hal-hal kecil nan berharga seperti ini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Air matanya hampir jatuh, namun ia sekuat tenaga menahannya sembari terus mengunyah daging panggangan di piringnya.</span></p><h3 class=\"c9\" id=\"h.cba6i6df66q9\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.3ijdhqjuo2r\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Sesi lulur mereka telah selesai, dan kedua wanita itu kini duduk bersandar sembari menikmati teh jahe hangat yang disajikan terapis.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyeka air mata di pipinya yang benar-benar lolos, suaranya sengau karena terharu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni, aku benar-benar tidak bisa menahan tangis mendengar ceritamu. Membicarakan museum sains, menari, dan robot AI di tengah panggangan BBQ... Ayah dan Ibu Mertuamu benar-benar memanusiakanmu seutuhnya. Mereka tidak melihatmu sebagai CEO Florentina, tapi sebagai Han Na Eun kecil yang punya mimpi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berkaca-kaca, tersenyum penuh rasa syukur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Daehyun-ah. Di malam BBQ itulah, aku akhirnya paham arti kata 'pulang'. Sifat kakuku, trauma masa kecilku yang selalu dituntut belajar, semuanya meleleh malam itu. Di depan panggangan daging... aku sadar bahwa aku tidak hanya mendapatkan seorang calon suami yang genius, tapi aku juga diselamatkan oleh sebuah keluarga yang mengajarkanku bagaimana rasanya dicintai tanpa syarat.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.jek40x9fpnpg\"><span class=\"c7 c1 c6\">Pelukan Hangat Jam 10 Malam dan Air Mata di Teras</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Waktu menunjukkan pukul 10 malam di kediaman Park. Setelah menyelesaikan acara BBQ dan merapikan halaman belakang, Na Eun bersiap untuk pulang. Junwoo telah memanaskan mesin mobilnya untuk mengantar Na Eun. Tuan dan Nyonya Park ikut berjalan keluar, mengantarkan mereka berdua hingga ke teras depan rumah.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, menepuk pundak Junwoo sekilas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak ya, Naeun-ah, sudah mau menyempatkan waktu berkunjung ke rumah Ayah dan Ibu malam ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggandeng lengan Na Eun dengan manja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nak. Jangan pernah bosan untuk main kesini, ya? Sesekali kalau kau sedang senggang, datanglah kemari untuk mengunjungi kami lagi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat dengan sangat tulus kepada kedua orang tua Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah... Ibu... Terima kasih banyak atas semua jamuannya malam ini. Saya benar-benar sangat terkesan dan menyukai semuanya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika merentangkan kedua tangannya dan memeluk Na Eun dengan erat dan penuh kasih sayang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih kembali ya, Sayang... Ah, Ibu bahagia sekali. Akhirnya kami akan segera memiliki seorang anak perempuan di rumah ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun yang menerima dekapan hangat itu awalnya sempat terkejut kaku. Namun perlahan, ia membalas pelukan erat tersebut. Jantungnya berdegup kencang, ia benar-benar terpaku dengan pilihan kata Nyonya Park yang menyebut dirinya sebagai \"anak perempuan\", bukan sekadar \"menantu\". </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kalimat sederhana yang sarat akan penerimaan tanpa syarat itu seketika meruntuhkan pertahanan terakhirnya. Setitik air mata haru lolos begitu saja di pundak Nyonya Park.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"
