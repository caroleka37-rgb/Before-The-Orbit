\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk mantap, langsung merangkul pinggang Na Eun dengan posesif)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar sekali. Terima kasih banyak atas ucapannya. Kalau begitu, Naeun-ah... sebelum sore semakin larut, ayo kita harus segera beranjak dari sini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merasakan gelagat aneh dari tunangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya... Oppa, kalau begitu aku pamit jalan duluan, ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melambungkan tangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, hati-hati di jalan, Naeun!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.4ym3dwd2g3gs\"><span class=\"c7 c1 c6\">Debat Lucu Gunung Es dan Ribuan Fans</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke dalam mobil yang sedang melaju menuju Namsan Tower. Lucunya, sepanjang perjalanan belasan kilometer itu, Park Junwoo yang biasanya selalu ceria, penuh lelucon, dan banyak bicara, mendadak berubah menjadi sangat diam. Ia hanya fokus menatap lurus ke depan ke arah jalanan tanpa berniat membuka obrolan sama sekali. Melihat perubahan sikap yang drastis itu, Na Eun tersenyum geli. Ia langsung menyadari kalau pria genius di sebelahnya ini sedang terbakar api cemburu).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memiringkan tubuhnya, menatap wajah kaku Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini kenapa, Park Junwoo? Tidak seperti biasanya kau diam saja seperti patung begini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyahut pendek, suaranya dibuat sedatar mungkin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak apa-apa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menahan tawa, mulai menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... sebenarnya sedang penasaran dan cemburu ya dengan Yoo Seob Oppa tadi?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdehem pelan, pandangannya tetap lurus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Untuk apa?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini... Dengar ya, dia itu murni hanya seniorku saat kuliah dulu di Amerika. Kami berdua juga sama sekali tidak pernah memiliki hubungan spesial apa pun, baik di masa lalu maupun sekarang. Tadi dia hanya tiba-tiba menyapaku karena melihatku sedang berdiri sendirian menunggumu. Ya... sebagai kawan lama yang sudah bertahun-tahun tidak bertemu, apa salahnya jika kami mengobrol sebentar, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Na Eun sekilas, mendengus pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, begitu? Tapi dari jauh tadi, kau tampaknya kelihatan sangat bahagia dan tertawa lepas sekali saat mengobrol dengannya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar jenaka, nadanya dibuat sedikit memelas untuk merayu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aha! Jadi kau benar-benar memperhatikan kami berdua dari jauh tadi, ya? Junwoo-ya... dengar baik-baik, ya. Aku bersumpah tidak ada hubungan apa-apa dengan pria manapun. Jadi, tolong jangan cemburu lagi, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membela diri dengan gengsi tinggi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Cemburu? Siapa juga yang sedang cemburu? Tidak ada yang cemburu. Hanya saja... aku merasa agak aneh melihat seorang Han Na Eun, yang biasanya selalu bersikap sangat cuek, dingin, dan menjaga jarak dengan orang lain, tiba-tiba bisa mengobrol sesantai dan seakrab itu dengan pria lain.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Akhirnya tertawa lepas, menganggap sisi kekanak-kanakan Junwoo sangat menggemaskan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Ingat ya, Park Junwoo... kau itu sama sekali tidak pantas cemburu pada si 'gunung es' seperti aku ini. Justru sebaliknya, harusnya akulah yang setiap hari merasa cemburu padamu, mengingat jumlah fans dan wanita yang mengagumimu di luar sana itu ada banyak sekali!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajah kaku Junwoo akhirnya luluh, senyum tipisnya mulai terbit kembali karena kalah telak telak oleh argumen Na Eun)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha... kok malah jadi mengungkit soal fans-ku, sih? Itu kan berbeda cerita, Naeun-ah!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terus menyenggol lengan Junwoo usil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak ada bedanya! Makanya, akui saja kalau kau memang cemburu tadi, ayo mengaku!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa pasrah sambil menggelengkan kepalanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, iya, terserah kau saja, Han Na Eun...\"</span></p><h3 class=\"c9\" id=\"h.x21avui3kznu\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.msh7l3qgck7m\"><span class=\"c1 c6 c19\">Jingga Sore di </span><span class=\"c1 c6 c8 c19\">Sunset Zone</span><span class=\"c7 c1 c6\"> Menara Namsan</span></h3><p class=\"c0\"><span class=\"c1 c8\">(Suasana sore hari di Namsan Tower. Langit Seoul mulai berubah warna menjadi gradasi jingga dan keemasan yang cantik. Junwoo dan Na Eun berjalan berdampingan menuju </span><span class=\"c1 c6 c8\">Sunset Zone (Teras Luar Lantai 4)</span><span class=\"c5 c1\">. Ini adalah titik pengamatan barat resmi di area menara yang menyajikan pemandangan matahari terbenam paling bersih tepat di atas Gunung Namsan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Junwoo yang masih berjalan dengan langkah santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya... kau ini sebenarnya masih cemburu ya soal yang tadi?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh sejenak, memasang senyum tipis yang dipaksakan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, kok.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas gemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bohong sekali. Kau bahkan masih diam saja dan irit bicara dari tadi... Ah, entahlah!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun sengaja berjalan mendahului dengan cepat, meninggalkan Junwoo beberapa langkah di belakang).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tersenyum geli melihat tingkah Na Eun, lalu ikut mempercepat langkahnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hey, Han Na Eun! Tunggu aku...\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mereka berdua akhirnya sampai di pagar pembatas Sunset Zone. Sambil berdiri berdampingan, keduanya terdiam sejenak memandangi hamparan lanskap Kota Seoul yang luar biasa indah dari ketinggian.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menopang kedua tangannya di pagar pembatas, menatap lurus ke depan dengan nada suara yang tiba-tiba melembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah... kau benar-benar yakin akhirnya akan menikah denganku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersentak pelan, menghentikan aktivitas minumnya lalu menoleh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau tiba-tiba menanyakan hal seperti itu? Justru seharusnya akulah yang bertanya kepadamu... Dengan semua perjuangan dan kerumitan yang kita hadapi sejauh ini, apa kau masih yakin denganku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menatap Na Eun dengan tatapan hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa tidak? Ini sudah H-1 bulan menjelang hari pernikahan kita. Dan lagipula... aku tadi baru saja merasakan bagaimana rasanya cemburu hebat karena dirimu. Benar-benar lucu sekali kalau dipikir-pikir...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum manis, memandang matahari yang perlahan mulai turun di ufuk barat sekitar pukul 4 sore)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Park Junwoo... anggap saja kejadian tadi itu semacam pemicu sebelum kita benar-benar sah menikah. Sebuah ujian kecil untuk melihat apa kau yakin melangkah dan tetap memilihku atau tidak. Dan ternyata... perasaanmu yang jujur itu tidak bisa berbohong.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk setuju)</span></p><p class=\"c0\"><span class=\"c1\">\"Benar sekali. Aku bahkan tidak pernah merasa </span><span class=\"c1 c8\">envy</span><span class=\"c4 c1\"> atau cemburu ketika melihat orang lain. Malahan, aku cenderung sangat senang berkenalan dengan orang baru. Tapi entah kenapa, tadi itu... ego dan 90% pikiranku mendadak langsung dikendalikan oleh perasaan cemburu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh, menyenggol lengan Junwoo usil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, kalau begitu aku jadi agak ragu ya... Kau ini benar seorang diplomat profesional bukan, sih? Di depan tunanganmu sendiri, kau sama sekali tidak menggunakan logika diplomatikmu itu. Aneh sekali.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika menjulurkan tangannya, merangkul pundak Na Eun dengan erat agar tubuh wanita itu mendekat ke pelukannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, iya! Ternyata setelah kau katakan, baru aku sadari juga kalau logikaku langsung hilang, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bersandar nyaman di rangkulan Junwoo, ikut tersenyum lega)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, begitu dong. Ini baru Park Junwoo yang ku kenal, sudah bisa tertawa lagi... Hmmm, ayo ikut aku sekarang!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bingung karena tangannya ditarik tiba-tiba)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hey, Han Na Eun... kita mau kemana lagi?\"</span></p><h3 class=\"c9\" id=\"h.68c02v3pjo9h\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.4cfaynrt3w51\"><span class=\"c7 c1 c6\">Gembok Cinta Golden Hour dan Kejutan Cekrek</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menarik tangan Junwoo menuju ke area pagar gembok cinta yang legendaris di Namsan Tower. Sore hari adalah waktu transisi yang sangat tepat, di mana area pagar gembok cinta belum terlalu padat oleh lautan turis yang biasanya baru membludak pada malam hari. Cahaya sore yang lembut (golden hour) juga memberikan pencahayaan alami terbaik (aesthetic) bagi siapapun yang ingin berfoto di sudut gembok warna-warni ini.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c8\">(Begitu sampai di depan pagar, Na Eun merogoh tas kecilnya dan mengeluarkan sebuah gembok baru berwarna merah muda yang ternyata sudah bertuliskan nama mereka berdua: </span><span class=\"c1 c6 c8\">Junwoo &amp; Naeun</span><span class=\"c5 c1\">).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya membelalak heran sekaligus gemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau... kau sudah menyiapkan dan membawa gembok ini dari rumah?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh jari telunjuknya di bibir sambil tertawa kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sssttt... benar sekali. Jangan berisik.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merebut gembok itu dengan antusias, wajahnya berseri-seri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sini, sini... biar aku yang pasangkan gemboknya ke pagar.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperhatikan Junwoo yang sedang sibuk mengunci gembok tersebut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, sudah selesai... Tunggu sebentar, aku mau memotretnya dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Setelah mengambil foto gembok mereka yang mengunci erat di antara ribuan gembok lainnya, Na Eun mengangkat ponselnya tinggi-tinggi. Ia mengarahkan kamera depan ke arah wajah mereka berdua.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Junwoo-ya, ayo lihat ke kamera. Kita </span><span class=\"c1 c8\">selfie</span><span class=\"c4 c1\"> dulu di depan ratusan gembok cinta ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendekatkan wajahnya, tersenyum lebar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Siap... satu, dua...\"</span></p><p class=\"c0 c2\"><span class=\"c30 c1 c6 c8\"></span></p><p class=\"c0\"><span class=\"c30 c1 c6 c8\">Cekrek!</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tepat di detik tombol kamera ditekan dan bunyi rana terdengar, Junwoo tiba-tiba memiringkan kepalanya dan mendaratkan sebuah ciuman manis di pipi Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Seketika itu juga, Han Na Eun langsung membeku di tempatnya. Matanya membelalak kaget, jantungnya berdegup maraton dengan sangat kencang. Ia benar-benar tidak menyangka akan mendapatkan serangan kejutan manis di tengah keramaian sore itu dari seorang Park Junwoo. Pipi \"si gunung es\" itu pun mendadak langsung merona merah merona karena salah tingkah yang luar biasa.</span></p><h3 class=\"c9\" id=\"h.8yjuicf0ylhx\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.yv09mi8x9bf3\"><span class=\"c7 c1 c6\">Gembok Cinta Remaja Kasmaran dan Risiko Headline Besar</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke masa sekarang (Tahun 2026), di dalam ruangan spa VVIP. Di bawah pencahayaan ruangan yang tenang dan menyejukkan, Na Eun dan Daehyun masih menikmati perawatan masker wajah serta manicure-pedicure. Daehyun tampak terkekeh pelan, berhati-hati agar masker di wajahnya tidak retak setelah mendengar akhir cerita romantis di Namsan Tower.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa geli, matanya berbinar terhibur)</span></p><p class=\"c0\"><span class=\"c1\">\"Ahhh... Eonni, ini benar-benar </span><span class=\"c1 c8\">plot twist</span><span class=\"c4 c1\">! Ternyata seorang Park Junwoo Oppa yang selalu terlihat tenang bisa merasakan cemburu yang begitu hebat pada seniormu, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tersenyum simpul, mengingat kembali memori manis itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hehehehe, iya... Kalau aku ingat-ingat lagi momen itu, rasanya lucu sekali. Junwoo yang selama ini selalu kulihat sangat profesional, supel, dan pandai membawa diri, karakter hebatnya itu perlahan-lahan langsung runtuh hanya karena terbakar cemburu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, kalian berdua ini memang sangat manis dan unik. Tapi menurutku, bagian yang paling romantis itu adalah saat di Namsan Tower. Kalian bahkan sampai punya gembok cinta berdua di sana... Huhuhu, cerita ini sukses membuatku iri, tahu!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, menggelengkan kepalanya santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Entahlah, aku juga tidak tahu apa yang sedang kupikirkan saat itu. Padahal waktu itu umur kami sudah mau menginjak kepala tiga, tapi kelakuan kami berdua malah persis seperti remaja belasan tahun yang baru pertama kali kasmaran, hahahaha!\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun memiringkan kepalanya sedikit, menatap Daehyun dengan kilatan jenaka di matanya).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Nada suara menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya, omong-omong... coba kapan-kapan kau juga pergi menaruh gembok cinta di sana, Daehyun-ah, bersama dengan Seo Pyo.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak membelalakkan mata, langsung merengek)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aneh-aneh saja kau ini, Eonni! Kalau kami berdua nekat pergi ke sana sekarang, bisa-bisa kami harus memakai pakaian dengan penyamaran penuh dari ujung kepala sampai ujung kaki.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas mendengar respons ketakutan adik iparnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahahahha! Iya juga, ya. Mengingat posisi kalian berdua sekarang di ruang publik, memang sudah tidak aman lagi untuk pergi ke tempat seramai itu secara sembarangan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melanjutkan godaannya sambil terkekeh)</span></p><p class=\"c0\"><span class=\"c1\">\"Kalau kalian nekat jalan-jalan ke Namsan Tower tanpa memakai penyamaran yang ketat, keesokan harinya foto kalian berdua pasti langsung jadi </span><span class=\"c1 c8\">headline</span><span class=\"c4 c1\"> berita besar di seluruh media nasional, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak membelalakkan mata, langsung merengek)</span></p><p class=\"c0\"><span class=\"c5 c1\">Eonnniii!!!</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.jh0cm7epgfs\"><span class=\"c7 c1 c6\">Pemberkatan Privat di Taman yang Rindang</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Hari H Pernikahan Park Junwoo dan Han Na Eun. Waktu menunjukkan pukul 10 pagi. Suasana pemberkatan dikemas dengan konsep pesta kebun pribadi (garden party) di area taman hotel yang menawarkan ruang hijau terbuka, dikelilingi oleh pepohonan rindang untuk menciptakan atmosfer yang tenang dan sakral. Di ujung jalan setapak, berdiri sebuah Altar Minimalis (Wedding Gate) menggunakan struktur kayu sederhana yang dihiasi bunga segar asli, dedaunan hijau, dan kain putih yang menjuntai halus ditiup angin pagi.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Jumlah tamu undangan yang hadir sangat dibatasi, hanya berkisar antara 50 hingga 150 orang saja demi menjaga keintiman acara bersama keluarga besar dan kerabat terdekat. Junwoo telah berdiri di depan altar, tampak gagah mengenakan Setelan Jas Santai berwarna hitam terang. Di seberang jalan setapak, sosok Han Na Eun bersiap melangkah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Na Eun tampil memukau dalam balutan Gaun Pengantin Minimalis dengan siluet </span><span class=\"c1 c8\">A-line</span><span class=\"c1\"> berenda yang ringan, tanpa ekor gaun yang terlalu panjang agar memudahkan dirinya bergerak anggun di atas hamparan rumput hijau. Wajahnya dipoles dengan Riasan Wajah </span><span class=\"c1 c8\">Dewy Look</span><span class=\"c4 c1\"> yang berfokus pada kulit sehat bersinar alami, dipadukan dengan riasan mata yang sangat tipis serta warna bibir yang segar.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">MC:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat pagi, hadirin yang terhormat. Di pagi yang amat berbahagia dan penuh berkat ini, kami menyambut kehadiran kedua keluarga besar, yaitu Keluarga Han dan Keluarga Park, dalam acara Pemberkatan Pernikahan antara Park Junwoo dan Han Na Eun.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Musik instrumental mulai mengalun lembut).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">MC:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kini, kita sambut pengantin wanita, Han Na Eun, yang berjalan didampingi oleh sang ayah tercinta, Tuan Han, melaju perlahan menyusuri altar menuju pengantin pria, Park Junwoo, yang telah menunggu di ujung sana.\"</span></p><h3 class=\"c9\" id=\"h.g9x5dewfxuef\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.rjscmkj8rjdx\"><span class=\"c7 c1 c6\">Takdir Tujuh Tahun Lalu di Aula SNU</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Senyum Na Eun merekah dengan sangat indah, secerah cuaca pagi hari itu. Matanya terkunci lurus memandang Junwoo yang menatapnya tanpa kedip dari ujung altar. Di sela-sela langkah lambat Na Eun, layar LED besar di sisi altar sekilas memutar rangkaian video dan foto masa kecil mereka hingga beranjak remaja. Kejutan puncaknya adalah saat layar menampilkan foto mereka sewaktu berada di sebuah workshop di Seoul National University (SNU) tujuh tahun yang lalu. Di dalam foto itu, Na Eun tampak berdiri anggun menjadi pembicara, sementara Junwoo berdiri di sebelahnya bertindak sebagai mediator workshop di aula.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Kemunculan foto bersejarah itu seketika memicu riuh tawa dan tepuk tangan hangat dari para tamu undangan yang sebagian besar merupakan kerabat dekat yang mengetahui perjalanan mereka).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meneteskan air mata haru, menyeka sudut matanya dengan saputangan sembari menunjuk ke arah layar LED)</span></p><p class=\"c0\"><span class=\"c1\">\"Lihatlah mereka... </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">, siapa yang menyangka kalau anak-anak kita yang dulu dipertemukan di sebuah forum mahasiswa, hari ini akhirnya bisa berakhir bersama di pelaminan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sangat lebar, menepuk punggung tangan istrinya sembari memandang bangga ke arah Junwoo)</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... Sungguh takdir Tuhan yang sangat indah. Jodoh Junwoo ternyata memang sudah terlihat dan digariskan bahkan sejak tujuh tahun yang lalu di aula kampus itu.\"</span></p><h3 class=\"c9\" id=\"h.w98d5ytxubxn\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.jh346kr03vgn\"><span class=\"c7 c1 c6\">Janji Suci dan Penyematan Cincin</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Langkah kaki Na Eun akhirnya sampai di ujung altar. Tuan Han menghentikan langkahnya tepat di hadapan Junwoo).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">MC:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Pengantin wanita kini telah sampai di atas altar, tepat di hadapan pengantin laki-laki.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Junwoo dengan pandangan mendalam, lalu memindahkan tangan Na Eun ke atas telapak tangan Junwoo)</span></p><p class=\"c0\"><span class=\"c1\">\"Jaga putriku baik-baik ya, Junwoo-ya...\" </span><span class=\"c1 c8\">(berucap tulus sembari perlahan melepaskan pegangan tangannya pada Na Eun)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat dengan takzim)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Ayah. Saya akan menjaganya dengan seluruh hidup saya.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tuan Han melangkah mundur untuk duduk di kursi keluarga. Kini, Na Eun dan Junwoo berdiri saling berhadapan di depan pendeta. Keduanya saling bertatapan dalam, mengunci pandangan satu sama lain, lalu perlahan mengulas senyum paling tulus saat mulai mengucapkan janji pernikahan suci secara bergantian.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">MC:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kini tiba saatnya bagi kedua mempelai untuk saling menyematkan cincin pernikahan sebagai simbol ikatan cinta yang tak lekang oleh waktu.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo meraih jemari Na Eun, menyematkan cincin berlian berpotongan unik pilihan mereka ke jari manis Na Eun. Begitu pula sebaliknya, Na Eun menyematkan cincin platinum di jari manis Junwoo dengan tangan yang sedikit bergetar haru. Kedua pasang cincin itu kini terikat sempurna).</span></p><h3 class=\"c9\" id=\"h.3yu89wi1w9al\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.w750cu1v9v0v\"><span class=\"c7 c1 c6\">Sesi Penghormatan dan Akhir yang Sah</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">MC:</span></p><p class=\"c0\"><span class=\"c1\">\"Rangkaian selanjutnya adalah Sesi Penghormatan atau </span><span class=\"c1 c8\">Sinyang-sinbu Insa</span><span class=\"c4 c1\">. Kedua pengantin dipersilakan berjalan menuju orang tua masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo dan Na Eun berjalan beriringan di atas area terbuka tersebut. Mereka menghampiri Tuan dan Nyonya Han terlebih dahulu, lalu beralih ke Tuan dan Nyonya Park. Di hadapan masing-masing orang tua, keduanya membungkuk hormat dengan sangat takzim sebagai tanda terima kasih yang mendalam atas segala kasih sayang dan didikan yang diberikan selama ini).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Nyonya Han dan Tuan Han tersenyum sangat lebar dan lega, begitu pula dengan Tuan dan Nyonya Park yang menyambut bungkukan itu dengan tatapan penuh restu dan binar kebahagiaan. Kini, di hadapan hukum, agama, dan seluruh keluarga, Park Junwoo dan Han Na Eun telah resmi menyandang status sebagai suami istri.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">MC:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Mari kita berikan tepuk tangan yang paling meriah untuk pasangan suami istri yang baru, Tuan dan Nyonya Park! Selanjutnya, kami persilakan kepada kedua pengantin dan kedua orang tua dari masing-masing pengantin untuk mengambil posisi di altar guna melakukan sesi foto bersama secara formal, yang kemudian akan dilanjutkan bersama keluarga besar serta kerabat lainnya.\"</span></p><h3 class=\"c9\" id=\"h.tqnan49a3iai\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.jua71lidjjf6\"><span class=\"c1 c6 c19\">Resepsi di Atas Air dan Kehangatan </span><span class=\"c1 c6 c8 c19 c31\">Sunset</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Waktu bergeser menunjukkan pukul 3 sore hingga pukul 5 sore. Resepsi pernikahan khusus untuk teman-teman dekat pengantin digelar di sebuah gedung estetik yang berdesain arsitektur modern mirip Seoul Wave Art Center. Para tamu berada di dalam ruangan ber-AC yang nyaman dengan dinding kaca penuh (floor-to-ceiling glass wall), memberikan ilusi magis seolah-olah pesta sedang diadakan tepat di atas permukaan air Sungai Han, sekaligus menyajikan pemandangan transisi momen matahari terbenam (sunset) yang memukau.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana dirancang dengan Konsep Jamuan Makan yang Santai. Menggunakan tatanan Long Table Dining berupa meja makan panjang dari kayu alami tanpa taplak tebal, di mana Junwoo dan Na Eun bisa duduk langsung di tengah-tengah teman mereka untuk makan dan mengobrol bersama. Di sudut ruangan, terdapat Dessert &amp; Pastry Corner—sebuah stan khusus bergaya kafe estetik Korea yang menyajikan croffle, macarons, kuaci, dan kue-kue mini, lengkap dengan mesin kopi otomatis serta barista profesional.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dari semua tamu teman-teman pengantin yang memadati ruangan, sekitar 70% di antaranya memang merupakan teman-teman dari lingkaran pergaulan Junwoo yang supel. Mulai dari rekan kerja di Diplomat hingga alumni kampus.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman-Teman Diplomat:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan menghampiri meja pengantin, menyalami Junwoo dengan antusias)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat, Junwoo-ya! Akhirnya seorang diplomat muda andalan kita melabuhkan hatinya pada seorang CEO Florentina yang hebat!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri berdampingan dengan Na Eun, merangkul pinggang istrinya sambil tersenyum bangga dan melirik menggoda ke arah teman-temannya yang masih lajang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak, Teman-teman, sudah menyempatkan datang. Perkenalkan... ini istriku, Han Na Eun. Makanya, kalian cepat-cepat menyusul, jangan betah menjomblo terus, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman Diplomat:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencibir jenaka sambil tertawa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya, iya, Park Junwoo... Kami tahu kau sudah resmi memiliki istri sekarang, jadi tidak usah pamer begitu juga kali, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun yang berdiri di samping Junwoo hanya bisa tersenyum simpul, ikut merasakan energi ceria dari teman-teman suaminya).</span></p><h3 class=\"c9\" id=\"h.374dmcng34b0\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.svm6p2g0tve1\"><span class=\"c7 c1 c6\">Tips Menaklukkan Si Gunung Es</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Tak lama kemudian, beberapa alumni Seoul National University (SNU) lintas jurusan dan mantan anggota Student Council ikut berkumpul mengelilingi meja panjang pengantin. Mereka mulai menggoda Junwoo tepat di depan Na Eun mengenai masa lalu mereka).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Teman-Teman </span><span class=\"c1 c6 c8\">Student Council</span><span class=\"c3 c1\">:</span></p><p class=\"c0\"><span class=\"c1\">\"Wah, akhirnya mantan Presiden </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> kita resmi menikah juga! Dulu di kampus kau dikagumi dan dikejar-kejar oleh banyak mahasiswi, tapi siapa sangka sekarang kau malah berhasil ditaklukkan oleh Han Na Eun, hahahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman Alumni SNU:</span></p><p class=\"c0\"><span class=\"c1\">\"Ah, iya! Momen kalian berdua di acara </span><span class=\"c1 c8\">workshop</span><span class=\"c1\"> tujuh tahun lalu itu benar-benar sangat bersejarah!\" </span><span class=\"c1 c8\">(bergurau dengan yang lainnya)</span><span class=\"c1\"> \"Bahkan kalau diingat-ingat lagi, setelah acara </span><span class=\"c1 c8\">workshop</span><span class=\"c4 c1\"> itu selesai, kalian berdua sama sekali tidak ada foto bersama. Tapi takdir memang lucu, ya, sekarang kalian malah berakhir di pelaminan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman Mantan Aktivis Kampus:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyenggol bahu Junwoo usil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, Junwoo-ya... tolong bagikan pada kami bagaimana tips dan trik rahasia untuk menaklukkan si 'gunung es' Han Na Eun? Kenapa dari sekian banyak orang, kau akhirnya menjatuhkan pilihanmu padanya, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar pertanyaan blak-blakan itu, suasana di sekitar meja langsung riuh oleh tawa penuh rasa penasaran).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tertawa pelan, lalu pandangannya melembut. Ia menatap Na Eun di sebelahnya dan menjawab dengan nada suara yang mantap dan tulus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Mungkin karena... aku tidak pernah benar-benar melupakannya sejak saat itu. Dia selalu terlihat berbeda dan menonjol dari mahasiswi lainnya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kalimat yang keluar dari bibir Junwoo seketika membuat Na Eun terdiam seribu bahasa dalam keharuan yang mendalam. Di dalam benaknya, ia menyadari dan mengingat kembali masa-masa kuliahnya dulu; sifatnya yang terlalu tegas, kaku, dan individualis sering kali membuat mahasiswa atau mahasiswi lain tidak menyukainya, bahkan mengasingkannya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, siapa yang menyangka bahwa ketegasan yang sempat dianggap kekurangan oleh orang lain, justru meninggalkan kesan mendalam yang sangat dihargai dan dikagumi oleh Junwoo selama bertahun-tahun.</span></p><h3 class=\"c9\" id=\"h.3lsc7xwfwl8x\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.b1wzro314ov0\"><span class=\"c7 c1 c6\">Panggilan Baru Menjelang Resepsi Malam</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana resepsi sore itu terasa semakin hangat dan akrab seiring dengan matahari yang perlahan tenggelam di balik dinding kaca, memantulkan warna keemasan di atas air. Pengantin bisa langsung berinteraksi tanpa sekat, tertawa, dan bertukar cerita dengan para tamu yang sebagian besar adalah teman dekat mereka).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di sela-sela waktu istirahat sebelum jam jamuan makan berakhir, Junwoo mendekatkan wajahnya ke telinga Na Eun).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh geli, berbisik dengan nada menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Istriku... kau masih memiliki semangat yang penuh, kan, untuk menghadapi acara resepsi utama nanti malam bersama para kolega bisnis orang tua kita?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar panggilan baru itu, ia menoleh dan tersenyum geli menahan salah tingkah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, kau ini... dalam situasi seperti ini pun masih saja sempat-sempatnya menggodaku...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa manis, menggenggam erat tangan Na Eun di bawah meja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja. Mulai sekarang dan seterusnya, itu akan menjadi tugas favoritku, Istriku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.7xx3igb5gg21\"><span class=\"c1 c6 c19\">Aroma Esensial </span><span class=\"c1 c6 c8 c19\">Creambath</span><span class=\"c7 c1 c6\"> dan Guncangan Emosional</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana ruang spa VVIP kembali senyap dan menenangkan. Setelah perawatan wajah dan kuku selesai, penataan berlanjut ke area rambut. Kursi perawatan Na Eun dan Daehyun kini disandarkan dengan nyaman. Rambut mereka berdua sedang dipijat lembut menggunakan krim creambath beraroma herbal esensial yang menenangkan, lengkap dengan mesin hair steamer yang mulai mengeluarkan uap hangat di sekitar kepala mereka. Daehyun menghela napas panjang, menikmati relaksasi sambil melanjutkan obrolan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menutup matanya dengan rileks di bawah kepulan uap hangat)</span></p><p class=\"c0\"><span class=\"c1\">\"Ahhh... </span><span class=\"c1 c8\">So sweet</span><span class=\"c4 c1\"> sekali pernikahan kalian, Eonni. Konsepnya matang sekali, bahkan kalian sampai memisahkan antara resepsi utama untuk kolega dan resepsi khusus untuk teman-teman dekat...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memejamkan mata, menikmati pijatan di kulit kepalanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, benar, Daehyun-ah. Sebenarnya itu juga ide dari para orang tua sih. Karena kalau dipikir-pikir, lingkaran pertemanan Junwoo itu sangat banyak dan luas sekali, berbanding terbalik 180 derajat dengan aku yang seleranya sangat privat, hahahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum simpul, menyahut dengan nada tulus)</span></p><p class=\"c0\"><span class=\"c1\">\"Yah... pada akhirnya cerita kalian sudah </span><span class=\"c1 c8\">happy ending</span><span class=\"c4 c1\"> ya, Eonni. Tapi... aku sebenarnya masih penasaran dengan satu hal.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm? Penasaran tentang apa lagi?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuka matanya sedikit, menoleh ke arah Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Masa-masa pertama kali kalian resmi menjadi suami istri... Bagaimana rasanya transisi dari si 'gunung es' dan diplomat populer yang tinggal satu atap? Sampai akhirnya... proses lahirnya Park Inna?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika terdiam sejenak, hembusan nafasnya terdengar sedikit berat namun penuh memori)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh... masa-masa awal itu, ya? Banyak sekali hal yang harus kami sesuaikan satu sama lain. Dan yang paling membekas... saat Inna lahir, aku sempat mengalami guncangan emosional yang luar biasa hebat.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersentak pelan, raut wajahnya berubah menjadi penuh empati dan rasa ingin tahu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Guncangan emosional? Wah... aku tidak menyangka wanita sekuat dirimu bisa melewatinya. Baiklah, ceritakan semuanya padaku, Eonni... Aku akan mendengarkannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Sup Rumput Laut & Tiga Generasi", "html": "<p class=\"c10 title\" id=\"h.g6f1jzijkfqw\"><span class=\"c23 c13\">Sup Rumput Laut &amp; Tiga Generasi</span></p><h3 class=\"c14\" id=\"h.s0xdhn420pit\"><span class=\"c7 c1 c6\">Bab: Sup Rumput Laut &amp; Tiga Generasi</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.ocbft7hfbyo8\"><span class=\"c7 c1 c6\">Dilema Washington 2013</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana masih di dalam ruang spa VVIP (Tahun 2026). Perawatan kini bergeser ke sesi pijat kepala dan pundak (head and shoulder massage). Jemari para terapis yang ahli dengan lembut memijat titik-titik penat di leher hingga pundak Na Eun dan Daehyun, memberikan sensasi rileks yang mendalam di sela-sela kepulan uap hangat aroma terapi. Na Eun menghela napas panjang sebelum membuka cerita.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi waktu itu setelah kami resmi menikah... aku masih ingat sekali, di awal tahun 2013, Junwoo tiba-tiba mendapat tawaran posisi diplomatik yang sangat strategis ke Washington D.C. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Saat pertama kali mendengar kabar itu, aku sempat langsung menolaknya. Bagaimana tidak? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kami baru saja menikah selama dua bulan, bahkan kami belum sempat berangkat bulan madu sama sekali, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh sedikit, tersenyum maklum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah... Eonni, tawaran ke Washington D.C. itu sebenarnya terdengar seperti hadiah pernikahan yang luar biasa ya untuk seorang diplomat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi di sisi lain, pasti rasanya sangat dilema. Kalian kan saat itu masih di tahap lagi sayang-sayangnya sebagai pengantin baru, hehehe.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar, rasanya campur aduk. Lucunya, orang tua Junwoo, Tuan dan Nyonya Park justru sepenuhnya memberikan kebebasan kehendak pada kami. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mereka bersikap sangat bijak. Bahkan, ada satu hal yang sangat membekas di hatiku... Ibu mertuaku bilang, kalau bisa, beliau memintaku untuk mendampingi Junwoo ke Washington dan merelakan Florentina jika aku mau. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Secara naluri, saat itu aku memang sudah merasa sangat lelah. Apalagi pada Q4 tahun 2012, Florentina sebenarnya sudah siap untuk diakuisisi oleh perusahaan keluargamu, Daehyun-ah, atas permintaan Ayah. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi... orang tuaku sendiri justru memiliki pandangan yang jauh berbeda.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengernyitkan dahi, tampak penasaran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa, Eonni? Apa sebenarnya pendapat Ayah dan Ibu Mertua saat itu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.g09npuezq0u0\"><span class=\"c7 c1 c6\">Meja Makan yang Dingin dan Tuntutan Profesional</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur bergerak mundur (kilas balik) menuju Februari 2013. Suasana malam hari di ruang makan kediaman Keluarga Han. Pencahayaan lampu gantung yang mewah terasa kontras dengan atmosfer ketegangan yang menyelimuti meja makan. Hidangan makan malam telah selesai, namun Tuan Han dan Nyonya Han masih duduk tegak, menatap serius ke arah Junwoo dan Na Eun yang duduk berdampingan di hadapan mereka).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh cangkir tehnya, menatap Junwoo dengan pandangan tajam penuh kalkulasi politik)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau harus tetap fokus dengan kariermu di dunia diplomasi, Junwoo-ya. Ayah melihat potensimu di Washington D.C. nanti akan semakin besar. Kita harus ingat, dari sekarang kita sedang mempersiapkan fondasi untuk karier politik terbaikmu di masa depan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tuan Han kemudian mengalihkan pandangannya yang dingin kepada putrinya).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c1\">\"Dan kau, Han Na Eun. Kau harus tetap tinggal di Korea untuk melanjutkan bisnismu. Pihak </span><span class=\"c1 c8\">Na Group</span><span class=\"c4 c1\"> secara tegas meminta agar kau tetap memegang kendali penuh sebagai CEO setelah perusahaanmu resmi diakuisisi nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar permintaan yang lebih terdengar seperti perintah mutlak itu, Junwoo dan Na Eun seketika saling melirik dalam diam. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Hati mereka didera dilema yang luar biasa besar. Mereka baru saja mengecap manisnya kehidupan pernikahan selama dua bulan, namun kini dihadapkan pada pilihan hidup yang teramat sulit.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdeham pelan, berusaha menjaga nadanya tetap hormat namun tegas)</span></p><p class=\"c0\"><span class=\"c1\">\"Ehmmm... Ayah, jujur saja, dari lubuk hati yang paling dalam, saya merasa sangat berat jika harus menjalani hubungan jarak jauh (</span><span class=\"c1 c8\">LDR</span><span class=\"c4 c1\">) dengan Naeun. Mengingat pernikahan kami ini masih berada di tahap awal.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut bersuara, menatap Ayah dan Ibunya dengan pandangan memelas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah... aku belum bisa dan belum siap jika harus berpisah jauh dengan Junwoo. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Bagaimanapun juga, dia adalah suamiku sekarang. Aku sama sekali tidak masalah jika harus berhenti berbisnis dan melepas Florentina sepenuhnya, supaya mereka bisa melakukan akuisisi secara penuh tanpa keterlibatanku lagi sebagai CEO.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika meletakkan sendoknya dengan ketukan keras, menatap Na Eun tidak suka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun! Apa-apaan yang kau bicarakan itu? Kalian berdua ini harus tetap fokus berkarir! Kalian berdua sama-sama memiliki potensi yang luar biasa besar di bidang masing-masing. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pernikahan sama sekali tidak bisa dijadikan alasan egois agar salah satu dari kalian harus mengalah atau mengorbankan masa depan!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk setuju dengan ucapan istrinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar apa yang dikatakan Ibumu. Apalagi kau, Naeun-ah... Kau harus tetap bertanggung jawab secara penuh terhadap Florentina. Ayah, sebagai investor pertamamu sejak awal, tentu menuntut pertanggungjawaban secara profesional padamu sebagai seorang CEO.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tuan Han mengetuk meja pelan, menekankan poinnya).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau sendiri tahu bahwa performamu kemarin belum bisa memenuhi target yang Ayah tetapkan sebagai investor. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jadi, kau harus tetap berada di Korea dan bertanggung jawab memimpin Florentina setelah diakuisisi nanti. Biarkan Junwoo sebagai suamimu pergi melanjutkan karier diplomatiknya ke Washington. Karena itulah jalan terbaik dan keinginan kami sebagai orang tua.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar untaian kata yang sarat akan tuntutan bisnis dan ambisi itu, dada Na Eun seketika bergemuruh hebat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Rasa marah yang besar menjalar di kepalanya. Namun, di sisi lain, logika profesionalismenya tidak bisa mengelak. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Ia sadar betul bahwa secara hukum bisnis, ia tidak bisa begitu saja membiarkan atau meninggalkan perusahaannya yang sedang dalam proses akuisisi.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyadari perubahan raut wajah Na Eun yang menahan amarah, langsung menggenggam jemari istrinya di bawah meja dan menengahi suasana)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kami mengerti maksud baik Ayah dan Ibu. Namun, kami butuh waktu satu minggu untuk mendiskusikan hal ini berdua dengan matang. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mengingat jika memang tawaran ke Washington D.C. ini diambil, keberangkatan resminya baru akan dilakukan pada bulan April nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas, bersandar di kursinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, kalian bisa mendiskusikannya terlebih dahulu dalam minggu ini. Tapi tetap ingat baik-baik, Naeun-ah... apa yang baru saja Ayah dan Ibu katakan kepadamu. Ini semua demi masa depan kalian.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.3noyo5qn35ey\"><span class=\"c7 c1 c6\">Otoritas Rumah Tangga dan Pelukan di Kamar Utama</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke kamar tidur utama mereka di mansion cluster kediaman Na Eun dan Junwoo. Kamar bernuansa modern minimalis itu terasa sunyi. Na Eun duduk di tepi tempat tidur, air matanya luruh dengan sangat deras. Isak tangisnya pecah, meluapkan seluruh rasa sesak dan amarah yang sejak tadi ia tahan di depan kedua orang tuanya. Junwoo langsung duduk di sampingnya, merangkul pundak Na Eun dengan lembut).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menangis hebat, suaranya bergetar menahan perih)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayah dan Ibu selalu saja seperti itu... Mereka sama sekali tidak melihat sedikit pun kesedihanku saat tahu kita harus berpisah sejauh itu, Junwoo-ya. Mereka hanya memikirkan bisnis dan target!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengusap air mata di pipi Na Eun, tatapannya penuh simpati)</span></p><p class=\"c0\"><span class=\"c1\">\"</span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... tenanglah, tenangkan dirimu terlebih dahulu. Aku tahu rasanya sangat sedih dan menyakitkan saat kau ditekan sekaligus didikte secara bersamaan seperti tadi. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sebagai suamimu, rasanya aku ingin sekali membelamu di depan mereka. Tapi... jika kita melihat kembali apa yang disampaikan Ayah tadi, kurasa kita memang harus mengalah untuk sementara waktu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh cepat, menatap Junwoo dengan mata sembab)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maksudmu... mengalah? Kau menyetujui ucapan mereka?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sabar, menggenggam kedua tangan Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Di awal pernikahan ini, mungkin kita berdua memang harus sama-sama fokus membangun karier terlebih dahulu. Setelah fondasi posisi kita berdua sudah kuat, baru kita bisa meminta ruang dan kebebasan penuh dari mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Gemas sekaligus sedih)</span></p><p class=\"c0\"><span class=\"c1\">\"Tapi, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c1\">... kau mau kita menjalani hubungan jarak jauh (</span><span class=\"c1 c8\">LDR</span><span class=\"c4 c1\">) tepat di awal pernikahan kita? Aku... aku benar-benar belum siap.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Dengarkan aku baik-baik, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... Bagiku, memilih hal ini juga sama sulitnya. Aku juga tidak mau berpisah darimu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi kita harus paham, untuk memiliki kendali penuh atas hidup kita kedepan, harus ada sesuatu yang kita korbankan di awal. Kita tidak bisa memberontak begitu saja di saat fondasi karir kita belum kuat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kedua orang tua kita masing-masing memiliki cara pandang yang sangat berbeda dalam melihat rumah tangga kita. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Maka dari itu, tugas kita adalah menyamakan persepsi itu. Hanya satu tahun saja kita menjalani </span><span class=\"c1 c8\">LDR</span><span class=\"c4 c1\"> ini... setelah itu, aku berjanji kita akan kembali bersama.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Kembali terisak, menyandarkan kepalanya di dada Junwoo)</span></p><p class=\"c0\"><span class=\"c1\">\"Aku belum siap, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... Benar-benar belum siap.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengecup puncak kepala Na Eun dengan sayang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, aku tahu, dan aku pun merasakan hal yang sama. Tapi ini hanya untuk sementara waktu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dengarkan aku, bahkan jika kau mau, kau bisa pergi menemuiku seminggu sekali ke Washington. Kita tetap bisa bertemu kapanpun kau mau, Naeun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengusap air matanya pelan)</span></p><p class=\"c0\"><span class=\"c1\">\"Ahhh... entahlah, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">. Otakku rasanya buntu, aku tidak bisa memutuskan apa-apa sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menangkup wajah Na Eun, menatapnya lekat)</span></p><p class=\"c0\"><span class=\"c1\">\"</span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... justru momen saat ini adalah langkah awalmu untuk membangun otoritas diri. Agar Ayah dan Ibu tidak terus-menerus mendikte hubungan dan rumah tangga kita ke depannya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Saat kau serius belajar manajemen di </span><span class=\"c1 c8\">Na Group</span><span class=\"c4 c1\"> nanti, mereka perlahan akan melihat dan mengakui eksistensi sebagai pemimpin yang mandiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas panjang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi bagaimana aku bisa tinggal berjauhan denganmu? Hanya itu yang kupikirkan sekarang. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Bahkan jujur saja, kepalaku sudah terlalu penuh sampai belum bisa memikirkan bagaimana proses akuisisi Florentina nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menarik Na Eun ke dalam pelukan yang erat dan hangat)</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, aku mengerti, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">. Kita memang harus berani mengambil resiko ini sekarang, di awal pernikahan. Ingat, kita harus menyamakan persepsi kedua orang tua kita masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bergumam di dalam dekapan Junwoo)</span></p><p class=\"c0\"><span class=\"c1\">\"Hanya orang tuaku saja, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... Orang tuamu sangat mengerti dan membebaskan kita.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c1\">\"Nah, iya, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">. Maka dari itu, karena kita sama-sama menyayangi mereka, kita harus mengambil pendekatan yang berbeda. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Ya... walaupun kita harus agak berkorban di awal hubungan ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Perlahan menarik tubuhnya, lalu menyunggingkan senyum tipis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, kau ini... selalu saja punya cara untuk membuatku memandang dikte dan tekanan dari orang tuaku dengan sudut pandang yang berbeda.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik jam dinding yang sudah larut, lalu mengedipkan sebelah matanya dengan nada menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, itu karena aku sudah resmi jadi suamimu sekarang! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Dan karena aku adalah suamimu...\" </span><span class=\"c1 c8\">(tersenyum usil)</span><span class=\"c4 c1\"> \"...jadi boleh dong ya, malam ini aku meminta hakku sebagai seorang suami? Hehehehe.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya mendadak merona merah, memukul dada Junwoo pelan dengan gaya manja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, kauuu ini... sempat-sempatnya ya!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo tertawa renyah sambil meraih sakelar di dekat tempat tidur. Lampu kamar utama pun dimatikan, menyisakan keheningan malam saat kedua pengantin baru itu akhirnya terlelap bersama dalam kehangatan dan rasa saling menguatkan).</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.kiehe6v8wxnc\"><span class=\"c7 c1 c6\">Otoritas Rumah Tangga dan Mimpi di Masa Depan</span></h3><p class=\"c0\"><span class=\"c1 c8\">(Suasana kembali ke masa sekarang [Tahun 2026], di dalam ruangan spa VVIP.)</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Sesi pijat kepala dan pundak masih berlangsung santai.)</span><span class=\"c1\"> </span><span class=\"c5 c1\">(Daehyun tampak menghembuskan napas panjang, meresapi cerita masa lalu Na Eun yang penuh perjuangan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap langit-langit ruangan dengan tatapan haru)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya ampun, Eonni... sungguh menyesakkan sekali kalau diingat-ingat lagi masa-masa awal pernikahan kalian itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, menikmati pijatan di pundaknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, iya. Itulah awal dari perjalanan panjang kami dulu. Apa yang dikatakan Junwoo saat itu sebenarnya seratus persen benar. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kita memang harus mau berjuang keras untuk membangun eksistensi diri terlebih dahulu. Karena tanpa adanya eksistensi dan posisi yang kuat, kita akan terus-menerus dikontrol dan disetir sesuai dengan kemauan Ayah dan Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun memiringkan kepalanya sedikit, menatap Daehyun dengan pandangan serius namun hangat).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dan sepertinya... kau juga harus mulai mempersiapkan hal itu baik-baik dengan Seo Pyo. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Jujur saja, saat pertama kali aku mendengar kabar kalau kau memutuskan untuk hiatus dari dunia </span><span class=\"c1 c8\">entertainment</span><span class=\"c4 c1\"> sebagai aktris, pasti ada kaitannya dengan reputasi suamimu dan menjaga nama baik keluarga kita, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tenang, menggelengkan kepalanya pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh... kalau soal itu, sebenarnya ini murni keputusan pribadiku sendiri, Eonni. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kalau ditanya soal reputasi... ya, memang ada benarnya, itu ikut menjadi salah satu pertimbangan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Tapi alasan utamanya, aku benar-benar ingin memperdalam bakat dan minatku di dunia </span><span class=\"c1 c8\">directing</span><span class=\"c1\"> (sutradara). Sekaligus, rencananya dari hasil kerja keras tabunganku selama ini, aku ingin membangun </span><span class=\"c1 c8\">Production House</span><span class=\"c4 c1\"> (PH) milikku sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar bangga mendengar tekad adik iparnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar! Apa pun yang terbaik dan yang kau inginkan, lakukanlah, Daehyun-ah. Tapi satu hal yang harus selalu kau ingat... jangan pernah hiraukan intervensi atau tekanan dari Ayah dan Ibuku. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kau dan Seo Pyo harus memegang kendali penuh atas rumah tangga kalian sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk mantap, menyunggingkan senyum penuh arti)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Eonni... Terima kasih atas nasihatnya. Lagipula, aku dan Seo Pyo sudah mendiskusikan banyak hal. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Aku sudah tahu betul ke depannya bagaimana peta mimpi-mimpi kami, terutama mimpi besar yang ingin dicapai Seo Pyo di masa depan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lega, meraih jemari Daehyun dan menggenggamnya hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benarkah? Baguslah kalau begitu. Apapun mimpi dan rencana masa depan kalian, kalian berdua harus mengusahakannya bersama sampai berhasil. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tenang saja, aku dan Junwoo pasti akan selalu berusaha mendukung kalian sepenuhnya dari belakang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.miai0n1bilrc\"><span class=\"c7 c1 c6\">Estafet Kepemimpinan dan Sinyal Tubuh yang Melemah</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Maju ke bulan Mei 2013. Junwoo telah resmi berangkat dan menetap di Washington D.C. untuk mengemban jabatan barunya sebagai diplomat. Sementara itu, di Seoul, Na Eun resmi menjabat sebagai CEO Na Cosmetic sebuah langkah besar setelah Florentina diakuisisi dan melakukan rebranding di bawah naungan Na Group).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana di dalam ruang rapat utama Na Cosmetic yang modern dan elegan. Na Eun duduk di kepala meja, memimpin rapat pertamanya bersama seluruh staf inti dan jajaran manajer baru yang ditunjuk pasca-akuisisi. Atmosfer rapat terasa formal dan padat).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap layar presentasi dengan serius)</span></p><p class=\"c0\"><span class=\"c1\">\"Saya melihat potensi produk kita ke depannya akan jauh lebih baik jika </span><span class=\"c1 c8\">core value</span><span class=\"c1\"> produknya tetap dipertahankan sama seperti yang dulu ada di Florentina. Hanya saja, dari data terbaru ini, kita perlu melakukan sedikit pergeseran pada target market.\" </span><span class=\"c1 c8\">(menunjukkan data di layar)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Manajer A:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangkat tangan, memberikan tanggapan profesional)</span></p><p class=\"c0\"><span class=\"c1\">\"Jika dilihat secara </span><span class=\"c1 c8\">core value</span><span class=\"c1\">, memang tidak ada masalah, Bu. Namun, menurut kami, tetap diperlukan adanya riset pasar yang baru agar pergeseran target market ini bisa benar-benar sesuai dan tepat sasaran. Berikut adalah data pembanding yang sudah kami siapkan...\" </span><span class=\"c1 c8\">(menunjukkan data dan menjelaskan)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Divisi RnD:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut menyahut setelah Manajer A selesai)</span></p><p class=\"c0\"><span class=\"c1\">\"Menambahkan dari sisi produk, Bu. Jika melihat dinamika market yang sekarang, </span><span class=\"c1 c8\">core</span><span class=\"c1\"> produk ini sebaiknya dikembangkan kembali dengan formulasi baru. Jadi, perlu ada </span><span class=\"c1 c8\">refreshment</span><span class=\"c1\"> (penyegaran) agar tetap relevan dengan selera pasar dan peminat saat ini. Kami juga sudah menyiapkan data formulasi awalnya di sini...\" </span><span class=\"c1 c8\">(menunjukkan berkas data dan menjelaskan)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menahan rasa tidak nyaman yang tiba-tiba menyerang tubuhnya, mencoba tetap fokus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik... Dari sisi tim kreatif, apakah kalian ada masukan atau pandangan tambahan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Kreatif:</span></p><p class=\"c0\"><span class=\"c1\">\"Untuk saat ini, kami akan menyesuaikan dulu dengan data-data dari hasil rapat hari ini, Bu. Baru setelah itu kami akan memberikan masukan lanjutan berupa referensi mengenai desain, </span><span class=\"c1 c8\">look</span><span class=\"c1\">, dan konsep </span><span class=\"c1 c8\">branding</span><span class=\"c4 c1\"> keseluruhannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika memegang pelipisnya. Kepalanya mendadak terasa pusing berputar, perutnya mulas, dan rasa mual yang hebat tiba-tiba bergejolak di tenggorokannya)</span></p><p class=\"c0\"><span class=\"c1\">\"Ehmmm... baiklah...\" </span><span class=\"c1 c8\">(suaranya melemah, ia menutup dokumennya terburu-buru)</span><span class=\"c4 c1\"> \"...ehmmm, maaf. Tolong interupsi sebentar.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Rapat:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Saling berpandangan cemas melihat wajah Na Eun yang mendadak pucat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ada apa, Bu? Apakah Ibu sedang sakit?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha sekuat tenaga menyembunyikan rasa sakitnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahh, tidak apa-apa... Baik, kalau begitu rapat kita cukupkan sampai di sini. Kalian bisa bubar sekarang, dan tolong kirimkan semua berkas data tadi ke email pribadi saya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Rapat:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Bu. Selamat siang.\"</span></p><h3 class=\"c9\" id=\"h.idn34yj6tqxl\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.109senx5cjf2\"><span class=\"c7 c1 c6\">Air Mata di Atas Atap dan Kehadiran Nyonya Na</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah semua staf keluar, Na Eun menyandarkan tubuhnya yang lemas di kursi sejenak, sebelum akhirnya berlari cepat ke toilet untuk meluapkan rasa mualnya. Merasa badannya benar-benar tidak sehat dan pikirannya buntu karena beban pekerjaan baru, Na Eun berjalan gontai menuju ke rooftop gedung kantor).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di atas rooftop yang sepi, di bawah embusan angin siang, Na Eun duduk sendirian. Pertahanannya runtuh. Ia menangis tersedu-sedu, meratapi kondisi tubuhnya yang drop di tengah tekanan arah bisnis yang baru, sementara sang suami berada belasan ribu kilometer darinya).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bergumam di sela tangisnya, menatap ponsel)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bahkan perbedaan waktu ini terasa sangat menyiksa... Di Washington sekarang pasti sudah dini hari, dia pasti sudah beristirahat. Aku tidak boleh egois dan mengganggunya...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tiba-tiba melangkah mendekat dari arah pintu masuk rooftop)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah... kau tidak apa-apa?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Nyonya Na, ibu dari Daehyun yang saat itu menjabat sebagai Co-Founder Na Group sekaligus Strategic Consultant untuk Na Cosmetic, menatap Na Eun dengan pandangan khawatir).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkejut, cepat-cepat menyapu air matanya dan berdiri membungkuk hormat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... Nyonya Na. Kenapa... kenapa Anda bisa ada di sini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan mendekat, mengusap pundak Na Eun lembut)</span></p><p class=\"c0\"><span class=\"c1\">\"Tadi ada salah satu staf rapatmu yang memberi tahu saya kalau kau berjalan ke arah </span><span class=\"c1 c8\">rooftop</span><span class=\"c4 c1\"> sendirian dengan wajah pucat. Ada apa? Kenapa kau menangis di sini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maafkan saya, Nyonya Na... Saya hanya merasa kurang enak badan saja.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wajahmu sangat pucat, Naeun-ah. Ayo, jangan ditunda, kita ke rumah sakit sekarang juga. Biar saya yang antar.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak perlu repot-repot, Nyonya Na. Nanti setelah jam pulang kantor saja saya bisa pergi sendiri, lagi pula saat ini saya masih ada beberapa pekerjaan yang harus diselesaikan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng tegas namun penuh kasih sayang ibu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jangan begitu. Kesehatan itu jauh lebih utama daripada pekerjaan apa pun di dunia ini. Ayo, Naeun-ah, ikut saya sekarang.\"</span></p><h3 class=\"c9\" id=\"h.ik4zq6fka3f4\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.jhs0y13ek0lb\"><span class=\"c7 c1 c6\">Kabar Bahagia di Ruang Lab</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke salah satu rumah sakit di Seoul. Setelah melewati serangkaian pemeriksaan fisik menyeluruh dan tes laboratorium, Na Eun dan Nyonya Na duduk di dalam ruangan dokter spesialis).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lebar, membaca lembar hasil laboratorium di tangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nyonya Han Na Eun, selamat... hasil tes menunjukkan bahwa saat ini Anda sedang mengandung, usia kehamilan Anda sudah memasuki minggu ke-8.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span
