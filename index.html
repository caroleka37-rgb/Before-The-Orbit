<script>
const chapters=[{"title": "Prolog", "html": "<p class=\"c10 title\" id=\"h.2dwnvoqqylbw\"><span class=\"c23 c13\">Prolog</span></p><h1 class=\"c0\" id=\"h.hvdn1u5ecf19\"><span class=\"c1 c6 c12\">B-Side SEKUEL 1 - BEFORE THE ORBIT</span></h1><h2 class=\"c0\" id=\"h.q3d3hgzijcdy\"><span class=\"c24 c1 c6\">“DUA DUNIA YANG BERBEDA”</span></h2><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-01.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Timeline Flashback: Seoul, Tahun 2003 – Awal Semester 1 (Seoul National University)</span></p><h3 class=\"c9\" id=\"h.wi4e6tb756qi\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.p2w2vdu3j60d\"><span class=\"c7 c1 c6\">Bagian 1: Ruang Aman dan Kehangatan Meja Makan</span></h3><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana pagi yang cerah di kediaman keluarga Park. Cahaya matahari menembus jendela kaca besar, menerangi meja makan kayu yang dipenuhi sarapan sederhana namun hangat. Suasana berisik oleh denting sendok dan tawa ringan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Park Junwoo tumbuh sebagai anak tunggal di sebuah oasis yang langka bagi kalangan elite Seoul. Ayahnya adalah seorang Jaksa Agung yang tegas di ruang sidang namun hangat dan jenaka di rumah, sementara ibunya adalah dokter spesialis anak yang mendedikasikan waktu senggangnya untuk kegiatan sosial. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di rumah ini, tidak ada hierarki yang kaku. Sejak kecil, pendapat Junwoo selalu didengar dalam setiap diskusi keluarga. Hal itu menumbuhkan rasa aman yang absolut dan kepercayaan diri yang sehat di dalam dadanya.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pagi itu, sebelum berangkat ke kampus Seoul National University (SNU) untuk semester pertamanya di jurusan Hubungan Internasional, Junwoo duduk bersama kedua orang tuanya. Jurusan ini ia pilih atas kesadaran penuh dan minat mendalam ia adalah pengamat yang gemar bersosialisasi.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ibu Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum hangat sambil menyodorkan segelas susu)</span><span class=\"c4 c1\"> \"Junwoo-ya, akhir pekan ini tim klinik ibu mau ke daerah Guryong untuk pelayanan kesehatan gratis dan pembagian buku. Kau mau ikut bantu anak-anak di sana lagi?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menerima gelas dengan mata berbinar)</span><span class=\"c4 c1\"> \"Tentu saja, Ibu! Kebetulan aku baru mengobrol dengan beberapa anak Hubungan Internasional angkatanku. Mereka tertarik ikut membuat gerakan sukarela untuk pendidikan anak-anak. Aku bisa mengajak mereka sekalian.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ayah Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Meletakkan koran, menatap putranya dengan bangga)</span><span class=\"c4 c1\"> \"Gunakan ruang bertumbuhmu di SNU dengan baik, Nak. Hubungan internasional itu bukan cuma diplomasi kaku antar-negara saja. Tapi tentang bagaimana kau menjembatani hati antar-manusia.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, mengangguk mantap)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Siap, Bapak Jaksa Agung Park! Aku berangkat dulu.\"</span></p><h3 class=\"c9\" id=\"h.qvsrb3ftd7dl\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.gdhn2fmkbv9s\"><span class=\"c7 c1 c6\">Bagian 2: Kantin FISIP – Sang \"Matahari Lintas Jurusan\"</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kantin Fakultas Ilmu Sosial dan Ilmu Politik (FISIP) SNU sangat ramai. Junwoo duduk di tengah meja panjang, dikelilingi mahasiswa dari berbagai jurusan. Lembaran brosur gerakan sosial berserakan di depannya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-02.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Junwoo muda adalah magnet. Karakternya yang hangat, supel, dan mudah berempati membuatnya dikenal luas lintas jurusan dalam waktu singkat. Ia tidak butuh waktu lama untuk dipercaya memimpin gerakan sosial mahasiswa yang berfokus pada pemberdayaan masyarakat.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Min-ho (Teman Seangkatan - Jurusan HI):</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menggeleng-gelengkan kepala melihat tumpukan berkas Junwoo)</span><span class=\"c4 c1\"> \"Junwoo-ya, kau ini baru semester satu tapi sibuknya seperti mahasiswa tingkat akhir. Gerakan sukarela, forum filantropi, proyek kemanusiaan... Apa kau tidak lelah berteman dengan semua orang di kampus ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum santai sambil membagikan selebaran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lelah dari mana? Bertukar cerita dengan orang-orang baru itu justru menambah energiku, Min-ho. Manusia itu punya latar belakang yang unik. Menarik tahu, kalau kita bisa memahami mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo (Mahasiswi Sosiologi):</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menyahut dari ujung meja)</span><span class=\"c4 c1\"> \"Kudengar anak-anak dari Fakultas Bisnis dan Hukum juga membicarakanmu kemarin saat rapat Student Council. Kau benar-benar tidak punya batas komunikasi, ya energimu sangat banyak?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c4 c1\"> \"Seni komunikasi itu tidak punya sekat fakultas, Ji-soo-ya. Selama tujuannya baik untuk kemanusiaan, semua orang adalah teman.\"</span></p><h3 class=\"c9\" id=\"h.ipgrcnnz4cv8\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.bn2tdez6svm0\"><span class=\"c7 c1 c6\">Bagian 3: Sang Putri Sulung dan Panggung yang Dikubur Rapat</span></h3><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Kontras visual: Suasana sunyi, dingin, dan penuh tekanan di kediaman keluarga Han. Han Na Eun berdiri tegak di depan cermin besar, merapikan blazer formalnya. Wajahnya cantik, namun datar tanpa ekspresi.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di belahan Seoul yang lain, Han Na Eun tumbuh dalam sangkar emas yang dingin. Sebagai putri sulung dari keluarga politik-bisnis terpandang, kata \"bebas\" tidak pernah ada dalam kamusnya. Ia dididik dalam lingkungan yang disiplin militer, kompetitif, dan penuh tuntutan. Nilai akademik, tata krama, etika berpakaian, hingga cara bernapas pun diatur demi menjaga reputasi nama besar keluarga Han. Tidak ada ruang untuk kesalahan sekecil apa pun.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Jurusan Manajemen Bisnis di SNU yang ia masuki semester ini adalah garis mutlak yang ditentukan ayahnya. Tidak ada yang tahu bahwa di balik otak STEM-nya yang genius, Na Eun remaja menyimpan rahasia besar. Ia sangat mencintai musik dan seni tari. Di masa SMA, ia diam-diam mengikuti ekstrakulikuler tari modern, mengunci kamar untuk menghafal setiap lekuk koreografi </span><span class=\"c1 c8\">grup idol</span><span class=\"c1\"> populer, dan bermimpi memakai </span><span class=\"c1 c8\">ear-monitor</span><span class=\"c1\"> di bawah lampu panggung sebagai </span><span class=\"c1 c8\">performer</span><span class=\"c4 c1\"> profesional.</span></p><p class=\"c0\"><span class=\"c4 c1\">Mimpi itu mati muda. Ia menguburnya sendiri dengan sadar malam itu, ketika sang ayah menyerahkan berkas pendaftaran Fakultas Bisnis. Namun, Na Eun menolak menjadi pecundang lemah. Meski terpaksa masuk ke dunia bisnis, ia melaluinya dengan totalitas yang luar biasa.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Kilas balik pendek: Na Eun melihat gantungan kunci grup idol yang ia kagumi, mengelusnya sesaat, lalu menutup laci itu dengan hentakan keras.)</span></p><h3 class=\"c9\" id=\"h.tp4wbr7svbcv\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.iy5j546kg6yt\"><span class=\"c7 c1 c6\">Bagian 4: Ruang Komunal Fakultas Bisnis – Sang \"Gunung Es Genius\"</span></h3><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana ruang belajar bersama Fakultas Bisnis. Berbeda dengan kubu Junwoo yang berisik oleh tawa, meja Na Eun dipenuhi tablet grafik saham, jurnal riset pasar modal, dan laptop yang menampilkan kode-kode rumit. Beberapa mahasiswi duduk agak menjauh, berbisik-bisik segan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Jika Junwoo adalah matahari, maka Na Eun adalah gunung es yang memikat namun tak tersentuh. Di kalangan mahasiswa seangkatan 2003, ia terkenal karena dua hal: kecerdasannya dan sifat individualismenya yang pekat. Ia menyendiri, bukan karena lemah, tapi karena ia tidak mengizinkan siapapun membuang waktunya yang berharga. Ia memfokuskan seluruh energinya pada dua tempat: </span><span class=\"c1 c8\">SNU VALUE</span><span class=\"c1\"> (Klub Investasi &amp; Pasar Modal) tempat analisis saham riil, serta jaringan </span><span class=\"c1 c8\">Enactus global</span><span class=\"c4 c1\"> (Klub Kewirausahaan &amp; Manajemen).</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-03.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Hye-won (Teman Jurusan Manajemen Bisnis):</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbicara dengan nada sangat hati-hati sambil mendekati meja Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Na Eun-ah... maaf mengganggu. Nanti malam anak-anak angkatan kita mau mengadakan kumpul santai di kedai depan gerbang. Kau... ada waktu untuk ikut bergabung?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Mata tetap terpaku pada pergerakan grafik saham di layar, jemarinya mengetik dengan ritme konstan)</span><span class=\"c1\"> \"Tidak bisa, Hye-won. Malam ini aku harus menyelesaikan analisis portofolio makro untuk presentasi </span><span class=\"c1 c8\">SNU VALUE</span><span class=\"c4 c1\"> besok pagi. Dataku harus segera aku selesaikan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Hye-won:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela nafas pelan, agak kecewa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, begitu ya... Tapi ini kan baru awal semester satu. Sesekali berbaur dan bersenang-senang dengan yang lain tidak akan membuat nilaimu turun, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Berhenti mengetik. Ia menoleh perlahan, menatap Hye-won dengan sepasang mata tajam yang dingin namun berwibawa)</span><span class=\"c4 c1\"> \"Kalian bisa berkumpul tanpaku, Hyewon-ah. Untuk sekarang maaf aku belum bisa bergabung\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Hye-won:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menelan ludah, kecewa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"B-baiklah kalau begitu. Semangat laporannya, Na Eun.\"</span></p><p class=\"c0\"><span class=\"c4 c1\">(Setelah Hye-won pergi, Na Eun menatap lurus ke depan. Untuk sepersekian detik, bahunya yang tegap tampak sedikit turun. Kesepian itu ada di sana, tersembunyi di balik topeng totalitasnya.)</span></p><h3 class=\"c9\" id=\"h.dg7d11iaojsv\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.gwvt5wo8cmsw\"><span class=\"c7 c1 c6\">Bagian 5: Persimpangan Dua Kutub yang Belum Berbaur</span></h3><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 436.50px; height: 318.16px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-04.png\" style=\"width: 583.94px; height: 318.16px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 144.50px; height: 316.87px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-05.png\" style=\"width: 579.93px; height: 316.87px; margin-left: -435.43px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana koridor utama gedung pusat SNU menjelang sore. Matahari senja berwarna jingga menerobos pilar-pilar bangunan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dua ruang bertumbuh yang berbeda total. Dua kepribadian yang bertolak belakang. Junwoo dan Na Eun berjalan di koridor yang sama, membawa atmosfer mereka masing-masing yang disadari oleh seluruh mahasiswa angkatan mereka.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo berjalan berlawanan arah dengan Na Eun, dikelilingi teman-temannya yang sedang tertawa terbahak-bahak mendengar ceritanya. Di sisi lain, Na Eun berjalan sendirian dengan langkah konstan, memeluk binder tebal, menatap lurus ke depan tanpa menoleh.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mereka berpapasan tanpa teguran. Hanya hembusan angin sore yang menggerakkan ujung pakaian mereka. Junwoo sempat melirik sekilas, memperhatikan profil samping Na Eun yang begitu serius.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Minna (Teman Angkatan):</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menyenggol lengan Junwoo setelah Na Eun melewati mereka)</span><span class=\"c4 c1\"> \"Junwoo-ya, kau lihat gadis barusan? Itu Han Na Eun, si 'Monster Genius' dari Manajemen Bisnis. Dia anak sulung dari keluarga Han yang berpengaruh itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menghentikan langkahnya sebentar, berbalik melihat punggung tegap Na Eun yang berjalan menjauh di antara kerumunan)</span><span class=\"c4 c1\"> \"Han Na Eun? Ah... anak Manajemen Bisnis.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Minna:</span><span class=\"c1\"> \"Iya. Dia gila sekali, semua proyek </span><span class=\"c1 c8\">Enactus</span><span class=\"c4 c1\"> dan simulasi saham disapu bersih sendirian. Tapi ya begitu, dia sangat individualis dan penyendiri. Tidak ada yang kuat berteman dengannya karena dia terlalu kaku dan dingin. Beda seratus delapan puluh derajat denganmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menatap punggung Na Eun dengan tatapan lurus, ekspresi jenakanya berubah menjadi sebuah senyuman tipis yang sarat akan kekaguman intelektual)</span><span class=\"c4 c1\"> \"Individualis? Mungkin perasaanmu saja, Minna-ya. Dia tidak terlihat sombong. Dia hanya terlihat seperti seseorang yang tahu persis apa tanggung jawabnya, dan memilih untuk totalitas tanpa mempedulikan distraksi luar\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di ujung koridor, samar-samar Na Eun mendengar gema tawa Junwoo dan teman-temannya yang menjauh. Langkah Na Eun tidak berhenti, namun matanya melirik sekilas ke arah bayangan kerumunan itu.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Membatin dengan suara batin yang lelah)</span><span class=\"c4 c1\"> \"Mereka memiliki selera yang sama mungkin sangat berbeda dengan keadaanku sekarang\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><h2 class=\"c0 c22\" id=\"h.lf8byy5tbqul\"><span class=\"c24 c1 c6\"></span></h2><p class=\"c0\"><span class=\"c3 c1\">Timeline: Seoul, Tahun 2005 – Setelah Semester 5 (Seoul National University)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Lanjutan setelah Bagian 5)</span></p><h3 class=\"c9\" id=\"h.4mezxqu7ugdg\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.hlv60n370xh7\"><span class=\"c7 c1 c6\">Bagian 6: Ruang Rapat Student Council – Pertanyaan tentang Anggota Pasif</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana Ruang Rapat Student Council SNU. Papan tulis dipenuhi dengan draft timeline untuk acara besar \"Pekan Mahasiswa\" yang mencakup pameran seni dan berbagai workshop. Junwoo duduk di ujung meja, memegang map berisi data seluruh anggota organisasi.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Waktu bergulir cepat ke tahun 2005, setelah badai semester 5 berlalu. Sebagai Presiden </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> yang baru terpilih, Junwoo memikul tanggung jawab besar untuk menyukseskan Pekan Mahasiswa. Di sore hari, ia meneliti satu per satu nama anggota di dalam daftar untuk pembagian divisi kepanitiaan. Matanya tertahan pada satu nama yang sudah tidak asing sejak semester satu: Han Na Eun.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetukkan jarinya di atas kertas, menatap forum rapat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Teman-teman, aku sedang mengecek ulang data anggota kita untuk pembagian tugas Pekan Mahasiswa. Aku menyadari ada beberapa anggota yang kurang aktif di organisasi kita belakangan ini. Mereka sebenarnya kenapa? Apa ada kendala internal?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Min-ho:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menghela napas sambil bersandar di kursi)</span><span class=\"c4 c1\"> \"Ah, kalau yang kau maksud anak-anak dari Fakultas Bisnis atau Hukum, biasanya karena jadwal kuliah dan komunitas internal mereka sangat padat, Junwoo-ya. Waktu mereka sering bentrok, jadi mereka lebih memilih memprioritaskan urusan jurusan mereka sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk paham, sorot matanya tetap tenang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Begitu, ya. Tapi sayang sekali kalau potensi mereka tidak tersalurkan di sini. Mungkin beberapa dari kita harus mencoba melobi mereka lagi secara personal, agar mereka mau kembali aktif membantu acara ini.\"</span></p><h3 class=\"c9\" id=\"h.egh9w08vo6uo\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.9ymlpit0ylpk\"><span class=\"c7 c1 c6\">Bagian 7: Mading Kampus – Gagasan yang Mengguncang</span></h3><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Keesokan harinya. Koridor utama kampus ramai oleh mahasiswa yang berkerumun di depan mading besar. Junwoo, Min-ho, dan beberapa pengurus Student Council lainnya berjalan melewati area tersebut dan ikut berhenti karena melihat keramaian.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Klub jurnalistik kampus dari anak-anak Ilmu Komunikasi baru saja menempelkan buletin mingguan terbaru. Biasanya, mading dipenuhi artikel tren anak muda atau kritik politik makro. Namun kali ini, </span><span class=\"c1 c8\">highlight</span><span class=\"c4 c1\"> terbesar yang menyita perhatian ratusan pasang mata adalah sebuah esai analitis berseri yang sangat berbobot.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Min-ho:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memicingkan mata membaca judul besar di buletin)</span></p><p class=\"c0\"><span class=\"c1\">\"Tunggu... 'Analisis Implementasi </span><span class=\"c1 c8\">Social Enterprise</span><span class=\"c4 c1\"> (Sociopreneurship) bagi Masyarakat Daerah Terpencil Berbasis Pemberdayaan Ekonomi Makro'. Siapa yang menulis artikel ini? Isinya berbasis riset lapangan yang sangat solid.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Melihat nama penulis di bagian bawah kertas)</span><span class=\"c4 c1\"> \"Lihat gila, penulisnya Han Na Eun dari Manajemen Bisnis! Dia kan anggota kita yang pasif itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Junwoo melangkah maju, membaca kata demi kata dengan seksama. Gagasan Na Eun tentang bagaimana bisnis harus digunakan untuk menyelesaikan masalah sosial di daerah terpencil benar-benar bergetar di frekuensi yang sama dengan jiwa filantropinya. Ada kekaguman yang tak bisa disembunyikan dari sepasang mata Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menyeletuk sambil tersenyum lebar)</span><span class=\"c1\"> \"Kita tidak perlu bingung mencari pembicara eksternal lagi. Kita sudah mendapatkan satu pembicara yang sangat potensial untuk mengisi </span><span class=\"c1 c8\">workshop</span><span class=\"c4 c1\"> bisnis kita sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Sontak membelalakkan mata, merasa keberatan)</span><span class=\"c1\"> \"Tunggu, Junwoo-ya! Kau mau mengundang Han Na Eun sebagai pembicara utama Pekan Mahasiswa? Yang benar saja. Pertama, dia terkenal angkuh dan tidak pernah menganggap penting organisasi </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> kita. Kedua, semua anak tahu dia itu tipe orang yang sangat susah di lobi jika bukan karena kemauannya sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh rendah, merapikan ranselnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia tidak angkuh, dia hanya efisien dengan waktunya. Tolong sampaikan pada perwakilan jurusan bisnis, katakan aku ingin mengundangnya berdiskusi di ruang sekretariat secara personal. Dia pasti mau datang jika tujuannya adalah untuk mendiskusikan isi buletin ini.\"</span></p><h3 class=\"c9\" id=\"h.t1nwjq2piei2\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.gsku1mog87dq\"><span class=\"c1 c6 c19\">Bagian 8: Perpustakaan – Secarik Kertas Jawaban</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana Perpustakaan Pusat SNU yang sangat hening. Na Eun duduk di sudut ruangan, dikelilingi tumpukan buku tebal, mengetik di laptopnya dengan ekspresi tanpa distorsi. Ji-soo berjalan mendekat dengan langkah ragu-ragu.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Ji-soo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbisik pelan agar tidak ditegur pengawas)</span></p><p class=\"c0\"><span class=\"c1\">\"Permisi, Han Na Eun-ssi? Aku Ji-soo dari </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hanya melirik sekilas dengan tatapan dinginnya yang khas, jemarinya tidak berhenti mengetik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya? Ada apa?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> \"Begini... Presiden </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> kami, Park Junwoo, membaca buletin gagasannmu di mading kampus tadi pagi. Dia sangat tertarik dengan risetmu dan ingin mengajakmu berdiskusi berdua di ruang sekretariat siang ini.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar nama Junwoo dan kata 'diskusi berdua', gerakan jemari Na Eun berhenti sejenak. Namun, wajahnya tidak menunjukkan ketertarikan romantis sama sekali. Ia menarik sebuah buku catatan kecil, merobek secarik kertas, lalu menuliskan sesuatu di sana dengan cepat menggunakan pena hitamnya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyerahkan secarik kertas itu kepada Ji-soo tanpa ekspresi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tolong sampaikan ini pada Presidenmu.\"</span></p><h3 class=\"c9\" id=\"h.19xl0xdleks8\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.bf4cjh1udtv4\"><span class=\"c7 c1 c6\">Bagian 9: Aula Kampus – Tentang Sebuah Prioritas</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana Aula utama kampus pada sore hari. Seluruh panitia Pekan Mahasiswa berkumpul untuk rapat pleno. Junwoo berdiri di depan panggung. Ji-soo berjalan masuk dengan wajah masygul dan menyerahkan secarik kertas dari Na Eun kepada Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Seluruh anggota </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> menahan napas, memperhatikan reaksi sang Presiden. Mereka mengira, pesona Park Junwoo yang terkenal tidak pernah ditolak oleh mahasiswi mana pun di SNU akan berhasil membuat si 'Gunung Es' meleleh. Namun, kenyataannya justru membuat mereka terkejut.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1 c8\">(Membuka lipatan kertas kecil itu, membaca tulisan tangan yang rapi dan tegas: </span><span class=\"c1 c6 c8\">\"Jika ada yang perlu didiskusikan secara substansial, silahkan tulis semuanya di emailku ini: haneun.han@snumail.com\"</span><span class=\"c5 c1\">)</span></p><p class=\"c0\"><span class=\"c5 c1\">(Aula mendadak sunyi sesaat, sebelum Junwoo tiba-tiba meledakkan tawa rendahnya yang renyah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Min-ho:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Langsung menepuk jidatnya dan mengejek Junwoo, memicu tawa riuh anggota lain)</span><span class=\"c4 c1\"> \"Hahaha! Sudah kubilang apa, Junwoo-ya! Tidak ada satupun mahasiswi yang menolak ajakan diskusi berdua dengan Presiden kita yang populer ini, ternyata pesonamu tetap tidak berlaku di hadapan Han Na Eun!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menyela dengan nada kesal)</span><span class=\"c4 c1\"> \"Apa mungkin dia benar-benar mau mengisi acara Pekan Mahasiswa kita nanti? Dia sangat tidak kooperatif. Kudengar dari anak jurusannya, dia memang tipe penyendiri yang tidak mau berteman.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Mengangkat tangannya dengan tenang, seketika menghentikan narasi-narasi negatif dan bisik-bisik anggota lainnya di dalam aula)</span><span class=\"c4 c1\"> \"Teman-teman, tolong hentikan omongan seperti itu. Ini sama sekali bukan sebuah penolakan personal, jadi jangan membesar-besarkannya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Min-ho:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu kau menganggap tindakannya ini apa, Junwoo?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menatap secarik kertas di tangannya dengan senyum tipis, ada rasa hormat yang mendalam di matanya)</span><span class=\"c4 c1\"> \"Ini tentang prioritas. Dia menghargai waktunya dan menghargai waktuku. Dia tidak ingin diskusi ini melebar menjadi obrolan kosong yang membuang waktu. Justru respons seperti ini membuktikan bahwa dia menganggap serius gagasannya sendiri. Kirimkan konsep acara kita ke emailnya sekarang juga. Aku yakin, dia akan membaca dan menerimanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pekan Mahasiswa tahun 2005 menjadi saksi bisu. Di balik penolakan tatap muka di perpustakaan itu, fondasi hubungan mereka diletakkan dengan sangat kokoh. Junwoo tidak melihat Na Eun dengan kacamata romansa masa muda yang rapuh, melainkan sebagai sosok rekan intelektual yang memiliki integritas tinggi pada dunianya sendiri. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Rekaman Memori", "html": "<p class=\"c10 title\" id=\"h.3qsz57ygi9xw\"><span class=\"c23 c13\">Rekaman Memori</span></p><h1 class=\"c0 c29\" id=\"h.pi8lul17o2ge\"><span class=\"c12 c1 c6\"></span></h1><h2 class=\"c0\" id=\"h.tcxysktedzmq\"><span class=\"c24 c1 c6\">BAB: REKAMAN MEMORI</span></h2><p class=\"c0\"><span class=\"c30 c1 c6 c8\">Timeline: Juni 2026 – Kediaman Keluarga Han, Seoul (Masa Sekarang)</span></p><h3 class=\"c9\" id=\"h.wr3txt5swikr\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.6kzlhzq1rd0h\"><span class=\"c7 c1 c6\">Bagian 1: Aroma Daging dan Keheningan Mansion</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana pagi yang cerah sekitar pukul 10.00 KST di area halaman belakang sebuah mansion mewah di kawasan elite Seoul. Langit musim panas begitu bersih, memantulkan warna biru jernih di permukaan air kolam renang. Angin sepoi-sepoi menggoyang dedaunan hijau di sekitar cluster perumahan yang sunyi.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Han Na Eun berdiri dengan anggun di dekat panggangan BBQ (Gogi-gui) modern, mengenakan pakaian kasual rumahannya yang tetap terlihat berkelas. Beberapa asisten rumah tangga tampak membantunya menata piring-piring kecil berisi banchan (makanan pendamping), sayuran segar, dan irisan daging sapi premium di atas meja kayu panjang. Di seberangnya, Daehyun—adik iparnya yang baru saja mendarat dari New Zealand dua hari lalu setelah sebulan penuh berbulan madu dengan Seo Pyo duduk santai sambil memperhatikannya dengan senyum menggoda.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Di dalam </span><span class=\"c1 c8\">cluster</span><span class=\"c4 c1\"> mansion seluas itu, pagi ini terasa sangat lengang. Anggota keluarga yang lain telah berangkat dengan kesibukan aktivitas masing-masing, menyisakan Na Eun dan Daehyun yang menikmati pagi yang tenang. Setelah berbulan-bulan disibukkan dengan dinamika bisnis Na Group dan urusan domestik, Na Eun sengaja mengambil hari cuti demi menyambut adik ipar kesayangannya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menopang dagu, matanya mengerling jenaka memperhatikan Na Eun yang sedang membalik daging)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni... ini baru pukul sepuluh pagi dan kau sudah mengajakku makan daging seberat ini. Apa kau sedang mengidam sesuatu, Eonni?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, menggelengkan kepalanya mendengar godaan itu sembari memberi isyarat pelan kepada asisten rumah tangga bahwa ia bisa melanjutkan sisanya sendiri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, Daehyun-ah. Jangan mulai menggodaku. Aku hanya ingin kita mengobrol santai tanpa formalitas. Di rumah sebesar ini hanya ada kita berdua saja pagi ini, lalu untuk apa aku hanya duduk berdiam diri merenung di hari cutiku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh, mengambil selembar selada)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya juga, ya. Sejak aku memutuskan hiatus dari aktivitasku, aku juga merasa punya terlalu banyak waktu luang. Oh ya, omong-omong Eunjae di mana, Eonni? Aku sengaja membawakannya mainan wol khas dari New Zealand.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, binar keibuan terpancar jelas dari matanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Anak bungsu itu baru saja tidur beberapa menit yang lalu. Suster membantuku menidurkannya di kamar atas setelah dia puas menyusu, jadi sekarang kita benar-benar bisa bersantai menikmati daging ini dengan tenang.\"</span></p><h3 class=\"c9\" id=\"h.erckoe8qra0t\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c5 c1\">(Aroma gurih daging panggang mulai memenuhi udara. Na Eun dengan telaten meletakkan beberapa potong daging yang sudah matang sempurna ke atas piring Daehyun. Mereka berdua makan sambil bertukar cerita. Daehyun menceritakan dengan sangat antusias tentang petualangannya selama satu bulan penuh di New Zealand bersama Seo Pyo mulai dari pemandangan danau yang tenang hingga udara musim dingin yang membekukan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengunyah dagingnya dengan lahap, lalu tiba-tiba meletakkan sumpitnya dan menatap Na Eun dengan mata berbinar penasaran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi Eonni... dari tadi kita hanya terus-menerus membahas tentang rumah tanggaku dan bagaimana serunya bulan madu kami di sana. Aku sekarang justru penasaran dengan kalian.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangkat alisnya, menuangkan teh gandum hangat ke gelas Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Penasaran tentang apa? Rumah tanggaku dan Junwoo?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk mantap)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya! Bagaimana bisa kalian berdua selalu memiliki rumah tangga yang sewarm dan sehangat itu? Kau tahu, Eonni, kalian berdua itu seperti kompas penunjuk arah bagi rumah tangga kami di awal-awal pernikahan kemarin. Lagipula, kalian juga datang dari jalur perjodohan keluarga, kan? Apa Junwoo Oppa itu tipikal orang yang mengejarmu dengan agresif sejak awal?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika tertawa lepas, sebuah tawa tulus yang tidak pernah ia tunjukkan di depan media atau kolega bisnisnya. Ia meletakkan penjepit daging, lalu menyandarkan punggungnya di kursi kayu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau salah besar, Daehyun-ah. Kisah kami sama sekali tidak seperti itu. Dulu, kami berdua benar-benar orang asing yang saling tidak mengenal, bahkan kami tidak pernah menyangka sama sekali bisa berakhir berjodoh di pelaminan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memicingkan mata, semakin penasaran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh? Benarkah? Tapi konsepnya pasti mirip-mirip denganku dan Seo Pyo, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng pelan, tersenyum tipis mengingat masa lalu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sangat berbeda konsep denganmu dan Seo Pyo. Kalian berdua sudah memiliki keterikatan cinta yang kuat sejak awal sebelum memutuskan bersama. Sementara kami? Kami berdua memulainya dari titik nol. Benar-benar kosong tanpa perasaan apa pun.\"</span></p><h3 class=\"c9\" id=\"h.c7klbpyd1pax\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengernyitkan dahi, menopang dagunya dengan kedua tangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benarkah begitu? Kalau kalian dulu dijodohkan secara paksa dan memulainya dari titik kosong, rasanya tidak mungkin kalian bisa membangun fondasi pernikahan yang menjadi contoh luar biasa menyentuh untuk kami berdua sekarang. Pasti ada sesuatu di awal, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengambil napas dalam, pandangannya menerawang menembus riak air kolam renang, memanggil kembali memori tahun 2003 dan 2005 di SNU)</span></p><p class=\"c0\"><span class=\"c1\">\"Kau tahu, Daehyun-ah... kami memiliki </span><span class=\"c1 c8\">image</span><span class=\"c4 c1\"> yang sangat berbeda jauh saat di SNU dulu. Kami berada di jurusan yang berbeda. Park Junwoo... dia itu idola kampus. Dia sangat supel, memiliki sejuta teman di setiap sudut fakultas, dan begitu banyak mahasiswi yang menyukai serta mengaguminya karena kepribadiannya yang hangat.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu bagaimana denganmu, Eonni?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tertawa kecil, ada sedikit nada mencela diri sendiri namun terdengar santai)</span><span class=\"c1\"> \"Sebaliknya, aku adalah mahasiswi yang paling banyak tidak disukai di angkatan kami. Aku sangat kaku, perfeksionis, dan penuh dengan sifat individualisme saat kuliah dulu karena tuntutan keluarga. Aku tidak mengizinkan siapa pun mendekat atau membuang waktuku. Kami berdua memiliki </span><span class=\"c1 c8\">vibes</span><span class=\"c4 c1\"> yang bertolak belakang seperti bumi dan langit. Tapi kalau dipikir-pikir lagi sekarang, mungkin perbedaan kontras itulah yang membuat takdir kami jadi menarik hingga akhirnya kami menikah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap kakak iparnya dengan tatapan tidak percaya)</span></p><p class=\"c0\"><span class=\"c1\">\"Eonni bilang, kau dulu individualis dan kaku? Bagaimana bisa kau yang dulu seperti itu sekarang bisa berubah menjadi sehangat ini denganku? Bahkan, beberapa orang dan jajaran direksi di Na Group sekarang menganggapmu sebagai sosok </span><span class=\"c1 c8\">leader</span><span class=\"c4 c1\"> yang sangat hangat dan mengayomi.\"</span></p><h3 class=\"c9\" id=\"h.l79cvf339wkq\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c9\" id=\"h.usqf5mszychm\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menatap adik iparnya dengan kelembutan yang dalam. Tangannya bergerak merapikan beberapa piring yang sudah kosong, lalu kembali menatap Daehyun dengan senyuman penuh arti.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ceritanya sangat panjang, Daehyun-ah. Perubahan itu tidak terjadi dalam satu malam. Dan jika kau mendengar bagaimana kami berinteraksi di masa kuliah dulu, kau mungkin akan terkejut.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memajukan tubuhnya, matanya berbinar penuh rasa ingin tahu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Katakan padaku, Eonni! Aku ingin tahu kelanjutannya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggoda dengan nada jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa kau benar-benar serius mau mendengarnya? Hati-hati ya, ceritanya mungkin akan sangat membosankan karena ini sama sekali tidak seromantis atau seindah kisah cintamu yang penuh bunga dengan Seo Pyo.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merengut manja, lalu dengan cepat mengangkat tangan kanannya dan menunjukkan jari kelingkingnya di depan wajah Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, Eonni selalu saja begitu, suka merendah! Cepat ceritakan, aku berjanji akan mendengarkannya dengan sangat seksama dari awal sampai akhir!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">(Na Eun tertawa melihat tingkah jenaka adik iparnya itu. Ia menautkan jari kelingkingnya ke jari kelingking Daehyun, mengunci janji pagi itu sebelum ia mulai membuka kotak rekam memori lamanya tentang masa-masa kuliah di SNU tentang esai </span><span class=\"c1 c8\">Social Enterprise</span><span class=\"c4 c1\">, tentang secarik kertas berisi alamat email, dan tentang bagaimana seorang Park Junwoo mendefinisikan dirinya bukan sebagai penolakan, melainkan sebagai sebuah prioritas.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di bawah langit pagi Seoul tahun 2026 yang hangat, kepulan asap BBQ menjadi saksi bagaimana sebuah kisah masa lalu mulai diceritakan kembali. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c9\" id=\"h.t6utj6hp8ip9\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.q7lgwxzgwwi\"><span class=\"c7 c1 c6\">Lembaran Email dan Skeptisisme Organisasi (Kilas Balik - Tahun 2005)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Narasi Na Eun membawa ingatan kembali ke masa-masa sibuk menjelang Pekan Mahasiswa tahun 2005. Suasana ruang sekretariat Student Council tampak tegang. Kertas-kertas draf acara berserakan, dan beberapa pengurus senior mulai menunjukkan wajah frustasi di depan laptop mereka.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Di tengah kejaran </span><span class=\"c1 c8\">deadline</span><span class=\"c1\"> persiapan Pekan Mahasiswa yang tinggal menghitung hari, komunikasi antara Junwoo dan Na Eun hanya berbasis pada untaian pesan elektronik yang dinilai sangat lambat dan tidak praktis oleh pengurus organisasi lainnya. Bagi anak-anak </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\">, sikap Na Eun yang menolak bertemu langsung adalah bentuk keangkuhan yang nyata.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Min-ho:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mempat-mampatkan tumpukan proposal ke meja dengan kesal)</span></p><p class=\"c0\"><span class=\"c1\">\"Junwoo-ya, kita belum memastikan dia fix ikut atau tidak sebagai pembicara utama. </span><span class=\"c1 c8\">Deadline</span><span class=\"c4 c1\"> konfirmasi pembicara untuk cetak selebaran sudah tinggal beberapa hari lagi!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c3\">Ji-soo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyahut dari depan laptopnya dengan nada sinis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar, Junwoo-ya... kau tidak bisa terus-menerus mengandalkan Han Na Eun. Walaupun gagasan dan risetnya di mading itu memang bagus, kurasa dia sangat, sangat tidak kooperatif jika metodenya seperti ini. Dia sengaja membuat kita menunggu seolah-olah dia sangat dibutuhkan. Aku sungguh tidak suka dengan sikap acuhnya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghentikan ketikannya, mengangkat pandangan lalu menyela dengan suara baritonnya yang tenang namun tegas)</span></p><p class=\"c0\"><span class=\"c1\">\"Teman-teman, kita ini berada di dalam sebuah organisasi. Kita berkumpul untuk menyatukan kepala yang berbeda-beda, jadi kita tidak bisa menganggap semua kepala harus memiliki cara kerja yang sama. Aku melihat potensi yang sangat besar pada diri Na Eun untuk </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\">. Jika kali ini dia secara sukarela mau masuk dan menjadi pembicara, dia akan melihat esensi kita, dan itu bisa membuatnya menetap di organisasi ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Ji-soo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Masih tidak terima)</span></p><p class=\"c0\"><span class=\"c1\">\"Kenapa kau sangat bersikukuh dengan si angkuh itu, Junwoo? Dia benar-benar tidak menganggap eksistensi </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> ini ada sejak semester satu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, bersedekap)</span></p><p class=\"c0\"><span class=\"c1\">\"Ini masalah kontribusi, Teman-teman. Orang-orang idealis yang bergerak dengan data seperti Han Na Eun justru menjadi salah satu aset yang paling penting untuk organisasi ini agar tidak sekadar membuat acara hura-hura. Aku sudah membuat kesepakatan tertulis dengannya via email, dan aku yakin dia mau ikut Pekan Mahasiswa ini untuk mengisi </span><span class=\"c1 c8\">workshop</span><span class=\"c4 c1\"> bisnis.\"</span></p><h3 class=\"c9\" id=\"h.n9taxmx0vqgr\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di kamar Junwoo yang hangat. Hanya terdengar suara ketukan kibor laptop. Junwoo duduk memakai kacamata bacanya, menyegarkan halaman kotak masuk emailnya. Sebuah notifikasi baru dari alamat email Na Eun masuk.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di balik ketegangan ruang rapat siang tadi, Junwoo tahu persis tombol apa yang harus ia tekan untuk menggerakkan seorang Han Na Eun. Bukan dengan pesona personal, melainkan dengan tawaran berbasis data dan keberlanjutan riset yang bernilai nyata.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Pengirim:</span><span class=\"c4 c1\"> haneun.han@snumail.com</span></p><p class=\"c0\"><span class=\"c1 c6\">Kepada:</span><span class=\"c4 c1\"> junwoo.park@snumail.com</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Baiklah, saya bersedia menjadi pembicara untuk workshop Pekan Mahasiswa. Tawaran tentang sponsorship dan akses data untuk riset saya selanjutnya mengenai Social Enterprise sangat menarik. Anda memiliki idealisme yang sama dan juga menyajikan data yang akurat tentang para penyintas buruh daerah. Aku akan mengirimkan draf materiku segera.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo membaca baris demi baris email itu dengan binar mata yang puas. Ia segera mengetik balasan dengan cepat, mencoba membuka ruang komunikasi yang lebih kasual.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Pengirim:</span><span class=\"c4 c1\"> junwoo.park@snumail.com</span></p><p class=\"c0\"><span class=\"c1 c6\">Kepada:</span><span class=\"c4 c1\"> haneun.han@snumail.com</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Terima kasih atas kesediaannya, Han Na Eun-ssi. Bagaimana jika kita berdiskusi langsung untuk menyelaraskan waktu presentasi? Kalau kau keberatan jika hanya berdua denganku, kita bisa bersama-sama membahasnya dengan anggota pengurus lainnya di kafetaria supaya kau tidak merasa terbebani.</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hanya butuh waktu lima menit bagi Na Eun untuk membalas, memotong ruang negosiasi interpersonal itu dengan batasan yang sangat tebal.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Pengirim:</span><span class=\"c4 c1\"> haneun.han@snumail.com</span></p><p class=\"c0\"><span class=\"c5 c1\">Aku hanya bisa datang di hari H acara. Maaf, jadwal kuliahku sangat padat minggu ini, dan ada beberapa kepentingan mendesak yang harus aku selesaikan di SNU VALUE dan Enactus global.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menatap jawaban singkat, padat, dan dingin itu. Ia terkekeh rendah, mengagumi batasan profesional yang dibuat gadis itu. Ia hanya membalasnya dengan satu frasa singkat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Pengirim:</span><span class=\"c4 c1\"> junwoo.park@snumail.com</span></p><p class=\"c0\"><span class=\"c5 c1\">Baik, dimengerti. Terima kasih banyak.</span></p><h3 class=\"c9\" id=\"h.wwfntt7eq7y\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c9\" id=\"h.qb1z9t9ifs2h\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c5 c1\">(Keesokan harinya, setelah mata kuliah umum selesai di koridor Fakultas Ilmu Sosial. Beberapa anggota Student Council berjalan beriringan bersama Junwoo, namun mulut mereka tidak berhenti membicarakan Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Min-ho:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbicara setengah berbisik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia memang pintar, tidak ada yang meragukan otaknya di SNU. Tapi dia sama sekali tidak mau bersosialisasi dengan sesama mahasiswa angkatan. Benar-benar seperti robot.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Ji-soo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menimpali dengan bersungut-sungut)</span></p><p class=\"c0\"><span class=\"c1\">\"Benar! Dia sangat membatasi diri dari lingkungan luar. Bagaimana bisa </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> memiliki anggota sedingin dia? Apa gunanya kecerdasan kalau tidak punya empati untuk berbaur?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berhenti berjalan, membalikkan badannya menghadap teman-temannya untuk menenangkan suasana)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Teman-teman... ini adalah langkah awal kita untuk mengajak si idealis masuk ke lingkungan organisasi kita. Karakter orang itu berbeda-beda, jadi mohon bersabar dan berikan dia ruang, ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Min-ho:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyenggol bahu Junwoo, penasaran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi jujur saja, Junwoo-ya. Kau membujuknya dengan apa sehingga si angkuh yang sekaku gunung es itu akhirnya mau melonggarkan jadwalnya dan menjadi pembicara di acara kita?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merapikan tali tas ranselnya, lalu melempar senyum misterius yang hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tidak membujuk atau merayunya, Min-ho. Aku hanya memberikan apa yang benar-benar dia butuhkan untuk risetnya. Itu saja.\"</span></p><h3 class=\"c9\" id=\"h.s9dndm48jtq\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.ecwcqvlflicd\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke area kolam renang. Daehyun mendengarkan cerita itu dengan mulut sedikit terbuka, sangat terpesona dengan bagaimana awal mula interaksi dua orang di hadapannya ini terjalin.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa geli sambil menepuk tangannya)</span></p><p class=\"c0\"><span class=\"c1\">\"Wah... jadi Junwoo Oppa menjinakkan kedisiplinanmu bukan dengan kata-kata manis, melainkan dengan proposal data buruh dan </span><span class=\"c1 c8\">sponsorship</span><span class=\"c4 c1\"> riset? Luar biasa! Dia benar-benar tahu cara menghadapi seorang Han Na Eun sejak mahasiswa!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tersenyum, menyumpit sepotong daging panggang yang baru matang ke piring Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya, begitulah. Park Junwoo datang dengan isi kepala yang setara. Dia menghargai prinsipku, dan dari sanalah rekaman memori kami yang sebenarnya dimulai.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa geli sambil penasaran)</span></p><p class=\"c0\"><span class=\"c5 c1\">Lanjutkan eonni….</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><h3 class=\"c11\" id=\"h.p4jxz23z9jcr\"><span class=\"c7 c1 c6\">Sisi Lain di Balik Pintu Kamar (Kilas Balik - Tahun 2005)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di kamar Na Eun. Kamar yang luas, rapi, dominan warna netral, dan terkesan dingin. Di atas meja belajarnya, beberapa buku tebal tentang manajemen makro, jurnal ekonomi internasional, dan tumpukan draf materi workshop wirausaha berserakan. Na Eun sedang mengetik dengan serius di depan laptop.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Malam itu, di bawah temaram lampu meja kamarnya, Han Na Eun sedang menyusun materi </span><span class=\"c1 c8\">workshop</span><span class=\"c4 c1\"> wirausaha sosial dengan ketelitian seorang profesional. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Baginya, setiap slide presentasi harus memiliki dasar hukum, grafik valid, dan studi kasus yang tidak terbantahkan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Di tengah keheningan malam dan deru </span><span class=\"c1 c8\">deadline</span><span class=\"c4 c1\">, sebuah bunyi notifikasi email masuk memecah kesunyian. Lagi-lagi dari Park Junwoo.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Pengirim:</span><span class=\"c4 c1\"> junwoo.park@snumail.com</span></p><p class=\"c0\"><span class=\"c1 c6\">Kepada:</span><span class=\"c4 c1\"> haneun.han@snumail.com</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Han Na Eun-ssi, maaf mengganggu malam-malam. Ada informasi tambahan yang perlu kusampaikan. Workshop bisnis nanti ternyata tidak hanya dihadiri oleh mahasiswa lokal SNU, tetapi juga mahasiswa mancanegara (pertukaran pelajar) serta perwakilan dari beberapa universitas lain di Korea Selatan. Mengingat audiens yang cukup luas, jika nanti dalam penyampaian materi diperlukan pengantar atau sesi tanya jawab menggunakan bahasa Inggris, aku siap menjadi mediatormu di panggung untuk membantu agar kau tidak merasa terbebani. Bagaimana menurutmu?</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun membaca pesan itu tanpa mengubah ekspresi wajahnya. Tanpa ragu atau berpikir panjang, jemarinya mengetik balasan yang sangat singkat, padat, dan lugas.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Pengirim:</span><span class=\"c4 c1\"> haneun.han@snumail.com</span></p><p class=\"c0\"><span class=\"c5 c1\">Tidak masalah. Saya akan mengikuti semua prosedur yang ada. Terima kasih.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di rumah Junwoo, layar laptopnya memantulkan balasan email dari Na Eun. Junwoo yang sedang menyeduh kopi instan di kamarnya membaca pesan singkat itu, lalu spontan meledakkan tawa ringan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menggeleng-gelengkan kepala sambil tersenyum lebar menatap layar)</span><span class=\"c4 c1\"> \"Luar biasa dingin. Han Na Eun... kau benar-benar rekan angkatan yang unik.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Kembali ke kamar Na Eun. Setelah menekan tombol kirim, Na Eun menutup laptopnya. Wajah datarnya yang kaku perlahan mengendur karena ia akhirnya sendirian di dalam kamarnya ruang aman di mana mata-mata keluarga Han tidak bisa mengawasinya.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Setelah memastikan urusan kuliah dan organisasi selesai, Na Eun melakukan sebuah gestur yang sangat tidak biasa. Sesuatu yang tidak pernah dan tidak akan pernah ia tunjukkan di kampus, di depan teman jurusan, atau di mana pun. Ia meraih iPod klasiknya dari dalam laci, memasang </span><span class=\"c1 c8\">headset</span><span class=\"c4 c1\"> ke kedua telinganya, dan mulai memutar daftar lagu-lagu K-Pop favoritnya dari generasi emas.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">(Lagu berganti dari irama megah </span><span class=\"c1 c6\">\"Rising Sun\" oleh TVXQ</span><span class=\"c1\">, ketukan bertenaga </span><span class=\"c1 c6\">\"Twins (Knock Out)\" oleh Super Junior</span><span class=\"c1\">, ritme adiktif </span><span class=\"c1 c6\">\"Warning\" oleh SS501</span><span class=\"c1\">, hingga lirik puitis </span><span class=\"c1 c6\">\"Fly\" oleh Epik High</span><span class=\"c4 c1\">.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">(Na Eun memejamkan mata. Detik berikutnya, tubuhnya yang biasa tegak dan kaku mulai bergerak mengikuti ritme. Sambil merapikan lembaran kertas materi di atas meja, ia melenggak-lenggokkan badannya, menggerakkan jemarinya meniru koreografi grup idola yang dihafalnya diam-diam. Jiwa </span><span class=\"c1 c8\">performer</span><span class=\"c4 c1\"> profesional yang ia kubur hidup-hidup malam itu hidup kembali di dalam kesunyian kamarnya, menjadi satu-satunya pelarian dari tekanan dunia nyata.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Keesokan harinya. Suasana kampus utama SNU sangat sibuk dan padat. Spanduk besar \"Pekan Mahasiswa SNU 2005\" sedang dinaikkan di luar gedung. Di dalam aula utama, situasi luar biasa berisik. Mahasiswa panitia Student Council berlarian, saling berteriak mengoordinasikan kabel pengeras suara, tata panggung, dan pameran outdoor.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Min-ho:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berteriak di tengah kebisingan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya! Kabel audio di sisi kanan panggung kurang panjang! Di mana divisi perlengkapan?!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil memegang papan jalan panitia, berteriak kembali dengan tenang namun tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Gunakan kabel cadangan di gudang B, Min-ho! Ji-soo, bagaimana dengan dekorasi meja registrasi?!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di tengah kekacauan persiapan itu, Profesor Kang salah satu dosen senior Fakultas Ilmu Sosial berjalan masuk ke aula sambil membawa berkas. Ia melambaikan tangan memanggil Junwoo. Junwoo segera menghampirinya dan membungkuk hormat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Profesor Kang:</span><span class=\"c1\"> \"Park Junwoo. Aku sudah melihat pamflet final yang disebar panitia pagi ini. Akhirnya, </span><span class=\"c1 c8\">Student Council</span><span class=\"c1\"> periode ini berhasil mendapatkan pembicara yang sangat berbobot untuk </span><span class=\"c1 c8\">workshop</span><span class=\"c4 c1\"> bisnis.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum ramah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih, Pak. Apakah Bapak mengenal Han Na Eun secara pribadi?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Profesor Kang:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Terkekeh, membetulkan letak kacamata)</span><span class=\"c4 c1\"> \"Aku tidak mengenalnya secara personal, tapi aku tahu reputasinya. Dia adalah mahasiswi paling idealis seangkatan kalian yang kecerdasannya di atas rata-rata. Di jurusannya, dia terkenal karena tidak ragu beradu argumen secara tajam dengan beberapa dosen jika dasar teorinya kuat. Aku mendengarnya sendiri dari dekan Fakultas Bisnis bahwa anak itu tidak gampang tertarik dengan acara-acara kampus yang menurutnya tidak relevan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum bangga, sorot matanya penuh rasa hormat)</span><span class=\"c1\"> \"Untungnya, </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> memiliki visi dan tujuan yang sama dengan idealismenya kali ini, Pak. Jadi kami bisa meyakinkannya.\"</span></p><h3 class=\"c11 c25\" id=\"h.wi9znjemxw81\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c5 c1\">(Di luar koridor aula, beberapa mahasiswa berkerumun di depan poster besar wajah Han Na Eun sebagai pembicara utama. Terdengar bisik-bisik pro dan kontra dari mahasiswa yang lewat.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><ul class=\"c27 lst-kix_vcvhguehyw7g-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Mahasiswa A:</span><span class=\"c4 c1\"> \"Gila, Han Na Eun jadi pembicara? Dia kan terkenal sangat dingin dan penyendiri. Apa dia bisa bicara di depan ratusan orang?\"</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Mahasiswi B:</span><span class=\"c4 c1\"> \"Tapi riset gagasannya di mading kemarin sangat bagus. Aku penasaran bagaimana dia memaparkannya secara langsung.\"</span></li></ul><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Ji-soo berlari menghampiri Junwoo yang sedang memeriksa daftar kursi di dalam aula dengan wajah panik.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> \"Junwoo-ya! Banyak sekali mahasiswa yang membicarakan si idealis itu di luar gara-gara poster baru. Dan tebak apa? Pendaftaran kuota kursi untuk </span><span class=\"c1 c8\">workshop</span><span class=\"c1\"> bisnis sudah penuh total (</span><span class=\"c1 c8\">full seat</span><span class=\"c4 c1\">), padahal kita baru merilis posternya satu hari yang lalu! Bagaimana ini? Apa kita perlu menambah kuota kursi dan memperluas area aula?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tetap tenang, menggelengkan kepala dengan mantap)</span><span class=\"c1\"> \"Tidak perlu, Ji-soo. Tutup saja pendaftarannya sesuai batas awal. Aku sudah membagi alokasi kursi secara adil untuk perwakilan kampus lain dan beberapa mahasiswa asing SNU, jadi kita tidak bisa membuka tambahan </span><span class=\"c1 c8\">seat</span><span class=\"c4 c1\"> lagi demi kenyamanan diskusi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Min-ho:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Datang menyela sambil mengelap keringat di dahinya)</span><span class=\"c1\"> \"Tunggu dulu, Junwoo. Memangnya kau sudah melakukan </span><span class=\"c1 c8\">briefing</span><span class=\"c4 c1\"> langsung atau gladi resik dengannya? Dia itu pembicara utama kita, tapi sampai detik ini sama sekali batang hidungnya tidak terlihat di aula.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menatap panggung utama yang sudah rapi, lalu menoleh ke arah Min-ho dan Ji-soo sambil melempar senyuman penuh keyakinan)</span><span class=\"c4 c1\"> \"Tidak perlu melacak keberadaannya sekarang, Min-ho-ya. Han Na Eun adalah orang yang sangat berkompeten dengan apa yang dikerjakannya. Tanpa perlu kita arahkan, dia pasti tahu persis apa yang harus dia siapkan untuk panggungnya esok. Percayalah padanya.\"</span></p><h3 class=\"c11\" id=\"h.12iv41xgw645\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke area kolam renang mansion keluarga Han. Daehyun tertawa terpingkal-pingkal mendengar bagian cerita tentang iPod dan bagaimana Junwoo membelanya di depan panitia.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Sambil memegangi perutnya yang geli)</span><span class=\"c4 c1\"> \"Hahaha! Eonni, aku tidak bisa membayangkan kau mendengarkan lagu TVXQ dan Super Junior sambil menari di kamar setelah membalas email sedingin itu kepada calon suamimu! Dan Junwoo Oppa... dia benar-benar mempercayaimu seratus persen bahkan sebelum kalian bicara langsung di aula.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menunduk, tersenyum dengan rona merah tipis di pipinya yang jarang terlihat)</span><span class=\"c4 c1\"> \"Itulah kenapa kukatakan kisah kami tidak seromantis kisahmu, Daehyun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun: </span><span class=\"c4 c1\">Ahhh mulai lagi Eonni, kisah awalmu ini manis sekali (sambil tertawa) ayo lanjutkan lagi eon..</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.k1tey4k9ht33\"><span class=\"c7 c1 c6\">Pertemuan Pertama di Aula Utama (Kilas Balik - Tahun 2005)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana Aula Utama SNU pada Hari H Pekan Mahasiswa. Riuh rendah suara pengunjung pameran dan peserta workshop memenuhi koridor luar. Di dalam aula, anggota Student Council sibuk mondar-mandir memastikan mikrofon dan proyektor berfungsi. Tiba-tiba, pintu aula terbuka.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-06.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1\">(Han Na Eun melangkah masuk dengan mantap. Ia mengenakan pakaian formal yang rapi, memeluk sebuah laptop, dengan tatapan lurus yang menembus kesibukan ruangan. Langkah kakinya yang tegap langsung menyita perhatian panitia. Ia berjalan mendekati meja utama, di mana Presiden </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\">, Park Junwoo, sedang berdiri.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Untuk pertama kalinya sepanjang semester, Han Na Eun menginjakkan kakinya di ruang kerja </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> untuk menemui para pengurus dan presidennya secara langsung. Kehadirannya yang tiba-tiba sempat membuat atmosfer ruangan yang bising mendadak canggung.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Min-ho:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Sontak berdiri, melihat jam tangannya dengan heran)</span><span class=\"c4 c1\"> \"Selamat datang, Na Eun-ssi. Kami... ah, kami sudah menunggu kedatanganmu. Bahkan kau datang tiga puluh menit lebih awal dari jadwal yang disepakati.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Melangkah maju dengan senyuman hangatnya yang khas, mengulurkan tangan kanan untuk menyapa)</span><span class=\"c1\"> \"Terima kasih banyak, Na Eun-ssi, karena sudah meluangkan waktu dan mau berkontribusi untuk acara </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> kami.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> (Wajahnya tetap datar tanpa ekspresi, namun ia menerima uluran tangan Junwoo. Mereka berdua berjabat tangan erat untuk pertama kalinya) \"Aku belum melakukan apa pun untuk acara ini, jadi Anda tidak perlu merasa berterima kasih seperti itu. Aku sengaja datang lebih awal agar Anda dan panitia bisa meninjau ulang presentasiku terlebih dahulu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">(Na Eun melepas jabatannya, lalu menyodorkan sebuah </span><span class=\"c1 c8\">flashdisk</span><span class=\"c4 c1\"> perak dari saku blazer-nya kepada Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menerima flashdisk tersebut dengan anggukan menghargai)</span><span class=\"c4 c1\"> \"Baiklah, terima kasih. Tim operator akan segera meninjaunya di layar utama.\"</span></p><h3 class=\"c11 c25\" id=\"h.wvuh356ws1x1\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c5 c1\">(Junwoo, Min-ho, Ji-soo, dan beberapa anggota pengurus berkumpul di depan monitor operator untuk memeriksa dokumen presentasi milik Na Eun. Begitu file terbuka, keheningan kembali melanda.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Bergumam tidak percaya, matanya menatap tajam ke layar)</span><span class=\"c4 c1\"> \"Luar biasa... Ini sama sekali bukan lagi draf presentasi mahasiswa tingkat awal. Struktur diagramnya, analisis datanya... ini adalah konsep bisnis yang sudah sangat matang dan siap dipresentasikan di depan dewan direksi korporasi.\"</span></p><p class=\"c0\"><span class=\"c4 c1\">(Junwoo yang berdiri di samping Ji-soo hanya tersenyum tipis. Di dalam hatinya, tumbuh rasa kagum yang semakin tebal terhadap sosok gadis di hadapannya seorang mahasiswi yang tidak butuh banyak bicara atau pembuktian lewat kata-kata, namun selalu menunjukkan tindakan nyata yang masif.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menoleh ke arah Na Eun)</span><span class=\"c1\"> \"Na Eun-ssi, melihat struktur audiens di luar yang mulai dipenuhi mahasiswa asing, apakah nanti saat memaparkan materi kau bisa menggunakan presentasi dengan </span><span class=\"c1 c8\">full</span><span class=\"c4 c1\"> bahasa Inggris?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menatap Junwoo dengan tatapan tegasnya yang tak tergoyahkan)</span><span class=\"c1\"> \"Kenapa kita tidak menggunakan bahasa kita sendiri? Saya rasa, </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> SNU harus lebih bangga menggunakan bahasa Korea di atas panggung kita sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersentak, langsung memandang Junwoo dengan panik)</span><span class=\"c4 c1\"> \"Tapi... Junwoo-ssi, bagaimana dengan mahasiswa perwakilan dari universitas luar dan mancanegara yang tidak fasih bahasa kita?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Segera menyela, mengangkat tangan untuk menenangkan Ji-soo sambil menatap Na Eun dengan senyum setuju)</span><span class=\"c4 c1\"> \"Tidak apa-apa, Ji-soo. Apa yang dikatakan Na Eun-ssi sepenuhnya benar. Kita berada di institusi nasional, kita harus bangga dengan bahasa negara kita sendiri. Masalah audiens asing, biar aku yang mengatasinya nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Beberapa anggota panitia di belakang mulai berbisik-bisik, menyadari betapa Han Na Eun adalah sosok yang memegang teguh prinsipnya dengan sangat ker
