ss=\"c4 c1\">\"Tentu saja tidak apa-apa, Nyonya Han. Saya justru sangat berterima kasih jika Anda bersedia. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di sela jadwal praktek, sesekali saya pasti juga akan sering datang untuk ikut membantu mengurus Inna.\"</span></p><h3 class=\"c11\" id=\"h.96cyeda1bgju\"><span class=\"c7 c1 c6\">Pondasi yang Kokoh dan Kunci Hubungan</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur bergerak maju kembali ke masa sekarang [Tahun 2026], di dalam ruang spa VVIP. Sesi pemijatan kepala dan pundak telah selesai. Daehyun tampak menghembuskan napas panjang, tersihir oleh akhir cerita masa lalu kakak iparnya).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, Eonni... momen kelahiran Inna ternyata benar-benar sangat dramatis, ya. Apalagi saat itu kau harus menjalaninya dalam kondisi berjauhan lintas benua dengan Junwoo Oppa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, benar kan? Apalagi tepat sesudah melahirkan, aku langsung tinggal di rumah mertua. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jujur, di saat-saat kritis itulah seluruh kebutuhan dukungan emosional ku terpenuhi dengan sangat baik. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Bahkan, beberapa minggu kemudian saat Junwoo sempat pulang sebentar lalu harus kembali lagi bekerja ke Washington, aku sudah tidak secengeng sebelumnya, hahahha! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Itu semua karena Ibu mertuaku sangat telaten memberikan dukungan mental sebagai ibu baru. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Ya... walau cukup mengguncang di awal, tapi syukurlah tidak sampai mengalami </span><span class=\"c1 c8\">baby blues</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c1\">\"Betul, Eonni. Di fase transisi seperti itu, keberadaan </span><span class=\"c1 c8\">support system</span><span class=\"c4 c1\"> yang tepat memang sepenting itu... </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi, setelah masa cutimu habis, akhirnya Ibu (Nyonya Han) yang merawat Inna, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar sekali. Ibuku yang membantu merawat Inna sehari-hari dibantu beberapa asisten. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Makanya, tidak heran kan kalau sekarang sifat anak itu persis seperti siapa, hahaha!\" </span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c8\">(Na Eun merogoh ponselnya, membuka galeri foto, lalu menyodorkannya ke arah Daehyun)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lihat ini... sifat dan kepribadian Inna sekarang benar-benar cerminan dari Ayah dan Ibuku. Karena memang sejak kecil, sebagai cucu pertama di keluarga Han, seluruh perhatian penuh tercurah padanya.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun tersenyum kecil, menaruh kembali ponselnya).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, karena pengalaman berat itulah, Daehyun-ah, akhirnya aku dan Junwoo memutuskan untuk menjaga jarak kelahiran anak yang lumayan jauh. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jujur saja, aku sudah tidak mau lagi mengalami masa-masa mengandung hingga melahirkan tanpa ada kehadiran Junwoo di sampingku; itu rasanya sangat menyiksa. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jadi, sekarang kau tahu kan alasan kenapa jarak usia antara Inna ke Yoo Seo dan Eunjae lumayan jauh?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk-angguk paham)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Eonni... sebenarnya dulu aku sempat terpikir dan penasaran soal jarak usia mereka, hehehhe.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Setelah melahirkan Inna, fokus utamaku dan Junwoo memang mendidiknya dengan baik dulu, ya walaupun kasihan juga karena dia bisa dibilang sebagai 'produk </span><span class=\"c1 c8\">parenting</span><span class=\"c4 c1\">' uji coba pertama kita sebagai orang tua baru, hahaha. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di masa-masa itu, kami berdua masih sama-sama memaksimalkan karier sembari mengasuh Inna, sampai akhirnya posisi Junwoo bisa benar-benar menetap kembali di Korea karena mendapatkan jabatan baru sebagai Menteri Luar Negeri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun dengan pandangan penuh rasa kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Emm... iya ya, Eonni... Mendengar semua ini, sekarang aku jadi tahu kenapa pondasi rumah tangga kalian bisa terlihat begitu kokoh dan tidak tergoyahkan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kalian berdua sudah melewati banyak hal berat bersama-sama, bahkan sejak sebelum menikah hingga sesudahnya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jalan yang kalian lalui tidak mudah, tapi kalian berdua tetap kompak untuk saling berpegangan tangan. Aku benar-benar belajar banyak hal darimu dan Junwoo Oppa hari ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menepuk pundak Daehyun lembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, semua hal itu datangnya bertahap, Daehyun-ah. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi ada satu hal penting yang selalu ditekankan oleh Junwoo berulang kali kepadaku; bahwa kita sebagai pasangan suami istri harus tetap dan selalu menjaga komunikasi, sesulit atau seburuk apapun keadaannya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Komunikasi itulah yang membuatku bisa tetap kuat bertahan saat menjalani LDR panjang dengan dia dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tepat saat obrolan mendalam mereka selesai, pintu ruang spa diketuk perlahan oleh seorang staf spa, mengabarkan bahwa seluruh rangkaian treatment privat mereka telah selesai sepenuhnya).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri sambil meregangkan otot lehernya yang kini terasa sangat rileks)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, karena itu pula, Eonni... aku merasa diriku ini masih sangat-sangat pemula dalam urusan pernikahan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Bahkan kadang, aku masih sering merasa kurang percaya diri dalam menghadapi banyak hal baru.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut berdiri, merangkul pundak Daehyun dengan penuh kasih sayang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tenang saja, adik iparku sayang. Kau pasti akan belajar memahami semuanya secara bertahap nanti bersama Seo Pyo. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Yang penting kuncinya hanya satu: komunikasi kalian berdua harus selalu dijaga. Ingat itu, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun tersenyum manis penuh keyakinan, dan keduanya melangkah keluar dari ruangan dengan perasaan yang jauh lebih lega dan hangat).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">[BAB \"SUP RUMPUT LAUT &amp; TIGA GENERASI\" - SELESAI]</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Epilog", "html": "<p class=\"c10 title\" id=\"h.gx02v97bsaiu\"><span class=\"c23 c13\">Epilog</span></p><h2 class=\"c28\" id=\"h.xak8zqv0po7x\"><span class=\"c31 c13 c6 c32\">Before</span></h2><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-22.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-23.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h2 class=\"c28\" id=\"h.nmdjmcav26h4\"><span class=\"c31 c32 c13 c6\">After</span></h2><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-24.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-25.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-26.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p>"}];
let current=0;
const KEY="before-orbit-progress";

function renderList(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const box=document.getElementById("list"); box.innerHTML="";
 chapters.forEach((c,i)=>{
  if(q && !c.title.toLowerCase().includes(q) && !String(i+1).includes(q)) return;
  const b=document.createElement("button"); b.className="chapter";
  b.innerHTML='<div class="num">'+String(i+1).padStart(2,"0")+'</div><div class="ct"><b></b><small>Bab '+(i+1)+'</small></div><span>›</span>';
  b.querySelector("b").textContent=c.title; b.onclick=()=>openChapter(i);
  box.appendChild(b);
 });
}

function openChapter(i){
 current=Math.max(0,Math.min(chapters.length-1,i));
 localStorage.setItem(KEY,current);
 document.getElementById("home").classList.add("hidden");
 document.getElementById("reader").classList.add("active");
 document.getElementById("chapterNo").textContent="Bab "+(current+1);
 document.getElementById("chapterTitle").textContent=chapters[current].title;
 document.getElementById("text").innerHTML=chapters[current].html;
 document.getElementById("prev").disabled=current===0;
 document.getElementById("next").disabled=current===chapters.length-1;
 document.getElementById("text").style.fontSize=(localStorage.getItem("font")||20)+"px";
 window.scrollTo(0,0); updateProgress();
}

function changeChapter(d){openChapter(current+d)}
function showHome(){document.getElementById("reader").classList.remove("active");document.getElementById("home").classList.remove("hidden");window.scrollTo(0,0)}
function resume(){openChapter(Number(localStorage.getItem(KEY)||0))}
function toggleTheme(){const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";localStorage.setItem("theme",dark?"light":"dark")}
function toggleSettings(){document.getElementById("settings").classList.toggle("show")}
function setFont(v){document.getElementById("text").style.fontSize=v+"px";localStorage.setItem("font",v)}
function updateProgress(){document.getElementById("progress").style.width=((current+1)/chapters.length*100)+"%"}

window.addEventListener("scroll",()=>{
 if(!document.getElementById("reader").classList.contains("active")) return;
 const h=document.documentElement.scrollHeight-innerHeight;
 document.getElementById("progress").style.width=(h?Math.min(100,scrollY/h*100):100)+"%";
});
if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark";
document.getElementById("fontSize").value=localStorage.getItem("font")||20;
renderList();
</script>
