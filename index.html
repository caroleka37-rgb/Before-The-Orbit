as dan tanpa kompromi.)</span></p><h3 class=\"c11\" id=\"h.ndfkuw7galrl\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-07.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana Aula Utama beberapa jam kemudian. Ratusan kursi terisi penuh tanpa celah. Sorot lampu panggung berpusat pada Han Na Eun yang berdiri di balik podium, sementara Park Junwoo duduk di kursi samping panggung sebagai mediator acara.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Siang itu, sebuah presentasi bertajuk </span><span class=\"c1 c6\">\"Seni Menjual Nilai, Bukan Cuma Barang\"</span><span class=\"c4 c1\"> </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">disampaikan oleh Han Na Eun dengan begitu lugas dan dingin, namun sangat menghipnotis di atas panggung aula. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Penyampaian materinya begitu detail dan menyeluruh. Ia tidak hanya berbicara teori kosong; ia menyajikan contoh nyata hasil riset lapangannya di beberapa daerah terpencil di Korea Selatan, membedah bagaimana sebuah produk tidak lagi berbicara secara fungsi melainkan tentang nilai, serta menjelaskan dampak makro dan mikro terhadap pertumbuhan ekonomi masyarakat akar rumput.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Audiens mahasiswa lokal sibuk mencatat setiap poin di buku mereka, sementara Park Junwoo yang duduk di samping panggung memandangi layar presentasi dengan tatapan yang sangat terpukau oleh validitas data yang disajikan Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Sesi tanya jawab dimulai. Sesuai prediksi, beberapa mahasiswa asing dari program pertukaran pelajar mulai mengangkat tangan dan melayangkan pertanyaan menggunakan bahasa Inggris.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Thomas (Mahasiswa Asing):</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Na Eun-ssi, your research on localized social enterprise is fascinating. But how do you scale up this high-value model when the regional infrastructure itself is lacking? Won't the cost consume the values?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa jeda ragu, ia langsung menjawab dengan pelafalan bahasa Inggris yang sangat fluent dan tegas)</span></p><p class=\"c0\"><span class=\"c5 c1\">\"That is exactly why we don't start with physical infrastructure expansion, Thomas. We scale the human capital first. When you implement a micro-consignment model based on community trust, the value of the product cushions the initial distribution cost. It's about shifting the paradigm from charity to sustainable trade.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri, mengambil mikrofonnya untuk menjembatani audiens lokal sebagai mediator yang andal)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar sekali. Menambahkan apa yang disampaikan Na Eun-ssi, poin utamanya adalah pemberdayaan kapasitas manusianya terlebih dahulu, bukan langsung pada komersialisasi alat. Dengan begitu, ekonomi mikro di daerah tersebut bisa berjalan mandiri tanpa terus bergantung pada subsidi luar.\"</span></p><h3 class=\"c11 c25\" id=\"h.85ho75i296ht\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c1\">(Dua jam </span><span class=\"c1 c8\">workshop</span><span class=\"c1\"> yang padat akhirnya selesai. Seluruh penonton di aula mendadak sunyi sesaat, sebelum akhirnya meledakkan sorak-sorai dan tepuk tangan yang sangat meriah. Anggota </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> yang awalnya skeptis, kini berdiri di belakang panggung dengan tatapan mata yang dipenuhi pengakuan atas langkah konkret Han Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun merapikan berkasnya, lalu berjalan turun dari panggung berdampingan dengan Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menjabat tangan Na Eun lagi di balik panggung dengan binar mata yang tidak bisa berbohong)</span><span class=\"c4 c1\"> \"Na Eun-ssi, presentasimu tadi benar-benar luar biasa. Terima kasih banyak atas waktu, ilmu, dan kontribusinya yang luar biasa hari ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Membalas jabat tangan Junwoo sekilas sebelum melepaskannya)</span><span class=\"c4 c1\"> \"Sama-sama. Saya rasa itu hal yang biasa. Mungkin di lain waktu, ada orang lain di organisasi ini yang bisa memaparkannya jauh lebih baik dari saya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tertawa kecil, menggeleng)</span><span class=\"c1\"> \"Ahh, jangan merendah begitu. Kau yang terbaik hari ini. Na Eun-ssi... melihat bagaimana caramu berpikir tadi, aku benar-benar berharap kau mau mempertimbangkan untuk bergabung secara aktif di kepengurusan </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> bersamaku. Bagaimana?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Berhenti melangkah, menatap Junwoo datar selama beberapa detik)</span><span class=\"c4 c1\"> \"Akan kupikirkan jawabannya nanti. Aku permisi dulu karena ada kelas di Fakultas Bisnis setelah ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Na Eun membungkuk badan sekilas, lalu berbalik dan berjalan pergi meninggalkan area aula dengan langkah tegapnya yang sunyi.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menatap punggung Na Eun yang menjauh, lalu bergumam pelan pada dirinya sendiri dengan senyuman tipis)</span><span class=\"c4 c1\"> \"Dia... benar-benar perempuan yang sangat berbeda dan unik.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Ji-soo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Berjalan mendekati Junwoo sambil bersedekap, menatap ke arah perginya Na Eun)</span><span class=\"c4 c1\"> \"Dia memang luar biasa cerdas, Junwoo-ya. Tapi sayang sekali, dia benar-benar tidak suka bersosialisasi dengan baik. Sikapnya barusan... dia seperti mengabaikan sapaan anggota panitia lainnya yang ingin memberi selamat.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Min-ho:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar, dia seperti hidup di dalam dunianya sendiri yang tidak tersentuh orang lain.\"</span></p><h3 class=\"c11\" id=\"h.ohgwpm4hhxmp\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke area halaman belakang mansion keluarga Han. Sumpit di tangan Daehyun bergerak lambat, ia benar-benar hanyut dalam narasi masa lalu kakak iparnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menghela napas panjang, matanya berbinar kagum)</span><span class=\"c4 c1\"> \"Wow... jadi itu adalah momen pertama kalinya kalian berada di satu panggung? Luar biasa, Eonni. Di saat orang lain menganggapmu dingin dan mengabaikan mereka, Junwoo Oppa justru melihatnya sebagai keunikan dan integritas yang tinggi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum lembut, menatap cangkir teh gandumnya yang hangat)</span><span class=\"c4 c1\"> \"Benar. Orang-orang melihatku sebagai gunung es yang angkuh, tapi Park Junwoo adalah satu-satunya orang yang bersedia melihat melampaui es tersebut. Dia menghargai batasan yang kubuat, dan dia membalas kekakuanku dengan sebuah ruang aman yang penuh dengan rasa hormat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun meletakkan sumpitnya perlahan, menatap Na Eun dengan senyuman penuh arti setelah mendengar seluruh rangkaian cerita kilas balik tahun 2005.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum manis, menopang dagunya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Mendengar ceritamu tadi, Eonni... kupikir kalian sebenarnya sudah ditakdirkan bersama sejak awal mula melangkah di SNU. Hanya saja, saat itu kalian memang tidak menyadarinya karena terlalu sibuk dengan dunia masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Sebelum Na Eun sempat membalas ucapan Daehyun, terdengar langkah kaki terburu-buru dari arah koridor dalam rumah. Suster penjaga Eun Jae berjalan keluar menuju area kolam renang dengan wajah segan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Suster:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Permisi, Nyonya Han. Maaf mengganggu waktunya, tetapi Nona Kecil Eun Jae baru saja terbangun dari tidur siangnya dan mulai mencari Anda.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika berdiri dari kursinya dengan senyum keibuan)</span></p><p class=\"c0\"><span class=\"c1\">\"Ah, benarkah? Baik, Suster. Terima kasih informasinya.\" </span><span class=\"c1 c8\">(Menoleh ke arah Daehyun)</span><span class=\"c4 c1\"> \"Daehyun-ah, ayo kita ke atas. Kita lanjutkan mengobrol di kamar Eun Jae saja.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke kamar tidur Eun Jae di lantai dua. Kamar anak perempuan berusia 3 tahun yang sangat menggemaskan, dipenuhi dengan dekorasi warna pastel yang lembut, boneka, dan mainan wol khas New Zealand yang tadi dibawa oleh Daehyun. Eun Jae yang bermata bulat besar sedang duduk di tengah kasur sambil mengucek matanya yang masih mengantuk.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun dengan gemas langsung melangkah maju, mengangkat keponakan perempuannya yang lucu itu ke dalam gendongannya dengan sangat telaten. Eun Jae langsung menyandarkan kepalanya yang mungil di bahu Daehyun.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil menepuk-nepuk pelan punggung Eun Jae, menatap Na Eun yang sedang merapikan selimut)</span></p><p class=\"c0\"><span class=\"c1\">\"Melihat bagaimana kedinginan dan kakunya dirimu di masa lalu saat kuliah dulu, Eonni... aku jadi mendadak teringat pada suamiku sendiri, Seo Pyo. Dia dulu juga persis seperti itu kalau di depan orang lain.\" </span><span class=\"c5 c1\">(Tertawa kecil)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas mendengar perbandingan itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kita berdua memang mendapatkan satu paket karakter, Daehyun-ah. Kita yang awalnya sekaku gunung es ini pada akhirnya bisa meleleh juga, dan itu semua karena pasangan kita yang tahu persis bagaimana cara membuatnya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh sambil mencium pipi gembul Eun Jae untuk menghiburnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya benar sekali! Kalau diingat-ingat lagi masa kuliah di SNU dulu, anak-anak dari FISIP dan Fakultas Ekonomi memang terkenal paling kaku dan serius dengan teori-teorinya. Berbeda jauh dengan anak-anak dari jurusan seni peran sepertiku yang dunianya dinamis. Sangat jarang ada interaksi organik di antara kita dulu. Dan kau bersama Junwoo Oppa... kalian berdua benar-benar tumbuh di dua jurusan yang kaku di kampus.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa mendengar analisis adik iparnya, lalu menatap Daehyun dengan pandangan penuh harap)</span></p><p class=\"c0\"><span class=\"c1\">\"Kau mau tahu kelanjutan kisah kami setelah acara Pekan Mahasiswa itu tidak? Kebetulan sekali mulai besok Junwoo harus pergi ke luar negeri untuk kunjungan kerja selama dua hari. Aku dan anak-anak pasti akan merasa sedikit kesepian di rumah sebesar ini.\" </span><span class=\"c1 c8\">(Tersenyum misterius)</span><span class=\"c4 c1\"> </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana kalau malam ini kau menginap saja di sini? Tidurlah di kamarku. Biar aku yang menelepon dan membujuk Seo Pyo agar mengizinkanmu, Hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa terpingkal-pingkal mendengar ide nakal kakak iparnya, sambil terus menimang Eun Jae yang mulai tertawa melihat mereka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, Eonni ada-ada saja! Bujuk saja adikmu yang keras kepala itu terlebih dahulu. Kalau bujukanmu memang mempan dan dia memberikan izin, aku pasti akan langsung ikut menginap di sini bersamamu malam ini!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suara tawa kedua wanita itu memenuhi kamar lantai dua yang hangat, bersahutan dengan celotehan manja dari Eun Jae yang sibuk memainkan jari kelingking Daehyun.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">NARASI PENUTUP BAB:</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kotak memori tahun 2005 telah dibuka sebagian, memperlihatkan bahwa takdir tidak pernah salah memilih jalurnya. Bagi Han Na Eun, mengenang masa kuliah bukan lagi tentang mengingat beban berat ekspektasi keluarga, melainkan tentang menghargai setiap langkah kecil bagaimana seorang Park Junwoo perlahan-lahan mengetuk pintu dunianya yang tertutup rapat, bersiap untuk menceritakan babak berikutnya yang jauh lebih menantang.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Garis Hidup Masing-Masing", "html": "<p class=\"c10 title\" id=\"h.1xyqwgt8bhln\"><span class=\"c23 c13\">Garis Hidup Masing-Masing</span></p><h2 class=\"c20\" id=\"h.frk9k7h3vqrg\"><span class=\"c24 c1 c6\">BAB: GARIS HIDUP MASING-MASING</span></h2><p class=\"c0\"><span class=\"c3 c1\">Timeline: 2026 – Kediaman Keluarga Han, Seoul (Masa Sekarang)</span></p><h3 class=\"c11\" id=\"h.20ahxjigd63x\"><span class=\"c7 c1 c6\">Bagian 1: Suapan MPASI dan Tawa di Kamar Eun Jae</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana masih di dalam kamar tidur Eun Jae di lantai dua yang nyaman. Cahaya matahari siang menembus tirai tipis, memberikan kehangatan alami. Na Eun duduk di kursi kecil samping tempat tidur, memegang mangkuk porselen kecil berisi MPASI (Makanan Pendamping ASI) bertekstur lembut yang bergizi. Eun Jae duduk di high chair bayi, sesekali mengoceh dengan sisa-sisa kantuknya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di kamar itu, waktu seolah berjalan lebih lambat. Han Na Eun yang di luar sana dikenal sebagai eksekutif tangguh Na Cosmetic, kini menjelma menjadi seorang ibu yang luar biasa telaten. Tangannya dengan sabar mengarahkan sendok silikon kecil ke mulut Eun Jae, sementara Daehyun duduk di karpet bulu tepat di samping mereka, memperhatikan dengan mata berbinar-binar.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meniup perlahan bubur di sendok)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aaa... anak pintar, ayo buka mulutnya sedikit lagi, Eun Jae-ya. Sedikit lagi habis, setelah ini kita bisa bermain.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Eun Jae:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuka mulut kecilnya, mengunyah pelan, lalu bertepuk tangan riang hingga menyisakan sedikit bubur di pipinya)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa gemas melihat pipi gembul keponakannya)</span></p><p class=\"c0\"><span class=\"c1\">\"Aigoo, lihat cara dia mengunyah, Eonni! Menggemaskan sekali. Boleh aku mencoba menyuapinya? Aku ingin belajar, siapa tahu dalam waktu dekat aku juga membutuhkannya, kan?\" </span><span class=\"c5 c1\">(Mengedipkan mata jenaka)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa sambil menyerahkan sendok kecil itu kepada Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja boleh. Ini, pegang sendoknya perlahan. Jangan terlalu penuh, Eun Jae tidak suka jika suapannya terlalu besar.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menerima sendok dengan sangat hati-hati, seolah memegang barang pecah belah berharga)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eun Jae-ya, lihat Bibi Daehyun membawa pesawat terbang... wuuush... ayo buka mulutnya, Sayang. Aaa...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Eun Jae:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat Daehyun dengan mata bulatnya yang penasaran, lalu tertawa mengepakkan tangannya, membuat bubur di sendok sedikit berceceran di dagunya)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak panik dengan wajah jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah! Eonni, maaf! Pesawatnya mengalami sedikit turbulensi di dagu Eun Jae, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengambil tisu dengan tawa renyah, mengelap dagu anaknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Tidak apa-apa, Daehyun-ah. Itu namanya pendaratan darurat. Kau harus lebih tenang agar penumpang kecilmu ini mau bekerja sama.\"</span></p><h3 class=\"c11\" id=\"h.ya1ld4bo6ubq\"><span class=\"c7 c1 c6\">Bagian 2: Telepon dari Yuchiwon</span></h3><p class=\"c0\"><span class=\"c1 c8\">(Tiba-tiba, ponsel Na Eun yang berada di atas meja nakas bergetar nyaring. Layarnya menampilkan ID penelepon: </span><span class=\"c1 c6 c8\">\"Kindergarten (Yuchiwon) - Wali Kelas Park Yoo Seo\"</span><span class=\"c5 c1\">.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangkat jari telunjuknya sekilas)</span></p><p class=\"c0\"><span class=\"c1\">\"Sebentar, Daehyun-ah, ada telepon dari </span><span class=\"c1 c8\">Yuchiwon</span><span class=\"c1\">.\" </span><span class=\"c1 c8\">(Menekan tombol jawab)</span><span class=\"c4 c1\"> \"Ya, Halo, Selamat siang, Guru Kim.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Suara Guru TK (via Telepon):</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Ah, Selamat siang, Ibu Han. Maaf mengganggu waktunya. Kami hanya ingin mengonfirmasi bahwa kegiatan kelas luar ruangan hari ini sudah selesai lebih awal, dan sekitar tiga puluh menit lagi sudah memasuki jam pulang sekolah untuk kelompok Yoo Seo. Apakah hari ini Yoo Seo akan dijemput seperti biasa?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, ya, baiklah. Terima kasih banyak atas informasinya, Guru Kim. Saya sendiri yang akan datang menjemput Yoo Seo hari ini. Sampai jumpa di sekolah.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menutup telepon, lalu menoleh ke arah Daehyun sambil berdiri dari duduknya, memberikan instruksi cepat kepada asisten rumah tangga yang berjaga di dekat pintu untuk membereskan mangkok MPASI.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Daehyun-ah, setelah ini ikut aku ke sekolah Yoo Seo, yuk? Ini sudah waktunya jam pulang sekolah di </span><span class=\"c1 c8\">Yuchiwon</span><span class=\"c1\">. Tolong bantu aku bersiap-siap sebentar.\" </span><span class=\"c1 c8\">(Berbicara pada asisten)</span><span class=\"c4 c1\"> \"Bibi, tolong bersihkan tempat makan Eun Jae dan siapkan pakaian pergi serta tas perlengkapan untuk anak bungsu saya, ya. Kita akan membawanya sekalian.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya membelalak senang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wahhh! Kau sendiri yang menjemput Yoo Seo secara langsung, Eonni? Apa kita benar-benar akan membawa Eun Jae juga naik mobil?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lebar sambil merapikan rambutnya di depan cermin)</span></p><p class=\"c0\"><span class=\"c1\">\"Tentu saja. Mumpung aku sedang mengambil hari cuti, aku ingin menghabiskan waktu penuh dengan anak-anak. Oh ya, bicarakan soal pergi...\" </span><span class=\"c1 c8\">(Na Eun berbalik, meneliti pakaian yang dikenakan Daehyun dari atas sampai bawah)</span><span class=\"c4 c1\"> \"Kau tidak berniat berganti pakaian? Apa kau mau memakai salah satu pakaianku saja di lemari? Aku bisa menyuruh asisten rumah tangga untuk mempersiapkannya sekarang.\"</span></p><h3 class=\"c11\" id=\"h.2h3kgg9gyfo9\"><span class=\"c7 c1 c6\">Bagian 3: Penyamaran Terbaik Sang Aktris Papan Atas</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat ke bawah, memegang ujung blus santai yang dikenakannya sambil cemberut ringan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... kalau penampilanku seperti ini saja, apa tidak terlihat cukup kasual dan santai, Eonni? Menurutku ini sudah sangat biasa untuk ukuran keluar rumah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika menahan senyumnya, lalu meledakkan tawa lebar yang menggoda adiknya)</span></p><p class=\"c0\"><span class=\"c1\">\"Daehyun-ah, kau ini lupa atau bagaimana? Kau itu aktris yang sangat terkenal di seluruh penjuru Korea Selatan. Jika kau nekat berpakaian 'kasual biasa' seperti itu dalam keadaan menjemput ponakan di sekolah umum, coba bayangkan apa yang akan terjadi nanti? Apa jadinya jika kantor Humas-ku harus lembur hanya untuk mengurus </span><span class=\"c1 c8\">headline</span><span class=\"c4 c1\"> beritamu yang diserbu wartawan dan penggemar di depan gerbang sekolah? Hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa geli, menepuk dahinya sendiri karena menyadari kepolosannya)</span></p><p class=\"c0\"><span class=\"c1\">\"Ahhh... eonni selalu saja bisa menggodaku! Benar juga, ya. Kadang kalau sedang bersamamu, aku lupa dengan status pekerjaanku sendiri.\" </span><span class=\"c1 c8\">(Tersenyum manis, melambaikan tangan kepada Eun Jae)</span><span class=\"c4 c1\"> \"Baik, baik! Aku akan pulang ke rumahku sebentar di mansion sebelah. Aku akan menyiapkan penyamaran terbaikku. Aku ini sudah sangat ahli dalam urusan menyamar di tempat umum, hahahha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng-gelengkan kepala sambil tertawa lepas melihat tingkat percaya diri adik iparnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, Tuan Putri. Aku beri waktu lima belas menit. Jangan sampai terlambat, atau Yoo Seo akan cemberut di gerbang sekolah karena ibunya datang terlambat!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Siap! Aku segera kembali!\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun melangkah keluar kamar dengan riang menuju mansionnya yang terletak tepat di sebelah, sementara Na Eun kembali tersenyum menatap Eun Jae.)</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.tu1kqtuuk5uy\"><span class=\"c1 c6 c19\">Obrolan di Balik Kemudi (Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c1\">(Suasana di dalam mobil sedan mewah milik Na Eun. Na Eun fokus menyetir dengan santai membelah jalanan kompleks keluar dari </span><span class=\"c1 c8\">cluster</span><span class=\"c4 c1\"> perumahan mereka. Di kursi penumpang sampingnya, Daehyun yang sudah mengenakan penyamaran kasual terbaiknya topi baseball dan kacamata hitam yang diturunkan ke pangkal hidung sedang duduk sambil memangku Eun Jae. Bayi perempuan itu mulai memejamkan matanya, mengantuk lagi karena kekenyangan setelah menghabiskan MPASI-nya tadi.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c4 c1\"> (Sambil menepuk-nepuk pelan lengan Eun Jae, memastikan ponakannya tertidur nyaman, lalu menoleh ke arah Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni, aku benar-benar penasaran dengan kelanjutan ceritamu yang tadi. Setelah acara Pekan Mahasiswa tahun 2005 itu selesai, apakah ada lagi momen di mana kalian berdua tidak sengaja bertemu atau mengobrol?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> (Menyetir dengan tenang, tatapannya lurus ke jalanan depan) </span></p><p class=\"c0\"><span class=\"c1\">\"Belum ada, Daehyun-ah. Sejak hari itu, aku memutuskan untuk tetap pada prinsipku dan tidak bergabung dengan </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\">. Dan anehnya, Junwoo pun tidak pernah menanyakan alasanku lagi, baik lewat email ataupun saat kami berpapasan di koridor kampus. Aku rasa, dia adalah tipe pria yang sangat tahu dan menghargai batasanku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menaikkan alisnya, semakin penasaran)</span><span class=\"c4 c1\"> \"Lalu... apakah ada masa-masa di mana kalian, sebelum akhirnya saling bertemu dan menikah seperti sekarang, saat masih muda dulu pernah mengagumi atau menyukai seseorang? Hmm, kalian berdua ini sama-sama sangat menarik dalam bidang masing-masing. Tidak mungkin rasanya jika tidak ada satupun orang yang tertarik atau mencoba mendekati kalian.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> (Tersenyum tipis, sorot matanya perlahan menerawang jauh mengingat masa lalu) \"Hmm... masa muda kami itu sangat berbeda, Daehyun-ah. Apalagi aku. Setelah lulus dari SNU, kami berdua sama-sama melanjutkan hidup masing-masing ke jenjang yang lebih tinggi. Bahkan selama bertahun-tahun, kami tidak saling mengejar, tidak menyimpan rasa penasaran, atau sampai mencari tahu kabar satu sama lain. Kami benar-benar berjalan di atas garis hidup masing-masing.\"</span></p><h3 class=\"c11\" id=\"h.pzen47grmg3z\"><span class=\"c7 c1 c6\">Dinginnya Philadelphia (Kilas Balik - Tahun 2008)</span></h3><p class=\"c0\"><span class=\"c4 c1\">(Suasana perpustakaan Wharton School, University of Pennsylvania, Amerika Serikat. Suasananya sangat tenang, hanya terdengar gemerisik lembaran kertas buku tebal. Na Eun muda duduk di salah satu meja sudut, dikelilingi tumpukan buku teks tebal dan laptopnya, sedang menempuh studi Master of Business Administration (MBA).)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tahun 2008, di saat musim dingin mulai menyelimuti Philadelphia, Han Na Eun sepenuhnya menenggelamkan diri ke dalam dunia akademis dan ambisi bisnisnya. Baginya, tidak ada ruang untuk romansa, bahkan di hari kasih sayang sekalipun.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Seorang mahasiswa diaspora asal Korea Selatan bernama Youngjae berjalan mendekati meja Na Eun dengan langkah ragu-ragu. Ia tersenyum manis lalu menaruh sebuah kotak coklat premium tepat di dekat laptop Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> (Menengok sekilas, menyadari ada sesuatu benda asing yang disodorkan ke arahnya, lalu bertanya dengan nada datar) \"Apa ini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Youngjae:</span><span class=\"c4 c1\"> (Tersenyum penuh harap) \"Cokelat untukmu, Na Eun-ya. Kau tahu kan kalau hari ini adalah hari Valentine? Aku sengaja ingin memberikannya khusus untukmu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> (Tanpa menyentuh kotak tersebut, langsung mengalihkan pandangannya kembali ke layar laptop) \"Simpan saja coklat itu untuk wanita lain. Aku tidak membutuhkannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Mendengar penolakan yang begitu dingin dan telak, senyum Youngjae seketika luntur. Ia langsung berbalik badan dengan lesu membawa kembali coklatnya. Di sudut meja perpustakaan yang agak jauh, beberapa mahasiswa diaspora Korea lainnya sudah memperhatikan sejak tadi.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><ul class=\"c27 lst-kix_w22egluine21-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Mahasiswa A:</span><span class=\"c4 c1\"> (Berbisik setengah tertawa saat Youngjae kembali) \"Sudah kuduga! Kau pasti akan ditolak mentah-mentah jika mendekatinya. Dia itu terkenal sebagai gunung es di Wharton, kau tidak akan bisa menaklukannya dengan mudah.\"</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Mahasiswa B:</span><span class=\"c4 c1\"> \"Sudahlah, Youngjae-ya. Kejar wanita lain saja, Han Na Eun sama sekali tidak cocok untuk pria biasa seperti kita.\"</span></li></ul><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Youngjae hanya bisa menghela napas, menatap nanar ke arah Na Eun yang sama sekali tidak menoleh lagi ke belakang, kembali fokus pada buku-bukunya seolah kehadirannya tadi tidak pernah ada.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-08.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><h3 class=\"c11\" id=\"h.2m0s22i6h91u\"><span class=\"c7 c1 c6\">Hangatnya Oxford dan Batasan yang Halus (Kilas Balik - Tahun 2008)</span></h3><p class=\"c0\"><span class=\"c4 c1\">(Suasana berpindah ke belahan bumi lainnya. Area taman publik di sekitar University of Oxford, Inggris. Cuacanya sejuk dengan latar belakang bangunan bergaya gotik yang megah. Park Junwoo muda sedang duduk berkumpul di bangku taman bersama sekelompok mahasiswa diaspora Korea. Ia sedang menempuh studi Master of Arts in International Law.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sementara itu, di waktu yang sama namun di belahan bumi yang berbeda, Park Junwoo menjalani kehidupan S2-nya di Inggris dengan karakteristik yang bertolak belakang. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sebagai ketua perkumpulan diaspora mahasiswa Korea di Oxford, pesonanya yang hangat, supel, dan kharismatik membuatnya selalu menjadi pusat perhatian.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Seorang mahasiswi diaspora bernama Hanna duduk menggeser posisinya agar lebih dekat di sebelah Junwoo, sambil menyodorkan sebuah berkas laporan dengan senyum manis.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Hanna:</span><span class=\"c4 c1\"> \"Junwoo Oppa, aku baru saja menyelesaikan beberapa riset yang sangat menarik untuk kebutuhan proyek kelompok kita.\" (Hanna berbicara dengan nada manja, sengaja memajukan tubuhnya bersandar lebih dekat)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c4 c1\"> (Menyadari gerakan Hanna yang terlalu dekat, dengan gerakan yang sangat halus dan sopan ia menggeser sedikit posisi duduknya memberi jarak, lalu tersenyum ramah) \"Baik, Hanna. Terima kasih atas kerja kerasnya, aku akan melihat dan meninjau dulu data yang kau berikan ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Beberapa mahasiswa diaspora lainnya yang duduk melingkar di sana langsung saling bertukar pandang dan berbisik-bisik. Mereka semua tahu kalau Hanna menaruh hati pada Junwoo, dan bukan rahasia lagi kalau banyak mahasiswi lain yang selalu berebut ingin berada di kelompok yang sama dengan Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Hanna:</span><span class=\"c1\"> (Mencoba peruntungannya lagi, menatap mata Junwoo) \"Oh ya, Junwoo Oppa... </span><span class=\"c1 c8\">weekend</span><span class=\"c4 c1\"> ini apakah kau sibuk? Jika tidak, bagaimana kalau kita pergi ke Primrose Hill bersama sambil membaca beberapa buku?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c4 c1\"> (Mendengar ajakan tersebut, Junwoo yang peka langsung menangkap sinyal bahwa Hanna memiliki perasaan khusus yang lebih dari sekadar teman. Ia tersenyum hangat, menolak dengan cara yang sangat elegan agar tidak menyakiti hati gadis itu) </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Hanna-ya... maaf sekali aku belum bisa ikut. Agenda kegiatanku untuk akhir pekan ini kebetulan sudah cukup padat. Lain kali, kita semua bisa pergi bersama-sama dengan anggota diaspora yang lainnya agar lebih ramai.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Mendengar jawaban diplomatis tersebut, Hanna tersenyum kecut dan langsung menyadari bahwa Junwoo secara halus sedang menegaskan bahwa dirinya belum membutuhkan seorang kekasih. Setelah Junwoo pamit berdiri untuk merapikan tasnya, teman-teman prianya langsung menyenggol bahunya sambil mengejek.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Min-woo (Teman S2):</span><span class=\"c4 c1\"> \"Kau ini benar-benar menyia-nyiakan Kim Hanna, Junwoo-ya! Dia itu tidak cuma pintar, tapi juga sangat manis. Bagaimana bisa kau sama sekali tidak tertarik padanya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Junwoo:</span><span class=\"c4 c1\"> (Hanya tertawa ringan sambil menyampirkan tas ranselnya) \"Sudahlah, Teman-teman, jangan mulai menggoda lagi. Aku masih ada kelas lain yang harus kuhadiri setelah ini.\" </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">(Junwoo melambaikan tangannya dengan ramah lalu berlalu pergi meninggalkan tempat tongkrongannya)</span></p><h3 class=\"c11\" id=\"h.vuvz60j2j43m\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam mobil sedan. Mobil Na Eun perlahan melambat karena lampu merah di persimpangan jalan menuju sekolah Yoo Seo.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c4 c1\"> (Tertawa geli mendengarkan cerita kontras tersebut) \"Hahaha! Jadi yang satu sibuk menolak coklat Valentine dengan wajah datar di Amerika, sementara yang satu lagi sibuk menolak ajakan kencan secara halus di Inggris? Benar-benar luar biasa. </span></p><p class=\"c0\"><span class=\"c4 c1\">Garis hidup kalian saat itu seperti dua rel kereta yang berjalan sejajar melintasi benua, ya Eonni.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> (Ikut tersenyum geli, melirik Eun Jae yang kini sudah tertidur pulas di pangkuan Daehyun) \"Benar. Kami tidak saling mencari, karena saat itu fokus kami adalah menyelesaikan apa yang ada di depan mata. Kami tidak pernah tahu kalau pada akhirnya, setelah melewati benua dan waktu yang panjang, garis hidup yang terpisah itu akan dipaksa berpotongan di satu titik yang sama.\"</span></p><h3 class=\"c11\" id=\"h.r18qm7ox2773\"><span class=\"c7 c1 c6\">Ambisi Disertasi dan Dua Jalur S3 (Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di dalam mobil masih santai. Jalanan menuju sekolah Yoo Seo mulai agak padat merayap dengan mobil-mobil jemputan lainnya. Na Eun memutar kemudi dengan tenang sembari melirik Daehyun yang mendengarkan dengan antusias.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> \"Bahkan saat kami melanjutkan ke jenjang S3, garis hidup kami masih tetap menetap di benua masing-masing. Aku tetap memilih bertahan di Amerika Serikat, mengambil program </span><span class=\"c1 c8\">Doctor of Philosophy in Business Strategic Management</span><span class=\"c1\"> di Harvard University. Dan Junwoo, dia melanjutkan studi </span><span class=\"c1 c8\">Doctor of Philosophy in International Relations</span><span class=\"c4 c1\"> di University of Cambridge, Inggris.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mata membelalak kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wow... Harvard dan Cambridge? Kalian benar-benar couple akademis, Eonni! Lalu, apa yang kalian fokuskan saat menempuh gelar doktor di kampus itu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum tipis mengingat masa-masa melelahkan itu)</span><span class=\"c1\"> \"Saat S3, aku tidak hanya belajar teori. Aku sudah mulai fokus mengembangkan cikal bakal </span><span class=\"c1 c8\">Na Cosmetic</span><span class=\"c1\">. Tentu saja saat itu namanya belum menjadi </span><span class=\"c1 c8\">Na</span><span class=\"c1\"> karena belum diakuisisi oleh investasi </span><span class=\"c1 c8\">Na Group</span><span class=\"c1\">. Merek awal yang kubangun bernama </span><span class=\"c1 c8\">Florentina</span><span class=\"c4 c1\">, dan tiruan formula kosmetik berbahan organik di dalamnya kujadikan sebagai salah satu bahan riset utama serta disertasi doktorku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c1 c8\">(Mengangguk-angguk kagum)</span><span class=\"c4 c1\"> \"Lalu bagaimana dengan Junwoo Oppa? Apa disertasinya di Cambridge?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> \"Tidak, bidangnya sangat linier dengan hubungan internasional. Kalau tidak salah ingat, Junwoo mengambil disertasi tentang pengembangan sosial pasca Perang Korea dan pemulihan taraf kehidupan masyarakat kelas bawah. Riset lapangannya dilakukan dengan bekerja sama langsung bersama beberapa LSM internasional, serta panti jompo yang dikelola oleh yayasan kemanusiaan milik keluarganya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Mata berbinar-binar, menatap Na Eun dengan senyum geli)</span><span class=\"c4 c1\"> \"Wah, wah... dengar ini, Eonni. Menurutku kisah kalian ini justru sangat romantis dengan caranya sendiri. Walaupun kalian berdua sama sekali belum bertemu atau saling menyapa saat itu, tetapi apa yang kalian lakukan di Harvard dan Cambridge adalah tentang bertumbuh bersama menjadi versi terbaik dari diri kalian masing-masing sebelum akhirnya dipersatukan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c33\" id=\"h.8kfeu8vetv2h\"><span class=\"c7 c13 c6\">Bagian 9: Gerbang Yuchiwon dan Rencana \"Ngafe\" Rahasia</span></h3><p class=\"c21\"><span class=\"c6\">Na Eun:</span><span> </span><span class=\"c8\">(Tertawa renyah mendengar kesimpulan adik iparnya)</span><span> \"Kau ini bisa saja mencocokkan semuanya agar terdengar romantis, Daehyun-ah. Kau mau mendengar cerita kelanjutannya lebih banyak lagi kah?\" </span><span class=\"c8\">(Melirik sekilas ke arah navigasi mobil)</span><span> \"...Tapi, lihat ke depan, kita sudah sangat dekat dengan sekolah </span><span class=\"c8\">Yuchiwon</span><span class=\"c4 c13\"> Yoo Seo.\"</span></p><p class=\"c21\"><span class=\"c6\">Daehyun:</span><span class=\"c4 c13\"> \"Ah, benar juga. Waktunya cepat sekali berlalu kalau sedang mengobrol.\"</span></p><p class=\"c21\"><span class=\"c6\">Na Eun:</span><span> \"Bagaimana kalau setelah menjemput Yoo Seo, kita pergi </span><span class=\"c8\">ngafe</span><span class=\"c4 c13\"> saja sebentar? Aku akan memesan tempat khusus di kafe milik temanku yang tidak jauh dari sini. Kau tidak perlu khawatir, keamanan dan privasi di sana sangat terjaga ketat, jadi aman untukmu dari kejaran paparazzi.\"</span></p><p class=\"c21\"><span class=\"c6\">Daehyun:</span><span> </span><span class=\"c8\">(Tersenyum lebar di balik kacamata hitamnya)</span><span class=\"c4 c13\"> \"Ah, tentu saja aku mau, Eonni! Aku sangat tidak sabar mendengar kelanjutan ceritanya. Oh ya, mobilnya sudah mau berhenti, apakah aku perlu ikut turun ke gerbang sekolah untuk membantumu?\"</span></p><p class=\"c21\"><span class=\"c6\">Na Eun:</span><span> </span><span class=\"c8\">(Menggelengkan kepala sambil tersenyum hangat, perlahan memarkirkan mobilnya di area jemputan sekolah)</span><span class=\"c4 c13\"> \"Tidak perlu, Daehyun-ah. Biar aku saja yang turun untuk menjemput Yoo Seo ke dalam. Kau tetaplah di dalam mobil bersama Eun Jae-ku saja. Lihatlah, dia sudah tertidur dengan sangat nyaman dan nyenyak di pangkuanmu. Jangan sampai dia terbangun karena gerakan mendadak.\"</span></p><p class=\"c21\"><span class=\"c6\">Daehyun:</span><span> </span><span class=\"c8\">(Melihat ke bawah, menepuk pelan kaki Eun Jae yang terlelap)</span><span class=\"c4 c13\"> \"Baiklah kalau begitu, Eonni. Sampaikan salamku pada keponakan jagoanku, ya! Jangan lama-lama, aku menunggu kelanjutan ceritanya!\"</span></p><p class=\"c0\"><span>(Na Eun mengangguk, mengambil tas kecilnya, lalu membuka pintu mobil dan melangkah anggun menuju gerbang Yuchiwon untuk menjemput anak laki-laki keduanya, meninggalkan Daehyun yang tersenyum menjaga sang bayi di dalam kehangatan mobil.)</span></p><h3 class=\"c11\" id=\"h.bng1hwmlthvc\"><span class=\"c7 c1 c6\">Keceriaan di Kafe dan Tiga Karakter Anak (Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di dalam ruangan privat sebuah kafe estetik yang tenang dan memiliki pengamanan ketat. Di atas meja, beberapa cangkir minuman dan camilan pesanan telah disajikan. Eun Jae yang baru terbangun dari tidur singkatnya kini sudah kembali ke pelukan hangat Na Eun, sementara Park Yoo Seo (5 tahun) duduk di samping Daehyun, sibuk bercerita dengan gaya yang sangat menggemaskan sambil menggerakkan kedua tangan kecilnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bibi Daehyun! Tadi di sekolah, Yoo Seo berhasil menggambar robot besar yang bisa terbang! Robotnya punya sayap seperti pesawat yang tadi Bibi ceritakan pada Eun Jae!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, mencubit pelan pipi Yoo Seo karena gemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, benarkah? Hebat sekali jagoan Bibi ini! Berarti robotmu tidak akan mengalami turbulensi di dagu seperti pesawat Bibi tadi, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu tidak dong, Bibi! Robot Yoo Seo kan hebat, secantik Bibi Daehyun, Hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> (Mendengar celotehan anaknya sambil menyuapi Eun Jae minum, menggelengkan kepala sambil tersenyum lebar) </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lihatlah, Daehyun-ah. Anak ini terus-menerus menggodamu. Sifat Yoo Seo ini benar-benar menuruni ayahnya, Park Junwoo. Dia sangat supel, ramah, dan pandai berbicara dengan orang lain. Bahkan, setiap kali kuajak dia mampir ke kantor, dia sering sengaja membawa sekantong permen untuk dibagi-bagikan kepada para staf.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c1\"> \"Sifat ramahnya sudah sangat terlihat, Eonni. Sejak pertama kali aku menginjakkan kaki sebagai menantu di keluarga Han, Yoo Seo ini adalah keponakan yang paling sering menyapa dan menggodaku dengan ceria. Oh ya, Yoo Seo-ya... Bibi membawakan sesuatu oleh-oleh khusus dari New Zealand kemarin. Nanti setelah sampai di rumah, kau bagi dengan kakak perempuanmu, Inna </span><span class=\"c1 c8\">Eonni</span><span class=\"c4 c1\">, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Yoo Seo:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Matanya berbinar, melompat kecil di kursi)</span><span class=\"c4 c1\"> \"Wah, asyik! Terima kasih, Bibi Daehyun yang cantik! Hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas melihat tingkah putranya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tuh, kan. Dia memang sangat senang menggoda orang lain. Bahkan kakaknya, Inna, sering dibuat kesal oleh tingkat kejahilan Yoo Seo ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c4 c1\"> \"Tapi kalau kuperhatikan, Inna itu tipikal anak yang pendiam ya, Eonni. Dia terlihat sangat anggun, bahkan terkadang dia masih tampak segan dan pemalu jika berbicara denganku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> \"Benar, sifat Inna itu sangat mirip dengan Ayah dan Ibuku kaku dan penuh tata krama (sambil tersenyum). Tapi kalau dipikir-pikir lagi, sebenarnya dia memiliki kemiripan yang sangat besar denganku di masa lalu. Dingin di luar, tapi sebenarnya mengamati segalanya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum tulus, menopang dagunya di atas meja)</span><span class=\"c4 c1\"> \"Kau memiliki mereka yang sangat menarik dan mewarnai hidupmu sekarang, Eonni. Pernikahanmu benar-benar terasa lengkap. Ayo, lanjutkan lagi ceritanya yang tadi. Aku sudah tidak sabar.\"</span></p><h3 class=\"c11\" id=\"h.1bfvnt71i2ky\"><span class=\"c7 c1 c6\">Tekanan dari Meja Makan Keluarga Han (Kilas Balik - Tahun 2010)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke masa lalu. Ruang makan mewah di kediaman utama keluarga Han di Seoul, tahun 2010. Suasana makan malam terasa sangat tegang. Nyonya Han duduk dengan tegak, menatap Na Eun muda yang baru saja kembali ke Seoul di masa-masa akhir penyelesaian S3-nya dari Harvard.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Nyonya Han:</span><span class=\"c1\"> \"Na Eun-ah, Ibu mau mengenalkan seseorang yang sangat baik denganmu. Akhir pekan ini kau harus datang ke acara </span><span class=\"c1 c8\">blind date</span><span class=\"c4 c1\"> yang sudah Ibu atur. Dia pasti akan sangat cocok denganmu karena dia adalah putra dari pemilik perusahaan telekomunikasi terkemuka di Korea.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Meletakkan sendoknya dengan pelan, menatap ibunya datar)</span><span class=\"c4 c1\"> \"Ibu, pendidikan S3 saya di Harvard bahkan belum sepenuhnya selesai. Kenapa Ibu harus repot-repot memperkenalkan aku dengan laki-laki di saat seperti ini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Nyonya Han:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menghela napas panjang dengan nada menuntut)</span><span class=\"c4 c1\"> \"Kau ini selalu saja membantah ucapan Ibu! Sudah tujuh kali, Na Eun-ah, putra-putra dari kolega Ibu kau tolak begitu saja tanpa alasan yang jelas! Apa kau sebenarnya sudah memiliki incaran laki-laki khusus di luar sana sehingga kau terus-menerus menolak semua orang yang Ibu tawarkan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> \"Tidak ada. Aku hanya belum mau memikirkan tentang pernikahan, itu saja. Aku sama sekali tidak tertarik dengan </span><span class=\"c1 c8\">blind date</span><span class=\"c4 c1\"> atau perjodohan apa pun.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Tuan Han:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menaruh gelas anggurnya ke meja dengan ketukan berat, suaranya terdengar tegas dan mutlak)</span><span class=\"c4 c1\"> \"Han Na Eun, dengarkan kami. Kau harus tetap pergi menemui putra dari keluarga Jung itu. Ini adalah permintaan langsung dari Ayah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Melihat sang ayah sudah mengeluarkan suara tegasnya yang penuh kuasa, Na Eun muda seketika tidak berdaya. Di dalam lingkaran keluarga Han, menolak perintah mutlak sang kepala keluarga adalah hal yang mustahil dilakukan jika ia masih ingin mempertahankan proyek bisnis mandirinya. Dengan berat hati, ia terpaksa menuruti kemauan mereka.</span></p><h3 class=\"c11\" id=\"h.jiymxpg2spxb\"><span class=\"c7 c1 c6\">Blind Date di Tepi Sungai Han</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di dalam restoran mewah berlantai kaca dengan pemandangan langsung ke arah Sungai Han yang berkilauan oleh lampu kota malam hari. Na Eun duduk berhadapan dengan Jung Wangso, seorang penerus tahta bisnis telekomunikasi. Wangso memiliki postur tubuh yang ideal, berpakaian desainer ternama, dan memiliki visual yang sangat tampan serta populer pada masanya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Jung Wangso:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum sangat manis, memotong daging steak-nya dengan elegan)</span><span class=\"c4 c1\"> \"Na Eun-ah... apakah kau cocok dengan rasa makanan di restoran pilihanku ini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menjawab singkat tanpa ekspresi, hanya mengaduk minumannya)</span><span class=\"c4 c1\"> \"Lumayan...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Wangso:</span><span class=\"c4 c1\"> \"Kudengar kau sedang menyelesaikan gelar doktormu. Kira-kira kurang berapa lama lagi sampai kau lulus? Ketika hari kelulusanmu tiba nanti, aku berencana akan langsung terbang ke Amerika untuk menjadi orang pertama yang berdiri di sana dan mengucapkan selamat untukmu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> \"Tidak perlu repot-repot. Kau kan pasti sangat sibuk dengan posisimu sebagai CEO di perusahaan telekomunikasi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Wangso:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Terkekeh percaya diri)</span><span class=\"c4 c1\"> \"Tidak juga, ada banyak bawahan berkompeten yang bisa membantu mengurus pekerjaanku. Oh ya, sehabis makan malam ini selesai, apakah kau berniat untuk jalan-jalan sebentar menikmati angin malam di tepi Sungai Han? Atau jika kau mau, kita bisa pergi ke Mall terdekat, aku ingin membelikan sesuatu yang berharga untukmu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> \"Tidak perlu, terima kasih. Setelah makan malam ini selesai, kita bisa langsung pulang ke rumah masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Wangso:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum lebar, menatap Na Eun dengan binar ketertarikan yang dalam)</span><span class=\"c4 c1\"> \"Ternyata apa yang dikatakan Ibuku itu benar. Kau memang wanita yang sangat dingin, Na Eun-ah. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi anehnya, aku justru sangat menyukai karaktermu itu. Jika kita menikah nanti, kau pasti akan menjadi sosok istri yang sangat tangguh. Kita berdua sama-sama berada di bidang bisnis, jadi ini adalah kombinasi yang sangat cocok untuk mengembangkan skala perusahaan kita bersama ke depannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Menatap Wangso lurus-lurus dengan tatapan sedingin es)</span><span class=\"c4 c1\"> \"Kita baru saja melakukan perkenalan beberapa menit yang lalu. Saya belum memikirkan hal apapun sampai sejauh itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Wangso:</span><span class=\"c4 c1\"> \"Tapi aku sudah memikirkannya dengan matang. Apa kau memang belum siap untuk menerimaku sebagai calon suamimu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> \"Iya... dan saya rasa, ini mungkin untuk terakhir kalinya kita perlu bertemu.\"</span></p><h3 class=\"c11\" id=\"h.40a0skk42fua\"><span class=\"c7 c1 c6\">Amarah di Ruang Tengah dan Pelarian Melalui iPod</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam harinya di ruang tengah kediaman utama keluarga Han. Begitu Na Eun melangkah masuk ke dalam rumah setelah menolak Wangso, ia langsung dihadang oleh amarah Tuan Han dan omelan beruntun dari ibunya yang tampak sangat murka.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Nyonya Han:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Berdiri dengan wajah memerah karena menahan malu)</span><span class=\"c4 c1\"> \"Calon pria seperti apa lagi yang sebenarnya kau cari di dunia ini, Han Na Eun?! Kenapa kau terus-menerus mempermalukan Ibu di depan kolega-kolega besar Ibu dengan penolakan mentah-mentahmu di antara putra-putra terbaik mereka?!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun tidak mengucapkan sepatah kata pun untuk membela diri. Dengan wajah datarnya yang menahan seluruh tekanan emosional, ia langsung berjalan cepat menaiki tangga dan berlari masuk ke dalam kamarnya, mengunci pintu rapat-rapat.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Di dalam kesunyian kamarnya yang luas, Na Eun menyandarkan tubuhnya di balik pintu yang tertutup. Untuk menenangkan detak jantungnya yang tidak beraturan akibat tuntutan tiada akhir dari kedua orang tuanya, ia meraih satu-satunya benda yang menjadi penyelamat jiwanya sejak masa kuliah. Ia memasang </span><span class=\"c1 c8\">headset</span><span class=\"c4 c1\"> iPod-nya ke telinga, memutar alunan musik K-Pop dengan volume tinggi hingga dunia luar yang bising sepenuhnya teredam sempurna di balik dinding kamarnya.</span></p><h3 class=\"c11\" id=\"h.fg4ipluizwg4\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan privat kafe. Daehyun mendengarkan dengan helaan napas berat, merasakan betapa sesaknya posisi Na Eun di masa lalu.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c4 c1\"> \"Ah... jadi kau sempat melewati tujuh kali perjodohan gagal sebelum akhirnya bertemu Junwoo Oppa? Tekanan dari keluarga dulu benar-benar mengerikan, Eonni.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, mengelus rambut Yoo Seo yang kini asyik memakan biskuitnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya, begitulah garis hidupku di tahun 2010. Penuh dengan penolakan karena aku tidak mau hanya menjadi alat investasi pernikahan bisnis orang tuaku dan memang aku juga putuskan, harus tertarik secara personal dengan calon suamiku . </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi di balik semua penolakan itu, aku tidak pernah menyangka kalau di tahun yang sama... Park Junwoo juga sedang menghadapi situasi pelik yang serupa di keluarganya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.y2a2rq7glnxz\"><span class=\"c7 c1 c6\">Kehangatan dan Candaan di Kediaman Park (Kilas Balik - Tahun 2010)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke ruang keluarga kediaman Park di Seoul, tahun 2010. Berbeda dengan atmosfer kaku keluarga Han, ruangan ini terasa sangat hangat. Alunan musik jazz instrumen terdengar lamat-lamat. Junwoo muda sedang duduk santai di sofa bersama kedua orang tuanya, tertawa lepas setelah menceritakan pengalamannya selama kuliah S3 di Cambridge.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum menggoda, menepuk pelan lutut putranya)</span></p><p class=\"c0\"><span class=\"c1\">\"Junwoo-ya... setelah Ibu dan Ayah dengar semua ceritamu yang seru tadi, ternyata selama bertahun-tahun di Inggris kau sama sekali tidak memiliki kekasih, ya?\" </span><span class=\"c5 c1\">(Menggoda dengan nada hangat yang khas)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa renyah, lalu bergerak merangkul pundak ibunya dengan manja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahh, Ibu... dugaanku pasti benar, nih. Ada sesuatu yang sedang Ibu sembunyikan dariku, kan? Hayo, ada rencana apa, Bu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh, mengelus lengan anaknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sebentar lagi kau akan lulus S3 di Cambridge, bahkan kau sudah mendapatkan tawaran resmi untuk menjadi diplomat muda negara kita. Ibu rasa, sudah saatnya nak kau mulai memikirkan untuk memiliki seorang pendamping hidup.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar penuturan ibunya, Junwoo terdiam sejenak. Ia melepaskan rangkulannya perlahan, menatap kedua orang tuanya dengan tatapan yang mendadak serius namun tetap lembut.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... aku memang belum memiliki kekasih sampai sekarang. Tapi untuk saat ini, aku benar-benar ingin fokus terlebih dahulu menyelesaikan disertasi dan memastikan kelulusanku di Cambridge berjalan lancar, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut melipat korannya, menatap putranya dengan bijak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Begini, Putraku. Ada seorang kolega dokter bedah, teman dekat ibumu, yang ingin sekali mengenalkan secara khusus putrinya padamu. Anak gadis itu adalah seorang diplomat juga. Dia memang belum resmi bertugas, tetapi dia merupakan lulusan berprestasi dari Monash University, Australia.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jika kau bersedia, dalam minggu ini kau bisa bertemu dengannya, Junwoo-ya. Tidak apa-apa, anggap saja ini hanya perkenalan santai biasa, tidak usah dijadikan beban.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sebagai seorang pria yang rasional dan pada dasarnya memang senang bersosialisasi serta membangun relasi baru, Junwoo tidak menemukan alasan untuk menolak. Ia mengiyakan permintaan orang tuanya. Di dalam benaknya, ia berpikir pertemuan ini mungkin akan menarik dan nyambung karena gadis bernama Im Dahye itu memiliki latar belakang pendidikan yang linier dengannya, yaitu Hubungan Internasional.</span></p><h3 class=\"c11\" id=\"h.5jzk93t0htyw\"><span class=\"c7 c1 c6\">Pertemuan Antar-Diplomat di Kafe Gangnam</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di sebuah kafe modern yang elegan di salah satu distrik Seoul. Junwoo duduk berhadapan dengan Im Dahye. Gadis itu berpenampilan modis, pembawaannya percaya diri, dan tipikal wanita kota yang ekspresif.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Im Dahye:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menopang dagu, menatap Junwoo dengan binar kekaguman yang jelas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya... aku benar-benar sangat kagum saat melihat seluruh pencapaian akademismu sampai ke jenjang S3 di Cambridge. Bahkan, kudengar dari teman-teman diaspora, dulu kau sangat populer dan menjadi bintang saat di SNU. Sayang sekali ya, aku sejak S1 sudah berada di Monash, jadi kita tidak sempat bertemu lebih awal.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum ramah, mengangguk menghargai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya. Terima kasih banyak atas pujiannya, Dahye-ssi. Kau juga sangat berbakat dan hebat karena bisa menyelesaikan studi Hubungan Internasional di Monash dengan hasil yang memuaskan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dahye:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum manis, mengeluarkan ponselnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ngomong-ngomong... karena pekan depan kita sudah harus kembali ke negara tempat kuliah kita masing-masing untuk urusan kelulusan, apakah boleh aku meminta nomor ponsel pribadimu? Supaya memudahkan komunikasi kita ke depannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sempat terdiam dan berpikir sejenak, menimbang batasan privasinya, namun akhirnya mengangguk sopan)</span></p><p class=\"c0\"><span class=\"c1\">\"Oh, tentu saja, tidak apa-apa.\" </span><span class=\"c5 c1\">(Junwoo menyebutkan nomor ponselnya)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dahye:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetik nomor itu dengan cepat, lalu menatap Junwoo dalam-dalam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku benar-benar berharap hubungan kita bisa berjalan lebih jauh dan lebih serius setelah pertemuan ini...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hanya terdiam, memberikan senyuman tipisnya yang ramah namun tidak memberikan kepastian apa pun)</span></p><h3 class=\"c11\" id=\"h.wa0wnwyvm91g\"><span class=\"c7 c1 c6\">Batasan yang Dilanggar dan Akhir Perjodohan</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, ekspektasi tidak selalu sejalan dengan realitas. Setelah berminggu-minggu berlalu sejak pertemuan di kafe itu, Im Dahye ternyata berubah menjadi tipikal wanita yang sangat posesif. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Ia selalu menuntut komunikasi tanpa henti, mengirimkan pesan beruntun, dan ingin mengetahui setiap detail jadwal harian Junwoo di Cambridge, seolah-olah mereka sudah terikat komitmen resmi.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana di kamar asrama Junwoo di Cambridge. Ponsel Junwoo di atas meja terus bergetar menampilkan puluhan pesan masuk dari Dahye di tengah-tengah kesibukannya mengetik draft final disertasi. Junwoo menghela napas panjang, memijat pelipisnya yang pening.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bergumam pelan, menggelengkan kepala)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ini sudah terlalu jauh... Hubungan seperti ini sama sekali tidak rasional.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sifat Dahye yang terlalu menuntut dan tidak bisa menghargai ruang pribadi itu akhirnya membuat Junwoo merasa sangat tidak nyaman dan kesal. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Menyadari bahwa hubungan ini tidak sehat untuk masa depannya, Junwoo mengambil keputusan tegas. Ia mengirimkan pesan permintaan maaf yang jujur kepada Dahye, lalu menelepon kedua orang tuanya di Seoul untuk menjelaskan secara dewasa bahwa ia tidak bisa melanjutkan perjodohan tersebut. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Beruntung, kedua orang tua Junwoo menerima keputusan itu dengan lapang dada tanpa kemarahan sedikit pun.</span></p><h3 class=\"c11\" id=\"h.bvxk51kqa7sc\"><span class=\"c7 c1 c6\">Dua Garis yang Masih Menunggu Waktu (Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan privat kafe di masa sekarang. Daehyun mendengarkan dengan senyum lebar, sesekali menyeruput minumannya sementara Yoo Seo sudah asyik bermain dengan mainan wolnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Jadi di tahun 2010 itu, Eonni sibuk melarikan diri dari omelan gara-gara menolak CEO sombong, sedangkan Junwoo Oppa di Inggris juga pusing menghadapi diplomat yang terlalu posesif? Lucu sekali kalau dibayangkan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tertawa pelan, menaruh cangkir tehnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar. Kami sama-sama terluka oleh ekspektasi orang lain, sama-sama mempertahankan prinsip, dan sama-sama mengunci diri dengan pikiran masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi setidaknya, dari semua penolakan itu, kalian berdua jadi tahu apa yang benar-benar kalian butuhkan dalam hidup, kan? Dan takdir sedang membersihkan jalan agar kalian tidak salah memilih orang sebelum akhirnya dipertemukan di waktu yang paling tepat.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap pemandangan di luar jendela kafe dengan binar mata yang hangat dan penuh rasa syukur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya... kau benar, Daehyun-ah. Kami harus melewati belahan bumi yang berbeda, ribuan lembar disertasi, dan beberapa orang yang salah, hanya untuk menyadari bahwa garis hidup yang kami jalani sejak tahun 2005 pada akhirnya memang dirancang untuk bermuara pada satu rumah yang sama.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.h6o9uztxyrjx\"><span class=\"c7 c1 c6\">Rahasia Cerdik Seo Pyo (Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana masih di dalam ruangan privat kafe yang tenang. Sesi cerita kilas balik tahun 2010 telah usai, meninggalkan senyum di wajah kedua wanita itu. Daehyun perlahan meletakkan cangkir tehnya, lalu menatap Na Eun dengan dahi berkerut, mendadak memikirkan sesuatu yang menggelitik rasa ingin tahunya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau dipikir-pikir dan dilihat dari cerita kita tadi... memang kalangan orang tua kita itu suka sekali ya menjodohkan anak-anaknya. Hmm, tapi berbicara tentang itu, apakah Seo Pyo dulu juga sempat sering dijodohkan seperti kalian, ya? Aku benar-benar belum sempat menanyakan hal itu secara detail kepadanya selama ini, Hahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa lepas, menggelengkan kepalanya mendengar kepolosan sang adik ipar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sama sekali tidak, Daehyun-ah! Anak itu terlalu cerdik untuk bisa dijebak dalam urusan perjodohan orang tua. Kau harus tahu, dia itu sebenarnya sudah menyukaimu sejak masa S2-nya, bahkan sejak dia magang menjadi asisten jaksa setahun sebelum menempuh S2 di Seoul.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya membelalak kaget, pipinya mendadak merona)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk penuh kemenangan, senyum menggoda terpeta jelas di wajahnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya! Dia berulang kali menegaskan kepada Ayah dan Ibu bahwa dia sama sekali tidak mau dijodohkan dengan siapapun. Tapi, ingat tidak saat pernah kuceritakan kepadamu tentang kunjungan bisnis keluarga kami ke rumah orang tuamu dulu? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Nah, tepat setelah kami pulang dari sana, Seo Pyo langsung mendatangi Ayah dan bilang kalau dia mendadak mau dijodohkan, asalkan pasangannya adalah kau. Posisi perjodohannya saat itu langsung aman terkendali karena dia sudah mengunci satu nama sejak awal, yaitu kau sendiri!\" </span><span class=\"c5 c1\">(Tertawa renyah menggoda Daehyun)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tertawa, menyembunyikan rasa semringahnya sambil menepuk pipinya sendiri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aaah, begitu ceritanya... Iya, sih, selama kami di New Zealand dia juga sempat bercerita sedikit tentang hal itu. Jadi, intinya dia memang tidak pernah dijodohkan dengan wanita mana pun ya sebelum bertemu denganku?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Belum pernah sama sekali. Makanya, kalau melihat bagaimana jalan cerita kalian, aku terkadang suka merasa iri dengan kisah cinta kalian yang sangat romantis dan walaupun ada sedikit drama ya diawal, Hahaha...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya makin merona merah, menutupi rasa malunya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahh, Eonni... mulai lagi deh menggoda!\"</span></p><h3 class=\"c11\" id=\"h.270d64crtcff\"><span class=\"c7 c1 c6\">Langkah Pulang Menjelang Sore</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa puas melihat ekspresi adik iparnya, lalu melirik jam tangan pintarnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahahha, baiklah, baiklah. Ayo kita bersiap-siap untuk pulang sekarang. Hari sudah mulai sore, dan jika dihitung dari jamnya, Inna seharusnya sudah pulang dari sekolahnya juga jam sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari kursinya, dengan cekatan dan hati-hati menggendong Eun Jae yang kembali tenang dalam dekapannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, Eonni. Ayo kita pulang. Jagoan kecil kita, Yoo Seo, juga sepertinya sudah mulai kelelahan karena energinya habis dipakai mendongeng tadi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun tersenyum, menuntun tangan Yoo Seo yang berjalan dengan langkah ceria di sampingnya, sementara Daehyun berjalan beriringan di sebelahnya sambil menggendong Eun Jae. Sore itu di Seoul, seiring langkah mereka meninggalkan kafe, garis hidup masing-masing yang dulunya penuh liku dan jarak kini telah menyatu sempurna, menyisakan kehangatan sebuah keluarga yang utuh.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><h3 class=\"c11\" id=\"h.3dwvkyninjd2\"><span class=\"c7 c1 c6\">Sambutan Inna di Rumah dan Interogasi \"Lawan Politik\" (Masa Sekarang - Sore Hari)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana sore hari di halaman depan mansion megah keluarga Han di Seoul. Mobil Na Eun berhenti dengan mulus. Na Eun, Daehyun, Yoo Seo, dan Eun Jae yang kembali terlelap turun dari mobil. Begitu pintu utama rumah terbuka, Park Inna (12 tahun) sudah berdiri di sana menyambut kedatangan mereka dengan pakaian sekolah yang rapi, tampak sangat anggun.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Inna:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk sopan dengan senyum lembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu, Bibi Daehyun, kalian sudah pulang? Wah, Yoo Seo-ya, kau tidak merepotkan Ibu dan Bibi di jalankan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berlari memeluk kakaknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, Noona! Tadi Yoo Seo jadi anak pintar dan dipuji Bibi Daehyun yang cantik!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"I
