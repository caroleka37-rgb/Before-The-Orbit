class=\"c1\">Mendengar kalimat sang dokter, Na Eun seketika tertegun. Ia terpaku, kehilangan kata-kata (</span><span class=\"c1 c8\">speechless</span><span class=\"c4 c1\">) karena terkejut. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, di detik berikutnya, rasa sedih yang menyesakkan dada kembali menyeruak. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Hatinya perih karena menyadari bahwa kabar sebahagia ini tidak bisa ia dengar dan rasakan secara langsung bersama suaminya di sisinya.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menggenggam tangan Na Eun erat, matanya berbinar bahagia)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Syukurlah, Naeun-ah! Kau akan segera memiliki anak... Ini luar biasa. Pasti Junwoo di Washington sana akan sangat bahagia mendengarnya.\"</span></p><h3 class=\"c9\" id=\"h.97u0luvnqwro\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.rsn9gzoq93tq\"><span class=\"c7 c1 c6\">Panggilan Video Lintas Benua</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Dalam perjalanan pulang dari rumah sakit menggunakan mobil mewah).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau tidak usah kembali ke kantor untuk hari ini, Naeun-ah. Kau harus langsung pulang dan beristirahat. Biar nanti sopir pribadi saya yang mengantarkanmu sampai ke rumah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak, Nyonya Na... Terima kasih atas semua kebaikan dan perhatian Anda hari ini.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Nyonya Na turun di titik antarnya, membiarkan sopirnya mengantar Na Eun. Di dalam mobil yang berjalan tenang, dengan tangan gemetar penuh haru, Na Eun memotret hasil foto USG pertama dan surat keterangan dokter, lalu mengirimkannya ke ruang obrolan Junwoo).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Hanya berselang beberapa menit saja, ponsel Na Eun tiba-tiba berdering nyaring. Panggilan video (video call) masuk dari Junwoo. Na Eun langsung mengangkatnya. Di layar ponsel, tampak wajah Junwoo yang berada di Washington di mana di sana masih menunjukkan waktu dini hari, sementara di Korea sudah siang).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar-binar penuh keterkejutan, menempelkan wajahnya dekat ke kamera)</span></p><p class=\"c0\"><span class=\"c1\">\"</span><span class=\"c1 c8\">Yeoboo</span><span class=\"c4 c1\">... Apakah... apakah foto yang baru saja kau kirimkan itu sungguhan? Kau tidak sedang bercanda, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Airmata kembali luruh, mengangguk pelan)</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... ini sungguhan...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat air mata istrinya, raut wajahnya mendadak melunak penuh rasa bersalah)</span></p><p class=\"c0\"><span class=\"c1\">\"Jangan menangis, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... tolong jangan menangis, kau membuatku ikut sedih di sini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kabar bahagia ini... benar-benar membuatku merasa sangat dilema, sekaligus membuatku luar biasa rindu padamu saat ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyeka air matanya, berusaha tersenyum menguatkan suaminya)</span></p><p class=\"c0\"><span class=\"c1\">\"Tidak apa-apa, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c1\">... aku hanya terlalu terharu.\" </span><span class=\"c1 c8\">(walau di dalam hati kecilnya, ia sangat merindukan kehadiran fisik Junwoo)</span><span class=\"c4 c1\">. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya sudah, ini sudah dini hari di sana, kau harus segera kembali beristirahat. Tadi kau bilang jadwal diplomatik mu hari ini sangat padat, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas panjang, menatap istrinya dalam-dalam melalui layar)</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c1\">. Maafkan aku, ya... Maaf karena selama bekerja di sini aku tidak bisa selalu </span><span class=\"c1 c8\">fast respon</span><span class=\"c4 c1\"> membalas pesan-pesanmu. Omong-omong, tadi kau pergi ke dokter sendirian?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Tidak, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">. Tadi aku ditemani oleh Nyonya Na. Dan sekarang aku sedang dalam perjalanan pulang karena badanku memang masih agak lemas dan tidak enak.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika teringat sesuatu, nadanya berubah khawatir namun tegas)</span></p><p class=\"c0\"><span class=\"c1\">\"Kalau begitu, jangan pulang ke rumah kita dulu, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">. Lebih baik sekarang kau langsung pergi ke rumah orang tuaku saja. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Aku akan segera menelpon Ayah dan Ibu di Seoul sekarang juga, supaya mereka bisa menjagamu dan merawatmu sejenak di sana, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merasa tidak enak hati)</span></p><p class=\"c0\"><span class=\"c1\">\"Jangan, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... Ibu dan Ayah pasti juga sedang sibuk dengan urusan mereka. Aku benar-benar tidak mau merepotkan mertua.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Tidak, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">, dengarkan aku. Ibu kebetulan hari ini sedang ada di rumah. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Beliau pasti akan sangat senang dan gembira sekali kalau kau datang kesana membawa kabar kehamilan ini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tolong... turuti perkataanku kali ini ya, demi kesehatanmu dan anak kita.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar ketulusan suaminya, akhirnya luluh dan tersenyum manja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, iya, baiklah... Aku akan bilang ke Paman sopir sekarang untuk memutar arah menuju rumah Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lega dan sangat manis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagus. Berhati-hatilah di jalan, Istriku. Aku mencintaimu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.o60zmitbevz\"><span class=\"c7 c1 c6\">Sup Rumput Laut Hangat di Kamar Junwoo</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur masih berada di masa lalu [Mei 2013]. Mobil yang membawa Na Eun akhirnya tiba di kediaman Keluarga Park pada waktu siang menjelang sore. Begitu mobil berhenti, Nyonya Park sudah berdiri di teras rumah, menunggu dengan raut wajah cemas sekaligus tidak sabar. Beliau langsung berjalan cepat menyambut Na Eun yang melangkah turun dengan tubuh lemas).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langsung merangkul dan memapah tubuh Na Eun dengan lembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Putriku... kau tidak apa-apa? Wajahmu pucat sekali, Nak. Ayo, mari masuk ke dalam... </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Ah, terima kasih banyak ya, Pak, sudah mengantarkan menantu saya dengan aman.\" </span><span class=\"c1 c8\">(ucap Nyonya Park tulus kepada sopir pribadi Nyonya Na)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk lemah, merasa bersalah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... maafkan aku ya, aku malah datang dan merepotkan Ibu seperti ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menepuk punggung Na Eun, menggeleng tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak boleh berkata begitu. Barusan sekali Junwoo menelepon Ibu dari Washington. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dia sangat gembira, dan Ibu pun luar biasa senang akhirnya akan hadir cucu pertama di keluarga ini! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Oh ya, ayo sekarang kau langsung berbaring saja di kamar Junwoo.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Nyonya Park mengantar Na Eun ke dalam kamar tidur Junwoo yang rapi dan beraroma familier. Begitu merebahkan badannya yang lemas di atas kasur, Na Eun menatap sekeliling kamar suaminya. Rasa rindu yang membuncah berpadu dengan kelelahan fisik seketika membuat pertahanannya runtuh; Na Eun kembali menangis sesenggukan).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Beberapa saat kemudian, Nyonya Park kembali masuk ke dalam kamar sambil membawa nampan berisi makanan dan minuman hangat. Beliau tertegun melihat menantunya yang sedang menyeka air mata).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh nampan di meja nakas, lalu duduk di tepi tempat tidur)</span></p><p class=\"c0\"><span class=\"c1\">\"Naeun-ah... kenapa menangis lagi, Nak? Ada apa, hmm? Katakan pada Ibu. Ibu tahu, masa-masa awal kehamilan seperti ini memang sangat menguras energi dan mengubah </span><span class=\"c1 c8\">mood</span><span class=\"c4 c1\">-mu dengan cepat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tentu sekarang kau juga pasti sedang merasa sangat stres, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menutup wajahnya, berucap di sela isak tangis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ibu... Maafkan aku sekali lagi karena tiba-tiba menangis di kamar ini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Aku... aku hanya langsung teringat Junwoo begitu mencium aroma kamarnya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sarat ketulusan, mengusap kepala Na Eun penuh kasih sayang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, tidak apa-apa, Nak. Sangat wajar jika kau merindukan suamimu di saat-saat sensitif seperti ini. Ini... Ibu sudah buatkan sup rumput laut yang masih hangat. Sup ini sangat cocok untuk meredakan rasa mualmu. Biar Ibu suapi saja, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha bangun dan bersandar pada bantal, menggeleng pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak perlu repot-repot disuapi, Bu. Aku bisa makan sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu, makanlah pelan-pelan...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Nyonya Park memperhatikan Na Eun yang mulai menyendok supnya dengan saksama).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu benar-benar sangat senang sekaligus terharu melihat kalian berdua. Kalian berdua sama-sama sedang berjuang keras membangun mimpi masing-masing, tepat disaat kabar gembira tentang calon cucu ini datang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap mangkuk supnya, menghela napas panjang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ibu. Jujur saja... semua ini terasa sangat berat bagiku, apalagi ini pertama kalinya aku mengalami kehamilan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak apa-apa, Putriku. Jika kau mau, kau bisa menginap malam ini di sini bersama Ibu supaya hati dan badanmu bisa jauh lebih tenang. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Nanti, biar Ibu yang menyampaikan kabar kehamilan ini kepada Nyonya Han. Ibu yakin, ibumu pasti juga akan sangat senang mendengar cucu pertama kita akan segera hadir.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berkaca-kaca kembali, menatap mertuanya penuh rasa syukur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Bu... Terima kasih banyak karena sudah mau merawat dan mengerti kondisiku hari ini.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Nyonya Park tidak menjawab dengan kata-kata; beliau langsung menarik Na Eun ke dalam pelukan hangat seorang ibu, membiarkan menantunya menumpahkan sisa kesedihannya di sana).</span></p><h3 class=\"c9\" id=\"h.3dbv9zv0f6j9\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.fi28vc525dg\"><span class=\"c7 c1 c6\">Sinergi Dua Keluarga dan Rasa Syukur Menjadi Saudara</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur kembali bergerak maju ke masa sekarang [Tahun 2026], di dalam ruang spa VVIP. Sesi pijat kepala dan pundak mulai memasuki tahap akhir. Daehyun tampak menghembuskan napas panjang, matanya terlihat berkaca-kaca setelah meresapi seluruh rangkaian cerita perjuangan Na Eun).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni... ceritamu itu benar-benar sedih dan menyentuh sekali. Jika aku yang berada di posisimu saat itu, aku pasti juga tidak akan sanggup melewatinya sendirian.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tenang, menatap Daehyun melalui pantulan cermin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Itulah, Daehyun-ah... masa-masa mengandung anak pertama kali memang benar-benar mengguncang emosional dan fisikku. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi di balik semua kesulitan itu, aku masih ingat betul bagaimana kebaikan ibumu, Nyonya Na. Beliau benar-benar sosok yang sangat pengertian. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Di awal-awal aku harus mengurus transisi Na Cosmetic dalam keadaan hamil dan </span><span class=\"c1 c8\">mood</span><span class=\"c4 c1\"> yang sering tidak stabil, ibumulah yang selalu pasang badan dan sering men-backup keputusan-keputusan penting perusahaan.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menghela nafas lega, guratan kebahagiaan terpancar dari wajahnya).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Makanya, saat akhirnya kau resmi menikah dengan Seo Pyo dan menjadi adik iparku, aku merasa sangat senang sekali. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sungguh, aku sangat bersyukur karena keluargamu selalu memberikan pengertian dan kasih sayang yang besar padaku sejak dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya merona senang, tersenyum lebar mendengar pujian itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Eonni... aku pun merasakan hal yang sama. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Aku kan sejak kecil terbiasa menjadi anak tunggal di rumah, jadi setelah menikah, rasanya menyenangkan sekali bisa memiliki seorang kakak perempuan yang sangat perhatian seperti dirimu.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun terkekeh pelan, mengingat sebuah memori lama).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lagipula, kalau boleh jujur, dulu Ibu dan Ayah sering sekali membahas namamu di rumah. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mereka selalu bilang kalau kau adalah sosok wanita cerdas yang sangat bisa diandalkan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Makanya, sebelum kita saling mengenal dekat seperti sekarang, dulu aku sering sekali merasa penasaran dengan sosokmu, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas, merasa terhibur dengan pengakuan adik iparnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, kau ini... bisa saja, hahahahaha!\"</span></p><h3 class=\"c9\" id=\"h.b44dotriel2t\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.pvwor9wt5fgm\"><span class=\"c7 c1 c6\">Perhatian di Ruang Keluarga dan Ramalan Awal Tahun</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur bergerak ke bulan November 2013. Usia kehamilan Na Eun kini telah menginjak 7 bulan. Suasana malam hari di ruang keluarga kediaman Keluarga Han terasa lebih hangat dari biasanya. Na Eun duduk bersandar di sofa yang nyaman, sementara Nyonya Han duduk di sampingnya sambil mengelus lembut perut putrinya yang sudah tampak membesar).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c1\">\"Naeun-ah... kau harus segera mengajukan cuti hamilmu di </span><span class=\"c1 c8\">Na Group</span><span class=\"c4 c1\">. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kalau kau merasa tidak enak atau sungkan untuk menyampaikannya, biar Ibu saja nanti yang akan bilang langsung pada Nyonya Na.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, menggeleng pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak perlu repot-repot, Ibu. Aku merasa masih cukup kuat dan sehat kok. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Lagipula, ini sudah mau memasuki akhir tahun, banyak sekali berkas dan laporan yang harus aku selesaikan karena sebentar lagi akan ada rapat kerja tahunan perusahaan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menurunkan koran yang sedang dibacanya, menatap Na Eun dengan nada tegas namun tersirat rasa khawatir)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jangan terus-menerus memaksakan dirimu, Naeun-ah. Kau itu sudah hamil besar, sudah sewajarnya dan sudah saatnya kau beristirahat di rumah. </span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">, apakah kemarin kau sudah mengecek jenis kelamin calon bayi mereka ke dokter?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh ke arah suaminya dengan wajah berbinar)</span></p><p class=\"c0\"><span class=\"c1\">\"Ah, iya benar, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">. Kemarin aku mendampingi Na Eun pergi ke dokter kandungan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Setelah diperiksa melalui USG, cucu pertama kita ini kemungkinan besar berjenis kelamin perempuan. Dan untuk Hari Perkiraan Lahir (</span><span class=\"c1 c8\">HPL</span><span class=\"c4 c1\">)-nya, kemungkinan di awal tahun depan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu bagaimana dengan kondisi fisik Na Eun dan bayinya secara keseluruhan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Semuanya sehat dan aman. Kata dokter kandungan kemarin, Na Eun memiliki fisik yang sangat kuat, dan calon bayinya juga sangat pengertian, tidak gampang membuat ibunya rewel atau kesakitan.\"</span></p><h3 class=\"c9\" id=\"h.beggw29olne\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.oyp2hpp96doo\"><span class=\"c7 c1 c6\">Jam Perundingan Washington dan Pesan di Sela Tugas</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke masa yang sama, namun di belahan bumi yang berbeda. Pagi hari menjelang siang di Washington D.C., Amerika Serikat. Atmosfer di dalam salah satu ruang konferensi Kedutaan Besar terasa sangat formal dan sibuk).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo, dengan setelan jas diplomatik yang rapi dan karisma yang matang, tengah berkutat hebat dengan dokumen pekerjaan serta menyambut para tamu delegasi penting dari pemerintah Amerika Serikat. Mereka sedang duduk mengelilingi meja oval untuk membahas kerjasama bilateral dan menyusun draf perjanjian internasional, mulai dari kesepakatan dagang hingga isu keamanan kritis).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunjuk ke arah dokumen di meja, berbicara dalam bahasa Inggris yang lugas dan berwibawa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Thank you for coming, Gentlemen. Regarding the draft of this bilateral cooperation, our government highly emphasizes the strategic balance in the trade sector. However, we also need to address the framework for regional security protocols to ensure mutual stability.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Delegasi Amerika:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk setuju, memeriksa lembar dokumen)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"We appreciate your point, Mr. Park. The United States government is fully prepared to support the trade expansion, provided that the security compliance measures on the maritime borders are strictly aligned with international standards. We believe this agreement will strengthen our partnership for the next decade.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Excellent. My team will review the compliance clauses by this afternoon so we can finalize the memorandum of understanding before the ministerial meeting tomorrow.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Rapat formal itu berjalan intens. Namun, di sela-sela jeda singkat perpindahan agenda kerja yang luar biasa padat, Junwoo langsung berjalan ke sudut ruangan dan mengeluarkan ponselnya. Di tengah kerinduan yang mendalam, ia mengetikkan pesan singkat untuk istrinya di Seoul dimana saat itu di Korea waktu sudah menunjukkan larut malam).</span></p><h3 class=\"c9\" id=\"h.5u6rm7e0lrg3\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.o05kqtctmpp1\"><span class=\"c7 c1 c6\">Ketikan Layar Lintas Benua</span></h3><p class=\"c0\"><span class=\"c5 c1\">{Tampilan Layar Ponsel - Isi Chat Junwoo &amp; Na Eun}</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Yeobo, kau sudah tidur? Di Korea pasti sudah larut malam sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Belum, Yeobo. Aku masih terjaga, belum bisa tidur nih.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Kenapa? Apa calon anak kita di dalam sana sedang rewel?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Hmm, sedikit. Mungkin karena usianya sudah masuk 7 bulan ya, jadi dia mulai aktif bergerak, hehe.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Aku benar-benar merindukan kalian berdua... Maafkan aku ya, Yeobo, untuk saat ini aku masih belum bisa pulang ke Seoul. Tapi aku berjanji, aku akan mengusahakan segala cara agar bisa mendapat izin pulang ke tanah air saat kau melahirkan nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Jangan terlalu memaksakan dirimu sampai kelelahan, Yeobo. Disini kondisiku aman-aman saja kok, ada kedua orang tua kita yang selalu siaga menjagaku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum getir di depan layar ponselnya)</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Kau ini benar-benar tidak berubah ya dari dulu... selalu saja merasa paling kuat dan sok tangguh. Padahal aku tahu betul, kau pasti sering menangis diam-diam di kamar karena merindukanku, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Huhuhu... iya, benar sekali. Tapi tidak apa-apa, aku baik-baik saja kok di sini. Oh ya, apakah jadwalmu sedang agak longgar sekarang, Yeobo?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Hanya sedikit, ini sedang jeda rapat... Eh, maaf sebentar ya, Yeobo. Besok akan aku sambung lagi telepon atau chat-nya. Tamu delegasi berikutnya sudah tiba di ruangan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Iya, tidak apa-apa. Semangat kerjanya, Suamiku!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo memasukkan kembali ponselnya ke dalam saku dengan berat hati, lalu menarik napas dalam-dalam untuk kembali memimpin perundingan dengan senyuman profesionalnya).</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c9\" id=\"h.b3odudcqtz47\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.rcegchv00xdd\"><span class=\"c7 c1 c6\">Rapat Kerja Tahunan 2013 dan Pembuktian Na Cosmetic</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur bergerak ke bulan Desember 2013. Usia kehamilan Na Eun kini telah menginjak 8 bulan. Suasana di ruang utama pertemuan Na Group terlihat sangat sibuk dan formal. Ruangan besar bernuansa marmer dan kaca itu dipenuhi oleh seluruh jajaran C-Level, manajerial, pimpinan, hingga dewan komisaris yang hadir untuk membahas hasil, evaluasi, dan proyeksi kerja tahunan).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di meja utama bagian depan, duduk Tuan Na selaku Presiden Direktur Utama Na Group, didampingi oleh Nyonya Na di sebelahnya sebagai Wakil Presiden Direktur Utama. Sementara itu, Han Na Eun duduk di barisan anak perusahaan bersama tim manajerial dari divisi Na Cosmetic. Moderator berdiri di podium utama untuk membuka acara).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Moderator:</span></p><p class=\"c0\"><span class=\"c1\">\"Selamat pagi, yang terhormat jajaran Dewan Komisaris, jajaran Direksi, serta seluruh pimpinan divisi dan anak perusahaan </span><span class=\"c1 c8\">Na Group</span><span class=\"c4 c1\">. Berkat rahmat Tuhan, kita dapat berkumpul dalam agenda Rapat Kerja Tahunan Evaluasi 2013. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Adapun susunan rapat kita hari ini akan diawali dengan pemaparan performa dari masing-masing pimpinan divisi, dilanjutkan dengan sesi tanggapan dari jajaran direksi, dan akan ditutup dengan arahan strategis dari Presiden Direktur Utama untuk menyambut tahun 2014. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Mari kita buka sesi presentasi pertama, yang akan diawali oleh Divisi Keuangan Utama </span><span class=\"c1 c8\">Na Group</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Satu per satu jajaran C-Level maju ke depan podium, mempresentasikan perkembangan, grafik pencapaian, serta evaluasi tahunan dari sektor masing-masing dengan atmosfer yang cukup tegang penuh interupsi taktis.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">C-Level Divisi Keuangan:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"...dan berdasarkan grafik penutupan buku di Q4 ini, efisiensi biaya operasional konsolidasi kita berhasil ditekan hingga 12%, sementara pendapatan dari sektor manufaktur utama tetap stabil. Demikian pemaparan dari divisi keuangan, terima kasih.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Moderator:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih atas pemaparannya. Selanjutnya, kami persilakan kepada perwakilan dari anak perusahaan baru kita yang resmi bergabung tahun ini, yaitu Chief Executive Officer dari Na Cosmetic, Nyonya Han Na Eun, untuk memaparkan laporannya. Waktu dan tempat kami persilakan.\"</span></p><h3 class=\"c9\" id=\"h.ue7obv65mop1\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.wqucsf51atvc\"><span class=\"c7 c1 c6\">Presentasi Berkelas di Tengah Kehamilan Besar</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Dengan kehamilan yang sudah memasuki bulan ke-8, Na Eun berdiri dari kursinya dengan tenang. Ia merapikan pakaian formalnya yang longgar namun tetap elegan, lalu berjalan dengan langkah mantap menuju podium utama. Sikapnya yang tenang dan profesional seketika menyedot perhatian seluruh ruangan).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuka slide presentasi, suaranya terdengar lugas, tegas, dan penuh percaya diri)</span></p><p class=\"c0\"><span class=\"c1\">\"Selamat pagi semuanya. Hari ini saya akan memaparkan </span><span class=\"c1 c8\">growth</span><span class=\"c1\">, </span><span class=\"c1 c8\">plan</span><span class=\"c1\">, eksekusi, </span><span class=\"c1 c8\">result</span><span class=\"c4 c1\">, serta evaluasi dari Na Cosmetic sepanjang tahun 2013. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Seperti yang kita ketahui, setelah proses akuisisi selesai, kami langsung melakukan langkah ekstrem berupa </span><span class=\"c1 c8\">rebranding</span><span class=\"c4 c1\"> menyeluruh dari Florentina menjadi Na Cosmetic pada kuartal ketiga (Q3) kemarin.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menekan tombol remote presentasi, menampilkan grafik penjualan yang melesat tajam ke atas).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Banyak pihak yang awalnya meragukan keputusan </span><span class=\"c1 c8\">rebranding</span><span class=\"c1\"> cepat ini. Namun, kami fokus pada eksekusi produk baru dengan </span><span class=\"c1 c8\">core value</span><span class=\"c4 c1\"> yang kuat namun dengan pergeseran target market yang lebih dinamis. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Hasilnya bisa kita lihat pada grafik Q4 ini. Pada penjualan pertama saat </span><span class=\"c1 c8\">launching</span><span class=\"c4 c1\">, Na Cosmetic berhasil mencatatkan pertumbuhan angka penjualan yang sangat fantastis, melampaui target awal sebesar 150%. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Bahkan, per minggu ini, kami sudah menerima lonjakan permintaan kontrak baru dari distributor maupun </span><span class=\"c1 c8\">reseller</span><span class=\"c4 c1\"> di tingkat nasional yang ingin mengamankan stok untuk kuartal pertama tahun depan.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Seluruh ruangan tampak mengangguk-angguk kagum, beberapa komisaris terlihat berbisik-bisik puas melihat angka-angka yang dipaparkan dengan begitu rapi dan berbasis data).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Evaluasi kami untuk tahun depan adalah mempercepat kapasitas produksi guna memenuhi permintaan pasar nasional yang di luar ekspektasi ini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Terima kasih, sekian presentasi dari Na Cosmetic.\"</span></p><h3 class=\"c9\" id=\"h.jq8v6gjc7mfh\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.61fa8bapiv3e\"><span class=\"c7 c1 c6\">Kekaguman Tuan dan Nyonya Na</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Melihat presentasi Na Eun yang begitu matang, taktis, dan berkelas, padahal ia sedang menanggung beban fisik kehamilan besar, Tuan Na dan Nyonya Na yang duduk di meja depan tidak bisa menyembunyikan rasa bangga mereka).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbisik pelan kepada istrinya di sebelahnya, matanya masih menatap Na Eun penuh apresiasi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun memang benar-benar wanita yang tangguh. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dalam kondisi hamil besar seperti itu, dia tetap bisa menunjukkan integritas dan profesionalisme yang luar biasa bagus dalam menyampaikan laporan serta hasil kerja perusahaan barunya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, mengangguk setuju)</span></p><p class=\"c0\"><span class=\"c1\">\"Benar, </span><span class=\"c1 c8\">Yeobo</span><span class=\"c4 c1\">... dia sangat tangguh. Padahal beberapa kali aku sendiri yang memintanya untuk mengambil cuti lebih awal demi kesehatannya, tapi dia selalu menolak dengan sopan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Anak itu... dia pasti akan sukses besar di dunia bisnis dengan caranya sendiri.\"</span></p><h3 class=\"c9\" id=\"h.7i9c2d9hnxda\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.tm86nicmo4vk\"><span class=\"c7 c1 c6\">Tanggapan Komisaris dan Direksi</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Na Eun kembali ke tempat duduknya diiringi tepuk tangan apresiatif dari para peserta rapat. Moderator kemudian kembali mengambil kendali jalannya acara).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Moderator:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Luar biasa pemaparan dari Na Cosmetic. Selanjutnya, kami berikan waktu dan kesempatan kepada pihak dewan komisaris serta jajaran direksi untuk menanggapi hasil kerja dari para C-Level yang telah dipaparkan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Komisaris Utama:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyalakan mikrofonnya, menatap ke arah Na Eun dan jajaran C-Level lainnya)</span></p><p class=\"c0\"><span class=\"c1\">\"Saya ingin memberikan apresiasi khusus untuk Na Cosmetic. Langkah </span><span class=\"c1 c8\">rebranding</span><span class=\"c4 c1\"> di Q3 yang langsung menghasilkan angka penjualan masif di Q4 adalah sebuah pencapaian yang bersih. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Untuk jajaran direksi utama </span><span class=\"c1 c8\">Na Group</span><span class=\"c4 c1\">, saya harap suntikan modal dan perluasan pabrik untuk Na Cosmetic di tahun 2014 bisa menjadi salah satu prioritas utama kita, karena data membuktikan pasar mereka sangat potensial.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menimpali melalui mikrofonnya selaku Presdir)</span></p><p class=\"c0\"><span class=\"c1\">\"Terima kasih atas masukan dari Dewan Komisaris. Pihak direksi menyetujui hal tersebut. Kami menilai performa seluruh divisi tahun ini, khususnya langkah ekspansi anak perusahaan baru kita, telah berjalan sesuai dengan cetak biru strategis </span><span class=\"c1 c8\">Na Group</span><span class=\"c4 c1\">. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mari kita pertahankan ritme kerja ini untuk menyambut tahun depan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c9\" id=\"h.83l98ug5nulr\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.ubd7awhelarx\"><span class=\"c7 c1 c6\">Undangan Makan Malam dan Telepon dari Remaja 17 Tahun</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur berada di masa lalu [Desember 2013]. Setelah rapat kerja tahunan selesai, Na Eun kembali ke ruang kerjanya untuk merapikan berkas-berkas sebelum pulang. Terdengar ketukan pintu lembut, lalu Nyonya Na melangkah masuk dengan senyuman hangat).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat sore, Han Na Eun. Kau mau segera pulang kantor, ya? Apakah ada waktu luang sore ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dan membungkuk hormat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Nyonya Na... Selamat sore. Kebetulan sore ini jadwal saya sudah kosong, tidak ada agenda lagi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baguslah kalau begitu. Saya dan Tuan Na ingin mengajakmu makan malam khusus hari ini di sebuah restoran dekat pusat kota. Kami hanya ingin mengobrol santai, sekaligus... saya ingin memperkenalkanmu dengan putri kami.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum senang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dengan senang hati, Nyonya Na. Terima kasih atas undangannya.\"</span></p><h3 class=\"c9\" id=\"h.hv2mjg4kp525\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.1nd8f59ec3ch\"><span class=\"c7 c1 c6\">Alasan Klasik Daehyun dan Perjalanan Bertiga</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Ketika mereka berdua bersiap-siap menuju basement untuk berangkat ke restoran, tiba-tiba ponsel Nyonya Na berdering. Layar menampilkan nama putrinya, Daehyun, yang saat itu masih menjadi seorang remaja berusia 17 tahun).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun (17 Tahun):</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya terdengar panik sekaligus manja melalui telepon)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... maafkan aku! Hari ini aku tiba-tiba harus ikut kegiatan ekstrakurikuler tambahan di sekolah supaya aku bisa lolos masuk tim teater. Jadi, Ibu dan Ayah saja ya yang pergi makan malam...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Na Eun, lalu berjalan agak menjauh sedikit)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sebentar ya, Naeun-ah...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya, silakan Nyonya Na.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbicara dengan suara setengah berbisik di telepon)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Daehyun-ah, Ibu kan sudah bilang sejak tadi pagi di rumah kalau sore ini kita ada janji makan malam bersama. Kenapa tiba-tiba tidak bisa datang? Ayahmu bisa marah kalau mendengar hal ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun (17 Tahun):</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, Ibu... aku benar-benar tidak bisa membatalkannya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Lagipula, setelah sekolah tadi aku juga ada jadwal syuting sebentar, kan Ibu sendiri juga sudah tahu kalau proyek yang ini berjalan sangat ketat...\" </span><span class=\"c1 c8\">(nadanya merajuk manja)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas, luluh oleh nada manja putrinya)</span></p><p class=\"c0\"><span class=\"c1\">\"Baiklah, baiklah kalau begitu. Ibu yang akan bicara dengan Ayahmu nanti. Tapi ingat, jangan diulangi lagi ya, Nak.\" </span><span class=\"c1 c8\">(jawabnya lembut sebelum menutup telepon)</span><span class=\"c4 c1\">.</span></p><h3 class=\"c9\" id=\"h.aoyh446rkwnl\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.vge51cx2rhj3\"><span class=\"c7 c1 c6\">Pujian Tuan Na di Pusat Kota</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Di dalam perjalanan mobil menuju restoran pusat kota, Nyonya Na menoleh ke arah Na Eun yang duduk disebelahnya).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf ya, Naeun-ah... sepertinya putriku mendadak belum bisa hadir malam ini karena urusan sekolah dan syutingnya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jadi, sepertinya kita hanya akan makan malam bertiga saja dengan Tuan Na.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, tidak apa-apa sama sekali, Nyonya Na. Jangan dipikirkan.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke dalam restoran privat yang tenang dan elegan di pusat kota. Sambil menikmati hidangan makan malam, percakapan mereka mengalir hangat, kembali membahas dinamika bisnis dan hasil luar biasa dari rapat kerja tahunan).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh alat makannya, menatap Na Eun dengan pandangan penuh wibawa sekaligus rasa bangga)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah, pemaparanmu di rapat tadi benar-benar membuka mata banyak orang. Di usiamu yang masih muda, ditambah kondisi kehamilan besar seperti ini, kau punya ketajaman visi yang jarang dimiliki eksekutif lain. Kedepannya, kami ingin kau terus belajar mendalami seluk-beluk bisnis ini tanpa ragu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Na:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menimpali sambil menuangkan teh hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar apa kata Tuan Na. Gunakan waktu dan setiap kesempatan di Na Cosmetic untuk membangun pengalaman yang jauh lebih matang. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jangan sungkan untuk membuat terobosan baru. Kami berdua akan selalu memantau dan mendukung penuh setiap langkah potensial mu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum takzim, membungkuk kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak atas kepercayaan dan bimbingan Tuan dan Nyonya Na. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Saya berjanji akan terus belajar dan memberikan yang terbaik untuk perusahaan.\"</span></p><h3 class=\"c9\" id=\"h.ouvuwpnlthmi\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.dc5g584mgdsl\"><span class=\"c7 c1 c6\">Takdir yang Belum Mengizinkan</span></h3><p class=\"c0\"><span class=\"c1 c8\">(Suasana kembali bergerak maju ke masa sekarang [Tahun 2026], di dalam ruang spa VVIP).</span><span class=\"c1\"> </span><span class=\"c5 c1\">(Sesi pijat kepala dan pundak hampir selesai, digantikan dengan suasana santai sambil menikmati teh herbal setelah spa).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah mengingat cerita itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya ampun, Eonni! Jadi di tahun 2013 itu seharusnya aku sudah bertemu dan berkenalan denganmu, tapi takdir benar-benar belum mengizinkan kita ya, hahahah!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut terkekeh sambil membenarkan posisi duduknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, itu dia! Kalau dipikir-pikir, di tahun yang sama seharusnya kau itu sudah bertemu denganku sebanyak dua kali, Daehyun-ah. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi entah kenapa, selalu saja ada takdir yang belum mengizinkan kita berpapasan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pertama, saat aku bersama Ayah dan Seo Pyo berkunjung ke rumahmu yang waktu itu pernah aku ceritakan kepadamu, kan? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dan yang kedua, ya tepat setelah raker tahunan ini. Ya ampun...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng-gelengkan kepalanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau diingat-ingat lagi, kenapa ya momentumnya dulu bisa sangat-sangat tidak pas begitu? Seharusnya waktu itu aku bisa lebih peka sedikit, hahahha! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi dari ceritamu tadi, memang kelihatan sekali kalau orang tuaku sangat mengagumimu sejak dulu. Rasanya... dulu mereka ingin sekali mengadopsimu menjadi anak mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh cepat, menyunggingkan senyum jahil di wajahnya)</span></p><p class=\"c0\"><span class=\"c1\">\"Hmm... kenapa? Jangan-jangan waktu itu kau merasa cemburu ya, Daehyun-ah?\" </span><span class=\"c1 c8\">(menggoda)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya mendadak merona, memprotes dengan nada salah tingkah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, tidak yaaa! Hmmm... mana ada aku cemburu!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas melihat ekspresi adik iparnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo, mengaku saja! Hahahahaha, Daehyun-ah, wajahmu sampai memerah begitu!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.twmhk9v45wlw\"><span class=\"c7 c1 c6\">Ketukan Jadwal dan Sinyal Darurat di Awal Tahun</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur berada di masa lalu [Januari 2014]. Suasana di ruang kerja Na Eun di kantor Na Cosmetic. Hari itu bertepatan dengan Hari Perkiraan Lahir [HPL] awal Na Eun. Di balik meja kerjanya, Na Eun tiba-tiba mencengkram sisi meja dengan erat, wajahnya berkerut menahan sakit).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meringis kesakitan, tangan satu lagi memegangi perutnya yang membesar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aduh... perutku... kenapa sakit sekali ya...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Sekretaris:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah masuk sambil membawa dokumen)</span></p><p class=\"c0\"><span class=\"c1\">\"Nona Han, saya ingin memberikan jadwal </span><span class=\"c1 c8\">update</span><span class=\"c4 c1\"> kerja kita awal tahun ini...\" </span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(pandangannya beralih ke wajah Na Eun, seketika ekspresinya berubah panik)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\"> \"Nona Han! Kau baik-baik saja? Wajahmu pucat sekali sebentar, maaf... di bawah kakimu ada... ya ampun, ada darah! Kau pendarahan, Nona!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Suasana sekitar ruangan Na Eun seketika gempar. Dengan sigap, sekretaris bersama beberapa staf bawahan langsung memapah Na Eun yang melemas, membawanya turun ke basement, dan melarikannya menggunakan mobil operasional menuju rumah sakit. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di dalam mobil, di sela rintihan kesakitannya, Na Eun menarik ujung baju sekretarisnya dan berbisik pelan.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya bergetar, memberikan detail alamat dari ponselnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tolong... bawa aku ke rumah sakit ibu dan anak... milik ibu mertuaku...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Sekretaris:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Dengan tangan gemetar ikut panik melihat kondisi Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Nona Han, alamatnya sudah saya terima. Selama perjalanan ini, apa perlu saya bantu hubungkan ke ponsel Ibu Anda, atau... ke Tuan Park Junwoo?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya... tolong... eh, hubungkan ke... suamiku dulu...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sekretaris Na Eun dengan cepat mencari kontak Junwoo dan mencoba melakukan panggilan internasional, namun nada sambung terus berdering tanpa ada jawaban.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Sekretaris:</span></p><p class=\"c0\"><span class=\"c1\">\"Maaf, Nona Han... sepertinya ponsel Tuan Park belum bisa tersambung. Kalau begitu, saya akan coba telepon Ibu Anda sekarang, ya.\" </span><span class=\"c1 c8\">(menekan nomor Nyonya Han)</span><span class=\"c4 c1\"> </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Halo, selamat siang, Nyonya Han. Saya sekretaris Nona Han Na Eun. Saya ingin mengabarkan jika siang ini Nona Han mengalami pendarahan dan saat ini kami sedang dalam perjalanan menuju rumah sakit milik ibu mertuanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han (di Telepon):</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya tersentak kaget)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa?! Na Eun pendarahan?! Baik, saya dan Tuan Han akan segera menyusul ke sana sekarang juga!\"</span></p><h3 class=\"c11\" id=\"h.m5lihcarfeau\"><span class=\"c7 c1 c6\">Siaga di Ruang Bersalin</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke Rumah Sakit Ibu dan Anak milik Keluarga Park. Begitu tiba, Na Eun langsung dilarikan ke ruang bersalin dan ditangani oleh tim dokter spesialis. Nyonya Park yang mendadak dikabari oleh staf rumah sakitnya langsung berlari cepat menyusuri koridor menuju ruang bersalin).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Nafasnya terengah-engah, menghampiri dokter yang baru keluar pintu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kudengar menantuku baru saja dibawa ke sini... Bagaimana keadaannya sekarang?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter Kandungan:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nyonya Park, salam. Iya, Nona Han Na Eun sudah ditangani oleh tim perawat kami di dalam. Memang benar ada sedikit pendarahan, namun mengingat ini sudah memasuki bulan HPL-nya, ini merupakan tanda-tanda awal persalinan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghembuskan napas sedikit lega)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik... Tolong lakukan yang terbaik dan tangani dia dengan sangat hati-hati ya, Dokter.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter Kandungan:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu, Nyonya Park. Kami akan mengawasi perkembangannya dengan ketat.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Setelah dokter kembali masuk, Nyonya Park berdiri di koridor dengan gugup. Ia berulang kali mencoba menghubungi nomor ponsel putranya di Washington, namun hasilnya nihil.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bergumam cemas, menatap layar ponselnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ehhmm... Junwoo-ya, kenapa ponselmu tidak tersambung juga? Ya ampun... aku lupa, di Washington sekarang kan masih jam 3 malam. Dia pasti sedang tidur nyenyak...\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tak lama kemudian, pintu lift terbuka. Nyonya Han datang terburu-buru didampingi oleh dua asisten pribadinya yang tampak repot membawa beberapa tas besar berisi perlengkapan bayi dan kebutuhan menginap Na Eun).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya menyiratkan kekhawatiran mendalam, namun suaranya diusahakan tetap tenang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nyonya Park! Dimana putriku sekarang, Nyonya Park?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, syukurlah Nyonya Han, kau sudah datang. Na Eun sudah dibawa ke dalam ruang bersalin.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengusap dadanya lega)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Syukurlah... Terima kasih banyak karena kau sudah datang duluan untuk menjaga putriku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, sama-sama, Nyonya Han. Kalau begitu, saya ingin izin pulang ke rumah sebentar untuk menyiapkan beberapa kebutuhan tambahan untuk Na Eun di sini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, tidak apa-apa, Nyonya Park. Silakan.\"</span></p><h3 class=\"c11\" id=\"h.6g4hxoladg18\"><span class=\"c7 c1 c6\">Telepon Dini Hari dari Washington</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Dalam perjalanan pulang di dalam mobil, Nyonya Park tidak menyerah. Jarinya terus menekan tombol panggil ke nomor Junwoo, menempelkan ponsel itu ke telinganya dengan cemas).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo... Nak, angkat teleponnya... Junwoo-ya, putrimu akan segera lahir ke dunia...\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Beberapa menit berselang, setelah belasan panggilan tak terjawab, ponsel Nyonya Park tiba-tiba bergetar hebat. Panggilan balik dari Junwoo masuk. Di Washington, jarum jam menunjukkan pukul 03.15 dini hari).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya terdengar serak khas orang baru bangun tidur, bercampur panik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... maafkan aku, Ibu. Aku baru saja terbangun dan kaget sekali melihat banyak panggilan tidak terjawab di ponselku. Ada apa, Bu? Apa terjadi sesuatu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nak... istrimu... Na Eun sudah mau melahirkan sekarang! Dia sudah berada di dalam ruang bersalin. Ini benar-benar di luar perkiraan perkiraan HPL awal kita yang seharusnya pertengahan Januari... tapi ternyata kontraksi dan pendarahan ringannya sudah terjadi di awal bulan ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika terdiam sejenak di seberang telepon, nyawanya langsung terkumpul penuh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Astaga, Ibu... Jadi bayinya lahir lebih cepat ya... Baik, Bu. Aku akan mengusahakan segala cara untuk mengurus dokumen perjalanan dan pulang ke Korea dalam minggu ini. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Mungkin... untuk saat ini, aku akan memantau kondisi Na Eun lewat </span><span class=\"c1 c8\">video call</span><span class=\"c4 c1\"> dulu, karena aku harus memajukan jadwal cuti diplomatik besok pagi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nak. Ibu tau mengatur jadwal diplomatik yang sudah ditentukan di sana memang tidak mudah. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi kau tidak perlu khawatir, ada kami para orang tua di sini yang akan mem-back up semua kebutuhan Na Eun selama kau belum tiba.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya bergetar menahan haru)</span></p><p class=\"c0\"><span class=\"c1\">\"Ibu... terima kasih banyak ya, Bu... Maafkan aku...\" </span><span class=\"c1 c8\">(ia terdiam sejenak, membayangkan Na Eun yang berjuang sendirian di ruang bersalin)</span><span class=\"c4 c1\"> \"...aku tidak tahu harus berbuat apa tanpa bantuan kalian di sana. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tolong sampaikan apapun detailnya ya, Ibu, tentang perkembangan persalinannya nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nak, pasti akan Ibu kabari terus. Sekarang kau tenangkan dirimu ya. Kau bisa istirahat lagi dulu sebentar, nanti Ibu hubungi begitu ada pembukaan baru. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Proses persalinan anak pertama biasanya tahapannya cukup lama, sementara ini Na Eun sudah ditangani dengan sangat baik oleh dokter.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ibu... Terima kasih banyak. Tolong sampaikan salam dan permohonan maafku juga kepada Ayah dan Ibu mertua.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nak...\"</span></p><h3 class=\"c11\" id=\"h.qrz5wpwvwxba\"><span class=\"c7 c1 c6\">Pemandangan Langka di Depan Ruang Bersalin</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lorong rumah sakit yang sunyi. Tuan Han dan Nyonya Han telah duduk menunggu di kursi tunggu depan ruang bersalin selama hampir 3 jam tanpa kepastian. Waktu terasa berjalan sangat lambat).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri, berjalan mondar-mandir dengan tangan terlipat di dada, sesekali melirik jam dinding)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa lama sekali penanganannya? Ini sudah lewat tiga jam dan belum ada dokter yang keluar memberikan kabar.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menarik napas dalam, mencoba menenangkan suaminya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sabar, Yeobo... Proses persalinan itu memang memakan waktu yang lama. Apalagi kondisi fisik Na Eun tadi kata perawat saat pertama kali dibawa ke sini juga agak lemah karena pendarahan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar penjelasan istrinya, Tuan Han menghentikan langkahnya. Pria yang biasanya selalu tampil kaku, formal, dingin, dan penuh kendali itu kini perlahan menurunkan kedua tangannya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Untuk pertama kalinya, topeng ketegasannya runtuh, memperlihatkan gurat wajah dan ekspresi seorang ayah yang didera rasa cemas yang luar biasa demi keselamatan putri sulungnya.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.7n57ipsgpr40\"><span class=\"c7 c1 c6\">Tangis Pertama dan Ruang VVIP</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Alur berada di masa lalu [Januari 2014]. Setelah lima jam penuh ketegangan berlalu di depan ruang bersalin, pintu akhirnya terbuka. Dokter kandungan keluar dengan wajah lelah namun mengulas senyum lega. Tuan dan Nyonya Han langsung berdiri menyambutnya dengan cemas).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana, Dokter? Bagaimana keadaan putri saya, Na Eun, dan juga bayinya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter Kandungan:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Syukurlah, Pak. Proses persalinan berjalan dengan sangat baik dan lancar. Bayi Nona Han Na Eun terlahir sehat, berjenis kelamin perempuan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, untuk sementara waktu ini, bayi dan ibunya harus dipisah terlebih dahulu untuk menjalani perawatan masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Untuk bayinya dirawat di mana, Dokter? Lalu bagaimana kondisi Na Eun sendiri?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter Kandungan:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bayinya akan kami masukkan ke dalam inkubator terlebih dahulu untuk diobservasi dan dipastikan seluruh indikator kesehatannya benar-benar aman, sebelum nanti mulai diberikan ASIP (Air Susu Ibu Perah) oleh ibunya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sedangkan untuk Nona Han Eun, saat ini beliau masih belum sadarkan diri. Ini kondisi yang sangat wajar karena proses persalinan anak pertama menguras banyak energi dan membuatnya kelelahan. Kita hanya perlu menunggu sampai beliau siuman.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghembuskan napas panjang, pundaknya yang tegang akhirnya melonggar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Syukurlah... kalau begitu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, terima kasih banyak, Dokter.\"</span></p><h3 class=\"c11\" id=\"h.gaqo7c7ejsa6\"><span class=\"c7 c1 c6\">Kehangatan Mertua dan Runtuhnya Pertahanan</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Beberapa jam kemudian, Na Eun telah dipindahkan ke ruang perawatan VVIP. Perlahan, kelopak matanya bergerak dan ia mulai sadarkan diri. Di samping tempat tidurnya, Nyonya Han setia menggenggam tangannya).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya masih sangat lemah dan serak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... di mana... di mana putriku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lembut, mengusap dahi putrinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nak, sebentar lagi putrimu akan dibawa ke sini oleh perawat. Kau tenang dulu ya...\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tiba-tiba pintu ruangan diketuk dan dibuka perlahan. Tuan dan Nyonya Park melangkah masuk dengan raut wajah penuh kelegaan. Melihat menantunya sudah membuka mata, Nyonya Park langsung berjalan cepat menghampiri ranjang Na Eun dengan mata yang berkaca-kaca menahan haru. Beliau memeluk tubuh Na Eun dengan sangat hati-hati).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya ampun, Putriku... kau sudah siuman, Nak. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Terima kasih... terima kasih banyak ya sudah berjuang sekuat ini demi cucu kita. Lalu, apa sekarang tubuhmu masih terasa sangat sakit? Ada bagian mana yang terasa kurang nyaman? Katakan pada Ibu, ya...\" </span><span class=\"c1 c8\">(ucapnya bertubi-tubi sambil menangis haru)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Maju mendekat sambil menaruh sebuah wadah hangat)</span></p><p class=\"c0\"><span class=\"c1\">\"Naeun-ah, ini Ayah bawakan sup rumput laut hangat buatan rumah. Setelah ini kau harus makan perlahan-lahan ya, supaya fisikmu punya energi kembali.\" </span><span class=\"c1 c8\">(Tuan Park mulai mengeluarkan beberapa masakan rumahan beraroma sedap dan minuman herbal yang khusus diracik untuk memulihkan wanita pasca-melahirkan)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar untaian kata terima kasih yang tulus, perhatian yang begitu besar, serta ketulusan dari kedua mertuanya, pertahanan ego Na Eun yang selama ini selalu ingin terlihat kuat seketika runtuh total di depan Tuan dan Nyonya Han. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Air matanya mengalir deras; ia menangis terisak-isak di dalam pelukan hangat Nyonya Park, menumpahkan segala beban, rasa takut, dan lelah yang dipendamnya sendirian selama berbulan-bulan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di sudut ruangan, Tuan dan Nyonya Han tersenyum haru memandang kedekatan tulus tersebut.</span></p><h3 class=\"c11\" id=\"h.lq105b284c5v\"><span class=\"c7 c1 c6\">Kehadiran Park Inna dan Layar Seberang Samudra</span></h3><p class=\"c0\"><span class=\"c1 c8\">(Pintu kembali diketuk, seorang perawat masuk mendorong boks bayi, membawa sesosok bayi perempuan mungil yang cantik. Nama yang telah disiapkan jauh-jauh hari oleh Junwoo dari Washington akhirnya resmi disandang oleh malaikat kecil itu: </span><span class=\"c1 c6 c8\">Park Inna</span><span class=\"c5 c1\">).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tepat pada saat bayi itu diletakkan di dekat Na Eun, ponsel Nyonya Park bergetar hebat. Panggilan video (video call) dari Junwoo masuk. Nyonya Park segera mengarahkan layar ponsel itu ke arah wajah Na Eun dan Inna).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Di layar ponsel, wajahnya tampak sangat sembap dan matanya memerah menahan tangis haru saat menatap putri pertamanya untuk pertama kali)</span></p><p class=\"c0\"><span class=\"c1\">\"Naeun-ah... Inna-ya... Dia sangat cantik, mirip sekali denganmu, Yeobo...\" </span><span class=\"c1 c8\">(suaranya tercekat)</span><span class=\"c4 c1\">.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum di sela sisa tangisnya, mengelus pipi bayinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia memiliki garis wajahmu juga, Junwoo-ya...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk, menempelkan dahinya ke layar ponsel dengan rasa bersalah yang amat dalam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Yeobo, maafkan aku... Maafkan aku karena aku tidak bisa berada di sampingmu, tidak bisa menggenggam tanganmu di saat-saat paling krusial dan bertaruh nyawa seperti ini. Aku benar-benar minta maaf...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggelengkan kepalanya pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak apa-apa, Suamiku. Jangan meminta maaf lagi. Lihatlah... kedua orang tua kita menjaga dan merawatku dengan sangat luar biasa di sini. Kau fokus saja menyelesaikan urusan cutimu di sana, kami menunggumu pulang.\"</span></p><h3 class=\"c11\" id=\"h.kw55te34t26l\"><span class=\"c7 c1 c6\">Komitmen Empat Orang Tua</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah situasi mereda serta Na Eun dan bayinya mulai tertidur untuk beristirahat, keempat orang tua berjalan keluar dan berkumpul di ruang tunggu luar yang lebih tenang untuk berdiskusi).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf, Nyonya Han, jika diperbolehkan, saya ingin mengusulkan sesuatu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Bagaimana jika selama masa cuti melahirkan ini, Na Eun tinggal di rumah kami saja? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Karena sebagai dokter, saya paham betul bahwa fase awal menjadi ibu adalah transisi yang sangat berat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Banyak hal mendadak yang bisa membuat seorang ibu baru kaget, dan kita harus siaga untuk mencegah risiko </span><span class=\"c1 c8\">baby blues</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk setuju, sangat memahami kapasitas besannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, tidak apa-apa, Nyonya Park. Saya sangat setuju. Sebagai ibunya sendiri, saya tahu betul Na Eun pasti akan kebingungan dan membutuhkan sosok yang jauh lebih mengerti serta bisa memberikan dukungan emosional yang kuat di saat-saat awal seperti ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdehem pelan, menatap Tuan dan Nyonya Park)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Namun, mengingat Anda berdua juga pasti memiliki tingkat kesibukan profesi yang sama padatnya dengan kami, kami tentu tidak ingin terlalu merepotkan keluarga kalian sendirian. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jadi, apa yang bisa pihak kami bantu dari sini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Untuk sementara waktu ini belum ada yang mendesak, Tuan Han. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Justru sebelumnya, saya mewakili Junwoo ingin berterima kasih sekaligus memohon maaf yang sebesar-besarnya karena di kondisi awal Na Eun menjadi ibu, putra saya belum bisa mendampingi secara fisik di sini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengibaskan tangannya pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak perlu berpikir begitu, Tuan Park. Kita ini sudah menjadi satu keluarga besar. Sebagai sesama orang tua, sudah sewajarnya kita harus saling bahu-membahu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, mungkin nanti setelah masa cuti melahirkan tiga bulan itu selesai dan Na Eun harus kembali aktif beraktivitas memimpin perusahaan, kemungkinan besar sayalah yang akan mengambil alih tugas membantu merawat Inna di rumah, tentunya dibantu oleh beberapa asisten berpengalaman yang sudah kami siapkan dari sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lega)</span></p><p class=\"c0\"><span cla
