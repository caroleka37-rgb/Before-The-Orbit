span class=\"c4 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-10.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Dengan gerakan tangan yang sedikit kaku karena gugup, ia mengulurkan jari manisnya. Jantungnya berdegup semakin kencang saat merasakan telapak tangan Junwoo yang hangat meraih jemarinya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Junwoo pun tidak kalah berdebar. Tangannya sedikit bergetar saat meraih jemari lembut Na Eun dan perlahan memasangkan cincin warisan ibunya ke jari manis gadis itu. Tepat saat cincin itu tersemat sempurna, keduanya tidak sengaja saling bertatapan mata.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Deg.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di detik yang singkat itu, kenangan musim semi tujuh tahun lalu di aula SNU mendadak muncul sekilas di benak mereka berdua momen jabat tangan organisasi yang menjadi awal segalanya. Sadar akan tatapan yang terlalu dalam, keduanya langsung berkilah dan secara bersamaan mengalihkan pandangan lurus ke depan, mencoba menetralkan kecanggungan.</span></p><h3 class=\"c9\" id=\"h.ua8yev3dgpai\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.qyao1f4w4wom\"><span class=\"c7 c1 c6\">Ketegangan di Depan Kamera</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah cincin terpasang, seorang fotografer privat yang sudah disiapkan keluarga Han melangkah maju membawa kamera DSLR.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Fotografer:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Tuan Junwoo dan Nona Na Eun, silakan berdiri berdampingan menghadap ke arah kamera. Mohon maaf, bisa tolong posisinya agak merapat? Ya, silahkan saling berpegangan tangan untuk posenya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Selama sesi foto berlangsung, sama sekali tidak ada interaksi atau obrolan di antara mereka. Yang ada hanyalah ketegangan yang sangat kentara. Jari-jari mereka bertautan dengan kaku, sementara senyuman yang terukir di wajah keduanya murni demi profesionalitas jepretan kamera.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan, menyenggol lengan istrinya di barisan kursi tamu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lihatlah mereka, Yeobo. Keduanya sama-sama terlihat sangat tegang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tersenyum geli, berbisik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, menggemaskan sekali. Mereka berdua terlihat sangat kaku.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di sisi lain, Tuan dan Nyonya Han hanya menatap kedua calon pengantin itu dengan senyuman lebar yang penuh kepuasan, sesekali mengangguk formal menoleh ke arah besan mereka.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di dalam pikiran Na Eun dan Junwoo saat blitz kamera menyala bergantian, ada satu hal yang mereka sadari: rasa penasaran yang terpendam selama tujuh tahun ini akhirnya benar-benar mengikat mereka dalam sebuah komitmen malam ini. Sesuatu yang sama sekali tidak pernah mereka ekspektasikan saat pertama kali bertemu di aula SNU dulu.</span></p><h3 class=\"c9\" id=\"h.g24w1xt4piv7\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.6btizpozuwri\"><span class=\"c7 c1 c6\">Dialog Tepi Kolam dan Ekspektasi yang Runtuh</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah sesi ramah tamah dan foto bersama kedua orang tua selesai, atmosfer acara beralih menjadi lebih santai. Para orang tua berkumpul di sofa tengah, tenggelam dalam obrolan hangat seputar bisnis dan rencana keluarga. Memanfaatkan momen longgar tersebut, Na Eun yang merasa butuh menghirup udara segar langsung berdiri dan meminta izin secara sopan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayah, Ibu, Nyonya dan Tuan Park... maaf, saya izin ke tepi kolam renang sebentar untuk mencari udara segar.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar hal itu, seluruh orang tua mengangguk hangat dan mengizinkannya. Na Eun pun melangkah keluar menuju area halaman belakang yang sunyi.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Beberapa menit kemudian, Junwoo memutuskan untuk menyusul. Ia berjalan perlahan menyusuri jalan setapak taman hingga langkahnya terhenti saat melihat Na Eun sedang termenung sendirian, duduk di bangku tepi kolam renang yang airnya memantulkan cahaya bulan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c18\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 451.00px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-11.png\" style=\"width: 602.00px; height: 328.00px; margin-left: -151.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah mendekat, memecah keheningan dengan suara rendahnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tahu... kau pasti sangat tertekan dengan acara malam ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menoleh sekilas, lalu kembali menatap air kolam. Ia berdehem kecil, mencoba menutupi rasa gengsi dan keterkejutannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak juga. Biasa saja.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil. Ia tahu betul Na Eun sebenarnya merasa tertekan dengan suasana lamaran mendadak ini. Berniat mengalihkan pembicaraan agar suasananya mencair, Junwoo ikut duduk di ujung bangku)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya... boleh aku tahu sesuatu? Saat kau masih remaja dulu, apa hal yang paling kau sukai?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar pertanyaan itu, Na Eun seketika terkaget. Ia terdiam sejenak dan menatap Junwoo dengan dahi berkerut. Baginya, pertanyaan itu terdengar sangat tidak biasa dan aneh untuk ukuran sebuah obrolan perjodohan kelas atas.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa... tiba-tiba menanyakan hal seperti itu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum santai)</span></p><p class=\"c0\"><span class=\"c1\">\"Kita ini sekarang sudah resmi bertunangan, Han Na Eun. Tentu hal sepele seperti itu sangat wajar untuk ditanyakan, bukan?\" </span><span class=\"c1 c8\">(Junwoo kemudian menarik sedikit lengan kemeja jasnya ke atas, menunjukkan sebuah garis samar di kulitnya)</span><span class=\"c4 c1\"> \"Kau lihat ini? Ini adalah bekas lukaku dulu, saat aku sedang melakukan hobiku bermain sepeda gunung.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun terpaku menatap lengan Junwoo. Di dalam kamus hidupnya, tidak pernah ada seorang laki-laki dari kalangan elit yang bertanya tentang esensi siapa dirinya, apalagi secara sukarela menunjukkan bagian terlemah atau kekurangan yang mereka miliki di pertemuan pertama.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap bekas lukanya dengan pandangan bernostalgia)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku sejak kecil sangat suka bersepeda gunung di medan yang ekstrim. Saking sukanya, kadang aku sampai lupa waktu. Dan ini adalah 'hadiahnya'. Saat jatuh waktu itu, aku harus merasakan sepuluh jahitan di lengan ini. Tapi, aku tetap menyukai hobi itu sampai sekarang, meskipun aku harus merasakan kalah berkali-kali di kompetisi dan hanya bisa merasakan menang sesekali saja. Jadi... bagaimana denganmu? Apa cerita masa mudamu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun tertegun dalam diam. Pikirannya mendadak kosong. Biasanya, tujuh kandidat pria terpandang yang dijodohkan dengannya di masa lalu selalu membuka obrolan dengan membahas ekspansi bisnis, masa depan bisnis, atau sesuatu yang sarat akan reputasi serta pencapaian materi. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, Park Junwoo di malam itu benar-benar meruntuhkan seluruh ekspektasinya. Kedewasaan pria itu yang berani tampil apa adanya tanpa topeng kesempurnaan seketika membuat jantung Na Eun kembali berdegup kencang kali ini bukan karena gugup, melainkan karena getaran lain.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk, memainkan jemarinya dengan nada suara yang mendadak gugup)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku... aku sangat suka menari saat masih muda dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaikkan alisnya, tampak terkejut sekaligus tertarik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Menari? Tradisional atau modern? Wah, ini informasi yang benar-benar baru buatku dari seorang Han Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hemmm, berdeham kecil untuk menutupi rasa malunya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku... menyukai musik K-Pop dulu. Tarian yang kumaksud adalah tarian modern mengikuti koreografi mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sangat tulus, matanya berbinar hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, begitu. Menarik sekali. Lalu untuk sekarang, apakah kau masih sering melakukannya di sela kesibukanmu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Belum... belum ada kesempatan lagi untuk ke arah situ.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk paham, menatap Na Eun lekat-lekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau begitu, lakukanlah lagi jika kau mau di masa depan nanti. Jangan biarkan pekerjaan menyita hal yang kau sukai.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar jawaban yang begitu membebaskan dari Junwoo, Na Eun kembali termenung menatap air kolam yang tenang. Di malam yang dingin itu, ia bisa merasakan dengan jelas bahwa satu dinding pertahanan kokoh yang selama ini ia bangun di sekeliling hatinya, telah runtuh seketika hanya karena sebuah obrolan sederhana tentang masa muda.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.8ohvci4i3p6b\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026) – Rahasia dari Kepungan Reputasi</span></h3><p class=\"c21\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Daehyun tampak memegangi dadanya dengan ekspresi sangat tersentuh.)</span></p><p class=\"c21\"><span class=\"c1 c6\">Daehyun:</span><span class=\"c4 c1\"> \"Oh eonni... itu manis sekali! Junwoo Oppa benar-benar tahu cara membuka gembok hati seorang Han Na Eun! Disaat pria lain pamer harta, dia malah pamer bekas luka jahitan, hahaha!\"</span></p><p class=\"c21\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c1\"> </span><span class=\"c1 c8\">(Tersenyum sangat lembut, menatap cincin pernikahan yang kini melingkar di jarinya)</span><span class=\"c4 c1\"> \"Itulah momen di mana aku sadar bahwa pria di hadapanku ini berbeda, Daehyun-ah. Dia tidak menginginkan Han Na Eun si pimpinan Florentina... dia hanya ingin mengenal Han Na Eun yang seutuhnya. Dan malam itu, benteng pertahanan pertama ku hancur, benar-benar retak tak bersisa.</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">( Jam dinding antik di sudut ruangan telah berdentang, menunjukkan tepat pukul 23.00 malam. Na Eun melirik jam tersebut, lalu meletakkan cangkir tehnya yang sudah benar-benar kosong.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari sofa sambil meregangkan tubuhnya pelan)</span></p><p class=\"c0\"><span class=\"c1\">\"Ya ampun, Daehyun-ah... tidak terasa sudah menunjukkan pukul sebelas malam. Ayo, sudah waktunya kita tidur.\" </span><span class=\"c1 c8\">(Mengajak adik iparnya untuk beranjak masuk ke dalam kamar)</span><span class=\"c4 c1\"> \"Besok pagi kau harus sudah pulang ke rumahmu sebelum 'Pak Menteri' kesayanganmu itu berangkat kerja, bukan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut berdiri sembari memeluk bantal sofa, matanya berbinar penasaran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya benar, Eonni. Tapi... omong-omong, sebelum kita masuk ke kamar, aku mau tanya satu hal. Soal ceritamu tadi yang membahas tentang menari... apakah setelah menikah dengan Junwoo Oppa, kau akhirnya sudah pernah melakukannya lagi?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menggelengkan kepalanya mengingat masa lalu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Pernah... tapi hanya tiga kali saja. Itu pun kulakukan di studio tari milik temanku, yang tempatnya pernah kutunjukkan kepadamu waktu itu. Tapi ya... lagi-lagi masalah 'reputasi' adalah segalanya yang membelenggu gerak-gerikku di luar. Meskipun Junwoo sendiri sama sekali tidak pernah melarang hobiku, aku tetap tahu diri dan membatasi aktivitas itu demi menjaga nama baik keluarga.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya mendadak berbinar cerah, melangkah mendekati Na Eun dengan antusias)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni, kalau kau mau, kita bisa menari bersama nanti! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kau tahu kan, ruangan seniku yang berisi alat-alat lukis, alat musik, dan beberapa perlengkapan teater masa laluku itu sudah kupindahkan seluruhnya dari rumah orang tuaku ke mansionku sekarang? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi, ruangannya memang masih butuh sedikit diperlebar, terutama jika ingin digunakan untuk latihan tari atau sekadar bermain alat musik dengan leluasa. Seo Pyo bahkan sudah menyetujui ide itu dan bersedia mendanai seluruh biaya renovasinya, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun mendadak memelankan suaranya, tampak agak ragu)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi... aku sebenarnya masih belum percaya diri. Bagaimana kalau Ibu (mertua) sampai tahu ada studio seni seperti itu di dalam kediaman kita sini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar rencana itu, senyumnya langsung mengembang lebar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah... Daehyun-ah, kau serius mau membuat studio seni pribadi di rumahmu? Hmmm... kalau soal Ibu, tenang saja, biar aku yang urus nanti. Aku yang akan turun tangan langsung untuk bernegosiasi dengan Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak melompat kecil kegirangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benarkah, Eonni?! Wah, terima kasih banyak! Studio seni ini nanti akan menjadi ruang rahasia kita berdua untuk bersembunyi dari kepungan reputasi publik, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan, mencolek hidung Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar sekali. Syukurlah aku memiliki seorang adik ipar artis seperti ini. Nah, sebagai hadiah karena kau sudah menemaniku mengobrol malam ini, kau harus ikut bersamaku ke spa besok siang secara VIP. Kebetulan aku mengambil jatah cuti selama tiga hari, dan karena Junwoo juga belum pulang dari dinasnya, besok siang kita bisa bebas memanjakan diri sendiri sekaligus melanjutkan cerita masa lalu kita.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar penuh semangat)</span></p><p class=\"c0\"><span class=\"c1\">\"Wah, seru sekali! Hmmm... tapi Eonni, kelanjutan ceritanya belum </span><span class=\"c1 c8\">happy ending</span><span class=\"c4 c1\">, ya? Padahal di bab ini kalian kan sudah resmi bertunangan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum penuh arti, menatap ke arah jendela luar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Belumlah... Acara lamaran malam itu barulah sebuah permulaan. Di dalam proses penjajakan tiga bulan setelah malam itu... justru akan ada masa-masa berat, di mana benteng ego kami kembali meninggi, hingga kami berdua hampir saja memutuskan untuk tidak jadi menikah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Ketika Memori Menjadi Kesempatan", "html": "<p class=\"c10 title\" id=\"h.3nyju4f88jgc\"><span class=\"c23 c13\">Ketika Memori Menjadi Kesempatan</span></p><h3 class=\"c14\" id=\"h.3lffwzkp0jxs\"><span class=\"c7 c1 c6\">BAB: KETIKA MEMORI MENJADI KESEMPATAN</span></h3><p class=\"c0\"><span class=\"c3 c1\">Bagian 1: Aroma Lavender dan Rahasia Rumah Tangga (Masa Sekarang - Tahun 2026)</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana siang hari yang menenangkan di sebuah salon spa VVIP terkemuka di pusat kota Seoul. Desain interiornya sangat elegan dengan sentuhan kayu hangat, pencahayaan temaram, serta aroma terapi lavender yang menenangkan. Han Na Eun dan adik iparnya, Na Daehyun, melangkah masuk setelah melewati gerbang reservasi khusus. Seorang pelayan spa dengan seragam rapi langsung membungkuk hormat menyambut mereka.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Pelayan Spa:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat siang, Nona Han, Nona Na. Selamat datang kembali. Ruangan VVIP privat Anda berdua sudah siap dan seluruh perlengkapan spa terbaik kami telah disiapkan. Silahkan lewat sebelah sini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan sembari mengedarkan pandangan ke sekeliling ruangan yang sangat estetik dan privat, lalu berbisik antusias)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, Eonni... apakah kau sering datang ke tempat ini? Aku baru tahu ada salon spa yang senyaman dan se-privat ini di pusat kota.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa ringan, menepuk pelan bahu Daehyun)</span></p><p class=\"c0\"><span class=\"c1\">\"Sering sekali, Daehyun-ah. Setiap kali aku merasa benar-benar lelah dan stres dengan semua urusan pekerjaanku, Junwoo pasti selalu menyuruhku kesini untuk menikmati </span><span class=\"c1 c8\">me-time</span><span class=\"c4 c1\">. Biasanya aku ke sini saat akhir pekan. Kami sengaja bertukar peran di hari itu; jika aku sedang spa, Junwoo yang akan menjaga dan mengurus anak-anak, begitu pula sebaliknya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menopang dagunya dengan mata berbinar kagum saat mereka mulai duduk di area perawatan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Inilah kenapa, Eonni... aku sangat ingin tahu rahasia rumah tangga kalian berdua. Hubungan kalian itu terasa sangat berbeda dari rumah tangga hasil perjodohan pada umumnya. Rasanya aku dan Seo Pyo harus banyak-banyak belajar dari kalian yang sudah menjadi ahlinya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh geli, menoleh ke arah Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahli apanya? Yang ada kami ini belajar setiap hari, tahu! </span></p><p class=\"c0\"><span class=\"c1\">Lagipula, bicara soal romantis... kau ingat tragedi Milan lima bulan lalu waktu kisahmu dan Seo Pyo gempar? Aku dan Junwoo saat itu menonton siaran langsung </span><span class=\"c1 c8\">press conference</span><span class=\"c1\">-mu di dalam kamar. Kami berdua sampai bergumam, kenapa kami tidak punya kisah romantis yang ditonton satu dunia dan tersiar di stasiun TV seperti kalian berdua, ya?\" </span><span class=\"c1 c8\">(Menggoda Daehyun dengan kerlingan mata)</span><span class=\"c4 c1\"> \"Jadi, sekarang siapa sebenarnya yang ahli di sini, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika merona merah, menutupi wajahnya dengan kedua telapak tangannya karena malu)</span></p><p class=\"c0\"><span class=\"c1\">\"Ahhh, Eonni! Kenapa melakukan </span><span class=\"c1 c8\">flashback</span><span class=\"c4 c1\"> ke masa-masa itu, sih! Siapa juga yang mau berada di kondisi menegangkan seperti saat itu? Kalau diingat-ingat lagi, aku benar-benar sangat malu dengan keluarga besar...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas melihat tingkah adik iparnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Kau ini memang adik iparku yang paling lucu. Nah, sekarang... kau pasti mau tahu lagi kan bagaimana kelanjutan kisah masa laluku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langsung menurunkan tangannya, menatap Na Eun dengan semangat berapi-api)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja! Ayo, cepat lanjutkan ceritanya, Eonni. Aku sudah tidak sabar!\"</span></p><h3 class=\"c9\" id=\"h.xi52jas493si\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.ie9g6hqumeww\"><span class=\"c7 c1 c6\">Invasi Subuh dan Sepeda Kayuh Ibu (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke beberapa hari setelah acara pertunangan resmi. Hari Minggu subuh yang masih sangat dingin dan remang-remang di kamar tidur Han Na Eun. Di atas meja nakas, sebuah ponsel tampak bergetar berulang kali, memecah kesunyian.)</span></p><p class=\"c0\"><span class=\"c5 c1\">Bzzz... Bzzz... Bzzz...</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerang pelan, matanya masih terpejam rapat saat tangannya meraba-raba nakas dengan setengah mengantuk)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ugh... siapa sih yang mengirim pesan sepagi ini? Mengganggu saja...\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Dengan nyawa yang belum terkumpul sepenuhnya, Na Eun membuka layar ponselnya. Sebuah pesan singkat dari kontak bernama 'Park Junwoo' tertera di sana.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">[Park Junwoo]:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Selamat pagi, Han Na Eun. Udara subuh ini sangat bagus. Bersiaplah dalam waktu 30 menit, aku akan mengajakmu olahraga pagi. Aku tidak menerima penolakan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mata langsung melotot membaca pesan itu, mendengus kesal)</span></p><p class=\"c0\"><span class=\"c1\">\"Apa-apaan sih dia ini? Kenapa tiba-tiba memaksaku begini?!\" </span><span class=\"c5 c1\">(Menutup ruang obrolan dengan kesal, lalu melempar ponselnya ke bantal dan bersiap merebahkan tubuhnya kembali untuk tidur).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Cklek!</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Pintu kamar Na Eun tiba-tiba terbuka lebar. Nyonya Han melangkah masuk dengan setelan rumah yang rapi, menatap putrinya yang masih bergulung di dalam selimut.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Na Eun-ah! Kenapa kau masih tidur di jam segini? Lihat itu, Junwoo sudah duduk di ruang tamu menunggumu sejak tadi. Apa kau sama sekali tidak tahu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika langsung terduduk tegak, shock)</span></p><p class=\"c0\"><span class=\"c1\">\"Apa?! Dia... dia sudah ada di bawah, Ibu?\" </span><span class=\"c5 c1\">(Bergumam kesal dalam hati: 'Pria itu kenapa sih? Kenapa tiba-tiba langsung menerobos ke rumah subuh-subuh begini?!')</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo cepat bangun, jangan membuat tunanganmu menunggu terlalu lama di bawah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas pasrah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Ibu. Tunggu sepuluh menit, aku akan segera bersiap.\"</span></p><h3 class=\"c9\" id=\"h.jkujhnbutheg\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.dzpxor8x1ysj\"><span class=\"c7 c1 c6\">Diplomasi Ruang Tamu dan Panggilan Baru</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di ruang tamu kediaman keluarga Han. Tuan Han duduk sambil melipat koran paginya, mengobrol santai dengan Junwoo yang tampak segar mengenakan pakaian olahraga kasual.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Na Eun ini... sepertinya kalian sudah janjian tapi dia malah belum bersiap sama sekali. Tolong ditunggu sebentar ya, Junwoo-ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sopan, menggaruk tengkuknya yang tidak gatal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, sebenarnya saya yang mengajaknya secara mendadak pagi ini, Tuan Han. Mungkin dia juga baru tahu setelah bangun tidur tadi, hehehe.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah turun dari tangga, memotong pembicaraan dengan senyum lebar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aduh, Junwoo-ya... Kenapa kau masih memanggil kami dengan sebutan 'Tuan' dan 'Nyonya'? Mulai sekarang, panggil kami Ayah dan Ibu, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertegun sejenak, wajahnya memerah malu karena merasa sungkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmmm... ah, iya... Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa puas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, begitu! Kau ini kan sekarang sudah resmi menjadi calon menantu di keluarga kami.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tepat di saat itu, Na Eun melangkah turun menyusuri anak tangga. Ia hanya mengenakan pakaian olahraga kasual yang sederhana, rambutnya dikuncir kuda, namun tatapan matanya tampak sinis dan bibirnya cemberut menatap lurus ke arah Junwoo. Junwoo yang melihat ekspresi 'terpaksa' itu justru tertawa tipis, merasa gemas.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari duduknya, membungkuk hormat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik kalau begitu, Ibu... Ayah... kami pamit pergi berolahraga dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika melotot, jantungnya berdesir kaget mendengar sebutan yang dilontarkan Junwoo kepada orang tuanya)</span></p><p class=\"c0\"><span class=\"c1 c8\">'Sejak kapan dia memanggil orang tuaku seperti itu?!'</span><span class=\"c1\"> </span><span class=\"c5 c1\">(batinnya protes).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan dan Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk kompak, tersenyum lebar melepas kepergian mereka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hati-hati di jalan, jangan pulang terlalu siang, ya!\"</span></p><h3 class=\"c9\" id=\"h.7ox0rjk3jzxk\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.itovprwb2k21\"><span class=\"c7 c1 c6\">Skenario yang Tidak Biasa di Tepi Sungai Han</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di depan gerbang besar rumah keluarga Han. Udara subuh terasa menusuk kulit. Na Eun melangkah keluar lalu menoleh ke kanan dan ke kiri dengan dahi berkerut karena tidak menemukan tanda-tanda keberadaan mobil Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melipat kedua tangannya di dada, menatap Junwoo ketus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini berniat mengajakku olahraga pagi tapi sama sekali tidak membawa mobil?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun... judulnya saja aku mengajakmu olahraga pagi, untuk apa kita harus naik mobil?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu kau mau kita berjalan kaki sampai ke taman?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah ke samping pagar, lalu menunjuk sebuah sepeda kayuh tua milik ibunya yang memiliki boncengan di bagian belakang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kita pakai ini. Nanti kita bisa bersepeda menuju taman di sekitar Sungai Han untuk berolahraga pagi di sana.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun seketika terpaku dan tertegun di tempatnya berdiri. Di dalam benaknya, ingatan tentang tujuh kandidat pria dari kalangan elit di masa lalunya kembali berputar mereka yang selalu menjemputnya dengan mobil mewah atau kendaraan mahal demi memberikan kesan yang mengesankan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, Park Junwoo lagi-lagi mengacak-acak ekspektasinya dan membuatnya terperangah dengan metode pendekatan yang sangat tidak biasa ini.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memegang stang sepeda, menepuk jok boncengan belakang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo naik, kau akan kubonceng. Kau... pasti belum pernah kan naik sepeda kayuh dan dibonceng seperti ini sebelumnya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaikkan dagunya, mencoba mempertahankan gengsinya yang tersisa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja belum pernah. Buat apa juga aku naik sepeda kayuh untuk aktivitas sehari-hariku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh geli mendengar jawaban ketus yang sarat akan rasa bete dari tunangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, ya sudah, hari ini kau harus mencobanya. Ayo naik.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana berubah dinamis. Mereka berdua mulai menyusuri jalanan kota Seoul yang masih sepi dan tenang di hari Minggu pagi sekitar pukul 05.00 subuh. Angin pagi menerpa wajah mereka berdua saat roda sepeda berputar konsisten. Na Eun duduk kaku di boncengan belakang.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-12.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbicara sedikit keras agar suaranya terdengar di antara deru angin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini... kenapa harus langsung menyusulku subuh-subuh begini? Kau tahu kan, hari Minggu ini aku ingin bersantai di rumah!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil terus mengayuh sepedanya dengan santai namun pasti)</span></p><p class=\"c0\"><span class=\"c1\">\"Kau tidak ingat dengan </span><span class=\"c1 c8\">deadline</span><span class=\"c4 c1\"> kesepakatan kita yang hanya tiga bulan itu, hm? Mana mungkin aku menyia-nyiakan waktu yang singkat ini, apalagi membiarkanmu bersantai sendirian. Kalau memang harus bersantai, ya harus kita lakukan berdua agar kita bisa saling mengenal.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya memerah, memukul pelan punggung Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa-apaan kau ini... seenaknya saja membuat aturan!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lebar, mempercepat kayuhannya saat jalanan mulai menurun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah, jangan cerewet. Pegangan yang kuat pada pinggangku, Han Na Eun. Kita akan segera sampai!\"</span></p><h3 class=\"c9\" id=\"h.qlujyy1a58hj\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.rk56aeiilts9\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke salon spa. Daehyun sampai memegang kedua pipinya yang ikut memerah akibat mendengarkan cerita Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c1\">\"Ahhh, Eonni! Ini benar-benar manis sekali! Junwoo Oppa benar-benar tahu cara mencuri </span><span class=\"c1 c8\">start</span><span class=\"c4 c1\"> sejak subuh! Tapi tunggu... kau benar-benar berpegangan pada pinggangnya saat itu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menutup wajahnya dengan handuk spa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terpaksa, Daehyun-ah! Karena dia sengaja mengebut saat jalanan menurun, aku yang ketakutan refleks memeluk pinggangnya erat-erat dari belakang. Sialan sekali, malam pertunangan aku membuat benteng pertahanan yang kuat dengan syarat tiga bulan, tapi beberapa hari kemudian, pria itu sudah berhasil meruntuhkan satu lapis lagi pertahananku lewat sebuah sepeda kayuh tua.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.v2fpbvvjphjz\"><span class=\"c7 c1 c6\">Filosofi Hari Minggu dan Perdebatan Kalori (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana pagi hari sekitar pukul 06.00 subuh di tepi Sungai Han. Langit Seoul mulai terang benderang dengan semburat warna biru muda yang bersih. Setelah melakukan jogging pagi yang cukup menguras keringat, Junwoo dan Na Eun tampak berjalan pelan sebelum akhirnya memutuskan untuk duduk di salah satu bangku taman yang menghadap langsung ke arah sungai yang tenang.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyeka keringat di pelipisnya dengan handuk kecil, lalu menoleh ke samping)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Di hari Minggu pagi seperti ini... biasanya kau lebih suka menghabiskan waktu untuk beraktivitas apa, Na Eun-ah?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengatur nafasnya, menatap lurus ke depan dengan sisa-sisa wajah bete)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ada banyak hal yang biasa kulakukan. Termasuk di antaranya adalah bekerja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan, menyandarkan punggungnya ke sandaran bangku)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bekerja lagi? Hmmm... apa kau tahu filosofi kenapa di dalam satu minggu itu harus diciptakan yang namanya hari Minggu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, menoleh dengan tatapan tidak habis pikir)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa tiba-tiba menanyakan hal seperti itu? Sama sekali tidak penting.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sangat tulus, menatap Na Eun lekat-lekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Justru itu sangat penting, Han Na Eun. Alasan adanya hari Minggu adalah karena ada hari di mana manusia itu harus mengambil jeda dalam hidupnya. Kalau kau menganggap hari Minggu itu sama persis seperti hari-hari kerja lainnya, rasanya itu juga tidak adil bagi tubuh dan pikiranmu sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memalingkan wajahnya, mendengus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Suka-suka aku. Bagiku semua hari itu sama saja, tidak ada bedanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengubah posisi duduknya menghadap Na Eun, nadanya terdengar tegas namun santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau begitu, mulai sekarang... selama masa berproses tiga bulan denganku, hari Minggu adalah hari di mana kau harus menemaniku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak melotot, tidak terima)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau jadi mengatur begini? Ada banyak hal mendesak yang harus kulakukan di hari Minggu, aku tidak bisa hanya bersantai-santai saja bersamamu!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa aba-aba langsung berdiri dan memegang pergelangan tangan Na Eun secara lembut namun kokoh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau begitu, ayo ikut aku sarapan sekarang. Mengisi energi itu juga termasuk ke dalam daftar hal penting yang wajib kau lakukan pagi ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha menarik tangannya, wajahnya memerah karena terkejut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku belum lapar, Park Junwoo! Hentikan... lepaskan tanganku!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil terus menariknya lembut menuju arah luar taman, senyumnya terkembang lebar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah, tidak ada bantahan. Ayo ikut saja.\"</span></p><h3 class=\"c9\" id=\"h.btlk00b02zn2\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.pasmn58aoya3\"><span class=\"c7 c1 c6\">Gengsi Ramyeon di Depan Minimarket</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke area depan sebuah minimarket (convenience store) di dekat pinggiran Sungai Han. Mereka berdua kini duduk berhadapan di meja plastik outdoor. Di hadapan mereka, dua cup ramyeon instan yang masih mengepul panas telah tersaji. Junwoo tampak sudah asyik menyantap makanannya, sedangkan Na Eun masih duduk cemberut sambil melipat kedua tangan di dada, membiarkan ramyeon miliknya tergeletak begitu saja tanpa dibuka.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengunyah ramyeonnya, menatap Na Eun heran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa belum disentuh? Kau tidak suka makan ramyeon minimarket?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaikkan dagunya, ketus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah kubilang kan, aku belum la—\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Kruuukkk...</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suara nyaring yang berasal dari perut Na Eun tiba-tiba berbunyi dengan sangat jelas di antara keheningan pagi itu, seketika memotong kalimat pembelaannya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa terbahak-bahak melihat gengsi Na Eun yang langsung runtuh akibat alarm tubuhnya sendiri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Na Eun-ah, kau harus tahu teori ini. Olahraga pagi secara umum itu membakar sekitar 150 hingga 700+ kalori per sesi, tergantung pada jenis gerakan yang kau pilih dan berat badanmu sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo mengetuk-ngetuk meja plastik dengan sumpitnya, berlagak seperti seorang dosen yang sedang memaparkan materi ilmiah ilmiah dengan santai)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Perkiraan jumlah kalori yang terbakar selama 30 menit untuk berat badan rata-rata seperti dirimu, sekitar 50 sampai 60 kilogram itu meliputi: Jalan kaki santai bisa membakar sekitar 150 - 200 kalori. Jogging atau lari yang kita lakukan tadi membakar sekitar 250 - 400 kalori. Dan bersepeda yang kita naiki subuh tadi membakar sekitar 200 - 300 kalori. Tubuhmu itu sedang kekurangan energi secara matematis. Jadi, ayo cepat dimakan ramyeonnya sebelum mie-nya mengembang dan tidak enak lagi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun yang mendengar penjelasan ilmiah yang mendadak meluncur dari mulut Junwoo seketika merasa skakmat. Ia tidak bisa menemukan celah argumen logis lagi untuk menjawabnya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dengan wajah yang masih ditekuk menahan malu, ia akhirnya langsung meraih cup ramyeon tersebut, membukanya dengan kasar, dan mulai mengaduk-aduk mienya dengan gerakan tangan yang sangat cepat untuk menutupi rasa salah tingkahnya.</span></p><h3 class=\"c9\" id=\"h.gr4y4ctb2lr9\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.ixej8h84pvc7\"><span class=\"c7 c1 c6\">Alasan di Balik Kata Penasaran</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah selesai menghabiskan sarapan mereka, keduanya berjalan kaki perlahan menyusuri trotoar jalanan pagi kota Seoul yang mulai hangat oleh sinar matahari. Junwoo berjalan santai di samping Na Eun sambil menuntun sepeda kayuhnya dengan satu tangan. Atmosfer di antara mereka kini terasa jauh lebih tenang dibandingkan subuh tadi.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Junwoo sekilas, membuka obrolan dengan nada kasual yang berpura-pura tidak peduli)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ngomong-ngomong... kenapa kau bersedia menyetujui perjodohan ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langkahnya seketika berhenti sejenak. Ia terdiam selama beberapa detik, lalu menoleh ke arah Na Eun dengan senyuman tipis yang sarat akan arti)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmmm... karena aku penasaran.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, tidak puas dengan jawaban sesingkat itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hanya itu? Tidak ada kepentingan atau motif lain di baliknya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Kembali melangkah, terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmmm... lalu bagaimana dengan dirimu sendiri? Aku justru merasa sangat heran melihat seorang Han Na Eun yang kukenal sangat idealis di masa lalu, malah mau-mau saja diajak masuk ke jalur perjodohan seperti ini. Itu adalah sesuatu yang sangat sulit untuk dijelaskan, bukan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuang muka, menjawab dengan nada gengsi yang kental)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku... aku juga sama. Aku menerima ini karena aku penasaran.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghentikan tuntunan sepedanya lagi, menatap Na Eun dengan binar mata jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau harus penasaran denganku, haa?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membela diri dengan argumen rasionalnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tahu bagaimana reputasimu dulu saat kita masih di SNU. Rasanya sangat mustahil dan tidak masuk akal jika seorang pria sepertimu bersedia menikah melalui jalur perjodohan seperti ini, padahal... padahal dulu ada sangat banyak gadis yang mengantri dan menyukaimu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar pengakuan terselubung itu, matanya seketika berbinar jahat. Ia langsung memajukan tubuhnya sedikit, membalas menggoda Na Eun dengan seringai usil di wajahnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya? Jadi... apakah rasa penasaranmu yang besar itu sebenarnya adalah bentuk rasa cemburu terpendam karena aku punya banyak penggemar yang mendekatiku dulu, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya seketika memerah padam sampai ke telinga, matanya membelalak kaget)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa-apaan kau ini?! Enak saja kalau bicara!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa menunggu balasan Junwoo selanjutnya, Na Eun yang sudah terlanjur salah tingkah tingkat dewa langsung berbalik badan dan berlari kencang meninggalkan Junwoo di belakang.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat reaksi menggemaskan tersebut, ia langsung tertawa lepas dengan senyuman lebar yang menghiasi wajah tampannya, lalu berteriak sembari menyusul dengan sepedanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun! Tunggu aku! Hahaha, kenapa kau malah kabur?!\"</span></p><h3 class=\"c9\" id=\"h.57wbt7sym064\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.ndrq5re4rx11\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Daehyun langsung tertawa heboh sampai memukul-mukul tepi kasur pijatnya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Ya ampun, Eonni! Junwoo Oppa benar-benar keterlaluan usilnya! Dia menggunakan rumus matematika kalori hanya untuk membongkar gengsi perut laparmu, lalu langsung menembakmu dengan tuduhan cemburu masa kuliah! Tapi jujur... kau waktu itu benar-benar cemburu ya, Eonni?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas sembari menutupi wajahnya yang mendadak ikut menghangat mengingat memori itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja tidak, Daehyun-ah! Saat itu aku murni merasa harga diriku diinjak-injak oleh kepercayaan dirinya yang terlalu tinggi itu! Tapi ya... kalau dipikir-pikir lagi sekarang, hari Minggu subuh itulah yang menjadi titik balik di mana memori masa kuliah kami berubah menjadi kesempatan nyata untuk saling membuka diri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.gu3lcolgnuba\"><span class=\"c7 c1 c6\">Roda Bisnis Florentina dan Kepungan Deadline</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana seminggu kemudian di dalam ruang kerja Han Na Eun di kantor pusat Florentina. Ruangan yang biasanya tenang kini berubah tegang. Di atas meja panjang, berserakan sampel kemasan baru, laporan analisis pasar, dan draf timeline distribusi. Na Eun berdiri di depan papan tulis digital, melakukan briefing mendesak dengan beberapa kepala divisi.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetuk layar digital dengan pena taktis, nadanya dingin dan tegas)</span></p><p class=\"c0\"><span class=\"c1\">\"Saya tidak mau tahu apa kendala di lapangan, Tim Produksi. Peluncuran produk baru kita tinggal menghitung hari. Jika vendor kemasan kedua masih belum bisa menyamakan standar warna </span><span class=\"c1 c8\">hologram</span><span class=\"c4 c1\"> botol dengan sampel utama, batalkan kontrak mereka sekarang juga!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Kepala Produksi:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi Nona Han, jika kita membatalkan kontrak secara mendadak, kita akan kekurangan stok untuk distribusi kuartal pertama di wilayah Seoul.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap tajam)</span></p><p class=\"c0\"><span class=\"c1\">\"Lebih baik kita kekurangan stok di minggu pertama daripada merilis produk cacat yang akan menghancurkan reputasi Florentina jangka panjang. Tim Pemasaran, bagaimana dengan progres </span><span class=\"c1 c8\">influencer</span><span class=\"c1\"> untuk </span><span class=\"c1 c8\">campaign</span><span class=\"c4 c1\"> di media sosial?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Kepala Pemasaran:</span></p><p class=\"c0\"><span class=\"c1\">\"Semua </span><span class=\"c1 c8\">draft</span><span class=\"c1\"> konten sudah aman, Nona. Hanya saja pihak agensi meminta kelonggaran waktu pembayaran </span><span class=\"c1 c8\">down payment</span><span class=\"c4 c1\"> karena masalah administrasi mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak ada kelonggaran. Berikan mereka waktu sampai jam lima sore ini, atau kita cari agensi lain yang lebih profesional. Kita tidak sedang bermain-main dengan waktu.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Setelah beberapa jam memimpin rapat yang sangat menguras emosi dan tenaga, para staf akhirnya keluar dari ruangan dengan wajah tegang. Na Eun menghela napas berat, menjatuhkan tubuhnya ke kursi kerja. Tepat saat itu, ponselnya bergetar di atas meja. Sebuah pesan masuk dari Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">[Park Junwoo]:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Han Na Eun, ini sudah masuk jam makan siang. Keluar dari ruang kerjamu sekarang, aku tunggu di restoran sushi dekat kantor. Aku yang traktir.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langsung mengetik balasan dengan cepat tanpa berpikir dua kali)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">[Han Na Eun]:</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Aku tidak bisa. Sedang sangat sibuk.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menunggu beberapa saat, namun anehnya, Junwoo sama sekali tidak membalas pesan penolakannya itu. Na Eun mendengus pelan, melempar ponselnya ke samping dan kembali fokus pada layar laptop.)</span></p><h3 class=\"c9\" id=\"h.4ows1snd5syq\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.fbb108k3ja9j\"><span class=\"c7 c1 c6\">Notes Kecil di Atas Meja</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Beberapa jam kemudian, sekitar pukul 1 siang. Pintu ruangan Na Eun diketuk perlahan. Salah satu staf kepercayaannya masuk membawa sebuah kantong kertas mewah berisi kotak makanan hangat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah mendekat sambil tersenyum penuh arti)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nona Han, maaf mengganggu. Ini... sepertinya ada kiriman makanan khusus dari tunanganmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, menatap kantong makanan itu dengan heran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa ini? Kenapa dia harus mengirim hal-hal seperti ini ke kantor, sih?\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menerima kantong tersebut dan menemukan sebuah kertas catatan kecil (notes) dengan tulisan tangan yang rapi menempel di bagian atas kotak makanan.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">\"Jangan lupa dimakan. Jangan kerja terus, Han Na Eun. Tubuhmu butuh kalori, ingat rumusnya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1 c8\">(Hmmm... bergumam pelan, jantungnya mendadak berdesir tipis namun egonya langsung menyampingkan kotak makanan itu ke sudut meja)</span><span class=\"c4 c1\"> \"Taruh saja disana. Terima kasih.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa menyentuh makanan itu sedikit pun, Na Eun langsung berbalik, kembali menenggelamkan diri ke dalam tumpukan dokumen dokumen Florentina.)</span></p><h3 class=\"c9\" id=\"h.yh2twfn55h2n\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.esanbdprj8oo\"><span class=\"c7 c1 c6\">Seni Menaklukkan Wanita</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke kediaman mewah keluarga Park di malam hari. Di ruang tengah yang hangat, Tuan Park dan Nyonya Park sedang bersantai menikmati teh malam, sementara Junwoo duduk di sofa sebelah sembari sesekali memantau ponselnya yang sepi dari balasan Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meletakkan cangkir tehnya, menoleh ke arah putranya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana, Nak? Setelah acara pertunangan resmi minggu lalu, apakah sudah ada kesan atau perkembangan yang bagus dari Na Eun?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika tersenyum tipis, mengingat bagaimana ketusnya gadis itu saat dibonceng sepeda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia... sangat lucu, Ayah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menoleh, penasaran dengan binar mata tertarik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh? Lucu bagaimana, Nak? Setahu Ibu, Na Eun itu gadis yang sangat anggun dan tenang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia itu wanita yang sangat idealis, Ibu. Dia punya prinsip yang luar biasa kuat. Sering kali prinsip dan gengsi itulah yang dia jadikan tembok kokoh untuk membentengi dirinya setiap kali aku mencoba melakukan pendekatan. Dia selalu mencari alasan logis untuk menolak, padahal ekspresi wajahnya tidak bisa berbohong.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa bangga, menepuk pundak putranya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Itulah yang dinamakan seni menaklukkan wanita, Nak. Dulu Ayah juga harus menghadapi tembok yang sama kerasnya saat pertama kali mendekati ibumu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melotot jenaka, mencubit pelan pinggang suaminya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, enak saja! Tidak ya! Jangan mengarang cerita, Ayahmu dulu itu yang sangat kaku seperti kanebo kering saat mendekatiku.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mereka bertiga pun tertawa bersama, memenuhi ruangan dengan kehangatan. Di sela tawa itu, Junwoo kembali melirik layar ponselnya yang masih belum menunjukkan tanda-tanda pesan masuk dari Na Eun. Perasaannya mendadak tidak tenang.)</span></p><h3 class=\"c9\" id=\"h.f806rl692t64\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.ky43a7s9to0j\"><span class=\"c7 c1 c6\">Runtuhnya Benteng Fisik</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke kantor Florentina pada malam hari. Jarum jam telah menunjukkan pukul 18.30. Seluruh ruangan kantor sudah mulai sepi dan gelap, hanya menyisakan lampu di ruangan Na Eun yang masih menyala terang. Staf kepercayaannya tadi tampak mengemas barang-barangnya di depan meja Na Eun sebelum pulang.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nona Han, kau belum mau pulang juga? Apa kau berniat untuk lembur lagi malam ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa mengalihkan pandangan dari laptop)</span></p><p class=\"c0\"><span class=\"c1\">\"Ah, iya, sepertinya begitu. Ada beberapa berkas regulasi yang harus aku selesaikan malam ini karena beberapa hari lagi sudah jadwal </span><span class=\"c1 c8\">launching</span><span class=\"c4 c1\">.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah mendekat ke meja kerja Na Eun, menunjuk kotak makanan dari Junwoo yang posisinya masih sama persis seperti tadi sore)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Astaga, Nona Han... Kau bahkan belum menyentuh makanan dari tunanganmu sama sekali? Ini sudah jam enam lewat, artinya sejak siang tadi kau belum memasukkan makanan apa pun ke perutmu!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tersentak, menoleh ke arah kotak makanan yang sudah mendingin itu dengan tatapan kosong)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... iya, aku sampai benar-benar lupa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas prihatin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nona, sepertinya kau sudah mulai butuh seorang manajer. Jika semua urusan perusahaan dari hulu ke hilir kau lakukan sendiri seperti ini, kau bisa sakit.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menjawab datar, mencoba kuat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak akan. Tubuhku sudah biasa dengan ritme seperti ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyerah, membungkuk pamit)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu, saya pulang duluan. Tolong jangan pulang terlalu larut, Nona.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Waktu terus bergulir. Di dalam gedung kantor yang sunyi, kini benar-benar hanya menyisakan Na Eun seorang diri. Jam dinding telah merambat menunjukkan pukul 21.00 malam. Pandangan mata Na Eun mendadak mengabur. Kepalanya terasa berdenyut sangat hebat, dan seluruh persendian tubuhnya mendadak mati rasa akibat dehidrasi dan kelelahan ekstrim.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memegangi kepalanya yang berputar, berbisik lirih)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ugh... kenapa pusing sekali...\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Dengan sisa tenaga yang ada, Na Eun berusaha bangkit berdiri dari kursi kerjanya untuk mengambil segelas air putih di dispenser sudut ruangan. Namun, baru dua langkah kakinya berpindah, dunianya mendadak menjadi gelap gulita. Kakinya lemas tak bertulang.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Brukkkk!</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tubuh anggun itu ambruk ke atas lantai karpet ruang kerjanya. Gelas yang dipegangnya terlempar, dan Han Na Eun sepenuhnya kehilangan kesadaran sendirian di tengah malam.)</span></p><h3 class=\"c9\" id=\"h.u66lu1l1ixk1\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.b66wco4m3ef1\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Daehyun langsung terpekik kaget, menutup mulutnya dengan kedua tangan, matanya membelalak panik menatap Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Astaga, Eonni!!! Kau pingsan sendirian di kantor jam sembilan malam?! Lalu... lalu bagaimana? Siapa yang menemukanmu pertama kali? Jangan bilang Junwoo Oppa yang datang menyelamatkanmu?!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menyesap air putih hangat yang disediakan pelayan spa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Firasat seorang Park Junwoo malam itu benar-benar tajam, Daehyun-ah. Di saat aku merasa tidak membutuhkan siapapun dan mengandalkan logikaku, disitulah takdir memaksa fisikku runtuh, agar aku tahu... aku tidak bisa hidup sendirian tanpa dirinya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.4b153ulpja61\"><span class=\"c7 c1 c6\">Firasat Buruk dan Penyelamatan di Tengah Malam</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari sekitar pukul 21.15 di depan gedung kantor Florentina. Sebuah mobil hitam melaju kencang dan berhenti mendadak tepat di depan lobi. Junwoo melangkah turun dengan terburu-buru. Wajahnya tampak sangat tegang, ponselnya masih menempel di telinga, mencoba menghubungi nomor Na Eun yang tetap tidak aktif.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah lebar menerobos masuk ke dalam area lobi yang sepi, berbicara pada petugas keamanan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apakah Han Na Eun, pimpinan Florentina, masih ada di atas?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Petugas Keamanan:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya, Tuan. Mobil Nona Han masih ada di parkiran basement dan lampu ruangannya di lantai atas belum dimatikan.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa membuang waktu, Junwoo langsung berlari menuju lift dan naik ke lantai ruang kerja Na Eun. Lorong kantor sudah gelap gulita. Junwoo mempercepat langkahnya, membuka pintu kaca ruang kerja Na Eun yang tidak terkunci.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun? Kau masih di—\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Kalimat Junwoo seketika terputus. Matanya membelalak sempurna saat melihat sesosok tubuh anggun tergeletak diam tak bergerak di atas lantai karpet, dekat dengan dispenser udara. Gelas air putih yang dibawanya telah menggelinding jauh di sudut ruangan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Jantungnya mencelos seketika, ia langsung berlari panik dan berlutut di samping tubuh Na Eun. Ia mengangkat kepala Na Eun ke pangkuannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Na Eun-ah! Han Na Eun! Bangun! Hei, kau dengar suaraku?!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menepuk-nepuk pelan pipi Na Eun yang terasa sangat dingin dan pucat. Detak jantung gadis itu melemah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya bergetar hebat karena panik, ia segera merengkuh tubuh Na Eun ke dalam gendongannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Astaga... badanmu dingin sekali. Bertahanlah, tolong!\"</span></p><h3 class=\"c9\" id=\"h.5z2q77kfdsin\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.v8q0qgoalm0v\"><span class=\"c7 c1 c6\">Ketegangan di Ruang UGD</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke lorong Rumah Sakit Pusat Seoul yang bising dan menegangkan. Pintu ganda ruang UGD terbuka lebar. Junwoo dengan napas terengah-engah dan pakaian yang berantakan mendorong brankar tempat Na Eun dibaringkan, didampingi oleh seorang dokter jaga dan dua orang perawat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter Jaga:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tolong siapkan infus saline sekarang! Tuan, apa yang terjadi pada pasien sebelumnya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan cepat di samping brankar, memegang erat ujung tempat tidur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Saya menemukannya sudah pingsan sendirian di lantai ruang kerjanya, Dokter. Wajahnya sangat pucat, kulitnya dingin, dan dia... sepertinya dia belum makan apa pun sejak siang hari!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter Jaga:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, kami akan melakukan pemeriksaan tanda-tanda vital terlebih dahulu. Mohon Tuan menunggu di luar garis pembatas UGD agar kami bisa memasang infus.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menahan lengan dokter tersebut dengan tatapan mata yang memohon)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dokter, tolong... tolong pastikan dia baik-baik saja. Lakukan apapun yang terbaik untuknya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dokter Jaga:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kami akan melakukan tugas kami semaksimal mungkin, Tuan. Silahkan urus administrasi terlebih dahulu dan tenangkan diri Anda.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 309.00px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-13.png\" style=\"width: 602.00px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 282.00px; height: 117.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-14.png\" style=\"width: 558.43px; height: 304.64px; margin-left: -276.43px; margin-top: -92.64px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><h3 class=\"c9\" id=\"h.1p51k9hjmpx3\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.1n3csumbmosb\"><span class=\"c7 c1 c6\">Siuman, Gengsi, dan Debat Kalori Jilid Dua</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Satu jam kemudian di dalam ruang rawat inap VIP yang sunyi. Aroma antiseptik tercium samar. Han Na Eun perlahan-lahan membuka kelopak matanya yang terasa sangat berat. Pandangannya mengabur sebelum akhirnya terfokus pada langit-langit kamar yang putih dan bunyi impus. Saat ia menoleh ke samping, ia mendapati Junwoo sedang duduk di kursi, melipat kedua tangannya di dada dengan tatapan mata yang tajam dan dingin.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya sangat serak, berusaha menggerakkan tangannya yang terpasang jarum infus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ugh... di mana... ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendeham dingin, tidak mengubah posisi duduknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau sedang di rumah sakit. Dan kau pingsan akibat kelaparan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengingat kejadian sebelum pingsan, wajahnya mendadak merona karena malu, namun egonya langsung naik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa... kenapa kau yang ada di sini? Siapa yang memintamu datang ke kantorku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari kursinya, melangkah mendekat ke sisi ranjang dengan wajah kesal yang tidak ditutup-tutupi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau aku tidak datang karena firasatku buruk, kau mungkin baru ditemukan besok pagi oleh staf dalam keadaan yang jauh lebih parah, Han Na Eun! Kau ini benar-benar keras kepala, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha duduk tegak, memaksakan tubuhnya padahal kepalanya masih terasa berputar hebat)</span></p><p class=\"c0\"><span class=\"c1\">\"Aku tidak meminta bantuanmu, Park Junwoo. Aku hanya... hanya sedikit kelelahan karena urusan </span><span class=\"c1 c8\">launching</span><span class=\"c4 c1\"> Florentina. Tubuhku ini kuat, aku sudah biasa—\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langsung menekan pundak Na Eun dengan lembut namun tegas agar gadis itu kembali berbaring)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kuat apanya?! Jangan membual di depan pria yang baru saja menggendong tubuh lemasmu. Kau tahu apa kata dokter tadi? Kau mengalami dehidrasi akut, kelelahan ekstrim, dan penurunan kadar gula darah yang drastis karena melewatkan waktu makan!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c
