c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha sekuat tenaga menyembunyikan getaran suaranya dan air matanya, berbicara dengan nada berterima kasih yang mendalam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya... Ibu. Terima kasih banyak... Naeun sangat berterima kasih kepada Ayah dan Ibu...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo yang berdiri di samping mereka, memperhatikan perubahan emosional Na Eun. Ia tersenyum sangat lembut, merasakan kehangatan yang menjalar di dalam hatinya sendiri melihat bagaimana keluarganya berhasil menyentuh sisi terdalam tunangannya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Ibu, Ayah... Kalau begitu kami berdua pamit jalan dulu ya, karena malam sudah semakin larut.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nak. Hati-hati di jalan ya, Junwoo. Menyetirlah dengan pelan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.lxtf86nw79s7\"><span class=\"c7 c1 c6\">Isak Tangis di Depan Minimarket</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Mobil Junwoo perlahan melaju membelah jalanan malam, meninggalkan gerbang kediaman Park. Begitu siluet rumah tersebut benar-benar menghilang dari pandangan, Han Na Eun mendadak menutupi seluruh wajahnya dengan kedua telapak tangannya. Detik berikutnya, ia langsung menangis sejadi-jadinya di dalam mobil.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak terkejut mendengar suara tangisan hebat di sampingnya, konsentrasinya menyetir agak terpecah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh... Naeun-ah?! Kau kenapa? Kenapa setelah pulang dari rumahku kau malah menangis hebat seperti ini? Ada... ada sesuatu yang salah? Apa ada ucapan orang tuaku yang menyinggung perasaanmu?\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun tidak menjawab. Ia tetap menyembunyikan wajahnya dan terus menangis tersedu-sedu, pundaknya naik turun menahan sesak. Melihat kondisi emosional tunangannya yang tidak stabil, Junwoo berinisiatif memutar kemudi. Ia mencari sebuah minimarket terdekat yang memiliki area tempat duduk di depannya, menepikan mobil, lalu membelikan sesuatu demi menenangkan Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mematikan mesin mobil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kita menepi dan turun dulu di sini sebentar ya, Naeun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Beberapa menit kemudian, di area meja kursi luar minimarket. Suasana malam terasa sunyi. Na Eun masih menelungkupkan kepalanya di atas meja, bahunya masih bergetar kecil karena sisa tangisnya. Junwoo duduk di hadapannya, memandangi Na Eun dengan senyuman yang sangat sabar dan penuh pengertian.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeser sebuah cup kecil)</span></p><p class=\"c0\"><span class=\"c1\">\"Ini, Naeun-ah... Makan es krim cokelat ini dulu. Kata orang, es krim sangat bagus untuk memperbaiki </span><span class=\"c1 c8\">mood</span><span class=\"c4 c1\"> yang sedang berantakan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Perlahan mengangkat kepalanya dari atas meja, matanya tampak sembap dan merah, napasnya masih terisak pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya... terima kasih banyak...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Ia menerima es krim itu, menyuapinya sesendok demi sesendok dengan gerakan lambat).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menopang dagu, menatapnya lekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sebenarnya kau ini kenapa, hm? Tidak biasanya kau menangis sampai sehebat ini di depanku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengusap sudut matanya, berucap dengan suara serak yang masih terisak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku... aku hanya merasa sangat terharu, Junwoo-ya. Perlakuan kedua orang tuamu malam ini... benar-benar membuat hatiku terasa sangat hangat, bahkan sampai aku tidak bisa berkata-kata lagi di depan mereka tadi.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmmm... Jadi kau menangis karena terharu? Lalu, apa ada hal lain lagi yang mengganggu pikiranmu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunduk, menatap es krimnya dengan perasaan bersalah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku juga merasa malu kepadamu, Junwoo-ya. Saat kau berkunjung ke rumahku tadi pagi, Ayahku bahkan langsung membahas urusan masa depan, mendikte langkah karirmu, dan menguji kapasitasmu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sedangkan... orang tuamu malam ini justru hanya menanyai hal-hal kecil tentang masa kecilku. Mereka membuatku sadar bahwa malam ini... mereka hanya ingin mengenal seorang Han Na Eun yang sesungguhnya, bukan siapapun atau status apa pun di belakang namaku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum meneduhkan, meraih jemari Na Eun yang bebas dan menggenggamnya erat)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi hal itu yang membuatmu menangis sejauh ini? Dengarkan aku baik-baik, Naeun-ah. Jika tadi pagi Ayahmu berbicara panjang lebar tentang masa depan dan mendikte bagaimana karierku nanti, menurutku itu adalah hal yang sangat wajar. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Karena bagaimanapun juga, nantinya aku akan menjadi suami dari putri kesayangannya. Beliau pasti ingin memastikan dan tahu dengan jelas bahwa calon menantunya memiliki progres hidup yang jelas. Jadi, tolong jangan dibanding-bandingkan lagi ya, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo mengusap punggung tangan Na Eun dengan ibu jarinya).</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Setiap orang tua memiliki cara dan bahasa yang berbeda-beda dalam menyampaikan rasa kasih sayang mereka kepada anaknya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mungkin, Ayah dan Ibuku melakukan pendekatan santai itu kepadamu malam ini karena memang begitulah bentuk bahasa kasih sayang yang mereka miliki.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendongak, menatap mata Junwoo dengan sisa isak tangisnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya... aku ingin rumah tangga kita nanti bisa seperti Ayah dan Ibumu. Aku ingin kita bisa saling menghargai, tidak saling menuntut, tidak saling mendikte, bisa duduk bersama membahas hal-hal kecil, dan yang pasti... kita bisa saling memberikan ruang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk mantap, tersenyum manis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik... nanti kita wujudkan bersama dalam rumah tangga kita ya. Sudah, jangan menangis lagi. Kau mau jajan apa lagi? Biar aku belikan lagi ke dalam minimarket, bagaimana?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng pelan, senyumnya mulai terbit)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak usah... tidak perlu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bangkit berdiri, berbicara dengan nada jenaka demi mencairkan suasana)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu, ayo kita pulang sekarang. Eh... maksudku, kita kan belum punya rumah bersama ya? Maksudku, ayo aku antar kau pulang ke rumahmu, Tuan Putri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengus geli, memutar bola matanya namun hatinya lega)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini, Park Junwoo... benar-benar tidak bisa diajak serius sebentar saja, ya!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.vajc1fwnuh7l\"><span class=\"c7 c1 c6\">Kontras Keluarga Han dan Rahasia Ibu Gengsi</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke masa sekarang (Tahun 2026), di dalam ruangan spa VVIP.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas panjang, menatap Na Eun dengan mata berbinar kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh... Eonni, cerita masa lalumu ini benar-benar sangat menyentuh hati. Kau bisa merasakan kehangatan yang berbeda dari keluarga Park, tapi disisi lain, Junwoo Oppa selalu bisa menyikapi perbedaan karakter Ayah dengan sangat bijak.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk lembut, menyeruput teh jahenya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Itulah, Daehyun-ah. Aku benar-benar merasa sangat malu saat itu dan merasa tidak enak kepada Junwoo. Tapi dia malah menyikapinya dengan begitu dewasa. Di sisi lain, kedua mertuaku memang memiliki andil yang sangat besar terhadap perubahan cara pandangku mengenai arti sebuah keluarga setelah kejadian malam itu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Maka dari itu, Daehyun-ah... saat kau pertama kali menikah dengan Seo Pyo dulu, aku sempat merasa sangat kesal dengan Ibuku yang terkesan kaku dan tidak memperlakukanmu dengan hangat.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan, menggelengkan kepalanya santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Eonni... wajar saja jika Ibu bersikap seperti itu dulu. Kebiasaanku kan memang sangat kontras dengan aturan di Keluarga Han. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Lagipula, dulu aku kan juga masih sangat aktif bekerja di dunia hiburan (</span><span class=\"c1 c8\">entertainment</span><span class=\"c4 c1\">). Jadi, menurutku mungkin saja Ibu bersikap kaku seperti itu karena beliau hanya sedang menjaga batasan-batasan yang memang harus diterapkan sebagai menantu baru.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Daehyun dengan tatapan tidak percaya, lalu tertawa kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, kau ini ternyata sama saja ya dengan Junwoo... Selalu saja punya sudut pandang yang berbeda dan bijak dalam memandang sikap kaku orang tuaku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hehehehe)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, dong... Tapi sebenarnya, Ibu itu aslinya tipe yang bisa mengayomi kok, Eonni. Hanya saja, memang harus kuakui caranya menyampaikan sesuatu itu agak kaku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum penuh arti, mendekatkan posisi duduknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, mungkin saja benar kata mu dan memang sebagai putrinya yang sudah hidup bertahun-tahun dengannya, aku merasakan kalau Ibu itu memang gengsian. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Oh ya, omong-omong... sebenarnya Ibu itu sangat ingin mengajakmu ikut mendampingi beliau saat menghadiri acara-acara resmi di lingkungan sosialitanya. Tapi sepertinya sampai sekarang beliau belum memberitahumu langsung, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menoleh dengan dahi berkerut bingung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh? Kenapa Ibu malah ingin mengajakku, Eonni? Apakah nanti perginya bersama dengan Eonni juga?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja tidak, aku langsung menolaknya mentah-mentah. Aku selalu memakai alasan sibuk mengurusi bisnis, hahaha! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi Ibu memang sangat tertarik untuk mengajakmu. Hanya saja, ya begitu... Ibu terlalu gengsi untuk menyampaikannya langsung kepadamu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kebetulan di yayasan Ibu dan lingkungan sosialnya itu diisi oleh banyak sekali orang-orang dari dunia seni rupa, seperti kolektor lukisan dan sebagainya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Beliau pasti merasa sangat membutuhkan kehadiranmu di sana, karena kau jauh lebih paham dan menguasai soal dunia seni dibanding kami semua.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar, tersenyum senang mendapat informasi itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, jadi begitu ceritanya... Baiklah, kalau begitu coba nanti setelah ini aku yang akan berinisiatif menanyakannya langsung kepada Ibu ya, Eonni.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengedipkan sebelah matanya dengan jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tenang saja, nanti di sela-sela waktu makan malam keluarga, coba aku bantu pancing dan tanyakan lagi ke Ibu biar dia tidak gengsi lagi, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Mungkin Karena Aku Tidak Pernah Melupakannya", "html": "<p class=\"c10 title\" id=\"h.gzfghhcaew8u\"><span class=\"c23 c13\">Mungkin Karena Aku Tidak Pernah Melupakannya</span></p><h3 class=\"c11\" id=\"h.6hppa2h8dlyg\"><span class=\"c7 c1 c6\">Plan B dan Ketegangan di Ruang Rapat</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana siang hari menjelang makan siang di ruang rapat utama kantor Florentina. Suasana terasa tegang dan kaku. Beberapa berkas laporan keuangan dan grafik performa produk terpajang di layar proyektor. Na Eun duduk di kepala meja, memegangi pelipisnya yang mulai terasa pening melihat data yang tidak sesuai target.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetuk meja dengan pulpen, suaranya tegas)</span></p><p class=\"c0\"><span class=\"c1\">\"Bagaimana ini? Kalian harus membuat kalkulasi yang jelas. Jika </span><span class=\"c1 c8\">Plan A</span><span class=\"c1\"> tidak berjalan sesuai rencana, </span><span class=\"c1 c8\">Plan B</span><span class=\"c4 c1\"> harus sudah siap dengan opsi-opsi yang matang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Manajer:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membetulkan posisi kacamata, sedikit gugup)</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, Ibu. Kami sudah mengevaluasi beberapa poin penting untuk tetap memaksimalkan </span><span class=\"c1 c8\">Plan A</span><span class=\"c1\">... \" </span><span class=\"c1 c8\">(berdiri dan menunjukkan data di layar untuk menjelaskan)</span><span class=\"c4 c1\"> \"...berikut adalah rincian penyesuaian dari divisi kami.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap tajam ke arah layar)</span></p><p class=\"c0\"><span class=\"c1\">\"Lalu keputusannya apa? Kita sudah mengeluarkan </span><span class=\"c1 c8\">budget</span><span class=\"c4 c1\"> yang sangat banyak. Memaksimalkan sektor promosi, karena itu adalah satu-satunya opsi terbaik kita untuk menutupi kerugian saat peluncuran produk kemarin.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Kepala Pemasaran:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk cepat, membuka berkasnya)</span></p><p class=\"c0\"><span class=\"c1\">\"Baik, Bu. Kami akan segera mengevaluasi strategi pemasaran kedepannya. Data yang dilampirkan oleh divisi lainnya juga akan kami maksimalkan dalam kampanye baru ini.\" </span><span class=\"c5 c1\">(sambil menunjukkan tabel data pendukung)</span></p><h3 class=\"c11\" id=\"h.kjm2f0f7c1w3\"><span class=\"c1 c6 c8 c19\">Pop-Up Chat</span><span class=\"c7 c1 c6\"> yang Memecah Konsentrasi</span></h3><p class=\"c0 c2\"><span class=\"c30 c1 c6 c8\"></span></p><p class=\"c0\"><span class=\"c30 c1 c6 c8\">Ting!</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suara notifikasi ponsel memecah keheningan di tengah suasana rapat yang sedang tegang. Na Eun, yang semula masih memegangi pelipisnya dengan raut wajah kaku, melirik sekilas ke arah layar ponselnya yang menyala di atas meja. Matanya seketika membelalak kaget.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c8\">(Sebuah pesan pop-up dari Junwoo muncul di layar: </span><span class=\"c1 c6 c8\">\"Sayang...\"</span><span class=\"c5 c1\">)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c8\">(Namun, belum sempat Na Eun mencerna pesan itu, beberapa detik kemudian pesan tersebut langsung dihapus oleh pengirimnya. Tak lama setelah itu, sebuah pesan baru masuk kembali dari kontak yang sama: </span><span class=\"c1 c6 c8\">\"Han Na Eun, aku akan menjemputmu dalam waktu 30 menit lagi. Kita akan makan siang bersama dengan para ibu (Nyonya Han &amp; Nyonya Park).\"</span><span class=\"c5 c1\">)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Seketika Na Eun merasa ada yang aneh dengan sikap Junwoo. Fokusnya terhadap materi rapat langsung buyar. Di dalam benaknya, ia mulai bergumam sendiri sembari menahan senyum yang tiba-tiba terbit di bibirnya. </span><span class=\"c1 c8\">'Kenapa dia tiba-tiba menghapus chat sapaan itu? Dasar Park Junwoo... suka sekali mencari gara-gara dan usil,'</span><span class=\"c4 c1\"> batinnya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf Rapat:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperhatikan perubahan ekspresi wajah atasannya yang mendadak tersenyum sendiri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf, Nona Han... apakah ada poin atau data baru yang perlu dipertimbangkan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersentak, buru-buru membuyarkan lamunannya dan kembali memasang wajah formal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh... tidak. Kalian bisa mengirimkan semua datanya ke email saya saja. Nanti akan saya tinjau kembali secara perlahan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Manajer:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi... untuk rapat siang ini belum ada keputusan final yang diambil, Ibu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merapikan berkasnya)</span></p><p class=\"c0\"><span class=\"c1\">\"Ehm... jalankan saja dulu </span><span class=\"c1 c8\">Plan B</span><span class=\"c4 c1\"> sambil terus dievaluasi perkembangannya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Kepala Pemasaran:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bangkit dari kursinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalian semua bisa bubar sekarang, karena ini juga sudah mendekati jam makan siang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Semua Staf:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, terima kasih, Ibu.\"</span></p><h3 class=\"c11\" id=\"h.lra6rh1nsuqd\"><span class=\"c7 c1 c6\">Pertanyaan di Dalam Mobil</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Tepat pukul 12 siang, mobil Sedan hitam milik Junwoo sudah terparkir rapi di depan lobi kantor Florentina. Junwoo tampak berdiri bersandar di pintu mobil. Begitu melihat Na Eun melangkah keluar dari pintu lobi, ia langsung membukakan pintu kursi penumpang.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum menyapa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kukira aku harus menyusul dan menghampirimu ke dalam ruanganmu tadi. Biasanya kan kau masih sibuk tenggelam dengan tumpukan pekerjaanmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Masuk ke dalam mobil, menyahut pendek dengan wajah cemberut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak ada. Pekerjaanku sudah selesai.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Masuk ke kursi kemudi, melirik wajah tunangannya sebelum menjalankan mobil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa wajahmu cemberut begitu? Apa sedang ada masalah di kantor?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memasang sabuk pengaman, membuang muka ke arah jendela)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak ada apa-apa. Ayo cepat berangkat.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mobil perlahan melaju meninggalkan area kantor, membelah jalanan kota menuju sebuah restoran mewah di pusat kota.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sembari fokus menyetir, terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini... selalu saja tidak mau jujur padaku. Kenapa lagi, Han Na Eun?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memutar tubuhnya, menatap Junwoo dengan pandangan menyelidik)</span></p><p class=\"c0\"><span class=\"c1\">\"Tadi... sebelum kau mengirim pesan konfirmasi tentang makan siang dengan para ibu, kau sempat mengirim pesan lain, kan? Apa isi pesan yang kau hapus itu?\" </span><span class=\"c5 c1\">(bertanya dengan nada pura-pura tidak tahu)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menahan senyum, pura-pura berpikir)</span></p><p class=\"c0\"><span class=\"c1\">\"Hmm... pesan yang mana, ya? Ah, sepertinya bukan apa-apa, kok. Tidak penting juga, hehe.\" </span><span class=\"c5 c1\">(menyahut dengan nada menggoda)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Nada suaranya meninggi, mulai merasa kesal karena dipermainkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Park Junwooo... !\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas melihat reaksi menggemaskan di sampingnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Ternyata seorang Han Na Eun yang terkenal dingin bisa bersikap manja dan penasaran setengah mati hanya gara-gara satu pesan yang kuhapus, ya? Iya, iya... aku mengaku.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun tetap melipat tangannya di dada, masih cemberut dengan wajah kesal yang dibuat-buat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meliriknya dengan tatapan jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kurasa... aku memang masih belum pantas untuk mengirimi pesan dengan sapaan 'sayang' untuk saat ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh cepat, menuntut penjelasan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa berpikir begitu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengedipkan sebelah matanya, tertawa usil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kita simpan saja sapaan 'sayang' itu untuk setelah kita resmi menikah nanti, ya? Biar sekarang kau makin penasaran dan terus memikirkanku setiap hari, hahahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memukul pelan lengan Junwoo dengan tas kecilnya, wajahnya merona merah karena salah tingkah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, Park Junwoo... !!!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.f23dg2hm2k5\"><span class=\"c7 c1 c6\">Pertemuan Dua Ibu dan Rencana Tiga Tahap</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana sebuah restoran mewah bernuansa privat di pusat kota Seoul. Nyonya Han dan Nyonya Park sudah duduk anggun di salah satu meja bundar dekat jendela besar yang menampilkan lanskap kota. Begitu pintu ruang privat diketuk, sosok Junwoo dan Na Eun muncul.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya langsung cerah, melambaikan tangan hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahh, kalian berdua sudah datang... Ayo masuk, Naeun-ah, Junwoo-ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... maaf membuat kalian menunggu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk anggun dengan senyum formal khasnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo, silakan duduk kalian berdua.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun dan Junwoo mengambil tempat duduk berdampingan di hadapan kedua ibu mereka).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperbaiki posisi duduknya, langsung bertanya ke inti poin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi, apa saja agenda yang akan kita bahas siang ini, Ibu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Isyarat memanggil pramusaji)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalian berdua pesan menu makan siang dulu saja. Kita akan membahas semuanya secara santai sambil makan.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Beberapa saat kemudian, setelah hidangan utama tersaji dengan rapi di atas meja, obrolan mengenai persiapan pernikahan pun resmi dimulai).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Untuk konsep detail pernikahan, seperti yang sudah disepakati oleh para orang tua sebelumnya, kami memutuskan untuk memberikan wewenang penuh kepada kalian berdua.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyeka bibirnya dengan serbet katun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar. Kita semua tahu pesta pernikahan kalian harus terlaksana dalam tahun 2012 ini juga. Secara tahapan, nanti akan dibagi menjadi tiga: pertama ada acara pemberkatan, lalu resepsi awal yang dikhususkan untuk teman-teman dekat kalian, dan terakhir resepsi utama untuk menyambut para kolega bisnis kami, para orang tua.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk mantap)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik. Untuk acara pemberkatan, kami ingin suasananya sangat privat dan hanya dihadiri oleh keluarga besar inti saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum meneduhkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu, tidak masalah, Naeun-ah. Ibu sangat setuju dengan konsep itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh sumpitnya sejenak, tampak berpikir)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu, dalam kurun waktu empat bulan ke depan, apakah waktunya akan benar-benar terkejar? Mengingat kompleksitas dan skala besar untuk acara resepsi utama kolega keluarga nanti?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melambaikan tangan santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudahlah, Junwoo-ya, jangan terlalu cemas. Untuk masalah vendor, pengurusan gedung, dan detail rumit lainnya, biar pihak kami para orang tua yang menyiapkan semuanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Alisnya sedikit bertaut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... tapi aku tetap mau memilih sendiri konsep visual dan gaya pernikahan kita, Ibu. Seperti gaun pengantin, dekorasi panggung, dan hal-hal esensial lainnya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau memang itu maumu. Kalau begitu, dalam seminggu ini mungkin kami para ibu akan meminta sedikit waktu luang kalian di sela pekerjaan untuk mencocokkan jadwal vendor gaun.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Na Eun sambil tersenyum pasrah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau saya sih mengikuti saja bagaimana baiknya para ibu dan Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu, Nak.\"</span></p><h3 class=\"c11\" id=\"h.98l4m84wggpb\"><span class=\"c7 c1 c6\">Otoritas Bulan Madu dan Interupsi Penengah</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melanjutkan pembicaraan dengan nada tegas tanpa celah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya, kami juga sudah mempersiapkan rencana bulan madu secara langsung tepat setelah rangkaian pernikahan selesai. Tanpa jeda waktu lagi. Pihak agensi perjalanan terbaik sudah kami siapkan untuk kalian.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika meletakkan garpunya sedikit keras, raut wajahnya berubah kaku)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... untuk urusan bulan madu, tolong biarkan aku dan Junwoo sendiri yang menentukan tempat dan waktunya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, nadanya meninggi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa harus repot begitu? Kalian berdua ini sama-sama sibuk mengurus bisnis. Kalau terus ditunda-tunda dengan alasan mengatur jadwal sendiri, yang ada kalian malah tidak jadi berangkat sama sekali.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar dikte yang begitu familiar dari ibunya, kepalan tangan Na Eun di bawah meja meremas roknya sendiri. Dadanya bergemuruh. Ia sekuat tenaga menarik napas dalam-dalam, berusaha menenangkan amarah dan ego yang mulai tersulut oleh cara ibunya yang selalu ingin memegang kendali atas hidupnya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyadari perubahan atmosfer, langsung memegang tangan Nyonya Han dengan senyum lembut sebagai penengah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah, tidak apa-apa, Nyonya Han... Biarkan anak-anak yang mengurus dan merencanakan waktu bulan madu mereka sendiri. Kita sekarang bisa fokus penuh untuk menyukseskan acara pernikahannya dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar bujukan yang halus namun tegas dari besannya, Nyonya Han akhirnya menghela napas pasrah dan mengangguk setuju, meskipun wajahnya masih menyiratkan sedikit rasa tidak puas).</span></p><h3 class=\"c11\" id=\"h.f13n9dw274er\"><span class=\"c7 c1 c6\">Ngedumel di Dalam Mobil dan Sudut Pandang Berbeda</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Pertemuan makan siang selesai. Setelah berpamitan, Na Eun dan Junwoo kembali ke dalam mobil. Begitu pintu mobil tertutup rapat dan kendaraan mulai melaju membelah jalanan, pertahanan kaku Na Eun runtuh. Ia langsung bersedekap, meluapkan seluruh kekesalan yang dipendamnya sejak di restoran tadi.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ngedumel kesal, suaranya bergetar menahan dongkol)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau lihat sendiri kan, Junwoo-ya? Ibu selalu saja seperti itu! Bahkan untuk urusan bulan madu pun dia harus mendikte dan mengatur semuanya seolah-olah kami ini robot yang tinggal mengikuti jadwalnya saja! Aku benar-benar tidak habis pikir dengan jalan pikirannya!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tetap menyetir dengan tenang, melirik Na Eun sekilas dengan senyum simpul yang teduh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha... ambillah napas dulu, Han Na Eun. Jangan langsung menguras energimu begitu setelah makan siang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh cepat, merengut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau malah tertawa? Kau tidak merasakan betapa sesaknya terus-menerus diatur seperti itu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengulurkan tangan kirinya, mengusap puncak kepala Na Eun dengan lembut sebelum kembali fokus ke setir)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku mengerti perasaanmu, Naeun-ah. Tapi cobalah melihatnya dari sudut pandang yang berbeda. Ibu (Nyonya Han) bersikap kaku seperti itu mungkin karena beliau hanya ingin memastikan bahwa segala sesuatunya berjalan dengan sempurna dan terbaik untuk putrinya bahkan untuk kehidupan setelah pernikahan kita nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengalihkan pandangan ke luar jendela, mendengus pelan namun hatinya perlahan mulai melunak mendengar suara tenang Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi caranya itu... selalu saja membuatku tertekan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya melembut, penuh kedewasaan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Itulah kenapa kita di sini bersama, kan? Untuk saling menyeimbangkan. Jika caramu menghadapi ibumu adalah dengan benturan, maka biarkan aku yang menjadi jembatan peredamnya. Lagipula, pada akhirnya kita tetap bisa menentukan bulan madu kita sendiri, bukan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Junwoo dari sudut matanya, senyum tipis akhirnya terukir di wajahnya yang lelah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya... ibumu benar-benar penyelamatku siang ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, kalau begitu senyum dong. Calon pengantin tidak boleh terlalu banyak cemberut, nanti gaun pilihannya jadi tidak muat karena aura stres, lho.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencibir gemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa hubungannya aura stres dengan muatnya gaun, Park Junwoo? Teori aneh dari mana lagi itu!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.72morpsfqfey\"><span class=\"c7 c1 c6\">Ruang Kamar dan Chat Kasmaran Larut Malam</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di dalam kamar pribadi Na Eun. Kamar yang biasanya sunyi dan kaku itu kini terasa hangat. Na Eun tampak berbaring telungkup di atas tempat tidurnya sembari memandangi layar ponsel. Wajahnya yang biasa dingin kini dihiasi senyum-senyum sendiri sebuah ekspresi kasmaran khas remaja usia 20-an yang sedang jatuh cinta menjelang hari pernikahan mereka.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Isi Chat:</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Kau ini kenapa dulu bahkan tidak mau berdiskusi denganku, secara langsung sama sekali saat kita membahas urusan </span><span class=\"c1 c8\">workshop</span><span class=\"c4 c1\">? Apa jangan-jangan kau saat itu sedang gugup, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Enak saja! Aku bukan tipe wanita seperti itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Lalu kalau bukan gugup, apa? Kau tahu sendiri kan bagaimana reputasiku di kampus dulu seperti apa? 😎\" </span><span class=\"c5 c1\">(nada menggoda)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Siapa peduli? 😜\" </span><span class=\"c5 c1\">(nada acuh namun menggoda balik)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun... Han Na Eun... Kau ini bisa-bisanya bilang 'siapa peduli', padahal sebentar lagi kau mau menikah denganku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... Kau sendiri, Junwoo-ya... Kenapa kau akhirnya memilihku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Memangnya apa kau perlu tahu? Katanya tadi tidak peduli.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Park Junwoo... dasar kau ini!\"</span></p><p class=\"c0 c2\"><span class=\"c30 c1 c6 c8\"></span></p><p class=\"c0\"><span class=\"c30 c1 c6 c8\">Krekkk...</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suara engsel pintu kamar yang dibuka mendadak seketika membuyarkan atmosfer romantis di dalam kamar Na Eun. Nyonya Han berdiri di ambang pintu dengan wajah serius).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah... Ibu sudah memanggil namamu dari tadi di bawah. Turun sekarang, ada beberapa detail penting pernikahan yang harus kau lihat malam ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak mematikan layar ponselnya dengan gugup, merapikan duduk)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh... iya, maaf, Ibu. Aku tadi tidak dengar suaranya. Aku segera turun sekarang.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sebelum beranjak dari kasur, Na Eun mengetik pesan singkat terakhir dengan cepat).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Isi Chat:</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Daa, Park Junwoo yang menyebalkan! Bye!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hey, Han Na Eun, kau mau ke mana dulu...\"</span></p><h3 class=\"c11\" id=\"h.l8aggs78stu7\"><span class=\"c7 c1 c6\">Siluet Gaun, Hanbok Kerajaan, dan Prinsip Dua Sisi</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana ruang tamu kediaman Keluarga Han. Di sana telah berkumpul beberapa orang profesional yang duduk rapi lengkap dengan katalog eksklusif, iPad, dan beberapa sampel kain premium. Salah satunya adalah tim desainer papan atas).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Desainer:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat malam, Nona Han. Kami dari tim desainer gaun pernikahan. Secara khusus malam ini kami datang untuk mempresentasikan beberapa opsi gaun dan hanbok yang akan dikenakan oleh calon pengantin serta keluarga besar nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Duduk di samping ibunya, memasang wajah profesional)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, baiklah. Silakan dimulai.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Desainer:</span></p><p class=\"c0\"><span class=\"c1\">\"Baik, Nona Han. Secara nama model atau potongan di dalam dunia busana pengantin, kami menggunakan istilah siluet (</span><span class=\"c1 c8\">silhouette</span><span class=\"c4 c1\">) untuk membedakan bentuk dasar sebuah gaun. Berikut adalah lima model gaun pernikahan paling standar dan populer di dunia yang bisa Anda pilih:</span></p><h3 class=\"c11\" id=\"h.xkleolckgfhc\"><span class=\"c7 c1 c6\">Pilihan Siluet Gaun Pernikahan</span></h3><h4 class=\"c15\" id=\"h.q9mp5gndgxzg\"><span class=\"c3 c1\">1. Ball Gown (Model Putri Kerajaan)</span></h4><ul class=\"c27 lst-kix_ua092vx4ummy-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Bentuk:</span><span class=\"c4 c1\"> Korset super ketat di bagian atas, lalu kainnya mengembang sangat lebar seperti kubah mulai dari batas pinggang ke bawah.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Kesan:</span><span class=\"c4 c1\"> Sangat mewah, dramatis, dan memberikan aura layaknya Cinderella atau putri kerajaan.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Cocok untuk:</span><span class=\"c1\"> Acara formal di dalam gedung besar (</span><span class=\"c1 c8\">ballroom</span><span class=\"c4 c1\">). Model ini sangat bagus untuk menyembunyikan area pinggul atau paha yang besar.</span></li></ul><h4 class=\"c15\" id=\"h.4to54kyob3fu\"><span class=\"c3 c1\">2. A-Line (Model Huruf A)</span></h4><ul class=\"c27 lst-kix_eapapp6530jm-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Bentuk:</span><span class=\"c4 c1\"> Ketat di bagian dada hingga pinggang, lalu melebar secara perlahan membentuk huruf \"A\" kapital menuju lantai.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Kesan:</span><span class=\"c4 c1\"> Klasik, anggun, aman, dan tidak lekang oleh waktu.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Cocok untuk:</span><span class=\"c4 c1\"> Semua bentuk tubuh. Ini adalah model paling fleksibel yang sangat populer karena memberikan ilusi tubuh lebih tinggi dan ramping.</span></li></ul><h4 class=\"c15\" id=\"h.ctovjyhz1a0y\"><span class=\"c3 c1\">3. Mermaid / Trumpet (Model Putri Duyung)</span></h4><ul class=\"c27 lst-kix_yqdklxye5k-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Bentuk:</span><span class=\"c4 c1\"> Memeluk ketat lekuk tubuh dari dada, pinggang, hingga area lutut. Dari bawah lutut, kainnya baru melebar keluar layaknya ekor putri duyung.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Kesan:</span><span class=\"c1\"> Seksi, glamor, modern, dan sangat menonjolkan lekuk tubuh (</span><span class=\"c1 c8\">hourglass figure</span><span class=\"c4 c1\">).</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Cocok untuk:</span><span class=\"c4 c1\"> Pengantin yang percaya diri dengan lekuk tubuhnya dan ingin tampil mencolok di pesta malam hari.</span></li></ul><h4 class=\"c15\" id=\"h.kbto09nmxaqt\"><span class=\"c3 c1\">4. Sheath / Column (Model Lurus)</span></h4><ul class=\"c27 lst-kix_j4jrchxfy2n4-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Bentuk:</span><span class=\"c4 c1\"> Potongan lurus dari atas ke bawah yang mengikuti bentuk tubuh alami tanpa tambahan volume kain yang mengembang.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Kesan:</span><span class=\"c4 c1\"> Minimalis, modern, santai, dan sangat praktis.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Cocok untuk:</span><span class=\"c1\"> Pernikahan konsep pantai (</span><span class=\"c1 c8\">beach wedding</span><span class=\"c1\">), taman (</span><span class=\"c1 c8\">outdoor</span><span class=\"c1\">), atau </span><span class=\"c1 c8\">intimate party</span><span class=\"c1\"> karena model gaun dari katalog </span><span class=\"c1 c8\">The Knot</span><span class=\"c4 c1\"> ini sangat ringan dan memudahkan Anda untuk berjalan bebas.</span></li></ul><h4 class=\"c15\" id=\"h.boa4hrhcblhz\"><span class=\"c3 c1\">5. Empire Waist (Model Dada Tinggi)</span></h4><ul class=\"c27 lst-kix_gr6s0xj3r635-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Bentuk:</span><span class=\"c4 c1\"> Memiliki garis potongan pinggang yang sengaja dinaikkan hingga tepat berada di bawah dada. Sisa kain ke bawahnya akan jatuh mengalir dengan longgar.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Kesan:</span><span class=\"c1\"> Klasik, bergaya kuno yang romantis (</span><span class=\"c1 c8\">vintage/regency</span><span class=\"c4 c1\">), dan sangat anggun.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">Cocok untuk:</span><span class=\"c4 c1\"> Pengantin yang sedang hamil, bertubuh mungil (karena memberikan ilusi kaki yang sangat panjang), atau yang ingin menyembunyikan area perut.</span></li></ul><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Desainer:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, dari kelima nama model di atas, siluet mana yang menurut Anda paling menarik dan Anda sukai, Nona Han?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kalau untuk pilihan busana Hanboknya sendiri bagaimana?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Desainer:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Untuk opsi hanbok pernikahan ini, kami menyiapkan tiga konsep utama, Nona Han:</span></p><ul class=\"c27 lst-kix_i0hu73nha2-0 start\"><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">1. Hanbok Pernikahan Tradisional (Hwarot atau Wonsam):</span><span class=\"c1\"> Model ini meniru pakaian </span><span class=\"c1 c8\">royal</span><span class=\"c1\"> atau putri kerajaan zaman dahulu. Ciri khasnya menggunakan jubah luar yang panjang dengan sulaman motif burung </span><span class=\"c1 c8\">phoenix</span><span class=\"c1\"> atau bunga yang sangat detail. Memberikan kesan yang sangat mewah, formal, dan sakral. Biasanya menggunakan warna-warna berani seperti merah terang atau hijau tua yang dipadukan dengan rok (</span><span class=\"c1 c8\">chima</span><span class=\"c4 c1\">) berwarna kontras.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">2. Hanbok Pernikahan Modern Serba Putih:</span><span class=\"c1\"> Bagi Anda yang menyukai konsep minimalis namun tetap anggun, model ini menggabungkan siluet hanbok dengan konsep gaun pengantin barat (</span><span class=\"c1 c8\">wedding gown</span><span class=\"c1\">). Seluruh bagian hanbok dibuat menggunakan warna putih bersih atau </span><span class=\"c1 c8\">broken white</span><span class=\"c1\"> dengan kombinasi kain brokat, </span><span class=\"c1 c8\">lace</span><span class=\"c1\"> (renda), </span><span class=\"c1 c8\">satin silk</span><span class=\"c1\">, hingga kain organza berlapis. Terlihat sangat suci, anggun, dan sangat cocok jika dipadukan dengan tudung pengantin (</span><span class=\"c1 c8\">wedding veil</span><span class=\"c4 c1\">) yang panjang.</span></li><li class=\"c0 c16 li-bullet-0\"><span class=\"c1 c6\">3. Hanbok Gaun A-Line / Ballgown:</span><span class=\"c1\"> Model ini memiliki modifikasi besar pada bagian bawah atau roknya (</span><span class=\"c1 c8\">chima</span><span class=\"c1\">). Bagian atasan (</span><span class=\"c1 c8\">jeogori</span><span class=\"c1\">) tetap mempertahankan potongan khas hanbok tradisional, namun bagian rok dibuat sangat mekar dan mengembang lebar seperti gaun </span><span class=\"c1 c8\">ballgown</span><span class=\"c4 c1\"> Barat. Memberikan siluet tubuh yang jenjang dan efek megah layaknya seorang putri saat berjalan di pelaminan.\"</span></li></ul><h3 class=\"c11\" id=\"h.8qgf8foo54wc\"><span class=\"c7 c1 c6\">Otoritas Pengantin dan Gengsi Nyonya Han</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menutup brosur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, kalian bisa mengirimkan semua detail visual ini ke alamat email pribadiku. Besok lusa akan saya tinjau kembali dan langsung saya putuskan bersama dengan calon suamiku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sela pembicaraan, mengerutkan dahi tidak setuju)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun... putuskan saja sekarang selagi tim desainer ada di sini. Lagipula, Junwoo itu anak laki-laki, dia pasti akan setuju-setuju saja dengan apapun pilihanmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap ibunya dengan tatapan tegas tak tergoyahkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu, ini adalah pernikahanku dan dia adalah calon suamiku. Aku harus memutuskan perkara ini bersama-sama dengannya. Biar bagaimanapun, dia harus ikut ambil andil dan tahu wanita yang dia nikahi nanti mau mengenakan baju seperti apa di pelaminan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Desainer:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum ramah, buru-buru menengahi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, tidak apa-apa, Nona Han. Dengan senang hati kami akan menunggu keputusan matang dari Anda berdua.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas, mengibaskan tangannya kaku)</span></p><p class=\"c0\"><span class=\"c1\">\"Ya sudah. Lalu untuk masalah cincin pernikahan, ini kebetulan ada tim desainer dari pihak </span><span class=\"c1 c8\">jewelry</span><span class=\"c4 c1\">-nya yang sudah menunggu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk kecil pada perwakilan perhiasan)</span></p><p class=\"c0\"><span class=\"c1\">\"Oh, kalau untuk urusan itu, besok aku dan calon suamiku yang akan langsung datang berkunjung ke </span><span class=\"c1 c8\">store</span><span class=\"c4 c1\"> kalian. Biar kami bisa meninjau dan memilih langsung desainnya di sana.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Jewelry:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat, sumringah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, baik, Nona Han. Dengan senang hati kami akan menyambut kedatangan Anda dan Tuan Park besok.\"</span></p><h3 class=\"c11\" id=\"h.rzo6gk4ogg79\"><span class=\"c7 c1 c6\">Perdebatan Setelah Tim Vendor Pulang</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah semua perwakilan tim dekorasi dan pakaian pernikahan pulang meninggalkan rumah, Nyonya Han langsung melipat tangannya di dada dan menegur putrinya dengan nada bicara yang kaku).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun... Ibu sengaja mengundang mereka semua ke rumah malam-malam begini agar bisa memudahkan kita dalam mempersiapkan segalanya. Tapi kau ini... kenapa malah menunda-nunda dan harus menunggu keputusan dari Junwoo segala?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri, menatap ibunya tenang namun sarat penekanan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu, kan sejak awal aku sudah bilang. Ini adalah pernikahanku dengan Park Junwoo. Jadi, biarkan kami yang menentukan apa yang akan melekat di tubuh kami berdua nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengus kesal, membuang muka)</span></p><p class=\"c0\"><span class=\"c1\">\"Kau ini keras kepala sekali... Ya sudah, kalau begitu urusan pemilihan hotel dan seluruh menu </span><span class=\"c1 c8\">catering</span><span class=\"c4 c1\"> resepsi utama, itu mutlak menjadi urusan Ibu yang mengatur. Jangan didebat lagi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengembuskan napas panjang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, untuk urusan hotel dan makanan, silahkan Ibu yang atur saja.\"</span></p><h3 class=\"c11\" id=\"h.1eutz3c3fma6\"><span class=\"c7 c1 c6\">Pesan Cuti di Sepertiga Malam</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Na Eun melangkah kembali ke dalam kamarnya dengan perasaan yang agak dongkol akibat perdebatan dengan ibunya. Ia duduk di tepi tempat tidur, mengambil ponselnya, lalu dengan gerakan cepat mengetik pesan singkat ke nomor Junwoo).</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Isi Chat:</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Besok kosongkan seluruh jadwal mu, aku akan mengambil cuti kantor. Pagi-pagi sekali kita harus bertemu. Ada banyak hal yang mau aku obrolkan denganmu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.u1xyqo3zorr0\"><span class=\"c1 c6 c19\">Masker Wajah, Rutinitas </span><span class=\"c1 c6 c8 c19\">Green House</span><span class=\"c7 c1 c6\">, dan Kepribadian yang Tertukar</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke masa sekarang (Tahun 2026), di dalam ruangan spa VVIP. Langkah perawatan kini telah beralih. Wajah Na Eun dan Daehyun sudah dilapisi masker wajah yang memberikan efek sejuk, sementara dua orang terapis dengan telaten melakukan perawatan manicure dan pedicure pada kuku-kuku mereka. Suasana rileks berpadu dengan tawa kecil Daehyun setelah mendengar cerita kilas balik pernikahan kakaknya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbicara pelan agar maskernya tidak pecah, menahan tawa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, Eonni... kau benar-benar berani ya membantah Ibu saat itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa tidak? Saat itu aku sudah memutuskan kalau pernikahan ini harus berjalan sesuai dengan kemauanku dan Junwoo. Ini murni pernikahan kami, bukan pilihan atau kendali penuh dari orang tua.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas, menatap kukunya yang sedang dibersihkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya ya... Eonni, dulu saat aku sendiri yang menikah dengan Seo Pyo, aku bahkan sama sekali tidak berani membantah Ibu Mertua saat sedang meninjau gaun pengantin dan keperluan lainnya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, karena itu, Daehyun-ah... Kenapa kau yang akhirnya menjadi menantu Ibuku? Itu karena kau sangat menghargai dan menuruti beliau, sedangkan aku? Aku selalu saja menantangnya, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sifatmu ini lucu sekali, Eonni. Tapi, apa kalian berdua tidak pernah sekalipun memiliki pendapat yang sama?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Hampir jarang sekali! Karena kesukaan aku dan Ibu itu benar-benar berbeda 180 derajat. Bahkan, kau tahu sendiri kan rutinitas mingguan Ibu di </span><span class=\"c1 c8\">green house</span><span class=\"c4 c1\">-nya? Yaitu merangkai bunga... Uhhhh, aku selalu merasa sangat penat dan bosan setengah mati dengan kegiatan itu! Junwoo bahkan selalu tertawa setiap kali dia melihat ekspresi bosanku saat sedang diajari Ibu merangkai bunga.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini ada-ada saja, Eonni... Benar kata Junwoo Oppa, kau ini memang unik.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum mengingat masa lalu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau tahu, Daehyun-ah? Bahkan dulu, saat Junwoo sampai dua kali menjabat sebagai Menteri Luar Negeri, aku selalu menolak ajakan Ibu untuk menghadiri acara-acara formal pejabat dan perkumpulan sosialita. Aku paling tidak suka berbasa-basi, lingkungan seperti itu sama sekali tidak cocok denganku. Dan lucunya, justru Ibumu Nyonya Na yang selalu menolongku! Beliau yang selalu melobi Ibuku agar aku bisa lolos dari jeratan acara kaku itu dengan alasan aku ada pertemuan bisnis mendesak, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya membelalak kaget di balik masker)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, ya? Aku baru tahu soal ini sekarang! Bahkan Ibuku sendiri tidak pernah menceritakan rahasia itu padaku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Aku bahkan kadang bilang begini ke Junwoo... </span><span class=\"c1 c8\">'Junwoo-ya, aku rasa Ibuku dan Nyonya Na memiliki putri dengan kepribadian yang tertukar deh,'</span><span class=\"c4 c1\"> hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, Eonni... ada-ada saja pikiranmu!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi itu benar! Junwoo juga mengiyakan hal itu. Kau bisa tampil dengan sangat anggun saat menghadiri acara formal di kementerian atau saat mendampingi Seo Pyo. Kau bahkan sering sekali tampil di depan publik bersama mereka. Sedangkan aku? Aku hampir jarang sekali datang karena alasan pemisahan antara dunia bisnis dan dunia politik, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencibir gemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni... kau itu memang sangat pintar dan genius kalau urusan mencari alasan... huhuhu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik Daehyun dari sudut matanya dengan nada menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Makanya, siap-siap ya... Kedepannya, kau yang akan menggantikan posisiku untuk ikut Ibuku ke acara-acaranya yang penuh dengan basa-basi itu, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merengek manja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, Eonni... kenapa kau jadi usil sekali begini, sih!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.q5j7ut1nsdsw\"><span class=\"c7 c1 c6\">Cincin Berlian Unik di Butik Perhiasan</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke masa lalu, di dalam sebuah butik perhiasan (jewelry boutique) mewah bernuansa elegan dan privat. Beberapa kotak beludru berisi deretan cincin pernikahan premium berjejer di atas meja kaca. Seorang staf ahli perhiasan dengan sarung tangan putih menjelaskan detailnya secara profesional kepada Na Eun dan Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Perhiasan:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ini beberapa pilihan terbaik dari koleksi terbaru kami, Nona Han, Tuan Park... Cincin-cincin ini dibuat dengan ketelitian tingkat tinggi, menggunakan material emas putih murni dan platinum.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh ke arah Junwoo, menunjuk ke deretan cincin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau sendiri mau model yang mana, Junwoo-ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggaruk pelipisnya yang tidak gatal, menatap bingung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ehmmm... kalau dilihat-lihat, semuanya tampak bagus dan berkilau ya. Aku jadi bingung sendiri membedakannya. Kalau kau sendiri, lebih tertarik pada model yang mana?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunjuk dua kotak perhiasan di baris tengah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku sebenarnya suka di antara dua pilihan ini. Yang sebelah sini modelnya terlihat terlalu simpel tapi sangat menarik, sedangkan yang satunya lagi sebenarnya bagus, tapi potongan berliannya agak unik.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tim Perhiasan:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum ramah, langsung menjelaskan)</span></p><p class=\"c0\"><span class=\"c1\">\"Pilihan yang sangat luar biasa, Nona Han. Untuk model yang kedua ini, batu </span><span class=\"c1 c8\">diamond</span><span class=\"c1\">-nya memang sengaja dipotong dengan teknik unik karena memiliki konsep yang spesial. Potongan unik seperti </span><span class=\"c1 c8\">Jubilee</span><span class=\"c1\"> yang memiliki 88 sisi pantulan cahaya dan </span><span class=\"c1 c8\">Emerald cut</span><span class=\"c1\"> dengan efek cerminnya yang tegas, hingga cincin bergaya </span><span class=\"c1 c8\">Vintage</span><span class=\"c4 c1\"> dapat dipilih agar cincin tampil beda dan mencerminkan karakter kuat dari pemakainya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar, langsung menunjuk cincin bermodel unik tersebut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, kalau begitu aku pilih yang ini! Untuk model cincin wanitanya, kurasa potongannya sangat cocok untukmu, Naeun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1 c5\">(Mengerutkan dahi, menatap Junwoo menyelidik)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maksudmu apa cocok denganku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum manis, menatap matanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, potongan berliannya itu... persis seperti karaktermu yang unik dan tidak biasa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya merona tipis, membuang muka sambil bergumam pelan)</span></p><p class=\"c0\"><span class=\"c1\">\"Enak saja...\" </span><span class=\"c1 c8\">(kembali menatap staf butik)</span><span class=\"c4 c1\"> \"Baiklah, kami pilih sepasang cincin ini saja.\"</span></p><h3 class=\"c9\" id=\"h.7z6qzzbzvc0p\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.jh2s0hsejnvx\"><span class=\"c7 c1 c6\">Reuni Singkat dan Percikan Cemburu</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah selesai memilih dan bertransaksi untuk cincin pernikahan, mereka berencana untuk langsung pergi ke Namsan Tower demi menghabiskan sisa waktu sore bersama sambil mengobrol santai. Namun, sebelum meninggalkan area pusat perbelanjaan, Junwoo menghentikan langkahnya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya, Naeun-ah. Aku mau ke toilet sebentar, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, aku akan menunggumu di sini saja, di depan butik.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun berdiri bersandar di dekat pilar kaca butik perhiasan sembari memainkan ponselnya. Baru beberapa menit ia menunggu, tiba-tiba terdengar sebuah suara pria memanggil namanya dengan nada ragu namun penuh kejutan dari arah samping.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun... ? Benarkah, itu kau?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menoleh, matanya membelalak kaget)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahh... Yoo Seob Oppa?! Ini benar-benar kau? Kapan kau pulang ke Korea?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Pria itu adalah Kang Yoo Seob, senior sekaligus mantan asisten dosen yang pernah mendampingi dan membimbing tesis Na Eun saat ia menempuh kuliah S2 di </span><span class=\"c1 c8\">University of Pennsylvania (UPenn)</span><span class=\"c4 c1\">, Amerika Serikat.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, melangkah mendekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, aku baru sekitar dua bulan yang lalu pulang dari Amerika.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, jadi selama ini ternyata kau tetap menetap dan bekerja di sana, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja. Wah, aku benar-benar tidak menyangka bisa berpapasan denganmu di mall ini, Naeun. Kudengar kabar dari teman-teman alumni, kau sekarang sudah sukses jadi CEO di Florentina, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum rendah hati, sedikit salah tingkah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, belum sukses kok, Oppa. Aku juga masih baru belajar mengelolanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Belajar apa? Kau ini kan mahasiswi paling pintar dan jenius yang dulu pernah kudampingi selama di UPenn. Jadi, tentu saja aku sama sekali tidak heran kalau sekarang kau sudah memegang bisnismu sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini terlalu banyak memujiku. Oh ya, kau sendiri sedang ada keperluan apa ke mall ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, tidak ada yang spesial. Aku barusan saja selesai bertemu dengan seorang teman.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sendirian saja? Mana pacarmu, Oppa? Atau... oh, jangan-jangan sekarang sudah punya istri, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengibas-ngibaskan tangannya sambil tertawa lepas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahh, kau ini bisa saja, Naeun. Aku bahkan belum punya pacar lagi sampai sekarang, apalagi punya seorang istri.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mereka berdua pun terus mengobrol dengan menggunakan bahasa informal, sesekali bernostalgia dan bercanda lepas mengenai kenangan masa-masa kuliah mereka di UPenn dulu. Tanpa Na Eun sadari, dari arah kejauhan di dekat koridor toilet, langkah kaki Junwoo terhenti. Junwoo berdiri mematung, memperhatikan dan mendengar setiap detail percakapan mereka yang terdengar teramat akrab dan dekat. Seketika itu juga, muncul gurat ekspresi yang sangat tidak biasa di wajah Park Junwoo sebuah rasa cemburu yang kentara).</span></p><h3 class=\"c9\" id=\"h.cc7d43od8d1w\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.xr2let7fk4z\"><span class=\"c7 c1 c6\">Pengumuman Status dan Diamnya Park Junwoo</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, kau ini tidak berubah ya... Ngomong-ngomong, kau sendirian saja datang ke mall sebesar ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Baru saja akan membuka mulut untuk menjawab)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku—\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tiba-tiba melangkah cepat dan langsung memotong pembicaraan, berdiri tepat di samping Na Eun dengan senyum formal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sedikit terkejut dengan kedatangan pria asing)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh... ternyata kau tidak sendirian?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap tajam namun tetap menjaga sopan santun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Halo. Maaf, siapa ini, Naeun-ah?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Junwoo-ya... Kenalkan, ini dulu seniorku saat aku kuliah S2 di UPenn. Namanya Kang Yoo Seob Oppa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langsung mengulurkan tangannya dengan tegas, menekankan setiap kata dengan penuh penegasan)</span></p><p class=\"c0\"><span class=\"c1\">\"Halo, salam kenal. Aku Park Junwoo... </span><span class=\"c1 c6\">tunangan</span><span class=\"c4 c1\"> Han Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Yoo Seob:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar kata 'tunangan', matanya sedikit membelalak kaget karena tidak menyangka wanita berhati es seperti Na Eun akan segera menikah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh... halo, aku Kang Yoo Seob. Wah, selamat ya untuk kalian berdua. Sepertinya kalian akan segera melangsungkan pernikahan dalam waktu dekat.\"</span></p><p class=
