\"c0\"><span class=\"c4 c1\">\"Jadi begitu... Kau ini tipe orang yang selalu fokus pada puncak ya, Na Eun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langkahnya sedikit melambat, menoleh dengan dahi berkerut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Fokus pada puncak? Apa maksudmu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, dalam hidup ini, harus ada yang namanya menikmati, merasakan, dan memaknai. Jika kau melewatkan (</span><span class=\"c1 c8\">skip</span><span class=\"c4 c1\">) ketiga proses itu dan hanya mengincar akhir, lalu apa yang sebenarnya bisa kau rasakan setelah berhasil mendapatkan hasilnya nanti? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Lagipula, ada kalanya kan hasil yang kita dapatkan di dunia ini tidak selalu sesuai dengan apa yang kita harapkan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terdiam sejenak, egonya terusik namun ia mencoba menyangkal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku... aku juga tidak selalu fokus pada hasil kok.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menatap Na Eun dengan pandangan jenaka)</span></p><p class=\"c0\"><span class=\"c1\">\"Kau itu masih saja pandai menyela, ya? Lusa kemarin saat malam di taman, kau menangis sesenggukan seakan-akan duniamu langsung berhenti total gara-gara hasil peluncuran produkmu tidak sesuai dengan ekspektasi atau usahamu yang sudah </span><span class=\"c1 c8\">all out</span><span class=\"c4 c1\"> untuk Florentina. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Justru di saat seperti itulah kau harus sadar, Naeun-ah. Berproses dalam hal apapun, kau harus siap dengan hasilnya, entah itu berujung baik ataupun buruk.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun seketika terbungkam. Ia terdiam seribu bahasa sembari terus melangkah. Di dalam kepalanya, logika mandirinya tidak bisa menolak bahwa kata-kata yang diucapkan Junwoo barusan benar-benar masuk akal dan langsung menusuk tepat ke pusat pemikirannya.</span></p><h3 class=\"c11\" id=\"h.8boccrvs36u6\"><span class=\"c7 c1 c6\">Kegagalan Oxford dan Rasa yang Menjadi Nyata</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Mereka terus berjalan hingga jalur mulai sedikit menanjak ringan. Keheningan di antara mereka pecah saat Na Eun mencoba membalikkan topik pembicaraan dengan pertanyaan yang selama beberapa hari ini mengganjal di benaknya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ngomong-ngomong soal berproses... kau tahu kan kalau kita berdua awalnya memulai pertunangan ini hanya karena sama-sama penasaran? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Lalu, kenapa kau sendiri tetap mau berproses sejauh ini? Kenapa kau memilihku dan terus mencoba untuk mengenalku lebih dalam? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kau kan tahu sendiri sekarang aku ini orangnya seperti apa. Pasti... sifat kaku dan independen ku ini sangat mengusik ketenanganmu, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, langkahnya tetap konstan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau tahu kan, aku pernah bercerita kepadamu tentang hobiku bermain sepeda gunung? Di awal-awal, aku sering sekali mengalami kegagalan dan terjatuh dalam berbagai perlombaan, tapi aku tetap memilih belajar untuk menekuninya karena aku suka prosesnya. Dan kau juga harus tahu satu rahasia lagi...\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menghentikan langkahnya sejenak, membalikkan tubuh menghadap Na Eun)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"...saat akan mengambil gelar S2 dulu, aku juga pernah gagal total untuk masuk ke Harvard University. Aku sangat kecewa dan terpukul di awal. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tapi siapa yang sangka, ternyata kegagalan di Harvard itu justru membawaku ke Oxford University, yang lingkungannya ternyata tidak jauh lebih luar biasa dan sangat cocok untukku. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jadi intinya, aku adalah pria yang menghargai dan mau menikmati sebuah proses. Soal bagaimana sifatmu, atau apa pun itu yang pernah kuketahui tentang masa lalumu...\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menaikkan tangan kanannya, menggunakan punggung tangannya untuk mengelap sisa-sisa keringat yang menetes di dahinya akibat terik matahari siang)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"...kurasa, rasa penasaranku kepadamu belakangan ini sudah berubah menjadi nyata...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-17.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Melihat gerakan refleks Junwoo yang sedang mengelap keringat di dahinya, Na Eun seketika tertegun di tempatnya berdiri. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Untuk pertama kalinya, ia melihat sisi maskulin dan pesona alami Park Junwoo dari jarak sedekat itu di bawah terik matahari. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Jantungnya mendadak berdegup dua kali lebih cepat. Karena panik dan gugup, Na Eun langsung memalingkan wajahnya dengan cepat ke arah deretan pohon pinus untuk menyembunyikan rona merah di pipinya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencoba menstabilkan suaranya yang mendadak gugup)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Menjadi... menjadi nyata apa maksudmu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat reaksi salah tingkah Na Eun, senyum usilnya kembali muncul. Ia menaikkan alisnya menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kira-kira apa yaaa? Hmmm... nanti saja deh aku kasih tahu jawabannya, tidak sekarang! Hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa menunggu balasan, Junwoo langsung berbalik dan berjalan cepat mendahului Na Eun dengan tawa yang renyah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak melotot kesal karena merasa dipermainkan, langsung berlari kecil mengejarnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Park Junwoo! Kau ini benar-benar ya! Berhenti tidak! Beritahu aku sekarang!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c9\" id=\"h.1aeef5okatq7\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari yang tenang di Bukhansan Dulle Camp. Dua tenda dome terpasang saling berhadapan, mengurung sebuah area tengah kecil di mana sebuah pemanggang BBQ masih menyala dengan sisa-sisa arang yang memerah hangat. Beberapa piring berisi makanan dan cangkir hangat terletak di atas meja lipat. Junwoo dan Na Eun duduk bersebelahan, menikmati keheningan malam sebelum Junwoo memecah kesunyian.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-18.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap nyala api arang, nadanya mendadak berubah santai namun dalam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah, kau tahu tidak kalau aku juga pernah merasa sangat kecewa dan merasa gagal total dalam hidupku?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghentikan gerakannya yang hendak meminum teh hangat, menoleh dengan dahi berkerut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Gagal? Kecewa? Apa maksudmu? Pria sepertimu bisa merasa gagal juga?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, menerawang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya. Sewaktu masa-masa akhir kuliah S2-ku di Oxford dulu, ambisiku untuk masuk ke Harvard University saat S3 nanti mendadak timbul lagi dengan sangat kuat. Tapi di saat yang bersamaan, ada turnamen umum sepeda gunung tingkat internasional di Kanada yang sangat ingin kuikuti, dan ada beberapa organisasi kampus yang kuikuti juga sedang membutuhkan seluruh energiku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meletakkan cangkirnya, mulai tertarik dengan cerita Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Karena aku menyukai dan menginginkan semua hal itu terjadi secara bersamaan, aku sampai lupa soal apa itu skala prioritas. Aku harus melakukan revisi besar-besaran untuk tesis S2-ku, tapi pikiranku terus melayang ingin ikut turnamen sepeda di Kanada, dan di sisi lain organisasi juga terus memanggilku. Aku benar-benar stres berat dan tidak bisa memutuskan segala sesuatunya dengan santai.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap lekat wajah Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kemudian... kau memutuskan untuk memilih apa pada akhirnya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan, menggelengkan kepala)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tidak memilih apa pun. Aku malah berdiam diri dan mengunci diri di dalam kamar asrama selama beberapa hari.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun yang mendengarkan pengakuan itu seketika terdiam. Di bawah temaram lampu kamp, ia menatap sosok Junwoo yang selama ini selalu ia kenal sebagai pria yang penuh energi, ceria, dan tampak tidak punya beban, ternyata bisa berada di titik terendah hingga memilih menepi dan menyendiri saat mentalnya kelelahan.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya melunak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa responmu malah seperti itu? Menutup diri di asrama... itu benar-benar bukan seperti tipe seorang Park Junwoo yang kukenal.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, kau benar. Tapi saat itu aku sadar kalau aku terlalu serakah memilih banyak hal hingga akhirnya aku malah tidak bisa memilih satu pun. Karena buntu, malamnya aku memutuskan menelepon Ayahku. Dan di sanalah aku langsung tersadar, sekaligus merasa sangat malu setelah mendengar nasihat dari beliau.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apakah... beliau memarahimu karena kau mengurung diri?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Tidak, Ayah sama sekali tidak marah. Beliau hanya berkata pelan, </span><span class=\"c1 c8\">'Junwoo-ya, kau sekarang sudah dewasa. Apa pun yang kau pilih dan kau tentukan di dunia ini, semuanya pasti memiliki konsekuensi masing-masing. Jadi, pastikan kau memilih sesuatu karena memang kau sedang sangat \"membutuhkannya\" saat itu, bukan hanya sekadar tentang urutan prioritas.'</span><span class=\"c4 c1\">\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Dahinya kembali berkerut, mencoba mencerna)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Memangnya... apa maksud dari perkataan Ayahmu itu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh, menatap mata Na Eun dengan serius)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku terlalu bingung menyusun prioritas mana yang harus didahulukan, sampai-sampai aku tidak sadar apa yang sebenarnya paling 'kubutuhkan' saat itu. 'Butuh' itu artinya hal tersebut sangat penting dan esensial untuk kelangsungan hidup kita saat ini. Sedangkan 'prioritas' sering kali hanya berangkat dari ambisi di permukaan, padahal belum tentu hal itu yang benar-benar jiwa kita butuhkan saat itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terdiam sejenak, kata-kata Junwoo menghantam logikanya yang selama ini selalu mendewakan kata 'prioritas' di Florentina. Ia menarik napas dalam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu... setelah mendengar itu, kau akhirnya memilih apa?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, mengusap tengkuknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Akhirnya aku melepaskan turnamen Kanada dan ambisi Harvard-ku. Aku memilih fokus sepenuhnya untuk menyelesaikan revisi tesis S2-ku di Oxford. Ya... walaupun pada akhirnya Harvard bukan lagi menjadi jalanku, ternyata di Oxford pun aku tetap bisa bertumbuh, berkembang, dan menemukan jalan baru yang tidak kalah luar biasa.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo kemudian menggunakan punggung tangannya untuk mengelap sisa keringat tipis di dahinya akibat hawa panas dari pemanggang BBQ di depan mereka.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sama seperti sifat kaku dan masa lalumu yang sempat kudengar... kurasa rasa penasaranku padamu saat ini, sudah tumbuh menjadi sesuatu yang nyata...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Jantungnya mendadak berdegup kencang melihat pesona maskulin Junwoo dari dekat di bawah cahaya api unggun, langsung memalingkan wajahnya ke arah tenda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Menjadi... nyata apa maksudmu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh usil melihat Na Eun salah tingkah, langsung bangkit berdiri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa yaaa? Rahasia... nanti saja deh aku kasih tahu saat kita pulang besok! Hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak berdiri dengan wajah memerah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Park Junwoo! Kau ini benar-benar ya! Beritahu aku sekarang!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.ijs39jzdpj1z\"><span class=\"c7 c1 c6\">Bagian 9: Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa geli sambil bertepuk tangan heboh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Eonni, astaga! Jadi Junwoo Oppa sengaja menggantung jawabannya di tengah camping seperti itu? Dia benar-benar pintar membuatmu penasaran setengah mati! Tapi tunggu, jadi dari sana kau mulai melihat pesona fisiknya juga, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menutup wajahnya dengan kedua tangan, tertawa malu mengingat kegengsiannya dulu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ih, Daehyun-ah, jangan meledekku! Hari itu logikaku benar-benar diputarbalikkan olehnya. Di satu sisi nasihatnya tentang kegagalan Oxford membuatku sadar dia pria yang dewasa, tapi di sisi lain... sifat menyebalkannya yang suka menggoda itu benar-benar membuatku gemas!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.345j9u28vht7\"><span class=\"c7 c1 c6\">Sindrom Pasca-Bukhansan dan Meja Kerja yang Sepi</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana keesokan harinya di ruang kerja pimpinan Florentina. Waktu menunjukkan pukul 11.55, lima menit menuju jam makan siang. Setelah menghabiskan malam berkemah yang tenang di Bukhansan Dulle Camp, mereka kembali ke realitas aktivitas masing-masing; Junwoo di firma hukum ayahnya dan Na Eun di kantor Florentina. Namun, Na Eun sama sekali tidak fokus. Sejak tiga puluh menit lalu, matanya terus-menerus melirik ke arah ponselnya yang tergeletak diam di samping laptop.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetuk-ngetukkan jemarinya ke meja, bergumam kesal dengan ekspresi wajah yang tidak bisa berbohong)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia pasti sengaja... Pria itu sengaja menggantung jawabannya kemarin supaya aku terus-terusan penasaran! Dasar Park Junwoo! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Biasanya jam segini dia sudah sibuk mengirim pesan ke ponselku untuk mengajak makan siang bersama, tapi hari ini kenapa mendadak senyap sekali? Sebenarnya apa maunya dia?!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tepat saat itu, seorang staf divisi kreatif masuk ke ruangannya untuk menyerahkan draf akhir desain kemasan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat ekspresi Na Eun yang sedang cemberut menatap ponsel)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nona Han... Anda kenapa? Apa ada masalah dengan laporan atau data penjualan terbaru?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersentak kaget, langsung memperbaiki posisi duduknya dan berdehem canggung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh... mmm, tidak apa-apa. Laporannya bagus kok. Ada apa?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum ramah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, kebetulan ini sudah jam makan siang, Nona Han. Apakah Anda mau ikut bergabung makan siang bersama kami para staf di kantin bawah? Oh... atau jangan-jangan, hari ini Anda sudah ada janji makan siang dengan Tuan Park, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya mendadak kaku, tersenyum paksa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, aku... tidak ada janji dengan siapa pun. Kalian duluan saja, nanti aku akan menyusul setelah menyelesaikan berkas ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Staf:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Nona Han. Kami permisi dulu.\"</span></p><h3 class=\"c11\" id=\"h.oc45vwgz9o28\"><span class=\"c1 c6 c7\">Keruntuhan Logika sang Wanita Independen</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah staf keluar dan pintu ruangan tertutup rapat, Na Eun langsung menyandarkan punggungnya ke kursi kerja. Ia mengusap wajahnya yang terasa hangat. Untuk pertama kalinya, ia merasakan sebuah rasa asing yang sangat tidak biasa bergejolak di dalam dadanya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Seorang Han Na Eun wanita yang sejak zaman kuliah terkenal dingin, rasional, dan tidak pernah sekalipun terkecoh oleh pesona laki-laki manapun, termasuk deretan pria kaya raya yang pernah dijodohkan dengannya kini tiba-tiba mendapati dirinya sedang lumpuh total hanya karena memikirkan pesona seorang Park Junwoo, pria yang dulu juga dikenal sebagai mantan Presiden </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\"> di Seoul National University (SNU).</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Dialog Batin Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meremas bantal kursi kecil di pangkuannya, salah tingkah sendirian)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahhh, apa-apaan aku ini?! Kenapa sekarang otakkuku malah dipenuhi oleh wajahnya saat mengelap keringat di Bukhansan Dulle-gil Trail kemarin? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dan kenapa sekarang aku harus segundah ini hanya karena dia tidak menghubungiku untuk mengajak makan siang?! Huaaa... aku ini kenapa?! Jangan-jangan aku... Tidak, tidak! Ayo sadar, Han Na Eun! Kau harus tetap rasional! Kau tidak boleh jatuh cinta duluan pada pria menyebalkan itu!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menggeleng-gelengkan kepalanya dengan heboh, menepuk-nepuk kedua pipinya yang merona merah demi mengembalikan kewarasannya sebagai wanita independen. Namun, rasa penasaran yang menyiksa itu ternyata jauh lebih kuat daripada egonya.)</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c11\" id=\"h.no8jk6qu099x\"><span class=\"c7 c1 c6\">Jalur Tikus Lewat Han Seo Pyo</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Karena sudah tidak tahan lagi menahan rasa penasaran mengapa Junwoo tidak mengirimkan pesan sebaris pun sejak pagi, Na Eun akhirnya menyerah pada gengsinya. Ia meraih ponselnya, membuka aplikasi pesan singkat, dan mengirim pesan kepada adiknya, Han Seo Pyo, yang kebetulan sedang magang di firma hukum milik Ayah Junwoo.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">[ISI CHAT POP-UP]</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">Seo Pyo-ya. Apa di kantormu sedang sibuk hari ini?</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c1 c8\">Eh? Tumben sekali Noona bertanya seperti itu. Kenapa tiba-tiba menanyakan tentang kantor kami?</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">Ah, tidak apa-apa. Cuma tanya saja.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c1 c8\">Kau ini Noona benar-benar tidak jelas sekali, </span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">Kau ini! Tinggal dijawab saja susah sekali. Ditanya sibuk atau tidak di kantormu?!</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">Iya, iya, galak sekali. Lumayan sibuk sih, tapi tidak semua bagian sama tingkat sibuknya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">Ya sudah.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c1 c8\">Tunggu sebentar... Sifat gengsimu ini mencurigakan. Kau ini aslinya sedang benar-benar menanyaiku, atau kau sebenarnya cuma penasaran dengan kabar Junwoo Hyung, hah? Hahahahahah!</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat balasan chat terakhir dari adiknya yang sangat tepat sasaran, Na Eun langsung melempar ponselnya ke atas meja kerja tanpa berniat membalasnya sama sekali. Wajahnya memerah padam karena tertangkap basah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menelungkupkan wajah di antara kedua tangannya, lalu menghela napas panjang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Huffft... aku ini sebenarnya kenapa, sih?\"</span></p><h3 class=\"c11\" id=\"h.cexk9yy5rxd3\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Daehyun langsung tertawa cekikikan sampai bahunya terguncang-guncang heboh.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Eonni, astaga! Seo Pyo benar-benar usil padamu dan dia langsung bisa menebak jalan pikiranmu dengan sekali tebak? Lucu sekali! Mengaku saja, di momen 'gundah gulana' itulah ego wanita independen itu benar-benar tamat kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencubit pelan lengan Daehyun sambil tertawa malu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ih, Daehyun-ah! Sudah kubilang jangan meledekku! Tapi ya... harus kuakui, hari itu adalah hari pertama di mana aku sadar bahwa benteng pertahanan yang kubangun bertahun-tahun ternyata bisa runtuh hanya karena sehari tidak dikirimi pesan makan siang oleh Park Junwoo.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.swwplsu3s36d\"><span class=\"c7 c1 c6\">Notifikasi Sore Hari dan Gengsi yang Tertahan</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana sore hari sekitar pukul 15.00 di ruang kerja Na Eun. Setelah didera kegundahan sejak siang, tiba-tiba layar ponsel Na Eun menyala. Sebuah notifikasi pesan masuk dari Park Junwoo. Na Eun langsung menyambar ponselnya, namun ia sengaja menarik napas dalam-dalam untuk menahan diri agar tidak membalasnya terlalu cepat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">[ISI CHAT POP-UP]</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">Han Naeun, maaf tadi aku tidak mengajakmu makan siang karena jadwalku sedang full untuk mengurus kegiatan di yayasan dan rumah sakit Ibuku. Tapi malam ini kau harus ikut denganku ya, nanti sore kujemput!</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun membaca pesan tersebut sekilas. Alih-alih langsung membalas, ia justru meletakkan kembali ponselnya ke meja dengan dagu terangkat sengaja mempertahankan gengsi tingginya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melipat kedua tangan, mendengus pelan dengan bibir sedikit kerucut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa tidak sejak pagi saja dia mengabariku kalau sibuk? Dia benar-benar sukses membuatku penasaran setengah mati dengan aktivitasnya seharian ini. Hufttt... menyebalkan.\"</span></p><h3 class=\"c11\" id=\"h.vqurnmz1xqr\"><span class=\"c7 c1 c6\">Penjemputan dan Ruang Tamu Florentina</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana menjelang jam pulang kantor di ruangan Na Eun. Pintu ruangan tiba-tiba terbuka tanpa ketukan keras. Junwoo melangkah masuk dengan setelan jas kerjanya yang masih rapi.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah masuk sambil tersenyum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Na Eun, pasti kau masih berkutat dengan pekerja—\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Kalimat Junwoo seketika terhenti. Tidak seperti biasanya di mana ia selalu melihat Na Eun masih pusing di balik meja kerja, kali ini ia mendapati Na Eun sudah tampil rapi, siap pergi, dan sedang duduk tenang di sofa ruang tamunya sembari membaca majalah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh geli, berjalan mendekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, tumben sekali? Kau sudah siap dan rapi bahkan sebelum aku meneleponmu dari lobi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menutup majalahnya dengan anggun, menatap Junwoo datar demi menutupi rasa salah tingkahnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Mau pergi ke mana sebenarnya? Jangan mendadak seperti kemarin.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lebar, ikut duduk di sofa tepat di samping Na Eun lalu mengeluarkan ponselnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau tahu kan kalau teman-teman angkatan kampus kita dulu sedang mengadakan acara reuni malam ini? </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Rencananya semua akan berkumpul di </span><span class=\"c1 c8\">Sam's Korean BBQ Restaurant</span><span class=\"c4 c1\"> di kawasan Samseong-ro, Gangnam District, yang letaknya dekat sekali dengan area COEX.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memalingkan wajah singkat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak tahu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau tidak membuka grup alumni kampus angkatan kita, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terdiam sejenak, lalu menjawab ketus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku sudah keluar dari grup itu sejak lama. Berisik, tidak penting.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, sama sekali tidak terkejut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Sudah kuduga kau pasti tidak ada di dalam grup itu. Ya sudah, karena itulah kau harus ikut pergi bersamaku malam ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mulai menolak, menggelengkan kepalanya tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak mau, Junwoo. Aku tidak terbiasa mengobrol atau berbasa-basi dengan mereka semua. Buat apa juga aku berada di sana?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun lekat-lekat, nadanya melunak namun penuh penekanan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja untuk menemaniku. Sudah tugasmu berada di sampingku, Naeun-ah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membela diri, suaranya naik satu oktav)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Pergi saja sendiri! Aku benar-benar tidak mau ikut acara reuni semacam itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Naeun-ah, kau ini sekarang adalah tunanganku. Sudah seharusnya kau ikut pergi bersamaku ke acara seperti ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mulai gemas, berdiri dari sofa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Park Junwoo! Aku ini tidak kenal dekat dengan mereka semua, apalagi ini acara lintas jurusan. Aku jelas berbeda denganmu yang berteman dengan semua orang!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut berdiri, tanpa banyak argumen lagi langsung meraih lembut pergelangan tangan Na Eun dan menggandengnya erat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah, tidak ada alasan lagi. Ikut saja denganku.\"</span></p><h3 class=\"c11\" id=\"h.itxsdpd4td0g\"><span class=\"c7 c1 c6\">Tarikan Lembut menuju Mobil</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menuntun atau lebih tepatnya menyeret halus Na Eun keluar dari ruangan kerja, melewati meja para staf Florentina yang menatap mereka dengan senyum-senyum tertahan, hingga sampai ke area parkir mobil.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-19.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sepanjang jalan koridor terus mengomel pelan, namun tidak benar-benar melepaskan tautan tangan Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya! Lepaskan... kau ini benar-benar pemaksa ya!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membukakan pintu mobil untuk Na Eun, mengedipkan sebelah matanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Anggap saja ini proses untuk membuat rasa penasaranmu kemarin menjadi jauh lebih nyata, Tunanganku. Silakan masuk.\"</span></p><h3 class=\"c11\" id=\"h.onnz0a4zz7p2\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memukul-mukul bantal sofa spa karena gemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ahahaha! Eonni, aku bisa membayangkan betapa mukamu merona merah saat itu! Keluar dari grup alumni karena 'berisik' itu benar-benar gaya Han Na Eun sekali! Tapi taktik Junwoo Oppa yang langsung menggandengmu keluar kantor itu... benar-benar juara! Jadi, bagaimana kelanjutan malam reuni itu, Eonni? Apakah di sana kalian go public untuk pertama kalinya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum penuh arti, mengingat awal mula hubungan mereka yang mulai bersemi di depan teman-teman kuliah mereka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Malam itu... adalah malam di mana semua orang akhirnya tahu, bahwa wanita paling dingin di kampus mereka dulu, akhirnya berhasil ditaklukkan oleh Presiden mahasiswa mereka sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.euj1brkpf9w2\"><span class=\"c7 c1 c6\">Pintu Gerbang Restoran dan Gengsi Gunung Es</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari di depan gerbang depan Sam's Korean BBQ Restaurant di kawasan Samseong-ro, Gangnam District. Suara bising knalpot mobil dan gemerlap lampu kota Gangnam mendominasi latar belakang. Di dalam mobil, Na Eun masih setia melipat tangan dengan wajah cemberut. Junwoo hanya bisa memandangi tingkah tunangannya itu dengan senyuman lucu.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melepaskan sabuk pengamannya, menoleh ke arah Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudahlah, Han Na Eun. Jangan cemberut terus begitu... Ayo kita turun, semuanya pasti sudah menunggu di dalam.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menahan pegangan pintunya, menatap Junwoo dengan tatapan memelas yang jarang ia tunjukkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya... aku benar-benar tidak bisa bertemu dengan mereka. Aku... aku malu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, sedikit memiringkan kepalanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa harus malu, hm? Memangnya kau malu kalau semua orang tahu kita berdua sudah bertunangan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menggeleng, nadanya mencicit pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bukan begitu... Kau kan tahu sendiri bagaimana aku dulu di SNU. Aku tidak pernah berinteraksi dekat atau berteman dengan siapa pun di kampus. Jadi rasanya sangat aneh dan canggung kalau tiba-tiba aku datang ke acara reuni angkatan seperti ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meraih lembut tangan Na Eun, menggenggamnya erat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kan sudah pernah kubilang sebelumnya, Han Na Eun. Malam ini kau datang kesini untuk menemaniku, bukan untuk bertemu atau mengurusi mereka. Sudah ayo, percayalah padaku.\"</span></p><h3 class=\"c11\" id=\"h.ku4lq2tm4xa\"><span class=\"c7 c1 c6\">Pengumuman yang Menggemparkan Angkatan</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berubah di dalam Sam's Korean BBQ Restaurant. Bau aroma daging panggang yang gurih menyeruak. Sekitar empat puluh orang lebih alumni lintas jurusan dari Seoul National University duduk melingkari deretan meja panjang yang sudah direservasi khusus. Begitu pintu geser restoran terbuka dan Junwoo melangkah masuk sambil menggandeng erat tangan Na Eun, seluruh pasang mata di ruangan itu seketika terpaku. Suasana riuh mendadak hening sejenak sebelum akhirnya pecah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 1:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari kursinya, berteriak heboh)</span></p><p class=\"c0\"><span class=\"c1\">\"Huaaa! Park Junwoo sudah datang! Si </span><span class=\"c1 c8\">mood maker</span><span class=\"c4 c1\"> angkatan kita akhirnya menampakkan batang hidungnya!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 2:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya membelalak tidak percaya, menyenggol lengan teman di sebelahnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tunggu... dan dia datang bersama... Han Na Eun?!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Seluruh ruangan langsung dipenuhi bisik-bisik tidak percaya. Bagi mereka, melihat seorang Han Na Eun yang reputasinya terkenal sebagai 'gunung es' yang tidak tersentuh di SNU dulu mau menghadiri acara reuni dan bahkan membiarkan tangannya digandeng erat oleh Junwoo adalah sebuah keajaiban besar.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 3:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melambaikan sumpitnya, menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya! Ada apa ini? Kenapa kau bisa datang bersama Naeun? Ini benar-benar pemandangan yang sangat baru di angkatan kita!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 4:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya! Kalian berdua sebenarnya ada hubungan apa, sih?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 1:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jangan-jangan kalian pacaran?! Astaga, demi apa?!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman-teman Lainnya:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bersorak kompak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jawab yang jujur, Junwoo-ya! Jangan membuat kami semua mati penasaran!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun yang berdiri di samping Junwoo hanya bisa tersenyum tipis, meremas pakaiannya pelan demi menahan rasa malu yang luar biasa karena menjadi pusat perhatian.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangkat sebelah tangannya, tertawa tenang menenangkan massa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tenang, teman-teman. Jangan penasaran berlebihan begitu. Sebenarnya... aku dan Naeun sudah resmi bertunangan.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Detik itu juga, meja alumni seperti meledak oleh suara histeris. Mereka semua terkaget-kaget dan saling berbisik tidak percaya. Mereka semua sangat tahu kisah masa lalu di kampus dulu, di mana Naeun adalah mahasiswi kaku yang bahkan menolak mentah-mentah untuk berdiskusi langsung dengan Junwoo saat di Student Council, tapi sekarang takdir malah membawa wanita itu menjadi tunangannya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman-teman:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya ampun, Junwoo-ya! Takdir kalian berdua benar-benar indah dan tidak tertebak! Kami semua sama sekali tidak menyangka si gunung es bisa meleleh di tanganmu, hahaha!\"</span></p><h3 class=\"c11\" id=\"h.fu3won147x9s\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 561.00px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-20.png\" style=\"width: 602.00px; height: 328.00px; margin-left: -41.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></h3><h3 class=\"c11\" id=\"h.9wp98aoj1444\"><span class=\"c7 c1 c6\">Rumor Lee Subin dan Percikan Cemburu</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suara riuh candaan dan obrolan nostalgia terus menggelinding hangat di atas meja BBQ. Na Eun hanya diam, sesekali mempertahankan ekspresi sedingin es batunya namun tetap melempar senyum formal ketika ada yang menyapanya. Hingga tiba-tiba, obrolan bergeser ke topik lain.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 2:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ngomong-ngomong, sejak tadi kita kok tidak melihat Lee Subin, ya? Padahal dia alumni jurusan seni yang sekarang jadi aktris muda naik daun. Biasanya dia yang paling aktif dan paling bersemangat kalau ada acara reuni begini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 3:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyenggol bahu Teman 4, mulai melirik usil ke arah Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, kau tidak tahu ya? Kemarin saat aku mengajaknya ikut ke reuni ini, dia bilang jadwal syutingnya sangat padat. Tapi kita semua tahu, Subin tidak pernah sekalipun melewatkan reuni demi satu alasan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 4:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tertawa menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, benar! Kemarin aku sempat menggodanya, kenapa tiba-tiba tidak mau ikut. Ternyata oh ternyata... alasan sebenarnya adalah karena Park Junwoo!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman-teman Lainnya:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut menimpali heboh)</span></p><p class=\"c0\"><span class=\"c1\">\"Maksudmu... Subin sudah tahu kalau Junwoo sudah bertunangan? Wah, dia pasti cemburu berat ya! Kita semua kan tahu kalau dulu Subin adalah anak yang paling aktif setelah Ji-soo di </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\">, dan dia selalu menempel serta menyukaimu, Junwoo-ya!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mulai merasa tidak enak, berdehem pelan mencoba mengalihkan pembicaraan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa-apaan sih kalian ini... Teman-teman, tolong jangan mulai menyangkut pautkan hal yang tidak-tidak.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di sampingnya, Na Eun yang tidak terbiasa dengan gaya bercandaan frontal ala anak alumni, mendadak merasakan hatinya berdenyut tidak nyaman. Jantungnya terasa sesak. Bukan karena ejekan teman-teman itu untuk Junwoo, melainkan karena ada sebuah perasaan asing, aneh, dan tajam yang mendadak muncul di dadanya: rasa cemburu.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 4:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nah, itu benar! Subin kan memang anak yang sangat supel dan cantik. Dia pasti sudah lama mengincar Junwoo. Bahkan setiap reuni sebelumnya, dia selalu datang paling cepat dan menyapa Junwoo duluan sambil membawakannya minuman, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 5:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahahha benar-benar kasihan sekali Subin si aktris itu. Ternyata pesonanya harus kalah telak oleh Naeun dalam memenangkan hati mantan Presiden mahasiswa kita!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Candaan masa lalu tentang kedekatan Junwoo dan Lee Subin terus bergulir memanaskan suasana ruangan. Telinga Na Eun rasanya sudah tidak sanggup lagi mendengar nama aktris itu disebut berdampingan dengan nama tunangannya. Dengan sisa-sisa ketenangannya, ia langsung meletakkan gelasnya dan bangkit berdiri.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya flat, memotong obrolan meja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf, teman-teman... aku permisi ke belakang sebentar.\"</span></p><h3 class=\"c11\" id=\"h.ixxs92kh2am\"><span class=\"c7 c1 c6\">Dua Puluh Menit di Luar Batas</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Waktu merambat pergi. Dua puluh menit berlalu, namun kursi di sebelah Junwoo masih tetap kosong. Na Eun sama sekali tidak kembali ke restoran. Junwoo yang sejak tadi terus-menerus melirik jam tangannya dengan cemas, akhirnya tidak bisa bertahan lagi. Ia berdiri dari kursinya dengan raut wajah khawatir yang kentara.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Teman-teman, maaf, aku permisi keluar sebentar untuk menyusul Naeun.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo langsung melangkah cepat keluar dari ruangan restoran BBQ yang bising itu, mengabaikan seruan godaan dari teman-temannya di belakang, demi mencari keberadaan sang tunangan yang tampaknya sedang menyembunyikan badai di dalam hatinya.)</span></p><h3 class=\"c11\" id=\"h.7ap496ke0ycu\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Daehyun langsung memukul permukaan air kolam spa sampai menciprat, wajahnya luar biasa heboh.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh... !!! Eonni! Jadi kau cemburu pada aktris Lee Subin saat itu?! Wah, ini benar-benar plot twist! Seorang Han Na Eun yang sedingin es batu ternyata bisa kepanasan hanya karena mendengar nama wanita lain di masa lalu Junwoo Oppa!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menutup wajahnya yang kini memerah sempurna, tertawa kecil mengingat betapa kekanak-kanakannya dia dulu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ih, Daehyun-ah, diamlah! Jangan membuatku makin malu! Malam itu... aku benar-benar baru sadar kalau aku sudah kalah total. Rasa cemburu itu tidak bisa kubantah lagi.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak menegakkan posisi duduknya, menatap Na Eun tidak percaya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni, sebentar! Apa yang kau maksud Lee Subin itu... adalah Subin Sunbaenim?! Astaga, jika benar itu dia, berarti dunia ini sempit dan sangat lucu!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangkat kedua bahunya, tersenyum tenang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... entahlah. Tapi yang jelas, dia adalah aktris muda berbakat di masa itu, dan sekarang dia juga masih sangat aktif sebagai aktris senior di industri hiburan. Memangnya kau tahu dan kenal dekat dengannya, Daehyun-ah?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika tertawa lepas sambil menepuk tempat tidur spa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu sajalah aku tahu, Eonni! Dia itu seniorku di dunia akting, hahahaha! Aku bahkan sudah beberapa kali terlibat proyek film dan drama bersamanya dulu. Aku sering sekali meminta saran dan masukan darinya tentang bagaimana caraku berakting di lokasi syuting. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Ya ampun, aku benar-benar tidak percaya kalau orang yang selama ini kujadikan mentor, dulunya adalah saingan berat bagi kakak iparku sendiri!\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun menaik-turunkan alisnya, kembali menggoda Na Eun)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya memerah tipis, ke arah Daehyun sembari tersenyum geli)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Heiii, Daehyun-ah! Sudah, setop membahas masa lalu itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Masih terkekeh, menopang dagunya di tepi ranjang refleksi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi aku penasaran, Eonni... Kalau sekarang wajah Subin Sunbaenim muncul di televisi, apa kau diam-diam masih merasa cemburu seperti dulu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, menggelengkan kepalanya mantap)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja tidak. Bertemu secara langsung dengannya saja aku belum pernah sampai sekarang. Tapi...\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menahan senyum usilnya, matanya berbinar jenaka)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"...pernah suatu hari, saat aku dan Junwoo sedang bersantai berdua di dalam kamar, tiba-tiba iklan yang dibintangi Lee Subin muncul di layar TV. Sengaja saja aku langsung membahas namanya di depan Junwoo untuk memancingnya. Dan kau tahu? Junwoo langsung merajuk dan kesal setengah mati karena aku mengungkit masalah itu lagi, hahahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut tertawa heboh mendengar curhatan kakaknya)</span></p><p class=\"c0\"><span class=\"c1\">\"Hahaha! Astaga, Junwoo Oppa pasti frustasi sekali ya, Eonni! Dia pasti berpikir, </span><span class=\"c1 c8\">'Kenapa rumor masa kuliah ini masih saja dibahas sampai sekarang!'</span><span class=\"c4 c1\"> Aduh, kalian berdua benar-benar pasangan yang menggemaskan!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><h3 class=\"c11\" id=\"h.l0t5ndxsgvtq\"><span class=\"c7 c1 c6\">[ Kembali Ke Masa Lalu - Pelarian ke Halte Bus dan Konfrontasi Dingin]</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari yang dingin di trotoar kawasan Samseong-ro. Junwoo tampak berlari kecil keluar dari Sam's Korean BBQ Restaurant dengan nafas sedikit terengah-engah. Ia sudah memeriksa area toilet restoran namun Na Eun tidak ada di sana. Junwoo terus mengedarkan pandangan ke sepanjang jalan, hingga akhirnya matanya menangkap siluet seorang wanita yang sangat ia kenal sedang duduk sendirian di sebuah halte bus tak jauh dari restoran.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan cepat mendekati halte, mengatur nafasnya yang memburu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini... aku sudah mencarimu ke mana-mana, ternyata kau malah duduk di sini? Kau mau pulang?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap lurus ke depan, menyilangkan kedua tangannya untuk menghalau angin malam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, aku hanya ingin mencari udara segar saja di luar.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Duduk di bangku halte tepat di sebelah Na Eun, menatap wajah tunangannya dari samping)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jangan berbohong, Naeun-ah. Kau... pasti merasa tidak nyaman ya dengan candaan teman-teman alumni di dalam tadi?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menjawab datar, mencoba terdengar acuh tak acuh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, biasa saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum geli melihat binar mata Na Eun yang gelisah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini... ketahuan sekali sedang merajuk. Apa ini semua gara-gara perkataan mereka tentang Lee Subin tadi, hm?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika terdiam, egonya sempat menolak namun emosinya yang tertahan sejak tadi akhirnya meluap pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Buat apa aku merajuk? Kalau memang dulu kau menyukainya ya wajar-wajar saja. Dia cantik, berbakat, bahkan sekarang sudah jadi artis terkenal. Lagi pula... ucapan dan sikapnya pasti jauh lebih manis dibandingkan...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sengaja memotong kalimatnya, menaikkan alis dengan nada menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dibandingkan siapa, ayo? Dibandingkan denganmu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya memerah karena kesal tertangkap basah, langsung berdiri dari bangku halte)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, entahlah! Aku mau pulang saja sendiri naik taksi!\"</span></p><h3 class=\"c11\" id=\"h.sjgn3ty0pskg\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-21.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></h3><h3 class=\"c11\" id=\"h.4prir9eus41p\"><span class=\"c7 c1 c6\">Pelukan di Halte Bus dan Pengakuan yang Menjadi Nyata</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Belum sempat Na Eun melangkah pergi ke tepi jalan, Junwoo dengan gerakan cepat ikut bangkit berdiri. Tanpa aba-aba, ia menarik lembut lengan Na Eun dan langsung mendekap tubuh wanita itu dengan sangat erat di tengah keheningan halte bus.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak membelalak kaget, tubuhnya kaku di dalam dekapan hangat Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo... Park Junwoo, apa-apaan ini?! Lepaskan! Ini di tempat umum, ini di halte bus!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sama sekali tidak melepaskan pelukannya, justru mempererat dekapannya sembari berbisik di dekat telinga Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku tidak peduli dengan tempat ini. Sekarang aku tahu... kau sedang cemburu berat, kan? Mengaku sajalah, Han Na Eun. Buang semua rasa gengsimu itu di depanku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya bersembunyi di dada Junwoo, suaranya teredam namun masih mencoba mengelak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak... enak saja! Tidak ya, Park Junwoo!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh rendah, merasakan detak jantung Na Eun yang berdegup sangat kencang sama seperti jantungnya sendiri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Buktinya... kau sama sekali tidak memberontak dan masih bertahan di dalam pelukanku sampai sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun tidak bisa menjawab lagi. Di dalam pelukan erat itu, ia hanya bisa terus menggerutu pelan demi menyembunyikan rasa cemburu yang campur aduk dengan rasa salah tingkah tingkat dewa. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pipinya terasa sangat panas. Sementara itu, Junwoo yang mendekapnya tersenyum penuh kemenangan dengan binar mata yang begitu hangat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di malam yang dingin itu, tepat di sebuah halte bus yang sepi, Junwoo akhirnya menyadari satu hal yang luar biasa: bahwa rasa cemburu dari seorang Han Na Eun malam ini, adalah sebuah pernyataan cinta yang paling nyata untuknya.</span></p><h3 class=\"c11\" id=\"h.y4jpoy60tftr\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke dalam ruangan spa VVIP. Daehyun langsung menjerit histeris tanpa suara, menangkup kedua pipinya dengan mata yang berkaca-kaca karena terlalu gemas.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil menggoyang-goyangkan lengan Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni! Junwoo Oppa benar-benar langsung memelukmu di halte bus?! Ah, romantis sekali! Jadi di halte bus itulah tempat dimana si gunung es benar-benar mencair seutuhnya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, menatap cincin pernikahannya dengan tatapan penuh kebahagiaan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, begitulah, Daehyun-ah. Malam itu aku sadar, sekeras apa pun aku mencoba rasional dan menyangkal perasaanku dengan gengsi... pelukan Park Junwoo malam itu selalu punya cara untuk membuatku menyerah dan mengakui bahwa aku sudah jatuh cinta.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Eksplorasi Emosi", "html": "<p class=\"c10 title\" id=\"h.ht14omn4l2h6\"><span class=\"c23 c13\">Eksplorasi Emosi</span></p><h3 class=\"c11\" id=\"h.v6r6soa8o0ih\"><span class=\"c7 c1 c6\">Bab: Eksplorasi Emosi</span></h3><p class=\"c0\"><span class=\"c1 c6\">Konteks:</span><span class=\"c4 c1\"> Awal Agustus 2012 – Akhir dari 3 Bulan Masa Pengenalan (Deadline)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Lokasi:</span><span class=\"c4 c1\"> Kediaman Keluarga Han</span></p><p class=\"c0\"><span class=\"c1 c6\">Waktu:</span><span class=\"c4 c1\"> Pukul 07.00 KST</span></p><h4 class=\"c15\" id=\"h.6humbrwinjp3\"><span class=\"c3 c1\">Kejutan Pagi dan Papan Catur</span></h4><p class=\"c0\"><span class=\"c5 c1\">(Suasana halaman samping kediaman keluarga Han yang asri di pagi hari. Matahari baru saja naik, menyebarkan kehangatan tipis di atas rumput yang masih berembun. Bau tanah basah dan aroma kopi hitam merebak. Di sudut halaman, sebuah rumah kaca (greenhouse) mini tampak dipenuhi berbagai jenis bunga berwarna-warni; Nyonya Han sibuk di dalam sana, merawat dan merangkai bunga-bunga kesukaannya sembari sesekali memandangi halaman dengan senyum tenang.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Di meja kayu halaman samping, sebuah papan catur telah tergelar. Tuan Han dan Park Junwoo sedang duduk berhadapan. Padahal, sesuai janji, Junwoo dan Na Eun baru akan pergi berkencan pada jam 12 siang nanti. Namun, Junwoo sengaja datang terlampau pagi tanpa memberitahu Na Eun terlebih dahulu, memilih untuk menghabiskan waktu santai bersama calon mertuanya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggerakkan bidak bentengnya ke posisi agresif, menatap papan catur dengan tajam)</span></p><p class=\"c0\"><span class=\"c1\">\"Kau membiarkan pertahanan </span><span class=\"c1 c8\">King's Indian</span><span class=\"c4 c1\"> milikmu terbuka di sisi menteri, Junwoo-ya. Terlalu fokus menyerang bisa membuatmu kehilangan bidak penting di belakang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sopan, menggeser bidak kudanya untuk memblokir jalur benteng Tuan Han)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, Ayah jeli sekali. Saya sengaja memancing benteng Ayah keluar agar struktur lini tengah Ayah sedikit merenggang. Terkadang, mengorbankan sedikit ruang di belakang bisa membuka jalur penetrasi yang baru.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh puas, menyandarkan punggungnya ke kursi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Langkah yang berani. Kau selalu memikirkan tiga langkah ke depan, persis seperti caramu menghadapi hidup.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tuan Han diam sejenak, mengetuk jemarinya di pinggiran meja, lalu mengubah nadanya menjadi lebih serius namun tetap santai)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c1\">\"Park Junwoo, bagaimana hubunganmu dengan Na Eun? Bulan ini... tepatnya kalian hampir mendekati </span><span class=\"c1 c8\">deadline</span><span class=\"c4 c1\"> batas waktu proses pengenalan tiga bulan yang kita sepakati, bukan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk hormat, pandangannya beralih dari papan catur ke wajah Tuan Han)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya Ayah. Sejauh ini semuanya berjalan dengan sangat lancar. Kami sudah saling mengenal dengan baik, dan perlahan kami mulai bisa saling memahami satu sama lain.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaikkan sebelah alisnya, tersenyum penuh arti)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Saling memahami? Hanya itu? Apakah dalam tiga bulan ini kalian sudah benar-benar saling jatuh cinta satu sama lain?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika tersenyum malu, menggaruk tengkuknya yang tidak gatal sembari menunduk menatap bidak catur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hehehe... iya, Ayah. Kami sudah melangkah sejauh itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa bangga, menoleh ke arah rumah kaca dan setengah berteriak memanggil istrinya)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">\"Luar biasa! Yeobo...! Dengar ini! Calon menantumu ini benar-benar hebat, dia berhasil menaklukkan putrimu yang keras kepala itu!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Nyonya Han yang sedang memegang gunting tanaman di dalam rumah kaca menoleh, lalu melemparkan senyum lebar dan lambaian tangan hangat ke arah Junwoo, merasa sangat lega dengan perkembangan hubungan mereka.)</span></p><h4 class=\"c15\" id=\"h.3o3h56r26mo\"><span class=\"c3 c1\">Tuntutan di Balik Dukungan Politik</span></h4><p class=\"c0\"><span class=\"c5 c1\">(Tuan Han kembali fokus pada permainan. Ia menggerakkan bidak menterinya, mengunci pergerakan raja milik Junwoo. Skak.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi, dengan berakhirnya masa pengenalan ini, apakah kalian berdua sudah siap untuk melangkah bersama ke pelaminan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggerakkan rajanya ke posisi aman, mencoba melepaskan diri dari kuncian)</span></p><p class=\"c0\"><span class=\"c1\">\"Kemungkinan besar iya, Ayah. Tapi mungkin setelah melewati </span><span class=\"c1 c8\">deadline</span><span class=\"c4 c1\"> bulan ini, kami berdua juga harus melakukan banyak persiapan matang. Jadi, kami rasa kami butuh sedikit waktu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggelengkan kepala dengan tegas namun tidak kentara)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Urusan pesta dan detail pernikahan, biar kami para orang tua yang siapkan. Kalian berdua tinggal menentukan konsepnya saja. Tapi setidaknya, pernikahan kalian harus terlaksana maksimal akhir tahun ini (2012). Tidak boleh lewat dari itu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merespons dengan hati-hati)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Ayah. Nanti atau setelah ini akan segera saya diskusikan lagi dengan Na Eun, mengingat kami berdua juga memiliki aktivitas padat masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk puas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagus. Berbicara soal aktivitas dan masa depan...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tuan Han memajukan tubuhnya, menatap Junwoo lekat-lekat, menyiratkan aura penuh kuasa)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"...apakah kedepannya kau sama sekali tidak memiliki keinginan untuk kembali mengejar karir mu di dunia diplomat atau politik? Sangat disayangkan jika latar belakang dan kemampuanmu tidak digunakan.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertegun sejenak, namun tetap mempertahankan senyum tenangnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sebenarnya ambisi dan rencana ke arah sana masih ada, Ayah. Tapi untuk saat ini, saya masih ingin fokus pada masa pengenalan pernikahan kami dan membantu bisnis orang tua saya terlebih dahulu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baguslah kalau ambisi itu masih ada. Dengar, Junwoo-ya. Kedepannya, setelah pernikahan kalian berdua selesai digelar, Ayah ingin kau mulai fokus penuh untuk membangun karir mu di dunia politik. Kau tidak perlu cemas atau memikirkan hal lain. Soal koneksi, finansial, dan segala bentuk dukungan... keluarga kami sudah menyiapkan semuanya untukmu.\"</span></p><h4 class=\"c15\" id=\"h.gxdb3670v8fu\"><span class=\"c3 c1\">Kepalan Tangan di Balik Pintu</span></h4><p class=\"c0\"><span class=\"c5 c1\">(Mendengar penuturan Tuan Han yang begitu gamblang mengenai rencana masa depannya yang diatur sepihak, Junwoo agak sedikit kaget. Sorot matanya sempat bergetar sedetik. Namun, ia tidak sepenuhnya terkejut. Sebagai pria yang cerdas, ia sudah sangat tahu sejak awal keluarga besar Han Na Eun berasal dari kalangan seperti apa dan bagaimana cara kerja mereka.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menarik napas dalam, mengangguk sopan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih atas kepercayaan dan dukungannya, Ayah. Saya sangat menghargainya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Sementara itu, tepat di balik pintu kaca yang membatasi area dalam rumah dan halaman samping, berdiri Han Na Eun. Ia yang baru saja turun dari kamarnya dengan pakaian santai, awalnya berniat menyapa Junwoo yang datang terlalu pagi. Namun, langkah kakinya terhenti total di ambang pintu.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Dari balik kaca, Na Eun melihat dan mendengarkan dengan sangat jelas setiap bait percakapan antara Junwoo dan ayahnya. Ia mendengar bagaimana ayahnya dengan mudah mendikte garis waktu pernikahannya, dan bagaimana masa depan politik suaminya kelak dijadikan alat tukar kekuasaan keluarganya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Kedua mata Na Eun menatap lurus ke arah punggung Junwoo yang tampak menerima semua itu dengan kepatuhan formal. Perlahan, di samping tubuhnya, kedua tangan Han Na Eun tiba-tiba mengepal dengan sangat erat hingga kuku jarinya memutih.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Napasnya memburu menahan gejolak emosi. Dinding egonya kembali meradang. Ia benci ketika takdirnya diatur, dan ia jauh lebih benci saat menyadari bahwa pria yang mulai berhasil mengetuk hatinya itu kini ikut terseret ke dalam pusaran kendali ayahnya.)</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c11\" id=\"h.syeu4x7ryq1v\"><span class=\"c7 c1 c6\">Ketegangan di dalam Mobil</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana di dalam mobil Junwoo yang bergerak membelah jalanan Seoul menuju pusat kota. Musik instrumental berputar pelan, mencoba memecah keheningan canggung. Na Eun duduk di kursi penumpang sambil menatap keluar jendela, sementara Junwoo sesekali melirik tunangannya itu dengan tatapan khawatir.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa menoleh, suaranya terdengar datar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kita... mau pergi ke mana hari ini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, mencoba mencairkan suasana)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau kan kemarin bilang katanya mau bersenang-senang denganku untuk merayakan status kencan resmi kita hari ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela nafas pelan, akhirnya menoleh)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, aku tahu. Tapi ke mana? Aku sedang tidak punya rekomendasi tempat yang bagus.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c1\">\"Bagaimana kalau kita ke </span><span class=\"c1 c8\">Lotte Young Plaza</span><span class=\"c4 c1\"> di kawasan Myeongdong? Di sana sedang banyak hiburan dan tempat seru yang bisa kita pilih.\"<
