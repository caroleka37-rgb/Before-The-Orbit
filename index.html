"h.x3zxydbxchfx\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.pmpwp9ly3x5o\"><span class=\"c7 c1 c6\">Rahasia Angkatan 2005 yang Terbongkar</span></h3><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperhatikan perubahan ekspresi putranya yang mendadak larut dalam pikiran)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa, Anakku? Kenapa kau mendadak diam saja setelah mendengar kabar ini? Apakah ada sesuatu yang membuatmu merasa keberatan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas pelan, berusaha menyusun kalimatnya dengan hati-hati)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Begini, Ayah, Ibu... aku hanya merasa ritme ini berjalan terlalu cepat. Prosesnya terasa sangat mendadak jika dari pertemuan pertama harus langsung mengikat komitmen dalam sebuah lamaran.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum maklum, menatap Junwoo dengan pandangan mata seorang ayah yang bijak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apakah kau merasa belum siap sepenuhnya untuk menikahi putri mereka, Junwoo-ya? Hmm... maafkan kami sebelumnya, Nak. Sebenarnya... Ayah, Ibu, serta Tuan dan Nyonya Han sudah mengetahui sebuah rahasia kecil sejak lama. Kami semua tahu kalau kau dan Han Na Eun adalah teman satu angkatan saat di SNU dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Catatan: Meskipun ingatan Junwoo sempat merujuk pada rentang waktu perkenalan mereka di masa lalu, fakta akademis mencatat mereka sebagai bagian dari lingkaran angkatan lama di kampus tersebut.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika menoleh, menatap ayahnya dengan dahi berkerut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sebentar, Ayah... apa maksudnya kalian sudah tahu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh lembut, melangkah mendekat dan mengusap lengan putranya)</span></p><p class=\"c0\"><span class=\"c1\">\"Ibu tahu semua ceritanya, Junwoo-ya. Kami tahu bahwa kau dan Na Eun dulu pernah terlibat dalam satu proyek </span><span class=\"c1 c8\">workshop</span><span class=\"c4 c1\"> kampus yang sama. Ibu mendengar cerita bagaimana kau dulu sangat telaten, sabar, dan gigih bernegosiasi dengannya yang terkenal keras kepala, sampai akhirnya dia luluh dan bersedia menjadi pembicara utama hingga acara besar itu sukses luar biasa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Pipinya sedikit merona, mencoba membela diri secara rasional)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi Ibu... pertemuan kami saat itu murni hanya sebatas urusan organisasi mahasiswa. Hubungan kami tidak lebih dari rekan kerja di satu proyek saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menggelengkan kepala)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Justru karena itulah, Nak. Dari cerita lama di kampus itu, kami sebagai orang tua bisa melihat dan meyakini bahwa di antara kalian berdua sebenarnya sudah ada benih-benih kecocokan karakter yang kuat sejak dulu.\"</span></p><h3 class=\"c9\" id=\"h.rlhpl7a1qwfa\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.7rfmvrr4qbtw\"><span class=\"c7 c1 c6\">Khawatir Seorang Ibu</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sorot matanya melembut, menyiratkan rasa empati yang mendalam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nyonya Han juga bercerita secara khusus dan terbuka kepada Ibu, Junwoo-ya. Dia bilang... Na Eun itu sebelumnya sudah pernah menolak mentah-mentah tujuh kandidat pria terbaik yang disodorkan kepadanya, dan semua pria itu berasal dari lingkaran sosial kami. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Karena penolakan-penolakan itu, Nyonya Han sempat merasa sangat khawatir jika putrinya tidak akan pernah bisa mendapatkan seorang jodoh yang mampu mengerti sifat keras dan dunianya dengan baik. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dan Ibu rasa... sangat wajar bagi seorang ibu untuk mengkhawatirkan masa depan anaknya, bukan? Walaupun terkadang, cara penyampaian mereka terlihat berbeda dan terlalu menuntut di mata anak-anak.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar penuturan tulus ibunya tentang kekhawatiran keluarga Han, Junwoo kembali terbungkus dalam keheningan. Sudut hatinya yang paling dalam mendadak bergetar halus. Meskipun saat ini belum ada percikan rasa cinta yang tumbuh secara nyata di antara mereka, namun ego dan rasa penasaran Junwoo sebagai seorang diplomat telah terpancing sepenuhnya.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dinding pertahanan es yang dibangun Han Na Eun di sekeliling dirinya justru membuat Junwoo merasa tertantang untuk melangkah masuk lebih jauh. Pertemuan keluarga lagi bukan lagi sekadar formalitas perjodohan di matanya, melainkan awal dari sebuah misi untuk menguak misteri di balik ketangguhan seorang Han Na Eun.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.kjtcjrenzys\"><span class=\"c7 c1 c6\">Pekerjaan di Hari Minggu (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana beralih ke kantor Florentina di distrik Gangnam. Jarum jam menunjukkan pukul 09.00 di hari Minggu pagi. Di saat orang lain menikmati akhir pekan, Na Eun muda justru memilih mengurung diri di ruang kerjanya. Suasana ruangan tampak sibuk; meja kayunya dipenuhi dengan tumpukan dokumen laporan keuangan, botol-botol sampel produk kosmetik yang sedang diuji klinis, serta sesekali jarinya bergerak di atas keyboard laptop untuk memeriksa surel masuk. Fokusnya benar-benar tersita sepenuhnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tiba-tiba, keheningan ruangan itu terpecah oleh suara engsel pintu yang terbuka perlahan.)</span></p><p class=\"c0\"><span class=\"c5 c1\">Kreeekkk...</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun tersentak kaget dari posisinya, langsung menoleh ke arah pintu. Matanya membelalak tak percaya saat melihat sosok Tuan Han dan Nyonya Han melangkah masuk ke dalam ruang kerjanya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari kursinya dengan raut wajah bingung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayah... Ibu? Kenapa kalian bisa kemari? Ada apa mendadak datang ke kantor?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah masuk dengan wibawanya yang kaku, mengedarkan pandangan ke sekeliling ruangan yang tampak berantakan karena berkas-berkas dan tumpukan sampel produk)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kami hanya kebetulan sedang lewat di daerah sini. Jadwal Ayah dan Ibumu sedang agak longgar pagi ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan mendekat ke meja sofa, meletakkan sebuah tas kain)</span></p><p class=\"c0\"><span class=\"c1\">\"Kami tadi diberitahu oleh asisten rumah tangga di rumah kalau kau sudah meninggalkan kediaman sejak pukul tujuh pagi, bahkan tanpa menyentuh sarapanmu sedikit pun.\" </span><span class=\"c1 c8\">(Sambil membuka kotak bekal hangat yang sengaja dibawanya)</span><span class=\"c4 c1\"> \"Jadi, Ibu memutuskan untuk membawakannya kemari.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun seketika merasa canggung. Kehadiran orang tuanya yang mendadak, ditambah perhatian yang terbungkus dengan sikap kaku khas keluarga Han, membuatnya merasa sedikit tidak nyaman di tengah kepungan beban pekerjaannya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha menguasai keadaan, merapikan sedikit berkas di mejanya)</span></p><p class=\"c0\"><span class=\"c1\">\"Aku... aku belum berminat untuk sarapan, Ibu. Oh ya, karena hari Minggu tidak ada staf lain yang berjaga di sini, aku bisa keluar sebentar untuk memesankan beberapa minuman dan makanan untuk Ayah dan Ibu.\" </span><span class=\"c5 c1\">(Hendak melangkah pergi meninggalkan ruangan)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangkat tangannya, mencegah langkah putrinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak perlu repot-repot, Na Eun. Kami berdua sudah kenyang. Kami kesini hanya ingin berbincang-bincang santai saja denganmu di ruangan ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik tumpukan dokumennya dengan cemas)</span></p><p class=\"c0\"><span class=\"c1\">\"Mungkin kita bisa berbincang nanti saja di rumah, Ayah, Ibu. Aku sedang mengejar </span><span class=\"c1 c8\">deadline</span><span class=\"c4 c1\"> laporan analisis untuk besok pagi, jadi aku harus menyelesaikan berkas-berkas ini terlebih dahulu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya merendah namun penuh penekanan mutlak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Duduk sebentar, Han Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar nada suara ayahnya yang tidak menerima bantahan, Na Eun akhirnya menghela napas pasrah. Ia menarik kursinya kembali dan menuruti perkataan sang ayah, duduk berhadapan dengan kedua orang tuanya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun dengan saksama)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Begini, Na Eun-ah. Bulan ini kita sudah semakin mendekati jadwal pertemuan resmi dengan keluarga Park. Kau tahu dan ingat tentang hal itu, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menjawab dengan nada suara yang pasrah dan datar, karena fokus pikirannya masih tertuju pada angka-angka di layar laptopnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu, aku ingat. Kalian bisa mengatur jadwal dan tempatnya sesuka kalian saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sedikit terkejut dengan kepasrahan putrinya, menaikkan alis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benarkah? Jadi, Ibu tidak perlu membahas secara mendetail lagi denganmu tentang bagaimana konsep dan teknis pertemuannya nanti?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Lagi-lagi, Na Eun memilih untuk pasrah. Baginya, perjodohan ini sejak awal adalah kehendak mutlak orang tuanya yang tidak bisa ia hindari, dan saat ini Florentina jauh lebih membutuhkan energinya daripada memikirkan pernikahan.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengurut pelipisnya perlahan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ibu. Kalian saja yang mengatur semuanya. Maaf jika pikiranku sedang tidak fokus hari ini, karena khusus bulan ini ada terlampau banyak hal operasional yang harus ku urusi sendiri di Florentina.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berdiri dari duduknya, mengangguk formal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu. Kau sudah memberikan wewenang secara terbuka kepada kami untuk mengurusnya. Kami pamit pulang kalau begitu. Jangan lupa makan bekalmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tuan dan Nyonya Han kemudian melangkah keluar, meninggalkan ruangan yang kembali hening. Na Eun hanya bisa terdiam membisu di kursi kerjanya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di dalam hatinya, ia merasa bahwa dalam bulan-bulan ini, benteng pertahanannya perlahan mulai retak. Ia benar-benar kehabisan tenaga dan tidak memiliki sisa energi lagi untuk sekadar mengalihkan pikirannya atau memberontak dari jerat perjodohan yang kian mendekat.</span></p><h3 class=\"c9\" id=\"h.4pt8t72crxw2\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.v7gvyaexcvu\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Teh di cangkir mereka sudah mendingin, namun obrolan malam itu justru semakin hangat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun dengan pandangan penuh simpati)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... jadi karena itulah kau langsung menyetujui pertemuan keluarga saat Ibu mertua menunjukkannya kepada Junwoo Oppa? Karena saat itu kau sudah terlalu lelah dengan urusan Florentina, Eonni?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, menyandarkan punggungnya di sofa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar. Saat itu yang ada di otakku hanya bagaimana cara Florentina bisa bertahan hidup dan memenuhi target Ayah di tahun depan. Aku tidak tahu kalau di seberang sana, Park Junwoo sedang memutar otaknya sendiri untuk menyelidiki 'motif' di balik kepasrahanku, hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><h3 class=\"c14\" id=\"h.j2cyhop2yxcj\"><span class=\"c7 c1 c6\">Warisan Cincin dan Rahasia Karakter (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana sore hari yang tenang di kediaman keluarga Park. Cahaya matahari senja yang berwarna jingga hangat menerobos masuk melalui celah gorden kamar tidur Junwoo muda. Junwoo sedang duduk di depan meja belajarnya, terfokus pada tumpukan buku di hadapannya, saat sebuah ketukan pelan terdengar di pintu kamarnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Tok... Tok...</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuka pintu perlahan, melongokkan kepalanya sambil tersenyum lembut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apakah kau sedang sibuk, Nak? Maaf, Ibu langsung masuk ke kamarmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika menutup bukunya, beranjak dari kursi dengan senyuman hangat untuk menyambut sang ibu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, tidak juga, Ibu. Silakan masuk.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menuntun ibunya dan mereka berdua kemudian duduk berdampingan di pinggiran tempat tidur.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meraih tangan Junwoo, lalu menyodorkan sebuah kotak beludru kecil berwarna merah tua dengan senyum penuh arti)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ini... Ibu ingin memberikan benda ini untukmu, Junwoo-ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menerima kotak itu, perlahan membukanya dan seketika terpaku)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ini...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mata berkaca-kaca karena bahagia)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ini adalah cincin milik Ibu yang dulu digunakan oleh Ayahmu saat melamar Ibu. Sekarang, Ibu rasa sudah saatnya cincin ini Ibu serahkan kepadamu... untuk kau pasangkan di jemari Na Eun nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Jantungnya berdegup kencang, ia memegangi kotak cincin itu dengan tangan yang sedikit bergetar, lalu menatap ibunya dengan tatapan jujur)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu... jujur saja, aku merasa sangat gugup saat ini. Acara pertemuan keluarga kita nanti mendadak diubah menjadi sebuah lamaran resmi, sementara aku dan Han Na Eun sama sekali belum pernah bertemu secara personal atau bahkan sekadar berinteraksi sebagai orang dewasa.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengusap pundak putranya, menenangkan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nak, tenanglah. Kau tidak perlu cemas. Bahkan tadi siang, Nyonya Han baru saja menelepon dan mengonfirmasi kepada Ibu bahwa Na Eun sudah menyerahkan seluruh wewenang pengaturan acara kepada orang tuanya. Gadis itu benar-benar sudah menyetujuinya tanpa bantahan. Jadi, kau tidak perlu mengkhawatirkan apapun lagi, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar penuturan ibunya, batin Junwoo sontak bergejolak hebat. Sikap Han Na Eun terasa semakin aneh dan tidak masuk akal di pikirannya. Rasa penasaran yang besar kini bercampur aduk dengan rasa tidak percaya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mengapa seorang wanita sekokoh Na Eun bisa berpasrah diri begitu saja menghadapi pertemuan keluarga yang bahkan langsung ditingkatkan menjadi sebuah lamaran?</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Pikiran Junwoo berkecamuk. Satu-satunya akses informasi yang ia miliki saat ini adalah Han Seo Pyo, anak magang di kantornya. Namun, sebagai seorang pria dewasa dan berprofesi sebagai diplomat yang menjunjung tinggi etika, Junwoo tahu bahwa tidak mungkin baginya untuk menginterogasi adik kandung calon istrinya sendiri secara ugal-ugalan.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela nafas panjang, berusaha meredakan kecamuk pikirannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu, terima kasih banyak atas cincin dan penjelasannya. Tapi... ngomong-ngomong, kenapa Ibu bisa merasa sangat yakin dengan pilihan pada diri Han Na Eun? Ibu sendiri tahu bagaimana karakternya, bukan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum bijak, meraih kembali jemari putranya dan menggenggamnya dengan penuh kehangatan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sifat dan karakter itu adalah dua hal yang berbeda, Junwoo-ya. Ibu rasa, dia memiliki karakter yang tampak dingin dan keras kepala saat ini karena dia adalah tipe wanita yang sangat menghargai sebuah proses dan pencapaian. Namun, Ibu sangat yakin... jauh di dalam dirinya, ada sisi sifat asli yang belum kita ketahui, yang hanya bisa digali melalui waktu dan kelembutan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertegun mendengar jawaban filosofis ibunya, menatap cincin di tangannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... Ibu juga tahu sendiri, kan? Di masa lalu, keluarga kita sering kali ditawarkan berbagai kandidat gadis dari latar belakang hebat. Jika... jika dirasa nanti setelah bertemu ternyata kami benar-benar tidak memiliki kecocokan, apakah Ibu tidak akan merasa kecewa?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tulus tanpa beban, menggelengkan kepalanya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tadi siang Ibu juga sempat membahas hal ini secara hati ke hati dengan Nyonya Han di telepon, Nak. Kami para orang tua sama-sama sudah berusaha memberikan jalan yang terbaik untuk kalian. Pada akhirnya... kalian berdualah yang akan menjalani kehidupan itu nanti. Apapun hasilnya, kami tidak akan kecewa karena keputusan ada di tangan kalian sendiri.\"</span></p><h3 class=\"c9\" id=\"h.5ckw2nacj7a4\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.zhp318ptds3x\"><span class=\"c7 c1 c6\">Kepasrahan di Kamar Han Na Eun (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari yang sunyi di kediaman mewah keluarga Han. Jarum jam sudah menunjukkan waktu pukul 9 malam. Tuan Han dan Nyonya Han tampak sedang duduk bersantai di sofa ruang tengah yang luas dan formal, saat pintu depan terbuka dan memperlihatkan Na Eun muda yang baru saja melangkah masuk dengan bahu yang tampak turun karena kelelahan setelah seharian penuh lembur di kantor Florentina.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh ke arah koridor, suaranya terdengar berwibawa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Na Eun-ah, duduk sebentar di sini. Ayah dan Ibu ingin bicara sesuatu denganmu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun yang sudah sangat lelah, baik secara fisik maupun pikiran, sebenarnya hanya ingin segera membersihkan diri dan tidur. Namun, ia terpaksa menghentikan langkahnya dan berbelok menuju ruang tengah, berdiri kaku di hadapan kedua orang tuanya.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya terdengar serak dan pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah... ada apa?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum formal, merapikan duduknya)</span></p><p class=\"c0\"><span class=\"c1\">\"Ayah dan Ibu sudah memutuskan untuk mengadakan acara pertemuan dengan keluarga Park di rumah ini saja. Disini suasananya akan jauh lebih nyaman dan privasi kita lebih terjaga. Ibu juga sudah menyiapkan pakaian serta seluruh </span><span class=\"c1 c8\">wardrobe</span><span class=\"c4 c1\"> khusus yang harus kau kenakan pada hari itu nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Na Eun yang energinya sudah terkuras habis oleh angka-angka laporan operasional kantor tidak memiliki sisa tenaga lagi untuk mendebat atau memberikan masukan. Ia hanya mengangguk pelan dengan pandangan mata yang kosong, pasrah menerima segala keputusan sepihak itu.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ibu. Kalau begitu, aku permisi ke atas dulu karena aku sudah sangat capek.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tanpa menunggu jawaban lebih lanjut, Na Eun langsung melangkahkan kakinya dengan gontai menuju kamarnya di lantai atas.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke kamar tidur Na Eun. Begitu pintu tertutup, Han Na Eun langsung merebahkan seluruh tubuhnya di atas kasur empuknya tanpa sempat mengganti pakaiannya. Ia terlentang, menatap langit-langit kamarnya yang sepi dalam kegelapan. Tiba-tiba... dalam keheningan itu, memori musim semi tahun 2005 di kampus SNU mendadak berputar sekilas di kepalanya momen saat telapak tangannya pertama kali berjabat erat dengan Park Junwoo di aula.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika memejamkan matanya rapat-rapat, menggelengkan kepala untuk mengalihkan pikiran itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bahkan untuk sekedar memikirkan atau menyangkal perjodohan ini saja aku sudah merasa sangat lelah... tapi kenapa... kenapa sialnya pikiranku justru mendadak teringat kembali pada masa-masa di kampus dulu?\" </span></p><p class=\"c0\"><span class=\"c1 c8\">(Na Eun menghela napas panjang, menatap kosong ke sudut kamar)</span><span class=\"c4 c1\"> \"Rasa penasaranku padanya memang tinggi, tapi otak dan tubuhku benar-benar sudah tidak mampu lagi berpikir jernih malam ini...\"</span></p><h3 class=\"c9\" id=\"h.ehqmrc2vtvzx\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.81r1wa6jczlm\"><span class=\"c7 c1 c6\">Pertanyaan Junwoo pada Kotak Cincin (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah di saat yang bersamaan ke kamar tidur Park Junwoo. Suasana di sana tidak jauh berbeda, sunyi dan temaram. Junwoo juga tampak sudah merebahkan tubuhnya secara santai di atas kasur, menatap langit-langit kamarnya. Tangannya terangkat ke atas, memegang kotak beludru merah berisi cincin sang ibu.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap kotak cincin itu dengan tatapan menerawang, membiarkan pikirannya melayang bebas kembali ke masa tujuh tahun lalu saat masih aktif di lingkungan kampus SNU, lalu bergumam pelan pada dirinya sendiri)</span></p><p class=\"c0\"><span class=\"c1\">\"Dulu... saat kita masih satu angkatan di kampus, aku bahkan tidak pernah berani menanyakan langsung kepadamu kenapa kau menolak untuk bergabung ke dalam </span><span class=\"c1 c8\">student council</span><span class=\"c4 c1\">. Saat itu aku menahan diri karena aku sangat paham wanita seperti apa dirimu...\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menurunkan tangannya, meletakkan kotak cincin itu di atas dadanya sembari tersenyum kecil, sebuah senyuman tipis yang sarat akan ironi takdir.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi sekarang... dalam waktu satu minggu lagi, aku justru akan melangkah maju untuk melamarmu secara resmi?\" </span></p><p class=\"c0\"><span class=\"c1 c8\">(Terkekeh pelan, menggelengkan kepalanya di atas bantal)</span><span class=\"c4 c1\"> \"Rasanya benar-benar aneh sekali. Kenapa wanita sekeras dirimu tidak melayangkan penolakan kali ini, Han Na Eun? Apa sebenarnya yang sedang kau pikirkan tentang diriku... dan tentang perjodohan ini?\"</span></p><h3 class=\"c9\" id=\"h.ey2360kzi4ov\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.y69lol60stl\"><span class=\"c7 c1 c6\">Sup Hangat Kedai Kaki Lima dan Ambisi Oxford (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana siang hari yang cerah namun terik di area perkantoran distrik Gangnam. Di dalam gedung Firma Hukum Park, Junwoo muda melangkah dengan tenang menyusuri koridor menuju ruangan kerja Han Seo Pyo muda. Melihat kedatangan putra pemilik firma, Seo Pyo dengan sigap langsung beranjak berdiri dari kursi kerjanya dan menghampiri Junwoo dengan sikap hormat.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat siang, Hyung. Ada yang bisa saya bantu untuk pekerjaan siang ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum ramah, melambaikan tangan dengan gestur santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tenanglah, Seo Pyo-ya, jangan kaku begitu. Siang ini aku sengaja datang untuk mengajakmu makan siang bersama. Apakah kau sedang luang dan bisa ikut?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu bisa, Hyung. Kebetulan beberapa dokumen dan pekerjaan untuk hari ini sudah selesai kuperiksa semuanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baguslah kalau begitu. Mari kita cari kedai makan di sekitaran blok sini saja, ya.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke sebuah kedai sederhana khas makanan Korea di pinggir jalan, tidak jauh dari area kantor. Aroma kuah sup yang gurih memadati ruangan kedai yang tampak ramai oleh pekerja kantoran. Junwoo dan Seo Pyo duduk berhadapan setelah memesan makanan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat sekeliling kedai, lalu menatap Seo Pyo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau suka makan di tempat-tempat kaki lima seperti ini, Seo Pyo-ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum agak canggung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hanya beberapa kali saja, Hyung. Saya jarang mampir ke kedai seperti ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, menyodorkan mangkuk pelengkap)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, begitu ya? Kalau begitu, kau benar-benar harus mencoba beberapa menu sup dan makanan di kedai ini. Rasanya benar-benar autentik dan tak kalah dari restoran bintang lima, hahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih rekomendasinya, Hyung.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mulai membuka obrolan dengan nada kasual)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kulihat setelah hampir satu bulan kau magang di firma hukum kami, kinerjamu cukup cakap dan cekatan. Rencananya, setelah menyelesaikan masa magang ini, kau mau melanjutkan kuliah S2 di mana?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku berencana mendaftar ke Oxford, Hyung.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar antusias)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, benarkah? Kalau begitu kita akan menjadi satu alumni nanti. Jurusan apa yang kau ambil di sana?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c1\">\"Jurusan </span><span class=\"c1 c8\">Master of Science in Political and Social Science</span><span class=\"c4 c1\">, Hyung. Saat ini aku sedang berusaha keras belajar, semoga saja bisa lulus ujian masuknya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk mantap dengan nada penuh keyakinan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau pasti lulus, Seo Pyo-ya. Aku perhatikan kau memiliki talenta serta cara berpikir yang sangat cocok untuk masuk ke jurusan tersebut. Lalu, kapan rencananya kau akan berangkat ke Inggris?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kira-kira lima bulan lagi, Hyung. Karena sesuai kesepakatan awal, aku mendapatkan jatah magang di firma hukum ini selama enam bulan penuh.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baguslah, persiapannya masih cukup panjang. Jika kau mau, aku memiliki beberapa kenalan dosen dan alumni di sana. Kabari saja aku jika nanti kau membutuhkan bantuan informasi tentang asrama atau hal lainnya di Oxford.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya berbinar, tampak kagum)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, iya, Hyung... maaf sebelumnya, kalau tidak salah kau dulu menyelesaikan studi S2 dan S3 sekaligus di Inggris, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar, aku menyelesaikan keduanya di sana. Ada apa memangnya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau benar-benar hebat, Hyung. Bisa menembus dan menyelesaikan S2 serta S3 di institusi Oxford dan Cambridge ya? Itu impian banyak orang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan, melambaikan tangan merendah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, jangan memujiku berlebihan begitu. Justru sebenarnya... S2 di Oxford itu adalah pilihan keduaku, Seo Pyo-ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, bingung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eh? Maksudnya bagaimana, Hyung?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku sebenarnya dulu sangat ingin mengambil S2 di Harvard, hahaha. Tapi sayangnya aku tidak diterima di sana karena saingannya jauh lebih pintar dari diriku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggelengkan kepala, tidak setuju)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, yang benar saja, Hyung. Di lingkungan kami, kau dikenal sebagai seorang diplomat muda yang sangat cerdas dan memiliki pengalaman nyata di lapangan. Bagiku, masalah nama institusi sebenarnya tidak serta-merta mencerminkan kualitas personal seseorang.\"</span></p><h3 class=\"c9\" id=\"h.kj3qks6e9mm0\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.aecolyw86i70\"><span class=\"c7 c1 c6\">Pancingan Diplomasi tentang Han Na Eun</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, merasa obrolan sudah cukup cair untuk masuk ke inti tujuannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Begitu ya... Hmmm, ngomong-ngomong, kau mungkin sudah tahu kalau aku dan kakak perempuanmu akan dijodohkan dalam waktu dekat ini, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hehehe, tertawa kecil penuh arti)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Hyung. Ayah sudah menceritakan hal itu kepadaku beberapa hari yang lalu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela nafas pelan, memasang raut wajah yang tampak tulus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Haa, iya... Jujur saja, jika nanti kita benar-benar menjadi satu keluarga, aku merasa belum mengenal latar belakang kalian sepenuhnya, terutama tentang kakak perempuanmu. Padahal, seminggu lagi acara pertemuan resmi itu akan segera datang.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menaruh sumpitnya sejenak, mengingat sesuatu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hemmm... Soal itu, aku sempat mendengar cerita dari Ayah. Noona memang sama sekali tidak sedang mempermasalahkan atau menentang perjodohan ini. Dia memang akhir-akhir ini sedang sangat sibuk dengan urusan bisnis barunya. Tapi jujur, aku sendiri sempat tertegun melihat bagaimana dia bisa mempercayakan seluruh keputusan dan pengaturan acara ini kepada orang tua kami begitu saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Seo Pyo dengan saksama, memancing)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Memangnya... di hubungan kalian sebelumnya, dia tidak pernah bersikap seperti itu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh geli)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jarang sekali dia bisa sepasrah itu, Hyung, hehehe. Biasanya dia akan memberontak atau mendebat habis-habisan jika urusannya diatur oleh orang tua. Tapi mungkin... mungkin karena sekarang dia sudah semakin dewasa, jadi dia sudah tahu ke mana prioritas hidupnya harus diarahkan saat ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar rangkaian jawaban dari Seo Pyo, Junwoo sejenak terdiam dan kembali tenggelam dalam pikirannya sendiri. Alasan di balik kepasrahan Han Na Eun yang diceritakan sang adik justru melahirkan spekulasi baru di kepalanya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Benarkah wanita itu menerima perjodohan ini murni karena ia sudah terlalu lelah dengan urusan bisnisnya dan memilih bersikap dewasa? Ataukah... ada strategi tersembunyi lain yang sedang disiapkan oleh si wanita idealis tersebut di pertemuan minggu depan? Rasa penasaran Junwoo kini benar-benar telah menyentuh batas puncaknya.</span></p><h3 class=\"c9\" id=\"h.s5qs8eabjj9v\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.hc63ewosnzy0\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Daehyun langsung menepuk tangannya dengan heboh setelah mendengar bagian cerita makan siang tersebut.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Luar biasa! Junwoo Oppa benar-benar menggunakan taktik diplomasi tingkat tinggi untuk mengorek informasi dari Seo Pyo lewat kedai sup kaki lima! Tapi lucu sekali, Seo Pyo sama sekali tidak sadar kalau dia sedang diinterogasi, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggeleng-gelengkan kepala sambil tersenyum kecut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Itulah suamimu, Daehyun-ah. Di depan Junwoo, dia langsung melupakan tugas spionase yang kuberikan dan malah asyik mengobrol tentang ambisinya kuliah di Oxford. Benar-benar informan yang payah!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.sxpz3sd5vuul\"><span class=\"c7 c1 c6\">Makan Malam dan Skakmat dari Sang Adik (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana sore menjelang malam di kantor Florentina. Sinar matahari senja mulai meredup, digantikan oleh temaram lampu jalanan Gangnam. Han Seo Pyo muda melangkah masuk ke ruang kerja Na Eun sesuai instruksi kakaknya tadi sore yang mengajak makan malam bersama. Ia mendapati Na Eun masih berkutat dengan tumpukan sampel produk di mejanya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh sekilas tanpa menghentikan ketikannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau sudah datang? Tunggu sebentar ya, lima menit lagi selesai. Duduklah dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghembuskan napas, menjatuhkan diri ke sofa ruang kerja)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini, Noona. Pekerjaanmu belum selesai tapi sudah menyuruhku cepat-cepat ke sini. Untung saja jarak kantor kita dekat.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun akhirnya mengklik tombol simpan, menutup laptopnya dengan bunyi klik yang tegas, lalu meraih tas tangannya dan beranjak berdiri.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperhatikan sekeliling ruangan dengan dahi berkerut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi serius, Noona... ruanganmu ini benar-benar berantakan sekali. Kau ini tidak memiliki gudang penyimpanan atau bagaimana? Ruangan seorang pimpinan itu seharusnya terlihat rapi dan profesional.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berjalan melewati adiknya begitu saja, tidak menghiraukan omongan kritis tersebut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudahlah, jangan banyak komentar. Ayo berangkat.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke sebuah restoran yang nyaman di pusat kota Seoul. Setelah pelayan menyajikan hidangan makan malam mereka dan berlalu, Na Eun langsung memajukan tubuhnya, memasang mode serius.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi, bagaimana tentang informasi mengenai Park Junwoo? Kau kan sudah satu bulan magang di firma hukum ayahnya, harusnya kau tahu sesuatu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tersenyum jenaka, meletakkan sumpitnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... iya. Lucu sekali, tadi siang dia juga mendadak mengajakku makan siang bersama. Lalu sorenya saat di kantor, aku membaca pesan darimu yang mengajak makan malam. Aku merasa... kalian berdua ini memang benar-benar cocok kok.\" </span></p><p class=\"c0\"><span class=\"c1 c8\">(Menggoda kakaknya dengan kedipan mata)</span><span class=\"c4 c1\"> \"Buktinya, siang tadi aku ditraktir oleh calon kakak iparku, dan malam ini kau yang mengajakku makan mewah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya memerah karena kesal, refleks menggerakkan tas tangannya dan memukul lengan Seo Pyo agak keras)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Seo Pyo... kau ini ya! Bisa tidak, serius sedikit?!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Aduh! Mengaduh pelan sambil tertawa terbahak-bahak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Tapi kalian berdua ini memang lucu, Noona. Sama-sama penasaran tentang satu sama lain, tapi tidak ada yang berani bertanya secara langsung. Komunikasi macam apa kalau modelnya begini sejak sebelum menikah?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyandarkan tubuhnya, menghela nafas frustasi)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini tidak memahami situasinya, ya? Kondisi kami saat ini benar-benar tidak ideal untuk langsung bertanya atau menolak. Aku sangat penasaran, bahkan di H-7 menjelang pertemuan keluarga, dia tetap memilih untuk melangkah maju tanpa ragu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Kau tahu sendiri kan, aku sudah sangat stres dengan persiapan </span><span class=\"c1 c8\">launching</span><span class=\"c4 c1\"> produk baru Florentina, dan di tengah kekacauan itu tiba-tiba datang urusan perjodohan ini. Tenagaku sudah habis, Seo Pyo-ya. Aku tidak punya energi lagi kalau harus berdebat dengan Ayah dan Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengubah nadanya menjadi lebih serius, menatap kakaknya lekat-lekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Noona... kalau mau jujur, itu tandanya rasa penasaranmu itu sebenarnya adalah bentuk dari 'menerima' Junwoo Hyung. Kau saja yang tidak sadar. Kalian berdua ini sama-sama malu dan gengsi. Kalian berdua memunculkan argumen kalau kalian hanya sedang menggunakan logika dan rasionalitas, tapi sebenarnya... yang mendominasi tindakan kalian saat ini adalah rasa penasaran yang besar itu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, tidak terima)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa maksudmu? Kau mau bilang kalau aku tidak rasional begitu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, menyandarkan punggungnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Mungkin saja. Rasa penasaran itu sebenarnya... sudah ada sejak lama di dalam diri kalian masing-masing, kan? Sejak masa-masa kuliah kalian di SNU dulu. Tapi saat perjodohan ini datang, kalian akhirnya memunculkan kembali perasaan lama itu. Ini memang belum bisa disebut cinta, tapi rasa penasaran inilah yang akhirnya menggerakkan ego kalian untuk ingin saling mengenal lebih jauh lewat jalur perjodohan ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Han Na Eun seketika langsung terdiam seribu bahasa. Lidahnya mendadak kelu. Biasanya, jika dirasa tidak tepat atau menyudutkan posisinya, ia akan menyangkal habis-habisan setiap pernyataan yang keluar dari mulut adiknya dengan argumen yang logis. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, untuk pertama kalinya dalam hidup, Na Eun menyadari di dalam lubuk hatinya bahwa perkataan Seo Pyo ada benarnya. Meskipun begitu, ego dan benteng pertahanannya yang tinggi lagi-lagi memaksa dirinya untuk menyangkal perasaan tersebut.</span></p><h3 class=\"c9\" id=\"h.gj8y7ksgxsud\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.8st31319b3sl\"><span class=\"c7 c1 c6\">Bagian 5: Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Daehyun sampai menganga mendengarkan analisis psikologis dari suaminya di masa lalu.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c1\">\"Wah... gila! Seo Pyo benar-benar melakukan </span><span class=\"c1 c8\">skakmat</span><span class=\"c4 c1\"> padamu malam itu, Eonni! Analisisnya sangat tajam!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menyesap tehnya yang sudah dingin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar. Aku ingat malam itu aku langsung terdiam dan berpura-pura sibuk memotong daging karena tidak tahu harus menjawab apa. Seo Pyo berhasil menguliti gengsi yang selama ini kubanggakan. Bahwa di balik semua alasan kesibukan Florentina, aku memang sengaja membiarkan diriku 'hanyut' dalam perjodohan ini... hanya karena aku penasaran pada seorang Park Junwoo.\".</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c14\" id=\"h.cp4pav7i3go9\"><span class=\"c7 c1 c6\">Jas Lamaran dan Panggilan Darurat Florentina (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana siang hari di sebuah tempat penjahit (tailor) mewah dan legendaris langganan keluarga Park. Ruangan itu berbau kain wol mahal dan parfum ruangan yang menenangkan. Junwoo muda sedang berdiri di atas podium kecil di depan cermin besar setinggi langit-langit, mengenakan setelan jas formal pesanan khusus yang melekat sempurna di tubuh tegapnya. Nyonya Park berdiri di sampingnya, menatap sang putra dengan binar mata yang dipenuhi rasa haru.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap putranya dari atas sampai bawah, lalu tersenyum hangat sembari mengelus lembut pundak Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya ampun, Putraku... Kau terlihat sangat tampan dan berwibawa dengan jas ini. Kau benar-benar terlihat sudah sangat siap untuk meminang seorang gadis.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tailor:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merapikan lipatan kecil di bagian ujung lengan jas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana, Tuan Park? Apakah ada bagian yang dirasa kurang nyaman atau terlalu ketat saat Anda bergerak?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mencoba menggerakkan bahunya sedikit)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, ini sudah pas dan nyaman.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo kembali menatap bayangan dirinya sendiri di cermin besar. Tatapannya mendadak menerawang jauh. Pikirannya sama sekali tidak berada di ruangan itu, melainkan masih terfokus penuh pada perkataan Seo Pyo saat makan siang waktu itu. Kalimat bahwa Na Eun menerima perjodohan ini mungkin karena ia sudah terlalu lelah dengan urusan bisnisnya dan memilih bersikap dewasa, terus berputar-putar di kepalanya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyadari perubahan ekspresi putranya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa, Putraku? Kenapa kau mendadak termenung begitu? Apakah ada bagian dari desain jas ini yang tidak kau sukai?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tersadar dari lamunannya, langsung memasang senyum ramah)</span></p><p class=\"c0\"><span class=\"c1\">\"Oh, tidak, Ibu. Jas ini sudah sangat tepat dan sesuai. Ngomong-ngomong, apakah Ayah juga akan menyusul kita ke tempat </span><span class=\"c1 c8\">tailor</span><span class=\"c4 c1\"> ini?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak, Nak. Ayahmu sudah meninjau dan mencobanya tempo hari, jadi hari ini kita tinggal mengambil dan membawanya pulang saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, begitu. Baiklah kalau begitu.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c1\">\"Oh ya, habis dari sini kita mampir sekalian ke butik langganan Ibu di blok sebelah, ya? Kebetulan Ibu sudah membuat janji temu dengan Nyonya Han di sana. Mereka berdua sedang meninjau beberapa </span><span class=\"c1 c8\">blouse</span><span class=\"c4 c1\"> formal untuk acara beberapa hari ke depan.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar kata 'mereka', jantungnya mendadak berdesir cepat. Ia menebak bahwa Han Na Eun pasti juga sedang berada di sana saat ini)</span></p><p class=\"c0\"><span class=\"c1\">\"Oh... ih-iya, Ibu...\" </span><span class=\"c5 c1\">(Jawabnya terbata, berusaha menyembunyikan rasa gugup yang tiba-tiba menyerang).</span></p><h3 class=\"c9\" id=\"h.fyd5z166bxwj\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.u646edhkns84\"><span class=\"c7 c1 c6\">Lamunan di Balik Kaca Butik</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke butik pakaian wanita kelas atas yang bernuansa elegan. Di dalam ruang pas eksekutif, Han Na Eun muda sedang berdiri di depan cermin besar, sementara seorang pelayan butik sedang merapikan pakaian formal yang melekat di tubuhnya. Di sudut lain ruangan, Nyonya Han duduk anggun sembari mengamati putrinya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Pelayan Butik:</span></p><p class=\"c0\"><span class=\"c1\">\"Bagaimana, Nona Han? Apakah </span><span class=\"c1 c8\">blouse</span><span class=\"c4 c1\"> sutra ini sudah terasa nyaman untuk Anda gunakan?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melihat penampilannya di cermin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sudah pas dan sesuai.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Pelayan Butik:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana dengan potongan rok formalnya ini? Kami membuatnya dengan bahan yang senyaman mungkin agar Anda tidak kesulitan saat duduk nanti, Nona.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, sudah tidak ada masalah.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Setelah pelayan butik itu menjauh untuk mengambil pelengkap pakaian, Na Eun tiba-tiba termenung. Matanya menatap lurus ke arah kaca besar ruangan yang memantulkan pemandangan jalanan di luar butik. Di seberang jalan, ia melihat sepasang anak muda usia kuliahan yang sedang berjalan santai sambil bergandengan tangan dengan tawa lepas. Entah kenapa, Na Eun mengamati pemandangan itu semakin dalam. Pikiran logisnya seolah terseret kembali ke masa-masa kuliahnya di SNU dulu... masa di mana ia menutup diri dari hal-hal semacam itu demi ambisi dunianya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Kringgg... Kringgg...</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suara dering nyaring dari ponsel di atas meja seketika membuyarkan lamunan mendalam Na Eun. Ia menghela napas, melihat nama pemanggil di layar, lalu menoleh sopan ke arah ibunya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu, maaf... aku meminta izin untuk mengangkat telepon penting ini sebentar.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun menggeser layar ponselnya, dan suara panik dari kepala tim produksinya langsung terdengar.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Kepala Produksi (via Telepon):</span></p><p class=\"c0\"><span class=\"c5 c1\">\"Nona Han, maaf mengganggu waktu Anda. Kami baru saja mendapatkan laporan dari vendor kemasan di lapangan. Ada kesalahan cetak massal pada logo hologram botol sampel untuk acara launching! Beberapa vendor utama meminta Anda hadir langsung ke kantor sekarang untuk menyetujui desain alternatifnya, karena jika ditunda, distribusi ini akan bermasalah.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika berubah tegang, nada suaranya kembali tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, tahan mereka di sana. Jangan ambil keputusan apa pun sebelum aku tiba. Aku akan ke kantor sekarang.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun mematikan ponselnya, menarik napas dalam-dalam lalu menghampiri ibunya dengan raut wajah penuh rasa bersalah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu, maafkan aku. Sepertinya aku tidak bisa menemani Ibu sampai selesai di butik ini. Ada urusan mendadak dan sangat darurat di kantor Florentina yang harus segera kuurus sendiri sekarang juga. Aku akan meminta sopir pribadi kita untuk datang dan mengantar Ibu pulang nanti.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, melirik jam tangannya dengan raut wajah tidak senang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bukankah Ibu sudah meminta waktumu hari ini secara penuh untuk urusan pertemuan ini, Na Eun? Kenapa selalu saja mendadak ada urusan bisnis?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Benar, Ibu... maafkan aku. Aku benar-benar tidak menyangka urusan kesalahan vendor ini akan datang mendadak hari ini. Aku tidak bisa melewatkannya karena ini menyangkut nasib produk baruku.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghembuskan napas berat, menyerah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu jika memang itu maumu. Kau tidak perlu menelepon sopir pribadi kita untuk menjemput. Nanti Ibu bisa pulang bersama dengan Nyonya Park.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Na Eun yang sebelumnya mendengarkan jawaban ibunya sambil menunduk mengetik pesan balasan untuk perusahaannya, mendadak menghentikan jarinya dan mendongak cepat dengan mata membelalak.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Nyonya... Park?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Nyonya Park. Memangnya siapa lagi?\"</span></p><h3 class=\"c9\" id=\"h.7srf4hvwwsv2\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.hpjk5d7zttx0\"><span class=\"c7 c1 c6\">Persimpangan Takdir yang Terlewat</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Lima menit kemudian, di depan lobi butik mewah tersebut. Mobil sedan hitam milik Na Eun tampak bergerak membelah jalanan, berlalu meninggalkan area butik dengan terburu-buru. Tepat beberapa detik setelah mobil Na Eun menghilang di tikungan jalan, sebuah mobil hitam lain milik keluarga Park perlahan datang dan berhenti tepat di depan lobi yang sama.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo dan Nyonya Park melangkah turun dari mobil. Begitu memasuki area butik, Nyonya Han yang sudah menunggu di ruang tamu VIP langsung berdiri menyambut mereka dengan senyuman formal.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat datang, Nyonya Park.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah mendekat, memeluk hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, maafkan kami karena baru datang dan membuatmu menunggu, Nyonya Han. Oh ya, perkenalkan... ini adalah putra tunggalku, Junwoo.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat 90 derajat, menyapa dengan nada suara yang sedikit bergetar karena gugup)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Halo... Selamat siang, Nyonya Han. Saya Park Junwoo.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengedarkan pandangan ke sekeliling ruangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, ngomong-ngomong... di mana Na Eun, Nyonya Han? Bukankah tadi kau bilang dia ikut bersamamu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengulas senyum canggung, menghela napas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf sekali, Nyonya Park, Junwoo-ya... Dia baru saja pergi beberapa menit yang lalu karena ada urusan mendadak yang sangat darurat di kantornya. Benar-benar anak itu... Mohon dimaklumi, ya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, tidak apa-apa, tidak masalah sama sekali. Dunia bisnis anak muda zaman sekarang memang sangat sibuk.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Kedua wanita paruh baya itu pun melanjutkan obrolan akrab mereka sembari melangkah masuk ke dalam ruangan khusus VIP.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Sementara kedua ibu mereka tenggelam dalam obrolan hangat, Park Junwoo justru berdiri terpaku sendirian di ruang tamu butik. Ia menatap kosong ke arah pintu kaca besar tempat mobil Na Eun baru saja berlalu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Junwoo menyentuh dadanya sendiri yang masih berdegup kencang. Ia menyadari sepenuhnya bahwa sejak berada di dalam mobil tadi, ia sudah merasa sangat gugup dan mempersiapkan diri untuk berhadapan langsung dengan Han Na Eun. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, takdir ternyata memilih untuk bermain-main. Pertemuan yang ia antisipasi justru terlewat begitu saja dalam hitungan menit.</span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><h3 class=\"c14\" id=\"h.ait9ucazq2ct\"><span class=\"c7 c1 c6\">Malam Penentuan di Kediaman Han (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam di hari H lamaran di kediaman mewah keluarga Han. Ruang perjamuan khusus yang biasanya digunakan untuk menyambut tamu-tamu delegasi resmi kini telah disulap menjadi ruangan yang terasa sangat intim, privat, namun tetap memancarkan kemewahan yang berkelas. Kilau lampu gantung kristal menerangi meja panjang yang telah ditata sempurna. </span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">Di sudut ruangan, beberapa asisten rumah tangga berpakaian seragam rapi berdiri dengan sikap siap, sementara beberapa koki privat keluarga tampak sibuk merapikan hidangan pembuka.)</span></p><p class=\"c0\"><span class=\"c5 c1\">(Pintu besar ruangan terbuka. Kepala asisten rumah tangga keluarga Han melangkah masuk terlebih dahulu, memandu kedatangan rombongan keluarga Park.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Kepala Asisten RT:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk hormat dengan sangat sopan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tuan, Nyonya, silahkan masuk. Keluarga Han sudah menunggu Anda di dalam ruang perjamuan utama.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tuan Park dan Nyonya Park melangkah masuk dengan senyum hangat, diikuti oleh Junwoo muda yang berjalan tegap di belakang mereka dengan setelan jas barunya. Di tengah ruangan, Tuan Han dan Nyonya Han sudah berdiri tegak untuk menyambut. Tepat di belakang kedua orang tuanya, Han Na Eun melangkah dengan anggun. Ia mengenakan setelan blouse formal sutra pilihan ibunya, rambutnya ditata feminim ke belakang, dan wajahnya dihiasi senyuman tipis yang dipaksakan agar terlihat ramah.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengulurkan tangan, menjabat erat tangan Tuan Park)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat datang, Tuan Park. Sebuah kehormatan bagi kami bisa menjamu Anda sekeluarga malam ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyambut Nyonya Park dengan pelukan formal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Senang sekali akhirnya hari yang kita tunggu-tunggu ini tiba, Nyonya Park.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melangkah maju, membungkuk hormat kepada orang tua Na Eun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat malam, Tuan Han, Nyonya Han. Saya Park Junwoo.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Dan di detik itulah, di tengah riuhnya sapaan formal orang tua mereka, tatapan mata Park Junwoo dan Han Na Eun akhirnya saling berbenturan. Untuk pertama kalinya, mereka kembali berjumpa secara langsung setelah terpisahkan oleh waktu selama tujuh tahun sejak masa-masa kuliah mereka di SNU dulu. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tatapan penuh selidik dan rasa penasaran yang terpendam seketika membumbung tinggi di antara keduanya, sebelum akhirnya mereka semua dipersilakan untuk duduk di kursi masing-masing.</span></p><h3 class=\"c9\" id=\"h.bt3zdisirsxb\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.noq61brzbty9\"><span class=\"c7 c1 c6\">Kata Mutlak dan Runtuhnya Benteng Na Eun</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah semua pihak menikmati hidangan pembuka dan atmosfer ruangan mulai mencair, Tuan Park mendehem pelan, memulai inti pembicaraan formal.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, di malam hari yang sangat berbahagia ini, kami sekeluarga merasa sangat senang dan berterima kasih atas jamuan dari keluarga Han yang begitu spesial. Secara pribadi dan atas nama keluarga besar Park, saya mengucapkan terima kasih yang sebesar-besarnya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sama-sama, Tuan Park. Kami sekeluarga justru merasa sangat tersanjung dengan kesediaan keluarga Park untuk berkunjung langsung ke kediaman kami ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengubah raut wajahnya menjadi lebih serius namun penuh wibawa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, mari kita langsung menuju ke inti utama acara malam ini. Sebagai pertemuan pertama dari kedua belah pihak keluarga, tentu saja pertemuan ini memiliki nilai yang sangat sakral bagi kita semua. Sekaligus... di malam yang indah ini, kami dari keluarga Park secara khusus ingin melamar Han Na Eun untuk menjadi pendamping hidup bagi putra tunggal kami, Park Junwoo.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Mendengar pernyataan mutlak yang keluar dari mulut Tuan Park, Han Na Eun seketika terpaku. Ia benar-benar </span><span class=\"c1 c8\">speechless</span><span class=\"c4 c1\">. Dunianya seolah berhenti berputar selama beberapa detik. Ia sama sekali tidak menyangka bahwa kata \"pertemuan keluarga\" yang selama ini dibahas orang tuanya ternyata secara harfiah adalah sebuah acara lamaran resmi yang langsung mengikat komitmen.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Seketika, rasa sesal mendalam menghujam hatinya. Ia merutuki kecerobohan dan egonya sendiri beberapa minggu lalu, di mana ia terlalu lelah dan stres memikirkan urusan bisnis Florentina hingga dengan bodohnya mempercayakan seluruh wewenang kepada orang tuanya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, di situasi seformal ini, di mana nama baik dan harga diri kedua keluarga besar dipertaruhkan, Na Eun tahu ia tidak mungkin bisa langsung menyangkal atau melakukan penolakan secara terbuka.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh ke arah putrinya yang tampak terdiam, memberi tekanan halus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana, Han Na Eun?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Untuk pertama kalinya dalam hidup seorang Han Na Eun yang terkenal idealis dan memiliki prinsip sekeras baja, ia terpaksa menyerah. Didorong oleh rasa penasarannya yang besar pada sosok pria di hadapannya, ia memilih untuk meruntuhkan benteng pertahanannya malam itu.</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menarik napas dalam, lalu mengangguk pelan dengan anggun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya... aku menerimanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Junwoo yang duduk tepat di seberang meja, di samping kedua orang tuanya, sempat tertegun tidak percaya. Matanya sedikit membelalak. Wanita sedingin es yang ia temui tujuh tahun lalu di kampus, kini dengan begitu mudahnya menerima lamaran pernikahan ini di depan matanya sendiri. </span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c1 c8\">'Sangat tidak bisa dipercaya... seorang Han Na Eun menyetujui pertunangan ini tanpa ada perlawanan sedikit pun?'</span><span class=\"c4 c1\"> batin Junwoo berkecamuk.</span></p><h3 class=\"c9\" id=\"h.f7ajk4womrhs\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.3zz0tf8r56pb\"><span class=\"c7 c1 c6\">Perjanjian Tiga Bulan</span></h3><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya berbinar dipenuhi rasa bahagia yang luar biasa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, terima kasih banyak, Naeun-ah... Terima kasih karena kau bersedia menerima putra kami.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kami juga merasa sangat tersanjung, Nyonya Park. Park Junwoo adalah pilihan terbaik untuk menjadi calon menantu di keluarga kami.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Syukurlah jika Na Eun sudah memberikan jawabannya dengan bijak. Kami sekeluarga mengucapkan terima kasih yang sebesar-besarnya atas lamaran resmi ini. Namun... sebelum kita melangkah lebih jauh, mungkin ada baiknya kita membiarkan kedua calon pengantin ini untuk menyampaikan pendapat atau ekspektasi mereka masing-masing? Mari kita mulai dari kau terlebih dahulu, Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sempat termenung sejenak sebelum mendengar suara ayahnya, lalu mendongak dengan tatapan mata yang kembali tajam dan taktis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... iya, Ayah. Terima kasih atas kesempatannya. Mungkin... saya pribadi membutuhkan waktu setelah lamaran atau pertunangan resmi ini terjadi. Saya meminta waktu selama tiga bulan ke depan untuk kami saling mengenal dan berproses. Setelah masa tiga bulan itu selesai, baru saya rasa itu akan menjadi keputusan akhir kami bersama untuk lanjut ke jenjang pernikahan atau tidak.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar persyaratan tak terduga yang diajukan Na Eun, Nyonya Han yang duduk di sebelahnya seketika terkejut. Ia menyenggol lengan putrinya di bawah meja sambil melemparkan tatapan mata penuh peringatan.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, berusaha mencairkan ketegangan)</span></p><p class=\"c0\"><span class=\"c1\">\"Ah, tentu saja tidak apa-apa, Naeun-ah. Ibu sangat mengerti, kalian berdua memang harus melakukan pendekatan terlebih dahulu sebelum melangkah ke pelaminan.\" </span><span class=\"c1 c8\">(Nyonya Park kemudian menyenggol lengan putranya sendiri dan menoleh)</span><span class=\"c4 c1\"> \"Bagaimana menurutmu, Nak? Apakah kau setuju dengan syarat dari Na Eun?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendehem pelan, memperbaiki posisi duduknya, menatap Na Eun lekat-lekat dengan senyum diplomatik yang menantang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ehm, iya, Ibu. Aku rasa itu bukan masalah. Aku juga merasa perlu untuk mengenal Na Eun lebih dekat, begitu pula sebaliknya dengan dirinya terhadapku. Tapi... aku juga ingin memberikan satu penjelasan tambahan di sini.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo jeda sejenak, memberikan penekanan pada kalimatnya)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terkait keputusan akhir setelah masa berproses tiga bulan itu selesai, aku rasa... aku sebagai pihak pria juga berhak memiliki hak suara yang sama untuk menentukan apakah pernikahan ini layak dilanjutkan atau justru sebaliknya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa bangga melihat ketegasan calon menantunya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, tentu saja tidak masalah, Junwoo-ya. Saya rasa ini adalah sebuah keputusan dan kesepakatan yang sangat adil bagi kalian berdua untuk memulai semuanya.\"</span></p><h3 class=\"c9\" id=\"h.c5jxly389dnq\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c14\" id=\"h.cj8mzjadm1t1\"><span class=\"c7 c1 c6\">Sematan Cincin dan Kilas Balik Aula SNU (Kilas Balik - Mei 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Setelah kesepakatan masa penjajakan tiga bulan disetujui oleh kedua belah pihak, Tuan Park tersenyum puas dan memberikan isyarat kepada putranya.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu. Sebagai peresmian dari ikatan awal ini, izinkan Junwoo memberikan seremonial lamaran dan pertunangan ini untuk Na Eun dengan menyematkan cincin tanda pertunangan mereka.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar instruksi tersebut, seketika jantung Park Junwoo dan Han Na Eun berdegup kencang secara bersamaan. Ada rasa gugup yang luar biasa mencuat ke permukaan, namun sebagai dua individu yang terlatih untuk menjaga reputasi, mereka menutupi kegugupan itu dengan melangkah yakin ke depan, berdiri saling berhadapan di tengah ruangan disaksikan oleh kedua orang tua mereka.</span></p><p class=\"c0 c2\"><
