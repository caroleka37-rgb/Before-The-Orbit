nna-ya, kau baru saja sampai rumah juga? Ini Bibi bawakan oleh-oleh dari New Zealand, nanti bongkar bersama adikmu di kamar, ya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Inna:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, terima kasih banyak, Bibi Daehyun. Kebetulan aku baru saja selesai merapikan buku-buku tugas sekolah.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suster penjaga segera maju dengan hati-hati mengambil alih Eun Jae dari gendongan Daehyun untuk menidurkannya kembali di ranjang bayi. Inna kemudian menuntun adiknya yang mulai rewel karena lelah, Yoo Seo, untuk masuk ke dalam kamar mereka di lantai atas. Suasana ruang tamu kini kembali tenang, menyisakan Na Eun dan Daehyun yang duduk bersandar di sofa mewah.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengeluarkan ponselnya sambil tersenyum misterius)</span></p><p class=\"c0\"><span class=\"c1\">\"Daehyun-ah, sebenarnya aku sudah mengirim pesan </span><span class=\"c1 c8\">chat</span><span class=\"c4 c1\"> ke Seo Pyo sejak kita di kafe tadi. Aku merayunya sedikit agar dia mau memberikan izin kepadamu untuk menginap di sini malam ini. Tapi anehnya, dari tadi anak itu sama sekali tidak membalas pesanku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa lepas, menggeleng-gelengkan kepalanya sambil menunjukkan layar ponselnya sendiri kepada Na Eun)</span></p><p class=\"c0\"><span class=\"c1\">\"Eonni, Eonni... pantas saja dia tidak membalas pesanmu! Dia langsung mengirim </span><span class=\"c1 c8\">chat</span><span class=\"c4 c1\"> kepadaku begitu membaca pesan darimu. Lihatlah rentetan pertanyaannya ini... Benar-benar seperti sedang menginterogasi lawan politik daripada bertanya kepada istrinya sendiri, Hahaha!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengus geli, ikut melihat layar ponsel Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Astaga, anak itu... Berani-beraninya dia mengabaikan pesan kakaknya sendiri tapi langsung membalas istrinya. Menanyai apa saja dia memangnya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lagi, meniru nada bicara suaminya yang kaku)</span></p><p class=\"c0\"><span class=\"c1\">\"Dia bertanya: </span><span class=\"c1 c8\">'Kenapa harus menginap? Memangnya apa yang harus kalian bicarakan berdua sampai tidak bisa pulang ke rumah sebelah?'</span><span class=\"c4 c1\"> Hahaha, dia terdengar sangat tidak rela.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Biarkan saja, Daehyun-ah. Jangan dibalas mendetail, biar dia penasaran di kantornya, Hahaha! </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">Ngomong-ngomong, selagi dia belum pulang, lanjutkanlah lagi ceritamu yang tadi, Eonni. Setelah kalian berdua sama-sama gagal dalam urusan perjodohan itu, lalu setelah kalian resmi lulus S3, bagaimana kelanjutan garis hidup kalian?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya... Tahun 2011, ya...\"</span></p><h3 class=\"c11\" id=\"h.ymtml0wnf1ty\"><span class=\"c7 c1 c6\">Cikal Bakal Florentina di Gangnam (Kilas Balik - Tahun 2011)</span></h3><p class=\"c0\"><span class=\"c1 c8\">(Suasana berpindah ke sebuah ruang kantor minimalis namun elegan di wilayah Gangnam, Seoul, tahun 2011. Terpampang logo bertuliskan </span><span class=\"c1 c6 c8\">\"Florentina\"</span><span class=\"c5 c1\"> di dinding utama. Na Eun muda yang baru saja menyelesaikan gelar Doktornya dari Harvard, tampak berdiri di depan papan tulis kaca, memimpin rapat bersama beberapa staf riset dan pemasaran pertamanya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetuk pulpennya ke papan kaca dengan tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\" Tapi untuk urusan operasional, kita harus mandiri. Formulasi bahan organik Florentina yang kubawa dari riset disertasi di Harvard harus segera memasuki uji klinis tahap akhir di Seoul pekan depan. Bagaimana kesiapan tim pemasaran?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Manajer Staf:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Semua jalur distribusi sampel sudah siap, Nona Han. Kami juga sedang memetakan target pasar wanita karier di distrik bisnis. Namun, modal awal kita masih sangat terbatas untuk promosi besar-besaran.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tenang, penuh keyakinan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak perlu promosi besar-besaran yang sia-sia. Fokus pada kualitas produk kita terlebih dahulu. Begitu khasiat Florentina terbukti di kulit mereka, produk ini yang akan berbicara sendiri di pasar. Mulai besok, kita lakukan pergerakan senyap.\"</span></p><h3 class=\"c11 c25\" id=\"h.uol5gqo51nyd\"><span class=\"c7 c1 c6\"></span></h3><p class=\"c0\"><span style=\"overflow: hidden; display: inline-block; margin: 0.00px 0.00px; border: 0.00px solid #000000; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px); width: 601.70px; height: 328.00px;\"><img alt=\"\" decoding=\"async\" loading=\"lazy\" src=\"images/image-09.png\" style=\"width: 601.70px; height: 328.00px; margin-left: 0.00px; margin-top: 0.00px; transform: rotate(0.00rad) translateZ(0px); -webkit-transform: rotate(0.00rad) translateZ(0px);\" title=\"\"/></span></p><h3 class=\"c11 c25\" id=\"h.3wjde72j8bau\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c11\" id=\"h.mejqu4nu7975\"><span class=\"c7 c1 c6\">Pelancong Perdamaian Dunia di Kamar Asrama (Kilas Balik - Tahun 2011)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke sisi lain kota Seoul. Ruang tengah kediaman keluarga Park yang dipenuhi tawa dan aroma makanan. Junwoo muda yang baru saja pulang membawa gelar Doktor dari Cambridge, sedang menjamu beberapa teman dekat alumni SNU-nya dalam acara kumpul-kumpul hangat.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 1:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menepuk bahu Junwoo sambil memegang gelas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Junwoo-ya! Kudengar setelah kelulusan S3-mu ini, kau langsung lolos seleksi dan akan ditempatkan sebagai diplomat muda di Jenewa, Swiss? Wah, kau akan tinggal sangat jauh lagi dari Seoul!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 2:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut menimpali sambil tertawa)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya benar! Hidupmu ini memang sudah seperti pelancong perdamaian dunia, Junwoo-ya. Pindah dari satu negara ke negara lain demi urusan diplomasi internasional.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, merangkul kedua temannya dengan pembawaan supelnya yang khas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha, kalian ini berlebihan sekali. Sebenarnya ini baru langkah awal, Teman-teman. Aku ingin mencoba mengambil tantangan baru di Jenewa selama beberapa waktu untuk melihat bagaimana dinamika hukum internasional di lapangan yang sesungguhnya. Tapi tenang saja, jiwaku tetap anak Seoul.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Teman 1:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tapi di sana nanti jangan terlalu sibuk dengan berkas PBB, carilah kekasih! Jangan sampai kau menolak wanita lagi seperti di Inggris dulu!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hanya tersenyum penuh arti)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Urusan itu... biarlah waktu yang menjawab. Yang penting malam ini kita nikmati dulu makanan ibuku!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di tahun 2011 itu, baik Han Na Eun maupun Park Junwoo masih berjalan di atas rel masing-masing yang terpisah ribuan mil. Yang satu sibuk merintis mimpi kosmetiknya di Gangnam, dan yang satu lagi bersiap terbang ke Swiss demi misi diplomasi. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Belum ada gebrakan yang mempertemukan mereka, namun fondasi masa depan sedang mereka bangun dengan kokoh.</span></p><h3 class=\"c11 c25\" id=\"h.eanyokygte0e\"><span class=\"c7 c1 c6\"></span></h3><h3 class=\"c11\" id=\"h.d5822yokok7w\"><span class=\"c7 c1 c6\">(Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke ruang tamu mansion Na Eun di masa sekarang. Jam dinding besar bergaya klasik sudah menunjukkan tepat pukul 17.00 sore.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil mengenang masa itu)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi begitu... ceritanya setelah badai perjodohan itu selesai, kami sama-sama sibuk merintis mimpi masing-masing. Belum ada gebrakan atau kejutan apa pun sih saat itu, benar-benar datar, hahaha.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Tiba-tiba, terdengar suara langkah kaki yang tegas namun terburu-buru masuk dari arah pintu depan menuju ruang tamu. Han Seo Pyo, yang baru saja pulang dari kantor kementeriannya dengan setelan jas formal yang rapi, muncul dengan wajah cemberut yang dibuat-buat.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Langsung berjalan mendekat, menatap Daehyun dengan pandangan memprotes lalu melirik kakaknya dengan tatapan menggoda)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Yeobo... kenapa kau harus menginap di sini malam ini? Apa kau mendadak lupa kalau rumah kita itu hanya berjarak beberapa langkah di sebelah?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika berdiri dari sofanya, berjalan maju dan mendorong bahu adiknya dengan jenaka menuju pintu keluar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Seo Pyo! Sudah, kau pulang sendiri sana ke rumahmu! Kau kan biasanya sangat suka menghabiskan waktu bekerja sampai larut malam di ruang kerjamu? Sudah, biarkan Daehyun menemaniku malam ini saja di sini!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Hanya bisa tertawa terpingkal-pingkal di atas sofa, menutup mulutnya melihat tingkah menggemaskan sang suami yang pasrah didorong oleh kakaknya)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Mendengar keributan lucu di bawah, Yoo Seo dan Inna mendadak turun kembali ke ruang tamu dari kamar mereka. Kedua anak itu langsung tertawa melihat tingkah ibu mereka yang sedang mendorong sang paman.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil terus mendorong Seo Pyo dengan tawa meledek)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kami bahkan belum menyelesaikan setengah dari semua cerita penting kami, Daehyun-ah! Jadi, biarkan adikku yang manja ini pulang ke rumahnya sendirian malam ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menahan tubuhnya di dekat pilar, memasang wajah memelas sambil menatap Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau tega sekali memisahkanku dari istriku sendiri, Noona? Lihat itu, dia sedang tersenyum manis kepadaku sekarang. Mana mungkin aku sanggup harus melewatkan malam sendirian di rumah besar itu tanpanya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggelengkan kepala sambil berkacak pinggang)</span></p><p class=\"c0\"><span class=\"c1\">\"Sudah, jangan berlebihan dan melodramatis seperti itu. Ini hanya untuk sehari saja, Pak Menteri!\" </span><span class=\"c5 c1\">(Dengan nada meledek jabatan adiknya)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika itu juga, tawa Daehyun, Inna, dan Yoo Seo pecah berbarengan memenuhi seisi ruang tamu, menyaksikan kehangatan hubungan kakak-beradik keluarga Han yang tidak pernah berubah sejak dulu.)</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Sebuah Nama yang Bergaung Kembali", "html": "<p class=\"c10 title\" id=\"h.afgkiey8988l\"><span class=\"c13 c23\">Sebuah Nama yang Bergaung Kembali</span></p><h2 class=\"c20\" id=\"h.ki8d43vdba2n\"><span class=\"c1 c6 c24\">BAB: SEBUAH NAMA YANG BERGAUNG KEMBALI</span></h2><p class=\"c0\"><span class=\"c3 c1\">Timeline: 2026 – Lantai Dua Kediaman Keluarga Han, Seoul (Masa Sekarang)</span></p><h3 class=\"c11\" id=\"h.40fs5ra5gy9r\"><span class=\"c7 c1 c6\">Bagian 1: Kerinduan Pak Menteri di Balik Jendela Jauh</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana malam hari yang tenang di area bersantai lantai dua mansion Na Eun. Setelah seharian penuh dengan aktivitas, suasana rumah kini meredup nyaman. Inna dan Yoo Seo sudah selesai dibantu belajar dan telah terlelap di kamar mereka, begitu pula dengan bayi Eun Jae yang sudah ditidurkan dengan aman di ranjangnya. Na Eun dan Daehyun duduk santai dengan cangkir teh hangat di tangan mereka, menghadap ke arah jendela kaca besar yang memperlihatkan pemandangan halaman dan mansion megah milik Daehyun dan Seo Pyo yang terletak tepat di sebelah.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan sambil menunjuk ke arah jendela, menatap ke arah mansion sebelah)</span></p><p class=\"c0\"><span class=\"c1\">\"Lihatlah ke arah mansionmu itu, Daehyun-ah. Dari sini masih terlihat sangat jelas lampu ruang kerja Seo Pyo menyala terang.\" </span><span class=\"c1 c8\">(Tertawa renyah)</span><span class=\"c4 c1\"> \"Padahal ini sudah hampir pukul sembilan malam. Sudah kuduga, anak itu pasti akan menghabiskan malamnya berteman dengan tumpukan berkas-berkas kementeriannya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tertawa menyahut ucapan kakak iparnya, lalu menggoyang-goyangkan ponsel di tangannya)</span></p><p class=\"c0\"><span class=\"c1\">\"Iya, Eonni, benar sekali! Dia itu benar-benar tidak bisa tenang. Bahkan baru saja dia mengirimkan foto di </span><span class=\"c1 c8\">chat</span><span class=\"c1\"> pribadiku. Coba lihat, ini foto tumpukan berkas yang baru saja kau sebutkan tadi.\" </span><span class=\"c1 c8\">(Menunjukkan layar ponselnya yang berisi foto dokumen dengan pesan singkat)</span><span class=\"c1\"> \"Dan lihat apa yang dia tulis di bawahnya: </span><span class=\"c1 c8\">'Aku merindukanmu.'</span><span class=\"c4 c1\">\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Melirik layar ponsel Daehyun lalu mendengus geli)</span></p><p class=\"c0\"><span class=\"c1\">\"Dan biarkan kutebak... dia mengirim kalimat itu dengan sangat datar tanpa ada tambahan satu pun </span><span class=\"c1 c8\">emoticon</span><span class=\"c4 c1\"> di belakangnya, kan? Dasar, Han Seo Pyo sekali.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa lepas menanggapi kebenaran tebakan Na Eun, lalu merapatkan posisi duduknya, menatap Na Eun penuh minat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Eonni... jika di tahun 2011 kalian berdua masih sama-sama sangat fokus pada impian dan rintisan karir kalian masing-masing, lalu kapan tepatnya kalian mulai dijodohkan kembali oleh orang tua? Ceritakanlah, aku sudah tidak sabar ingin mendengarnya!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, sorot matanya kembali menerawang ke masa lalu, mengingat benang takdir yang mulai ditarik mendekat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi, semuanya dimulai di tahun 2012...\"</span></p><h3 class=\"c11\" id=\"h.9gsucidmm9ip\"><span class=\"c7 c1 c6\">Bagian 2: Kepulangan Sang Pelancong ke Hangatnya Rumah (Kilas Balik - Seoul, 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke ruang makan kediaman keluarga Park yang penuh dengan aroma masakan rumahan yang menggugah selera. Di atas meja makan, tersaji berbagai macam hidangan khas Korea yang tertata rapi. Park Junwoo muda yang baru saja kembali dari Jenewa, Swiss, duduk bersama kedua orang tuanya dalam atmosfer yang begitu intim dan hangat.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengambilkan sepotong daging besar dan menaruhnya di atas mangkuk nasi Junwoo dengan senyum lebar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ayo, Putraku, makanlah yang banyak! Ayah sengaja memasak semua makanan kesukaanmu hari ini untuk merayakan kepulanganmu ke Seoul.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum bahagia, matanya berbinar menatap hidangan di depannya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak, Ayah. Wah, baunya enak sekali. Kalau yang ini... apakah ini kimchi buatan Ibu, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum lembut, mengangguk)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Anakku. Ibu sudah menyiapkannya dan membuatnya sejak sepekan yang lalu khusus untuk menyambut kedatanganmu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyuap makanan dengan lahap, lalu menghela napas lega)</span></p><p class=\"c0\"><span class=\"c1\">\"Ah, luar biasa enak. Inilah yang membuatku selalu merasa kangen dan ingin cepat pulang ke Seoul, karena kehangatan kalian berdua yang tidak pernah berubah.\" </span><span class=\"c1 c8\">(Junwoo meletakkan sumpitnya perlahan, menatap kedua orang tuanya dengan saksama)</span><span class=\"c4 c1\"> \"Oh ya, Ayah, Ibu... sepertinya setelah ini aku tidak akan melanjutkan lagi jabatanku sebagai diplomat di Jenewa.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sedikit terkejut, menurunkan sendoknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa, Nak? Apa ada masalah selama kau bertugas di sana? Apa kau tidak betah tinggal di Swiss?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap cemas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, ada apa, Junwoo? Apa terjadi sesuatu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum menenangkan agar orang tuanya tidak khawatir)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bukan begitu, Bu. Aku hanya berpikir bahwa akan jauh lebih baik jika aku menetap dan bekerja di dekat kalian mulai sekarang. Setelah satu tahun penuh berada di Jenewa dan mengumpulkan beberapa pengalaman berharga sejak masa S3 dulu termasuk magang di beberapa lembaga internasional aku memutuskan untuk mematangkan karir di sini saja. Aku ingin mencari peluang di Seoul tanpa harus hidup berjauhan lagi dengan Ayah dan Ibu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Matanya seketika berkaca-kaca karena terharu, meraih dan menggenggam erat tangan putranya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, Putraku... apa pun yang menjadi keputusanmu, Ibu akan selalu mendukung dan mendoakanmu, asalkan kau merasa bahagia dalam menjalaninya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk setuju dengan tatapan bangga)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah juga sependapat dengan Ibumu. Bagaimana kalau untuk sementara waktu, jika kau mau, kau bisa membantu mengurus firma hukum milik Ayah, atau ikut mengawasi manajemen rumah sakit dan yayasan kemanusiaan milik keluarga kita?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk patuh sambil tersenyum hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja, Ayah. Aku akan membantu kalian dengan seluruh kemampuanku di firma dan yayasan, sambil perlahan menunggu peluang besar lain yang sedang kupersiapkan datang.\"</span></p><h3 class=\"c11\" id=\"h.n3y74nhs77z9\"><span class=\"c7 c1 c6\">Bagian 3: Ambisi \"Florentina\" dan Tawaran Aliansi Bisnis (Kilas Balik - Seoul, 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke sebuah ruang kerja yang luas, kaku, dan berwibawa di kediaman utama keluarga Han. Tuan Han duduk di balik meja kerja kayunya yang besar, sementara Nyonya Han duduk di sofa kulit di dekatnya. Han Na Eun muda berdiri di hadapan mereka, memegang sebuah iPad yang menampilkan grafik perkembangan bisnis kosmetik mandirinya, Florentina.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetuk jemarinya di atas meja, menatap putrinya dengan tajam)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Bagaimana dengan perkembangan bisnismu, Florentina? Apakah operasionalnya berjalan lancar selama satu tahun ini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyalakan layar iPad-nya dan menyerahkannya ke hadapan sang ayah dengan penuh percaya diri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Ayah. Perusahaanku menunjukkan data grafik perkembangan yang sangat positif. Selama dua kuartal terakhir, retensi pelanggan kami meningkat sebanyak 45%, dan formula organik Florentina mulai diakui oleh beberapa klinik kecantikan mandiri di Seoul. Skala produksi kami bahkan harus dinaikkan bulan depan untuk memenuhi permintaan pasar.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memperhatikan grafik di layar iPad, mengangguk-angguk kecil secara formal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Mendengar penjelasan dan melihat pencapaianmu ini, Ayah rasa sudah saatnya perusahaan kecilmu itu membutuhkan suntikan dana dari investor luar agar strukturnya bisa berkembang dengan lebih matang dan cepat.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sedikit terkejut, langsung menarik kembali iPad-nya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Investor? Tapi Ayah, bisnis ini baru berjalan murni selama satu tahun. Aku masih sangat menikmati proses pertumbuhan organiknya dan ingin mengelolanya secara mandiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut menyahut dari tempat duduknya dengan nada suara yang menuntut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Na Eun-ah, untuk menjadi sebuah korporasi yang besar dan bertumbuh di industri ini, kau tidak bisa hanya mengandalkan idealis idemu sendiri. Kau harus memiliki aliansi bisnis yang kuat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kebetulan, ada beberapa kolega Ayahmu yang sudah melihat profil Florentina dan mereka menyatakan siap untuk memberikan investasi besar. Kita bisa mengatur pertemuan resmi dengan mereka dalam waktu dekat.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengepalkan tangannya pelan, menahan kekesalannya namun tetap berusaha menjawab dengan nada sedatar mungkin)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf, Ibu, tapi aku belum mau menerima investasi dari luar. Aku masih ingin melihat bagaimana pertumbuhan Florentina tegak berdiri di atas kakinya sendiri tanpa bantuan dari aliansi siapapun saat ini. Tolong hargai keputusanku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas berat, menetapkan batasan baru dengan tegas)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, Ayah akan memberikanmu kelonggaran dan menunggu sampai tahun depan. Tetapi ingat Han Na Eun, setidaknya di tahun depan kau harus bisa menunjukkan kualitas profit dan laporan keuangan yang jauh lebih baik serta berlipat ganda dari apa yang kau tunjukkan sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terdiam dengan perasaan yang sangat tertekan di bawah bayang-bayang ekspektasi tinggi ayahnya, lalu menundukkan kepalanya sedikit)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, Ayah. Aku mengerti.\"</span></p><h3 class=\"c11\" id=\"h.1kuqmrb1l1lq\"><span class=\"c7 c1 c6\">Bagian 4: Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Na Eun menghela nafas panjang sembari menyesap sisa teh hangat di cangkirnya, mengingat kembali betapa melelahkannya ambisi di tahun 2012 itu.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil tertawa kecil menatap Daehyun)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi begitu... ceritanya di tahun 2012, setelah melewati masa-masa perjodohan yang berantakan itu, kami berdua sama-sama sedang merintis mimpi di kota yang sama. Belum ada gebrakan besar atau pertemuan yang dramatis di antara kami saat itu, semuanya masih berjalan di jalurnya masing-masing.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tulus, menopang dagunya dengan mata berbinar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Wah, walaupun belum bertemu, tapi ketegangan ceritanya sudah mulai terasa, Eonni! Lalu, apa yang terjadi setelah tahun 2012 berlalu? Bagaimana nama itu akhirnya bergaung kembali di hidupmu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum penuh arti, melirik ke arah luar jendela)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kelanjutan cerita setelah itu jauh lebih menarik, Daehyun-ah. Tapi sepertinya, sebelum aku melanjutkannya, kau harus membalas dulu pesan suamimu di sebelah sebelum dia nekat membawa seluruh berkas kementeriannya dan ikut tidur di sini malam ini, Hahaha!\"</span></p><h3 class=\"c11\" id=\"h.wbn40rtg1mtv\"><span class=\"c7 c1 c6\">Tetangga Dekat yang Belum Bersua (Kilas Balik - Gangnam, 2012)</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Di tahun 2012, distrik Gangnam menjadi saksi bisu betapa dekatnya jarak fisik di antara mereka. Gedung kantor </span><span class=\"c1 c8\">Florentina</span><span class=\"c4 c1\"> milik Na Eun dan gedung Firma Hukum Park rupanya hanya dipisahkan oleh beberapa bangunan di blok yang sama. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, kesibukan masing-masing membuat kedua alumni SNU itu belum pernah sekalipun berpapasan di jalan.</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana pagi hari yang cerah di kantor utama Firma Hukum Park. Ruangan terasa luas dan profesional. Tuan Park berdiri di tengah kubikel staf bersama Park Junwoo muda yang berpakaian setelan jas rapi.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menepuk pundak Junwoo sambil berbicara dengan suara lantang ke seluruh staf)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat pagi semuanya! Mulai hari ini, putraku, Junwoo, akan mulai aktif membantu operasional kita di firma hukum ini. Jadi, tolong jangan sungkan-sungkan untuk berinteraksi dan bekerja sama dengan dia.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum hangat, membungkuk ramah kepada semua orang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Halo, selamat pagi Teman-teman semua. Saya Park Junwoo, senang rasanya bisa menyapa kalian semua hari ini. Mohon bantuannya selama saya di sini, ya, dan jangan pernah sungkan jika kalian membutuhkan bantuan saya.\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Semua staf menyambut dengan tepuk tangan riuh, menciptakan binar keakraban yang kental di dalam firma hukum tersebut.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh ya, ada satu pengumuman lagi. Kita juga kedatangan salah satu talenta terbaik di bidang hukum saat ini yang akan menjalani magang di firma kita. Silakan masuk, Han Seo Pyo.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Han Seo Pyo muda (25 tahun) melangkah masuk dengan pembawaan yang tenang, tegas, namun memancarkan kecerdasan seorang calon jaksa ulung.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Seo Pyo ini nanti akan membantu beberapa posisi penting di sini sebagai asisten pribadiku, sekaligus belajar menjadi pengacara untuk firma ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Mendengar marga </span><span class=\"c1 c6\">\"Han\"</span><span class=\"c4 c1\"> disebut, ingatan Junwoo seketika terlempar ke masa tujuh tahun lalu saat Pekan Mahasiswa SNU. Jantungnya sempat berdesir kaget, namun dengan cepat ia berkilah dengan pikirannya sendiri bahwa marga Han adalah marga yang umum di Korea.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Maju beberapa langkah, mengulurkan tangannya sambil tersenyum hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Selamat datang, Seo Pyo-ya. Semoga kamu bisa merasa nyaman selama magang di tempat ini, ya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo (Muda):</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menjabat tangan Junwoo dengan tegas dan penuh hormat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Terima kasih banyak atas bantuannya, Hyung.\"</span></p><h3 class=\"c11\" id=\"h.1jmazjz0mwtx\"><span class=\"c7 c1 c6\">Rasa Penasaran Junwoo</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Beberapa jam kemudian, setelah suasana kantor mulai tenang, Junwoo mengetuk pintu ruang kerja ayahnya dan melangkah masuk untuk berbicara empat mata.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf mengganggu, Ayah. Aku hanya sedikit penasaran... anak magang yang baru tadi, apakah dia berasal dari keluarga Han?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menurunkan kacamata bacanya, menatap Junwoo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, benar. Kenapa memangnya, Junwoo-ya? Apa kau sudah mengenalnya sebelumnya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, menggeleng pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, tidak, Ayah. Aku cuma ingin tahu saja.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia adalah putra dari teman dekat Ayah, Tuan Han. Dia berencana untuk melanjutkan studi S2-nya nanti, tetapi sebelum itu, dia ingin magang di firma kita terlebih dahulu sambil belajar memahami dunia hukum praktis.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk-angguk paham)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, jadi begitu rupanya. Baiklah kalau begitu, Ayah.\"</span></p><h3 class=\"c11\" id=\"h.i1njh7s7y3oc\"><span class=\"c7 c1 c6\">April 2012 dan Gaung yang Mengejutkan</span></h3><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tiga bulan pun berlalu dengan cepat. Junwoo kini disibukkan oleh kontribusi besarnya di berbagai lini bisnis keluarga, membagi waktunya secara adil untuk firma hukum sang ayah, rumah sakit milik ibunya, serta yayasan kemanusiaan. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Disisi lain, beberapa gedung di sebelahnya, Han Na Eun sedang berkutat hebat dengan target Q2. Ia bekerja jauh lebih keras dari siapapun demi memastikan </span><span class=\"c1 c8\">Florentina</span><span class=\"c4 c1\"> berkembang murni karena jerih payahnya sendiri.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Hingga akhirnya, tepat pada bulan April 2012, takdir yang tertunda itu mulai menyuarakan gaungnya.</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana ruang tamu kediaman keluarga Park di malam hari. Suasananya begitu tenang saat Nyonya Park duduk mendekat ke arah Junwoo yang sedang bersantai.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Putraku... tahun ini kau akan genap berumur tiga puluh tahun. Bolehkah Ayah dan Ibu meminta satu hal darimu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menoleh, lalu meraih dan memegang tangan ibunya dengan sentuhan hangat)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja, Ibu. Apa yang ingin Ibu minta?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ibu rasa... sudah saatnya kau memikirkan tentang pernikahan. Tapi Ibu perhatikan selama ini kau sama sekali belum pernah mengenalkan gadis manapun kepada kami.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Ikut menyahut dari sofa seberang dengan nada suara yang sengaja dibuat jenaka)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Anakku. Kami berdua ini sangat menginginkan adanya kehadiran seorang anak perempuan baru di dalam rumah ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan, mengusap tengkuknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah... Ayah, Ibu, maafkan aku karena telah membuat kalian menunggu terlalu lama. Tapi untuk saat ini, memang aku sedang tidak dekat dengan gadis manapun...\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah kalau begitu, Putraku. Kami tahu kau sangat sibuk dengan duniamu sendiri dan juga sibuk membantu bisnis keluarga kita. Jadi... bolehkah kami menawarkan satu calon yang baik untukmu?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terdiam sejenak, menatap ayahnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Siapa, Ayah?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia adalah putri dari keluarga Han. Namanya... Han Na Eun.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Seketika itu juga, Junwoo tersentak kaget. Nama itu langsung memicu memori yang tersimpan rapi sejak tujuh tahun yang lalu di aula kampus SNU.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap cemas melihat perubahan ekspresi putranya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa, Putraku? Kenapa kau langsung terdiam begitu? Jika kau merasa keberatan, tidak apa-apa, pikirkan saja dulu baik-baik dan jangan langsung diputuskan malam ini.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengulang nama itu dengan gumaman pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm... Han Na Eun?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, kenapa? Apa kau sudah pernah mendengar atau mengenal nama ini sebelumnya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berusaha menguasai keterkejutannya, lalu tersenyum tipis)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, tidak, Ayah... aku cuma seperti agak mengingat sesuatu saja. Tidak apa-apa, jika memang ini jalannya, tidak ada salahnya jika dicoba.\"</span></p><h3 class=\"c11\" id=\"h.cq2lgwic549o\"><span class=\"c7 c1 c6\">Keputusan Kilat Sang Wanita Dingin</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke ruang kerja kaku milik Tuan Han di kediaman utama keluarga Han. Atmosfernya terasa formal saat Na Eun berdiri di depan meja ayahnya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menatap Na Eun dengan wibawa mutlaknya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Sekarang dengarkan Ayah, Han Na Eun. Kau harus segera menikah dalam waktu dekat ini. Kami sudah menemukan satu calon yang paling ideal untuk mendampingimu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menjawab dengan nada datar tanpa riak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Siapa?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dia adalah putra dari keluarga Park. Dia merupakan seorang diplomat muda berprestasi yang sempat bertugas di Jenewa tahun lalu, dan sekarang dia sudah pulang ke Korea untuk membantu mengurus bisnis keluarganya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Alisnya sedikit bertaut)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dari keluarga Park?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, namanya Park Junwoo.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Seketika, topeng sedingin es milik Na Eun retak sekilas karena rasa terkejut yang mendalam. Nama itu... nama yang gaungnya pernah ia dengar di masa kuliah dulu. Namun, dengan cepat ia berhasil menenangkan kembali raut wajahnya.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Han:</span></p><p class=\"c0\"><span class=\"c1\">\"Kami berencana untuk mengadakan acara </span><span class=\"c1 c8\">blind date</span><span class=\"c4 c1\"> terlebih dahulu untuk kalian. Kalian bisa saling melakukan perkenalan secara personal pada pekan ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memotong ucapan ibunya dengan tegas)</span></p><p class=\"c0\"><span class=\"c1\">\"Tidak perlu repot-repot mengadakan </span><span class=\"c1 c8\">blind date</span><span class=\"c4 c1\">, Ibu. Usiaku sudah mau menginjak tiga puluh tahun, melakukan hal-hal seperti itu justru akan terlihat sangat konyol bagi orang seusia kami.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Han:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengernyitkan dahi, bingung dengan arah bicara putrinya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lalu, apa maumu yang sebenarnya, Han Na Eun?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Langsung atur saja pertemuan resmi antara dua keluarga kita. Itu jauh lebih efisien dan lebih baik.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Tuan dan Nyonya Han seketika saling bertukar pandang dengan wajah yang sangat terkejut. Biasanya, putrinya itu akan memberontak habis-habisan atau menolak mentah-mentah setiap kali topik perjodohan diangkat. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun kali ini, Na Eun justru secara mengejutkan langsung meminta pertemuan dua keluarga dilakukan secepatnya.</span></p><h3 class=\"c11\" id=\"h.bv4raupav34h\"><span class=\"c7 c1 c6\">Foto yang Menjawab Dugaan</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke kediaman keluarga Park keesokan harinya. Nyonya Park berjalan mendekati Junwoo yang sedang membaca berkas di ruang tengah, sembari menyodorkan sebuah lembaran foto cetak.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Berbicara dengan nada heran namun antusias)</span></p><p class=\"c0\"><span class=\"c1\">\"Junwoo-ya, coba lihat ini. Ini foto dari Han Na Eun. Tapi anehnya... pihak keluarga Han mengabarkan kalau gadis ini menolak </span><span class=\"c1 c8\">blind date</span><span class=\"c4 c1\"> dan langsung meminta diadakan pertemuan resmi antar dua keluarga kita. Apa menurutmu dia benar-benar langsung tertarik padamu bahkan sebelum bertemu, Junwoo-ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo menerima lembaran foto itu perlahan. Begitu matanya menatap siluet wajah tegas, anggun, dan dingin milik wanita di dalam foto tersebut, Junwoo terdiam.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Bergumam di dalam hatinya dengan senyuman yang perlahan terbit di sudut bibirnya)</span></p><p class=\"c0\"><span class=\"c5 c1\">'Dugaanku ternyata sama sekali tidak meleset...'</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Melihat foto itu, seluruh tebakan Junwoo terjawab tuntas. Han Na Eun yang disebutkan oleh ayahnya memang benar-benar sosok mahasiswi intelektual berprinsip kokoh yang telah lama ia kagumi secara intelektual sejak masa di SNU dulu. Garis hidup yang selama ini berjalan terpisah di atas rel masing-masing, akhirnya resmi ditarik oleh takdir untuk saling berhadapan.</span></p><h3 class=\"c11\" id=\"h.6su0okutaybj\"><span class=\"c7 c1 c6\">Akhir dari Sebuah Penantian (Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Daehyun mendengarkan bagian akhir cerita itu dengan mulut yang setengah terbuka karena terlalu takjub.)</span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c1\">\"Astaga... Eonni! Jadi kau langsung meminta pertemuan keluarga tanpa lewat </span><span class=\"c1 c8\">blind date</span><span class=\"c1\"> karena kau tahu kalau pria itu adalah Park Junwoo sang ketua </span><span class=\"c1 c8\">Student Council</span><span class=\"c4 c1\">?!\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah, meletakkan cangkir tehnya yang sudah kosong)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tentu saja. Untuk apa aku membuang waktu berpura-pura tidak kenal di kafe jika aku sudah tahu pria itu? Lagipula, aku ingin tahu motif dan melihat ekspresi wajahnya saat kami bertemu kembali secara resmi sebagai orang dewasa.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><h3 class=\"c11\" id=\"h.c8gwpotj49wx\"><span class=\"c7 c1 c6\">Foto yang Menjawab Dugaan (April 2012)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana pagi hari yang cerah di kamar pribadi Junwoo. Sinar matahari menerobos masuk lewat celah gorden. Junwoo duduk di depan meja kerjanya, menatap lembaran foto cetak Na Eun yang diletakkan di samping laptopnya yang menyala. Jemarinya bergerak lincah di atas keyboard, mengetikkan nama \"Han Na Eun\" di mesin pencari untuk melacak rekam jejak akademis dan bisnis wanita itu. Ini adalah pertama kalinya sejak 7 tahun lalu, ia mendadak dilingkupi rasa penasaran yang begitu besar.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menopang dagu, menatap layar laptopnya lalu bergumam pelan)</span></p><p class=\"c0\"><span class=\"c1\">\"Dia adalah wanita yang idealis, sangat pintar, dan sekarang menjadi seorang pebisnis. Tapi... kenapa wanita sepertinya mendadak mau menerima pernikahan melalui jalur perjodohan kilat bahkan langsung meminta pertemuan keluarga?\" </span><span class=\"c1 c8\">(Alisnya bertaut, tersenyum tipis penuh teka-teki)</span><span class=\"c4 c1\"> \"Aku benar-benar penasaran dengan motif di baliknya. Apakah dia sudah tahu... kalau pria yang akan dijodohkan dengannya ini adalah Junwoo yang 7 tahun lalu menjadi mediatornya di aula SNU?\"</span></p><h3 class=\"c11\" id=\"h.165cbv3ry7ef\"><span class=\"c7 c1 c6\">Perspektif di Ruang Kerja Florentina</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Di saat yang bersamaan, di belahan distrik Gangnam yang hanya berjarak beberapa gedung. Han Na Eun muda juga sedang terduduk kaku di balik meja kerjanya. Layar laptopnya menampilkan profil lengkap Park Junwoo, mulai dari prestasinya sebagai mantan Presiden Student Council SNU, ketua diaspora di Inggris, hingga rekam jejaknya sebagai diplomat muda di Jenewa.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyilangkan tangan di dada, matanya terpaku pada foto profil Junwoo di layar laptop sembari bergumam bimbang)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa seorang Park Junwoo mau-maunya menikah melalui perjodohan seperti ini? Dia adalah idola kampus dulu, dan sekarang dia pernah menjadi seorang diplomat. Di luar sana, pasti ada banyak gadis yang mengantri untuk menjadi istrinya. Kenapa dia justru menerima begitu saja saat dijodohkan denganku? Apa motif pria itu yang sebenarnya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Lamunan dan kecurigaan Na Eun seketika terpecah saat pintu ruang kerjanya diketuk dengan terburu-buru oleh staf pemasarannya.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Asisten Staf:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Maaf mengganggu waktu Anda, Nona Han. Ini mengenai laporan distribusi sampel Florentina untuk kuartal ini. Ada sedikit kendala logistik dengan kurir eksternal kita.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika kembali ke mode profesionalnya yang dingin, menutup laptopnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Letakkan berkasnya di meja. Biar aku periksa setelah jam istirahat. Sekarang, aku ada urusan keluar sebentar.\"</span></p><h3 class=\"c11\" id=\"h.8m0sju93ksb7\"><span class=\"c7 c1 c6\">Makan Siang dan Misi Rahasia untuk Seo Pyo</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berganti di sebuah restoran bergaya modern minimalis yang letaknya tidak jauh dari kantor Florentina. Na Eun duduk berhadapan dengan adiknya, Han Seo Pyo muda (25 tahun) yang masih mengenakan kemeja rapi khas anak magang firma hukum.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memotong makanannya, berpura-pura kasual)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi... gedung Firma Hukum Park tempatmu magang itu ternyata ada di sekitar sini rupanya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menyuap makanannya, menjawab santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, memangnya kenapa, Noona? Tiba-tiba sekali menanyakan lokasi kantorku.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memajukan tubuhnya, berbisik serius)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Seo Pyo-ya, kau harus tahu. Aku... akan dijodohkan dengan anak laki-laki dari pemilik firma hukum tempatmu magang saat ini.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak tersedak, menatap kakaknya dengan mata membelalak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hmm! Maksudmu... dengan Junwoo Hyung?!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau mengenalnya dengan baik di sana?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menggaruk tengkuknya yang tidak gatal)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Belum terlalu dekat juga, sih. Lagipula aku agak segan dengannya karena dia sangat pintar dan pembawaannya berwibawa.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengetuk meja dengan jarinya, memberi perintah mutlak)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Mulai sekarang, kau harus membantuku. Cari tahu segala hal tentang dia secara mendalam. Pertemuan resmi keluarga kita akan diadakan satu bulan lagi, dan aku harus tahu persis pria seperti apa dia sekarang.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengerutkan dahi, bingung)</span></p><p class=\"c0\"><span class=\"c1\">\"Tunggu dulu... jika kau memang ingin tahu, kenapa kau tidak mengajak perkenalan atau </span><span class=\"c1 c8\">blind date</span><span class=\"c4 c1\"> berdua dulu dengannya? Kenapa kau malah langsung memutuskan untuk mengadakan pertemuan keluarga besar?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c1\">\"Aku sudah mengenalnya. Tujuh tahun lalu kami satu angkatan di SNU, hanya saja kami berbeda jurusan. Kami bahkan pernah terlibat dalam satu proyek </span><span class=\"c1 c8\">workshop</span><span class=\"c1\"> bersama.\" </span><span class=\"c1 c8\">(Na Eun menyandarkan tubuhnya, menyipitkan mata)</span><span class=\"c1\"> \"Kau tahu sendiri, dulu dia itu sangat populer di kampus karena menjadi presiden </span><span class=\"c1 c8\">student council</span><span class=\"c4 c1\">. Bahkan sampai S3 pun dia menjadi ketua diaspora di Inggris lalu menjadi diplomat. Sangat mudah baginya untuk mendapatkan wanita manapun yang dia mau. Dia juga pasti tahu sifatku yang dingin dan idealis seperti ini. Lalu, kenapa dia bisa tertarik dengan perjodohan ini? Kau harus menyelidikinya diam-diam di kantor, ya!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menahan tawa, menatap kakaknya dengan nada mengejek)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hooo... jadi begitu. Tapi, kenapa harus melibatkan aku dalam urusan ini, Noona?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Wajahnya memerah karena kesal, melotot)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Han Seo Pyo... kau ini benar-benar, ya!!!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangkat kedua tangannya, menyerah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baik, baik, akan kulakukan. Tapi seandainya kau memang tidak menyukai perjodohan ini dari awal, kenapa kau harus langsung menyetujuinya tanpa protes ke Ayah?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membuang muka, menjawab ketus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku... hanya penasaran saja dengan motifnya.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh geli, menggeleng-gelengkan kepala)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau ini banyak sekali alasannya, Noona. Jangan-jangan... kau sebenarnya sudah menyukai Junwoo Hyung sejak jaman kuliah dulu, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak memelototkan matanya, membantah keras)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Enak saja! Tidak mungkin! Buat apa aku menyukainya sejak dulu? Aku tegaskan sekali lagi, aku hanya penasaran dengan motif tersembunyinya saja!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Seo Pyo hanya tertawa lepas melihat kakaknya yang salah tingkah. Makan siang itu pun larut dalam pembicaraan hangat khas kakak-beradik yang tiada habisnya saling mengejek satu sama lain.)</span></p><h3 class=\"c11\" id=\"h.xnn3wz7izbb2\"><span class=\"c7 c1 c6\">Taktik Balasan dari Pihak Firma</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana berpindah ke siang harinya di kantor Firma Hukum Park. Seo Pyo baru saja melangkah masuk kembali ke ruang kerja setelah jam istirahatnya selesai. Junwoo yang sedang memeriksa beberapa dokumen di mejanya, langsung menoleh dan menyapa Seo Pyo dengan senyuman ramahnya yang hangat.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Seo Pyo-ya... kau baru saja kembali dari makan siang, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membungkuk sopan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, iya, Hyung. Maaf jika aku agak sedikit terlambat kembali ke kantor. Apakah ada dokumen atau tugas yang bisa kubantu saat ini?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Meletakkan pulpennya, merapikan duduknya dengan gestur casual namun terencana)</span></p><p class=\"c0\"><span class=\"c1\">\"Begini... besok Ayahku memiliki agenda penuh yang tidak bisa ditinggalkan di Kejaksaan Agung. Sementara itu, besok ada acara </span><span class=\"c1 c8\">charity</span><span class=\"c4 c1\"> tahunan di kampus SNU untuk anak-anak berkebutuhan khusus. Kebetulan, rumah sakit milik Ibuku bertindak sebagai sponsorship utamanya di sana. Apakah kau bersedia menggantikan posisi Ayahku, tadi aku sudah ijin beliau. Dia mengijinkan kamu menggantikannya dan pergi menghadiri acara itu bersamaku besok?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk tanpa curiga)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, tentu saja, Hyung. Tidak masalah sama sekali bagi saya. Lalu, apa saja hal khusus yang harus aku lakukan dan persiapkan untuk membantu Anda besok?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum sangat ramah, menepuk pundak Seo Pyo)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, tidak ada hal khusus yang berat kok. Kau mungkin hanya akan banyak mendampingi dan membantuku saja di lapangan nanti. Jadi, santai saja.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Di balik senyuman ramah dan ajakan tugas mulianya itu, Junwoo rupanya memiliki niat terselubung. Sebagai seorang diplomat yang cerdik, ia sengaja memanfaatkan kedekatan tugas besok untuk menjadikan Seo Pyo sebagai jembatan informasi rahasianya. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Junwoo tahu betul bahwa pemuda magang di hadapannya ini adalah adik kandung dari Han Na Eun kunci utama untuk mengorek apa sebenarnya motif dari sang wanita sedingin es tersebut mau dijodohkan dengannya.</span></p><h3 class=\"c11\" id=\"h.lm2xwqtv1dmq\"><span class=\"c7 c1 c6\">Kembali ke Masa Sekarang (Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Daehyun tertawa geli mendengarkan taktik saling selidik tersebut.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hahaha! Astaga, Eonni! Jadi kalian berdua sama-sama menggunakan Seo Pyo sebagai mata-mata tanpa sepengetahuan satu sama lain? Kasihan sekali suamiku, dia benar-benar terjebak di tengah-tengah pertempuran intuisi kalian!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c1 c6\">Na Eun:</span><span class=\"c4 c1\"> Suamimu memang polos Daehyun-ah saat itu, dia tidak sadar kalau dia sedang jadi informan diantara kami.</span></p><h3 class=\"c11\" id=\"h.6p1e8s8q4uax\"><span class=\"c7 c1 c6\">Umpan dan Jawaban Kunci di Kampus SNU (Kilas Balik - April 2012)</span></h3><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Suasana pagi hari yang cerah namun emosional di halaman luas Seoul National University (SNU). Balon-balon berwarna pastel dan tenda-tenda putih besar telah didirikan untuk acara Penggalangan Dana Medis tahunan. Melalui afiliasi beberapa rumah sakitnya, SNU rutin menggalang dana besar untuk mendukung pendidikan serta pengobatan anak-anak penderita kanker dan leukimia, yang pada tahun ini juga dihadiri oleh anak-anak berkebutuhan khusus. Junwoo muda dan Seo Pyo muda tampak sibuk bahu-membahu membantu beberapa panitia lapangan, mengoordinasikan kedatangan berbagai yayasan besar yang menjadi pendukung utama acara.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sambil menata tumpukan brosur amal di atas meja, menoleh santai)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Apa kau sering ikut serta dalam acara amal seperti ini, Seo Pyo-ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Membantu mengangkat kotak perlengkapan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Tidak juga, Hyung. Hanya beberapa kali saja selama masa kuliah dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk-angguk, mulai melemparkan umpannya dengan halus)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, begitu. Ngomong-ngomong... kalau tidak salah, kau ini dua bersaudara, ya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Hyung, benar sekali.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tersenyum tipis, berpura-pura iri)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Pasti rasanya menyenangkan ya punya saudara kandung. Aku sendiri adalah anak tunggal di rumah, jadi apa-apa sejak kecil harus kulakukan sendiri.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Terkekeh pelan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dua-duanya tentu ada sisi enak dan tidaknya, Hyung.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mancing lebih dalam, menaikkan alisnya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa kau mengatakan begitu? Memangnya ada sisi tidak enaknya?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa kecil, menggeleng-geleng)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hehehe, tidak apa-apa, Hyung. Hanya saja... kalau aku kan memiliki seorang kakak perempuan, dan dia itu tipikalnya sangat posesif padaku sejak kami masih kecil.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Mendengar kalimat itu, Junwoo tahu bahwa umpan diplomatisnya mulai mendapatkan jawaban yang ia cari.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kenapa bisa seposesif itu? Seharusnya kan anak perempuan yang lebih butuh perlindungan dari anak laki-laki atau dari adiknya sendiri?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tatapannya melembut, menyiratkan rasa hormat yang besar)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ya... karena dia selalu dituntut untuk menjadi pilar utama di keluarga kami. Dia selalu menyayangiku dengan caranya sendiri, dan tentunya... dia selalu dipaksa untuk berusaha tangguh menghadapi segalanya.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1\">Mendengar jawaban itu, Junwoo seketika tertegun di tempatnya. Kalimat </span><span class=\"c1 c6\">\"berusaha tangguh\"</span><span class=\"c4 c1\"> bergaung di kepalanya sebagai sebuah jawaban kunci. Wanita dingin yang ia lihat di foto itu ternyata memikul beban berat yang membuatnya harus memasang dinding pertahanan setinggi es.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Namun, Seo Pyo yang sejak awal memiliki insting yang tajam sebenarnya menyadari bahwa Junwoo sedang sengaja mencari tahu tentang Na Eun. Mengingat perintah kakaknya saat makan siang, Seo Pyo dengan cerdik langsung menghentikan obrolan itu agar Junwoo tidak bisa menyelidik lebih jauh lagi.</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menguasai ekspresinya kembali, melirik jam tangan)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Oh, iya... begitu ya. Setelah ini acara intinya akan segera dimulai. Kemungkinan besar aku akan memandu jalannya acara di atas panggung sebagai perwakilan dari pihak rumah sakit, sekaligus menyambut beberapa kolega yayasan dan rektorat SNU. Kau sendiri mau tetap berjaga di sini atau bagaimana, Seo Pyo?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jika diperbolehkan, aku tidak usah ikut mendampingi ke dalam acara intinya saja, Hyung. Aku berniat ke Perpustakaan Hukum di dalam, mungkin sambil berjalan-jalan bernostalgia mengingat jaman kuliah dulu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Tertawa renyah)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Hehehe, baiklah. Lakukan saja sesukamu.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Seo Pyo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jika nanti kau membutuhkan bantuan mendesak di panggung, kau bisa segera menghubungiku, Hyung.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Baiklah, terima kasih, Seo Pyo-ya.\"</span></p><h3 class=\"c11\" id=\"h.a4n506cal76w\"><span class=\"c7 c1 c6\">Lembaran Foto yang Mengejutkan (Masa Sekarang - Tahun 2026)</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana kembali ke lantai dua mansion Na Eun di masa sekarang. Malam semakin larut, namun atmosfer di ruangan itu mendadak berubah tegang bercampur takjub. Daehyun, yang sejak tadi mendengarkan kisah bulan April 2012 itu, tiba-tiba memotong ucapan Na Eun dengan wajah yang tampak linglung seolah ingatan lamanya terkunci.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Memajukan tubuhnya, memotong cepat)</span></p><p class=\"c0\"><span class=\"c1\">\"Tunggu... sebentar, Eonni. Kau bilang tadi acara </span><span class=\"c1 c8\">charity</span><span class=\"c4 c1\"> besar di SNU itu terjadi pada bulan April tahun 2012, kan?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengernyitkan dahi bingung)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, benar. April 2012, saat Florentina baru berjalan satu tahun. Kenapa memangnya, Daehyun-ah?\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun tidak langsung menjawab. Dengan tangan yang sedikit gemetar, ia langsung menyalakan layar smartphone-nya, membuka aplikasi galeri foto penyimpanan cloud lamanya, lalu menggulir layar dengan cepat hingga menemukan sebuah foto lama yang tampak sedikit buram namun tersimpan rapi. Ia menyodorkan layar ponsel itu tepat di depan mata Na Eun.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Suaranya bergetar menahan rasa tidak percaya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Kau tahu, Eonni? Aku... aku ada di dalam acara itu saat itu! Aku baru berusia 15 tahun, dan aku terpaksa datang ke sana karena permintaan Ibuku yang hadir sebagai salah satu donatur utama yayasan. Aku bahkan diminta mendadak untuk menjadi MC cilik untuk menghibur anak-anak penyintas kanker dan berkebutuhan khusus di atas panggung, karena acara itu juga disiarkan langsung di televisi nasional. Itu adalah debut pertama kalinya aku memandu acara langsung di TV...\"</span></p><p class=\"c0\"><span class=\"c5 c1\">(Daehyun memperbesar bagian tengah foto tersebut, dimana sekelompok pejabat rumah sakit dan yayasan berdiri bersama.)</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dan coba lihat foto bersama dengan para kolega yayasan ini... Eonni, pria yang berdiri tepat di bagian tengah mengenakan setelan jas abu-abu ini... apakah ini Junwoo Oppa?!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Seketika terdiam tertegun, matanya membelalak menatap layar ponsel Daehyun tanpa berkedip)</span></p><p class=\"c0\"><span class=\"c1\">\"Astaga... Daehyun-ah...\" </span><span class=\"c1 c8\">(Menutup mulutnya karena terkejut)</span><span class=\"c4 c1\"> \"Benar, ini benar-benar dia saat itu! Dan wanita anggun di sebelahnya ini adalah Ibu mertuaku, Nyonya Park. Kau... kau ternyata sudah berada di antara mereka bahkan sebelum kita saling mengenal...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menunjuk titik lain di foto)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Dan ini adalah Ibuku ...\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Na Eun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Napasnya tercekat, otaknya langsung menghubungkan semua benang merah masa lalu)</span></p><p class=\"c0\"><span class=\"c1\">\"Ya ampun... takdir macam apa ini? Jadi... saat Seo Pyo dulu pernah bercerita kepadaku bahwa dia pertama kali mengagumimu secara diam-diam lewat jendela Perpustakaan Hukum SNU saat kau sedang melakukan syuting... ternyata yang dia maksud adalah syuting memandu acara </span><span class=\"c1 c8\">charity</span><span class=\"c4 c1\"> ini?! Hari di mana Junwoo mengajak Seo Pyo ke acara itu?!\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Daehyun:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menghela napas panjang, bersandar di sofa dengan tatapan takjub yang luar biasa, menyadari besarnya konspirasi alam semesta)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Jadi... takdir kita semua... sebenarnya sudah dimulai bersamaan di bulan April 2012 itu, Eonni.\"</span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p><p class=\"c0 c2\"><span class=\"c4 c13\"></span></p>"}, {"title": "Retaknya Benteng Pertahanan", "html": "<p class=\"c10 title\" id=\"h.uc41sagm6lsu\"><span class=\"c23 c13\">Retaknya Benteng Pertahanan</span></p><h1 class=\"c0 c29\" id=\"h.i1d3bwjofg4k\"><span class=\"c12 c1 c6\"></span></h1><h2 class=\"c0\" id=\"h.mfncu2pghllp\"><span class=\"c24 c1 c6\">BAB: RETAKNYA BENTENG PERTAHANAN</span></h2><p class=\"c0\"><span class=\"c3 c1\">Timeline: Mei 2012 – Tepi Sungai Han, Seoul (Kilas Balik)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><h3 class=\"c14\" id=\"h.pah13s51zvrh\"><span class=\"c7 c1 c6\">Angin Pagi Sungai Han dan Ucap Kejutan</span></h3><p class=\"c0\"><span class=\"c5 c1\">(Suasana Minggu pagi yang masih sangat awal di pinggiran kota Seoul. Kabut tipis sisa semalam masih menggantung rendah di atas permukaan air Sungai Han. Jarum jam baru menunjukkan pukul 05.00 pagi. Tuan Park, Nyonya Park, dan Junwoo muda tampak baru saja menepikan sepeda mereka setelah melakukan rutinitas olahraga pagi mengitari area perumahan. Ketiganya berdiri di tepi pembatas sungai, menghirup udara pagi yang dingin sembari menikmati ketenangan Seoul sebelum kota itu sepenuhnya terbangun.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Merenggangkan kedua tangannya, menghirup napas dalam-dalam lalu menoleh ke arah putranya dengan senyum paling bahagia)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Ah, segarnya... Rasanya Ibu senang sekali pagi ini, Junwoo-ya. Membayangkan bahwa rutinitas bersepeda kita di setiap hari Minggu secepatnya akan kehadiran satu anggota baru yang ikut bergabung bersama kita.\"</span></p><p class=\"c0 c2\"><span class=\"c5 c1\"></span></p><p class=\"c0\"><span class=\"c5 c1\">(Junwoo, yang saat itu sedang meneguk air putih dari botol minumnya, seketika membelalakkan mata karena kaget. Ia tersedak kecil hingga terbatuk-batuk mendengar penuturan sang ibu yang begitu tiba-tiba.)</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Tuan Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Menepuk-nepuk punggung Junwoo dengan saksama)</span></p><p class=\"c0\"><span class=\"c1\">\"Hati-hati, Nak. Minumnya pelan-pelan saja sampai tersedak begitu.\" </span><span class=\"c1 c8\">(Tuan Park kemudian menoleh ke arah istrinya)</span><span class=\"c4 c1\"> \"Tapi... apakah berita itu benar, Yeobo? Apakah pihak keluarga Han memang sudah memastikan bahwa putri mereka bersedia melangkah langsung hingga ke jenjang pertunangan tanpa ragu?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Mengangguk mantap, menatap suaminya dengan binar mata antusias)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Aku sudah memastikan hal itu secara langsung, Yeobo. Kemarin siang aku sengaja minum teh dan bertemu dengan Nyonya Han. Beliau sendiri yang mengatakan bahwa tidak akan menjadi masalah jika dalam pertemuan resmi keluarga kita nanti, acaranya langsung ditingkatkan menjadi acara lamaran resmi.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Junwoo:</span></p><p class=\"c0\"><span class=\"c5 c1\">(Sontak meletakkan botol minumnya, menatap ibunya dengan tatapan tidak percaya)</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Lamaran? Ibu... kita bahkan belum sempat bertemu atau duduk bersama secara formal. Bagaimana bisa langsung melompat ke tahap lamaran?\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c3 c1\">Nyonya Park:</span></p><p class=\"c0\"><span class=\"c4 c1\">\"Iya, Putraku. Nyonya Han menegaskan bahwa hal itu sama sekali bukan masalah bagi mereka. Kau tahu sendiri kan bagaimana prinsip keluarga mereka? Bagi mereka, dalam urusan seperti ini, lebih cepat melangkah justru akan jauh lebih baik.\"</span></p><p class=\"c0 c2\"><span class=\"c3 c1\"></span></p><p class=\"c0\"><span class=\"c1 c4\">Junwoo seketika terdiam seribu bahasa. Angin pagi Sungai Han yang berhembus dingin seolah membekukan kata-katanya. Di dalam benaknya, rasa penasaran yang sejak kemarin menghantuinya kini kian membumbung tinggi. </span></p><p class=\"c0 c2\"><span class=\"c4 c1\"></span></p><p class=\"c0\"><span class=\"c4 c1\">Kenapa Han Na Eun si wanita idealis berprinsip kokoh yang ia ketahui sama sekali tidak melayangkan protes atau pemberontakan saat tahu pertemuan keluarga mereka akan langsung diubah menjadi acara lamaran? Berdasarkan analisis rasionalnya, ini benar-benar aneh dan tidak biasa.</span></p><h3 class=\"c9\" id=\
